<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="supported-color-schemes" content="dark">
<title>Anchored — Men's Curriculum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --navy:#0F1821;        /* deepest bg */
  --navyDeep:#0A1219;    /* header bg */
  --panel:#16232F;       /* card/section panels */
  --panel2:#1C2B39;      /* raised panels */
  --teal:#3FB0AE;        /* accents on dark */
  --tealLight:#5FC8C6;
  --slate:#9DB3B7;
  --cream:#2A3A47;       /* borders on dark */
  --gold:#D8B673;        /* gold accent, lightened for dark */
  --ink:#E8EDEF;         /* primary body text */
  --inkSoft:#C4CFD4;     /* secondary text */
  --gray:#9DB3B7;
  --paper:#0F1821;       /* page bg */
}
html{color-scheme:dark;background:#0F1821;}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;}
.disp{font-family:'Fraunces',Georgia,serif;}
.eyebrow{letter-spacing:.18em;text-transform:uppercase;font-size:11px;font-weight:700;}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px;}
.wrap-narrow{max-width:820px;margin:0 auto;padding:0 22px;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}

/* header */
header{position:sticky;top:0;z-index:30;background:var(--navyDeep);border-bottom:1px solid rgba(142,166,170,.25);}
.hbar{display:flex;align-items:center;gap:12px;padding:13px 22px;max-width:1080px;margin:0 auto;}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;}
.logo .disp{color:#fff;font-size:20px;font-weight:700;letter-spacing:.04em;}
.htag{color:var(--slate);font-size:12px;margin-left:4px;}
.back{margin-left:auto;color:var(--slate);cursor:pointer;transition:color .18s;}
.back:hover{color:var(--tealLight);}

/* hero */
.hero{background:linear-gradient(180deg,#16232F 0%,#0F1821 100%);color:#fff;position:relative;overflow:hidden;border-bottom:1px solid var(--cream);}
.hero-ghost{position:absolute;right:-50px;top:-30px;opacity:.06;}
.hero-in{padding:70px 0 56px;position:relative;}
.hero h1{font-size:74px;line-height:.98;font-weight:700;letter-spacing:-.02em;}
.hero p{max-width:580px;margin-top:22px;font-size:18px;line-height:1.55;color:var(--inkSoft);}
.lens-strip{display:flex;flex-wrap:wrap;gap:8px;margin-top:30px;}
.lens-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid rgba(142,166,170,.3);border-radius:3px;padding:8px 13px;font-size:13.5px;}
.lens-chip .num{color:var(--tealLight);font-weight:700;font-size:15px;font-family:'Fraunces',serif;}
.lens-chip .d{color:var(--slate);font-size:12.5px;}

/* library */
.sec{padding:54px 0 10px;}
.sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:26px;flex-wrap:wrap;}
.sec-head .eyebrow{color:var(--teal);}
.sec-head h2{font-size:30px;font-weight:700;color:var(--ink);}
.sec-head .note{color:var(--slate);font-size:14px;}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;}
.tcard{background:var(--panel);border:1px solid var(--cream);border-top:4px solid var(--teal);border-radius:6px;padding:24px 26px;cursor:pointer;transition:transform .18s,box-shadow .18s;position:relative;overflow:hidden;}
.tcard:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(20,31,41,.14);}
.tcard .row{display:flex;justify-content:space-between;align-items:flex-start;}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#0F1821;background:var(--teal);padding:3px 9px;border-radius:20px;}
.tcard h3{font-size:30px;font-weight:700;color:var(--ink);margin:8px 0 2px;}
.tcard .sub{font-size:17px;font-style:italic;color:var(--gray);margin-bottom:12px;}
.tcard .blurb{color:var(--inkSoft);font-size:14.5px;line-height:1.55;}
.tcard .go{margin-top:16px;font-weight:600;font-size:14px;}
.note-box{margin-top:22px;background:var(--panel);border:1px dashed var(--slate);border-radius:6px;padding:18px 22px;display:flex;gap:14px;align-items:center;font-size:14px;color:var(--gray);line-height:1.5;}

/* track page */
.thero{background:linear-gradient(180deg,#16232F 0%,#0F1821 100%);color:#fff;border-bottom:1px solid var(--cream);}
.thero-in{padding:46px 0 40px;}
.thero .eyebrow{color:var(--tealLight);margin-bottom:12px;}
.thero h1{font-size:52px;line-height:1;font-weight:700;letter-spacing:-.015em;}
.thero .sub{font-size:20px;font-style:italic;color:var(--slate);margin-top:8px;}
.thero p{max-width:620px;margin-top:16px;font-size:16.5px;line-height:1.55;color:var(--inkSoft);}
.wlist{display:grid;gap:12px;padding:38px 0 10px;}
.wrow{background:var(--panel);border:1px solid var(--cream);border-radius:5px;padding:18px 22px;display:flex;gap:18px;align-items:center;cursor:pointer;transition:transform .18s,box-shadow .18s;}
.wrow:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(20,31,41,.12);}
.wnum{font-family:'Fraunces',serif;font-size:30px;font-weight:700;color:var(--slate);min-width:42px;}
.wrow .wt{font-family:'Fraunces',serif;font-size:20px;font-weight:600;color:var(--ink);}
.wrow .wp{font-size:13px;font-weight:600;margin-left:10px;}
.wrow .wtheme{color:var(--gray);font-size:13.5px;margin-top:3px;}
.arrow{margin-left:auto;font-size:20px;}

/* session */
.shero{background:linear-gradient(180deg,#16232F 0%,#0F1821 100%);color:#fff;border-bottom:1px solid var(--cream);}
.shero-in{padding:44px 0 38px;}
.shero .eyebrow{color:var(--tealLight);margin-bottom:10px;}
.shero h1{font-size:44px;line-height:1.02;font-weight:700;letter-spacing:-.015em;}
.shero .stheme{font-size:19px;font-style:italic;color:var(--slate);margin-top:8px;}
.sbody{padding:36px 0 10px;background:var(--paper);}
.block{margin-bottom:24px;background:var(--paper);}
.block .lbl{margin-bottom:8px;}
.block .body{font-size:16px;line-height:1.62;color:var(--ink);background:var(--paper);}
.words{display:grid;gap:10px;}
.wordcard{background:var(--panel);border:1px solid var(--cream);border-left:4px solid var(--gold);border-radius:4px;padding:13px 16px;}
.wordcard .top{margin-bottom:4px;unicode-bidi:plaintext;}
.wordcard .gk{font-family:'Fraunces',serif;font-size:20px;font-weight:700;color:var(--gold);unicode-bidi:isolate;direction:ltr;}
.wordcard .tl{font-style:italic;color:var(--slate);font-size:14px;margin:0 8px;unicode-bidi:isolate;}
.wordcard .gl{font-weight:700;color:var(--ink);font-size:14.5px;unicode-bidi:isolate;direction:ltr;}
.wordcard .nt{font-size:14.5px;color:var(--inkSoft);line-height:1.55;}
.prompt{border-radius:0 4px 4px 0;padding:13px 16px;margin-bottom:10px;background:var(--panel2);}
.prompt.elder{border-left:4px solid var(--slate);}
.prompt.first{border-left:4px solid var(--teal);margin-bottom:18px;}
.prompt .plbl{font-weight:700;font-size:14.5px;}
.prompt.elder .plbl{color:var(--tealLight);}
.prompt.first .plbl{color:var(--teal);}
.prompt .ptext{font-size:14.5px;color:var(--inkSoft);}
.qhead{font-weight:700;color:var(--ink);font-size:15px;margin-bottom:8px;}
.qlist{list-style:none;margin:0 0 22px;}
.qlist li{display:flex;gap:13px;margin-bottom:11px;align-items:flex-start;}
.qlist .qn{font-family:'Fraunces',serif;color:var(--teal);font-weight:700;font-size:19px;min-width:20px;}
.qlist .qt{font-size:15.5px;line-height:1.5;}
.forge{background:var(--panel2);border:1px solid var(--cream);border-radius:6px;padding:22px 24px;color:#fff;display:flex;gap:16px;align-items:flex-start;}
.forge .flbl{color:var(--tealLight);margin-bottom:6px;}
.forge .ftext{font-size:16px;line-height:1.6;color:#eef1f0;}
.snav{display:flex;justify-content:space-between;margin:30px 0 10px;gap:12px;}
.nbtn{padding:11px 22px;border-radius:2px;font-weight:600;font-size:14.5px;cursor:pointer;letter-spacing:.01em;border:1px solid var(--slate);background:transparent;color:var(--ink);}
.nbtn.primary{border-color:var(--teal);background:var(--teal);color:#0F1821;}
.nbtn:disabled{opacity:.4;cursor:default;}

footer{background:var(--navyDeep);color:var(--slate);padding:26px 22px;text-align:center;margin-top:40px;}
footer .eyebrow{margin-top:8px;}

@media (prefers-color-scheme: light){
  /* page is dark by design; keep it dark even in light mode for consistency */
  html,body{background:#0F1821;color:#E8EDEF;}
}
@media(max-width:640px){
  .grid{grid-template-columns:1fr;}
  .hero h1{font-size:52px;}
  .thero h1{font-size:40px;}
  .shero h1{font-size:34px;}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
const TRACKS = [{"id":"james","title":"Doers","subtitle":"A Man's Study in James","book":"James","weeks":10,"status":"complete","accent":"#2A8C8C","blurb":"The most practical book in the New Testament. Trials, money, speech, ambition, and the faith that actually works — verse by verse.","sessions":[{"n":1,"passage":"1:1–8","title":"When Life Tests You","theme":"Trials, wisdom, and the divided man","context":"James — the half-brother of Jesus, who didn't believe until after the resurrection — writes to Jewish Christians scattered by persecution. These are men who lost homes and businesses for their faith. He opens not with comfort but with trials, because that's where his readers already were. The most practical book in the New Testament: 108 verses, over 50 commands.","text":"James makes a jarring claim: count trials as joy — not because pain is good, but because of what it produces. Testing produces perseverance; perseverance produces maturity. Then he pivots: if you lack wisdom, ask God, who gives generously. But ask in faith, not as a 'double-minded' man tossed like a wave.","words":[{"greek":"πειρασμός","translit":"peirasmos","gloss":"trial / test","note":"Can mean an external hardship that proves faith, or an internal pull toward sin. James uses both senses in this chapter — v.2 is a trial from outside, v.13 temptation from inside."},{"greek":"τέλειος","translit":"teleios","gloss":"mature / complete","note":"Not 'sinless perfection.' Finished, whole, having reached its intended end — like ripe fruit. The trial doesn't break you; it completes you."},{"greek":"δίψυχος","translit":"dipsuchos","gloss":"double-minded","note":"Literally 'two-souled' — a word James may have coined. One foot in trust, one in doubt. Not evil, just unstable."}],"thread":"The wisdom James says to ask for is ultimately the wisdom of the cross — where God brought the greatest good out of the greatest trial. A man can 'count it joy' only because he trusts the character of the God who allowed the trial.","elder":"Name a trial that, looking back, produced something in you comfort never could have. Younger men need to hear this from someone who's lived it.","first":"What trial are you in right now that you'd rather escape than endure? Be honest about the pull to bail.","questions":["Where is the line between a trial God allows (v.2) and a temptation you invite (v.13) blurry in your life right now?","What does 'asking God for wisdom' actually look like this week — beyond a quick prayer?","Where are you double-minded — trusting God and hedging your bets at the same time?"],"forge":"Name one active trial to your group. Instead of asking God to remove it this week, ask for the wisdom to endure it well. Report what changed."},{"n":2,"passage":"1:9–18","title":"Where Temptation Really Comes From","theme":"Riches, testing, and the anatomy of sin","context":"James writes to scattered believers — some newly poor, some still wealthy. In an honor culture, poverty meant shame and wealth meant status. He flips both, and confronts a lie every generation of men repeats: that God is the one setting us up to fail.","text":"A reversal (9–11): the poor brother boasts in his high position, the rich in his low one, because wealth withers like a wildflower. Then (12–18) James dismantles the excuse 'God is tempting me.' God tests to strengthen; temptation comes from your own desire. He traces the sequence: desire → enticement → sin → death. Contrast: God only gives good gifts, and never changes.","words":[{"greek":"ἐπιθυμία","translit":"epithumia","gloss":"desire / craving","note":"Not evil in itself — the same word describes Jesus 'earnestly desiring' the Passover. It becomes sin when aimed wrong or refusing limits."},{"greek":"δελεάζω","translit":"deleazō","gloss":"to lure / bait","note":"A hunting term — to draw prey out with bait toward a hidden hook. Temptation is a lure that looks like food and hides a trap."},{"greek":"ἀποκυέω","translit":"apokueō","gloss":"to give birth","note":"Sin 'gives birth' to death (v.15); God 'gave us birth' by the word of truth (v.18). Two pregnancies, two outcomes. Which is a man carrying?"}],"thread":"James refuses to let a man blame God for his sin. The God who 'gives us birth by the word of truth' is entirely good — the cross proves He isn't out to trap us. Sin's lineage ends in death; God's ends in life.","elder":"Where have you seen a small unchecked desire grow into something that cost a man dearly — maybe in your own story?","first":"What desire feels harmless right now that James would tell you to watch? Name the bait before the hook is set.","questions":["Where do you subtly blame God or circumstances for temptations that actually start in your own desire?","James says catch sin at the 'desire' stage. What's one desire you need to confront early this week?","If every good gift comes from an unchanging Father (v.17), how does that reframe what you're chasing?"],"forge":"Identify the specific 'bait' you're most vulnerable to. Set one guardrail this week that stops you at the desire stage, before it becomes action."},{"n":3,"passage":"1:19–27","title":"Doers, Not Just Hearers","theme":"The word, the mirror, and real religion","context":"Early church gatherings centered on hearing Scripture read aloud — many couldn't own or read a scroll. James warns against a danger that's only grown: consuming truth without doing anything with it. Familiar in an age of podcasts and sermons on demand.","text":"The famous triplet: quick to listen, slow to speak, slow to anger. Then the core command of the book — don't merely hear the word, do it. The hearer-only is like a man who looks in a mirror and forgets his own face. Pure religion, defined concretely: bridle the tongue, care for orphans and widows, stay unstained by the world.","words":[{"greek":"ὀργή","translit":"orgē","gloss":"anger / wrath","note":"A settled, simmering anger — the slow burn a man nurses. It 'does not produce the righteousness of God.' The anger that feels justified is often the most useless."},{"greek":"παρακύπτω","translit":"parakuptō","gloss":"to stoop and look intently","note":"Not a glance — a bending to examine closely, used of Peter peering into the empty tomb. The doer doesn't skim the word; he stoops over it and stays."},{"greek":"θρησκεία","translit":"thrēskeia","gloss":"religion / worship practice","note":"The external, visible practice of faith. James redefines it: not performance in the meeting, but a controlled tongue and hands that serve the helpless."}],"thread":"Not works-salvation — a description of what saving faith looks like when it's real. The 'word planted in you that can save you' is the gospel. Grace produces doers.","elder":"What's one truth you knew for years before you actually lived it — and what finally moved it from ear to hand?","first":"It's easy to feel spiritually full from content while doing little. Where's the gap between your input and your action?","questions":["'Quick to listen, slow to speak, slow to anger' — which is hardest for you, and where does it show?","Where are you a 'hearer who forgets' — you know the truth but don't act on it?","Pure religion = controlled speech + care for the vulnerable. Which is God pressing on you now?"],"forge":"Pick one truth you've heard repeatedly but never obeyed. Do it this week — one concrete act. Move it from ear to hands."},{"n":4,"passage":"2:1–13","title":"The Sin of Playing Favorites","theme":"Partiality, the poor, and the royal law","context":"Picture the early church meeting: wealthy landowners and day-laborers in one room. A man in gold rings walks in, and a poor man in rags. James addresses a real scene of men giving the rich the good seat and the poor the floor.","text":"James confronts partiality as incompatible with faith in Christ. God chose the poor to be rich in faith — so honoring the rich inverts God's values. He raises the 'royal law' — love your neighbor — and shows breaking one command makes you a lawbreaker of the whole. He closes: mercy triumphs over judgment.","words":[{"greek":"προσωπολημψία","translit":"prosōpolēmpsia","gloss":"favoritism / partiality","note":"Literally 'face-receiving' — judging by the surface. Deciding a man's worth by his clothes, car, or job. James calls it incompatible with faith in the Lord of glory."},{"greek":"βασιλικός","translit":"basilikos","gloss":"royal","note":"'Love your neighbor' is the royal law — the king's supreme statute. Not a suggestion for nice people; the governing law of the realm a man now belongs to."}],"thread":"The gospel is the death of favoritism. At the cross the ground is level. A believer who plays favorites forgot he himself was the poor man God chose. Mercy triumphs over judgment — because that's exactly what happened to us.","elder":"You've watched status shift across a lifetime — the rich fall, the overlooked rise. What has age taught you about judging by appearance?","first":"In a world of image, brands, and follower counts, where do you size men up by the surface?","questions":["Whose face do you 'receive' — who gets your respect by status, and who gets overlooked?","Where does partiality quietly live in your circles or your church?","'Mercy triumphs over judgment.' Where do you need to lead with mercy this week instead of a verdict?"],"forge":"Identify one person you've judged by the surface. Show them deliberate honor this week — the kind you'd give a man you were trying to impress."},{"n":5,"passage":"2:14–26","title":"Faith That Actually Works","theme":"Faith, works, and the proof of the real thing","context":"Some think this contradicts Paul — 'justified by works, not faith alone.' It doesn't. Paul fights legalists who think works earn salvation; James fights men claiming faith while living like it doesn't exist. Same coin, two edges.","text":"Can a faith that produces nothing save anyone? A gut-punch example: telling a hungry brother 'be warm and well-fed' while doing nothing. Useless. Faith without works is dead — proven by Abraham (who offered Isaac) and Rahab (who hid the spies), two very different people, both showing faith by action.","words":[{"greek":"νεκρός","translit":"nekros","gloss":"dead","note":"Not weak or immature — a corpse. Dead faith isn't a lower grade of living faith; it's a different category. A dead body and a sleeping body look similar but aren't."},{"greek":"δικαιόω","translit":"dikaioō","gloss":"to justify / vindicate","note":"Can mean 'declared righteous before God' (Paul) or 'proven righteous' (James here). Abraham was declared righteous by faith in Gen 15; his works in Gen 22 proved it. No contradiction — two moments."}],"thread":"Works don't earn salvation — they evidence it. The same grace that saves also changes. Not a to-do list added to the gospel; the fruit that always grows on a living tree.","elder":"You can spot the difference between a man who talks faith and one who lives it. What marks of the real thing have you learned to look for?","first":"Where might your faith be more talk than action right now? What would 'works' look like as proof, not performance?","questions":["Where is your faith currently 'talk' — right beliefs not producing action?","James pairs Abraham (a giant) with Rahab (an outsider with a past). What does that say about who gets working faith?","If a stranger examined only your actions this week, what would they conclude you believe?"],"forge":"Find the 'cold and hungry brother' in your world — a real need you've been meeting with words. Meet it with action this week."},{"n":6,"passage":"3:1–12","title":"The Untamed Tongue","theme":"Speech, power, and the fire no man controls alone","context":"Many in the church wanted to be teachers — a position of honor. James warns: not many should, because teachers are judged more strictly, and the teacher's tool is the tongue — the hardest thing in the body to control. Every man needs this; leaders especially.","text":"Images for the tongue's outsized power: a bit steers a horse, a rudder a ship, a spark sets a forest ablaze. Then it turns dark — the tongue is 'a fire, a world of unrighteousness,' untamable by human effort. The irony: the same mouth blesses God and curses men made in His image. A spring can't give both fresh and salt water.","words":[{"greek":"χαλιναγωγέω","translit":"chalinagōgeō","gloss":"to bridle / rein in","note":"Controlling a powerful horse with a small bit. A man doesn't kill the horse's power — he governs it. Same with the tongue: not silence, but control."},{"greek":"γέεννα","translit":"geenna","gloss":"hell / Gehenna","note":"Named for the Valley of Hinnom outside Jerusalem — a place of child sacrifice, later a burning trash dump. The destructive tongue is 'set on fire by Gehenna.'"}],"thread":"No human can tame the tongue — which is the point. James drives men to grace. What willpower can't do, the Spirit does by changing the spring. The mouth is a heart-gauge: clean water comes from a new source, not gritted teeth.","elder":"Words spoken decades ago still echo — ones that wounded, ones that healed. What has a lifetime taught you about the weight of what a man says?","first":"In the age of the group chat and the quick reply — where is your tongue (or your thumbs) running ahead of your wisdom?","questions":["Where have your words steered a relationship — for good or damage — more than you realized?","The same mouth blesses God and curses men. Where's that inconsistency in you?","If the tongue reveals the heart, what is your speech this week telling you about your source?"],"forge":"For one week, before speaking into conflict or criticism, run the filter: true? necessary? kind? Watch what dies in your mouth before it gets out."},{"n":7,"passage":"3:13–18","title":"Two Kinds of Wisdom","theme":"Earthly wisdom vs. wisdom from above","context":"James returns to wisdom — his chapter 1 theme — but now contrasts two kinds. In the ancient world 'wisdom' meant skill in living, not just knowledge. Every man lives by one of these two, whether he's named it or not.","text":"Who is wise? Proven by conduct, not claims — a good life, deeds done in humility. Counterfeit wisdom: bitter envy and selfish ambition — earthly, unspiritual, demonic, breeding disorder. Wisdom from above: pure, peace-loving, gentle, open to reason, merciful, impartial, sincere. It sows peace and reaps righteousness.","words":[{"greek":"ἐριθεία","translit":"eritheia","gloss":"selfish ambition","note":"Originally a hired worker who works only for pay; then self-seeking, partisan scheming — advancing yourself at others' expense. Ambition with no ceiling and no loyalty."},{"greek":"ἐπιεικής","translit":"epieikēs","gloss":"gentle / reasonable / yielding","note":"A man who doesn't insist on his rights, who bends where he can without breaking what's true. Not weakness — strength under control."}],"thread":"Wisdom from above 'came down' — the same language John uses for Christ. Jesus is the wisdom of God in the flesh; His life was pure, peaceable, gentle, merciful. Worldly wisdom builds the self; heavenly wisdom looks like the cross.","elder":"You've seen both wisdoms play out to their end. What fruit does each actually produce over a lifetime?","first":"The world sells earthly wisdom as 'the grind,' 'the hustle,' 'look out for yourself.' Where has that script gotten into you?","questions":["What does your recent conduct say about which wisdom you're running on?","Where is 'selfish ambition' dressed up as drive or excellence in your life?","Of the traits of wisdom from above, which is God growing in you, and which is most absent?"],"forge":"Pick one trait of wisdom from above that's weak in you. Practice it in one hard relationship this week — especially where earthly wisdom says push, win, or self-promote."},{"n":8,"passage":"4:1–12","title":"What You're Really Fighting For","theme":"Conflict, worldliness, and humility before God","context":"James gets to the root of fights and quarrels in the community — not wars between nations, but conflicts between men in the same church and family. He traces them to a surprising source: the war inside a man's own desires.","text":"Where do fights come from? Desires battling within. You want, don't have, so you quarrel — and don't have because you don't ask, or ask with wrong motives. Then: friendship with the world is enmity with God. But grace is greater — 'God opposes the proud but gives grace to the humble.' The response: submit, resist, draw near, humble yourself.","words":[{"greek":"ἡδονή","translit":"hēdonē","gloss":"pleasure / craving","note":"Root of 'hedonism.' James locates conflict in cravings that 'wage war' inside a man. The fight with your brother usually starts as one you already lost inside."},{"greek":"ταπεινόω","translit":"tapeinoō","gloss":"to humble / lower oneself","note":"In the ancient world humility looked like weakness. James inverts it: 'Humble yourselves before the Lord, and he will lift you up.' The way up is down."}],"thread":"'God opposes the proud but gives grace to the humble' is the gospel's shape. Christ humbled Himself and was exalted. Every fight a man picks to defend his pride runs against the grain of grace.","elder":"Where have you seen humility restore what pride destroyed — or the reverse?","first":"What conflict are you in that, honestly, is really about your own unmet want more than the other person's wrong?","questions":["Trace one current conflict back to its root desire in you. What do you actually want?","'Friendship with the world' — where have you quietly befriended a value system at odds with God?","Of the commands in v.7–10, which is God specifically calling you to this week?"],"forge":"Take one conflict where your pride is dug in. Do the humble thing first — draw near, admit your part, make the call — before the other man does."},{"n":9,"passage":"4:13–5:6","title":"Plans, Money, and the God You Forgot","theme":"Presumption, wealth, and living before God","context":"James addresses two kinds of men: the confident merchant planning next year's profits, and the wealthy landowner exploiting his workers. In an economy of long trading journeys and daily-wage laborers, he speaks to how a man handles ambition and money before God.","text":"The presumptuous planner (4:13–17): 'we'll go, do business, make money' — no thought of God or life's fragility. James condemns not planning, but planning as if you're in control. Say 'if the Lord wills.' Then (5:1–6) a blistering warning to the rich who hoarded wealth, withheld wages, and lived in luxury. Their gold corrodes as evidence against them.","words":[{"greek":"ἀτμίς","translit":"atmis","gloss":"mist / vapor","note":"A puff of steam, fog burned off by the sun. 'You are a mist that appears a little while and then vanishes.' Not morbid — clarifying. A man who remembers he's vapor plans differently."},{"greek":"ἀλαζονεία","translit":"alazoneia","gloss":"arrogant boasting","note":"The swagger of a man who overstates his power and control. Boasting about tomorrow as if you own it. Confidence in the wrong thing."}],"thread":"The gospel frees a man from both errors — he needn't grasp the future (a good God holds it) or hoard wealth for security (his treasure is in Christ). A man who knows he's vapor, held by an eternal God, plans boldly and holds money loosely.","elder":"You've watched certain plans dissolve and seen how fast a life passes. How has that changed the way you hold your plans and your money?","first":"You're building — career, income, future. How do you pursue ambition hard while holding it before God, not instead of Him?","questions":["Where are you planning 'as if the Lord wills' — and where as if you're in control?","How you handle money and those who work for/under you — what does it reveal?","If your life is a mist, what would you re-order this week? What matters less, and more?"],"forge":"Take one plan you're holding tightly and submit it to God — 'if the Lord wills.' And review one area of money or how you treat those under you: is there a wrong to make right?"},{"n":10,"passage":"5:7–20","title":"Patience, Prayer, and Bringing Men Back","theme":"Endurance, honest speech, and restoring the wanderer","context":"James closes as he opened — endurance under trial — but now aims men at the finish line. His readers still suffer, still wait. He calls for patience 'until the Lord's coming,' pointing to the farmer waiting for rain and the prophets who endured.","text":"Be patient like a farmer waiting on harvest. Don't grumble against each other. Consider Job. Let your yes be yes. Then a rich passage on prayer: pray when suffering, sing when happy, call the elders when sick, confess to one another — the prayer of a righteous man is powerful (Elijah). The final word: bring back the man who wanders, and you save a soul from death.","words":[{"greek":"μακροθυμία","translit":"makrothumia","gloss":"patience / long-suffering","note":"Literally 'long-tempered' — opposite of short-fused. Active, enduring steadiness under pressure, like a farmer working the field through the long wait for rain."},{"greek":"ἐπιστρέφω","translit":"epistrephō","gloss":"to turn back / bring back","note":"To turn a wanderer around, bring him home. The last word of the book — a man noticing another drifting and going after him."}],"thread":"The book ends where the gospel ends — restoration. 'Bringing back the wanderer' is what Christ did for every man in the room, now handed to us. James's final vision isn't the lone finisher; it's the man who, having endured, turns to grab the brother slipping.","elder":"You've waited through long seasons for God to move, and watched men wander and some come home. What has the wait taught you, and who came back because someone refused to give up?","first":"Patience is counter-cultural in an instant world. Where is God asking you to endure and wait right now instead of forcing an outcome?","questions":["Where do you need 'the patience of the farmer' — steady endurance through a wait you can't shortcut?","Is there a man you actually confess to, or are you enduring alone?","Who is the wandering man in your life that God might be calling you to go after?"],"forge":"Two moves: (1) confess one thing you've carried alone to a brother this week. (2) Name the one man drifting from faith you'll reach out to — and take the first step to bring him back."}]},{"id":"nehemiah","title":"The Wall","subtitle":"A Man's Study in Nehemiah","book":"Nehemiah","weeks":8,"status":"complete","accent":"#B08A3E","blurb":"Leadership, rebuilding, and standing firm against opposition. A cupbearer becomes a builder — a picture of the man who carries weight.","sessions":[{"n":1,"passage":"1:1–11","title":"The Man Who Wept First","theme":"Burden, prayer, and where leadership begins","context":"It's roughly 445 BC. The Babylonian exile is over; a remnant has returned to Jerusalem, but the city's wall still lies in ruins — a hundred years after the first return. Nehemiah isn't a priest or a prophet. He's a cupbearer to Artaxerxes, king of Persia — a trusted, high-security palace official, essentially a chief of staff with the king's ear. He's comfortable, safe, and far from the rubble. This book opens with news from home reaching a successful man in exile.","text":"Nehemiah's brother arrives with a report: the survivors in Jerusalem are in great trouble, the wall broken down, the gates burned. Watch Nehemiah's response — he doesn't immediately strategize. He sits down and weeps, mourns, fasts, and prays for days. Then comes the prayer itself: he praises God, confesses the sins of his people (including his own), recalls God's promises, and only at the very end asks for success before 'this man' — the king. Burden became prayer before it became a plan.","words":[{"greek":"חוֹמָה","translit":"chomah","gloss":"wall","note":"In the ancient world a city's wall wasn't decoration — it was identity, safety, and dignity. A city without a wall was defenseless and shamed, open to every enemy. Nehemiah weeps over a wall because he grieves a people exposed and disgraced."},{"greek":"זָכַר","translit":"zakar","gloss":"to remember","note":"Nehemiah asks God to 'remember' His promise (v.8). In Hebrew, remembering isn't recalling a fact — it's acting on a commitment. He's not informing God; he's holding God to His covenant word. Prayer that reminds God of His own promises."}],"thread":"Nehemiah's confession — identifying with a people's sin though he's far away and personally successful — points toward Christ, who fully identified with a sinful people He had no part in, and interceded for them. Before Nehemiah rebuilds a wall, he stands in the gap in prayer. The true Builder does the same for us.","elder":"You've carried burdens for people and places over the years. What has age taught you about the difference between anxious worry and burden that drives you to your knees?","first":"What's a broken situation — in your family, city, or church — that you've heard about and shrugged off? What would it look like to actually let it break your heart?","questions":["Nehemiah wept before he planned. Where do you rush to fix what God first wants you to grieve and pray over?","His prayer starts with God's character, moves through confession, and ends with the ask. How does that order rebuke the way you usually pray?","What burden has God put on your heart that you've been treating as someone else's job?"],"forge":"Name one broken thing God has burdened you with. Before doing anything about it, pray over it every day this week — starting with who God is, not with your request. Report what shifts."},{"n":2,"passage":"2:1–20","title":"Prayed-Up and Ready to Move","theme":"Planning, courage, and asking the hard question","context":"Four months pass between chapters 1 and 2 — Nehemiah prayed and waited. Now he's serving wine to the king, and his sadness shows. This was dangerous: a cupbearer was to be pleasant, and displaying sorrow before a Persian king could cost your life. Into that risk, the king asks what's wrong.","text":"The king notices Nehemiah's face and asks. Nehemiah is 'very much afraid' — then does something telling: he shoots up a split-second prayer to God and answers the king in the same breath. He makes his request — send me to rebuild — and the king grants it, plus letters and timber. Nehemiah arrives, inspects the ruins secretly by night, then rallies the people: 'Let us rise up and build.' Opposition (Sanballat, Tobiah) appears immediately, sneering. Nehemiah answers: the God of heaven will give us success.","words":[{"greek":"רָצוֹן","translit":"ratson","gloss":"favor / good pleasure","note":"Nehemiah acts because 'the good hand of my God was on me' (v.8). He prepared, planned, and asked boldly — but credits the outcome to God's favor, not his own skill. The praying man and the working man are the same man."},{"greek":"בִּירָה","translit":"birah","gloss":"fortress / citadel","note":"The word for the fortified structure by the temple. Nehemiah inspects the ruins like an engineer — measuring, assessing, counting cost — before he speaks a word publicly. Faith didn't replace planning; it fueled it."}],"thread":"Nehemiah's arrow-prayer in the king's presence shows a man who lives in constant contact with God. This is the life Jesus modeled and made possible — moment-by-moment dependence on the Father, even under pressure. Bold action flows from a prayerful life, not from self-confidence.","elder":"You've watched men act boldly and men act rashly. What's the difference you've learned to see between courage that's prayed-up and courage that's just ego?","first":"Nehemiah did his homework quietly before announcing anything. Where do you tend to announce a vision before you've counted the cost?","questions":["Nehemiah prayed for four months, then moved fast when the moment came. Where are you all planning and no action — or all action and no prayer?","He inspected the ruins honestly before rallying anyone. What broken area of your life have you avoided looking at directly?","Opposition showed up the instant he started. How do you tend to respond when your first good step is met with a sneer?"],"forge":"Take one burden you've been praying over and make the first concrete plan this week — count the cost honestly, like Nehemiah walking the ruins at night. Bring the plan to your group."},{"n":3,"passage":"3:1–32","title":"Everyone Builds Something","theme":"Ownership, teamwork, and the wall in front of you","context":"Chapter 3 reads like a list — name after name, section after section. Easy to skim. But this 'boring' chapter is one of the most powerful pictures of shared work in Scripture. Nehemiah organized the entire population to rebuild the wall, and the Spirit preserved the record of who built what.","text":"The high priest and priests build the Sheep Gate. Then goldsmiths, perfume-makers, merchants, rulers, and daughters all take a section. A recurring phrase: 'next to him' — man beside man, each owning the stretch of wall in front of his own house. Some do extra. A few nobles 'would not stoop to serve.' The genius is decentralization: everyone builds the part nearest them, and the whole wall rises together.","words":[{"greek":"נֶגֶד","translit":"neged","gloss":"opposite / in front of","note":"Many built the wall 'opposite his own house' (v.10, 23, 28). Ownership was personal — you fortified what you were closest to. The strongest walls get built when every man takes responsibility for the section right in front of him."},{"greek":"אַדִּיר","translit":"addir","gloss":"nobles / mighty ones","note":"The Tekoite nobles 'would not put their necks to the work' (v.5). The word implies status and strength — the very men most able to help refused to stoop. Position without service is exposed the moment there's real work to do."}],"thread":"The body of Christ works exactly like this wall — each part doing its own work, joined to the next, the whole growing together (Ephesians 4). No section is too small; the perfume-maker's stretch holds as surely as the priest's. Christ assigns each man his portion and builds the whole through the faithfulness of each.","elder":"You've seen churches and teams where a few carry everything and many coast. What have you learned about what makes men actually take ownership rather than spectate?","first":"The men built the section in front of their own house first. What's the 'wall in front of your house' right now — the responsibility nearest you that you keep hoping someone else will handle?","questions":["Everyone had a section. What's yours right now — in your family, church, or work — that's specifically yours to build?","The nobles wouldn't stoop to serve. Where does your pride or status keep you from the unglamorous work?","The wall rose because men built 'next to' each other. Who are you building alongside — and who's building next to you?"],"forge":"Identify the 'wall in front of your house' — the one responsibility nearest you that you've been avoiding. Build your section this week: take concrete ownership of it, and tell your group what you did."},{"n":4,"passage":"4:1–23","title":"A Trowel in One Hand, a Sword in the Other","theme":"Opposition, discouragement, and building under threat","context":"As the wall rises, opposition escalates from mockery to conspiracy. Sanballat and Tobiah, then Arabs, Ammonites, and Ashdodites, plot to attack Jerusalem and stop the work. Meanwhile the workers themselves are exhausted and afraid. This is the chapter every man building anything worthwhile eventually lives.","text":"First comes ridicule — 'even a fox climbing on it would break down their wall.' Nehemiah prays and keeps building; the wall reaches half-height because 'the people had a mind to work.' Then the threats turn violent. The workers grow discouraged: 'the strength of the laborers is failing, and there is much rubble.' Nehemiah's response is the model: he sets a guard, stations families by their sections, and arms the builders — half work, half stand watch. Each man builds with one hand and holds a weapon in the other. He tells them: don't be afraid; remember the Lord; our God will fight for us.","words":[{"greek":"עָמָל","translit":"amal","gloss":"labor / weary toil","note":"The word for the workers whose strength was 'failing' (v.10) — grinding, exhausting labor. Discouragement here wasn't spiritual weakness; it was real fatigue plus rubble plus threats. Nehemiah addresses the whole man, not just morale."},{"greek":"זָכַר","translit":"zakar","gloss":"to remember","note":"'Remember the Lord, great and awesome' (v.14). The antidote to fear isn't pretending the threat is small — it's remembering that God is bigger. Nehemiah re-anchors frightened men to the size of their God."}],"thread":"The Christian life is lived exactly here — trowel and sword, building and battling at once. Paul echoes it: put on the armor, keep doing the work. We build the kingdom while resisting a real enemy, sustained not by our strength but by the God who 'will fight for us.' Standing firm is itself faithfulness.","elder":"You've been discouraged mid-project more than once — maybe wanted to quit. What has kept you building when the strength was failing and the rubble was piled high?","first":"Opposition and fatigue hit the moment the work got real. Where are you tempted to quit something good simply because it got hard and people criticized you?","questions":["Nehemiah faced mockery, threats, and his own team's exhaustion. Which of those three is currently draining you most?","'Remember the Lord' was his answer to fear. What truth about God do you most need to remember in the threat you're facing?","The men built with one hand and held a weapon in the other. What does 'trowel and sword' look like in your daily life right now?"],"forge":"Name the specific discouragement tempting you to quit something good. This week, do the 'trowel and sword' — keep building it AND name the threat honestly to a brother who'll stand watch with you."},{"n":5,"passage":"5:1–19","title":"When the Threat Comes From Inside","theme":"Justice, integrity, and leading yourself first","context":"The external enemies couldn't stop the wall — but now the work is threatened from within. A famine, plus heavy Persian taxes, has driven poorer Jews into debt. To survive, they're mortgaging fields and even selling their children into slavery — to their own wealthy countrymen, who are charging interest and profiting off their brothers' desperation. The community is fracturing from the inside.","text":"Nehemiah hears the outcry and gets angry — a righteous anger. He confronts the nobles and officials: you are charging your own brothers interest and enslaving them. He calls them to return the fields, houses, and the interest taken. They agree. Then Nehemiah reveals his own example: as governor, he had every right to a food allowance funded by the people — but he refused it for twelve years, because the burden on the people was already too heavy. He led himself to a higher standard than he required of others.","words":[{"greek":"נְשִׁי","translit":"nashi / neshek","gloss":"interest / usury","note":"Charging interest to a fellow Israelite in distress was forbidden in the Law (Exodus 22, Leviticus 25). The wealthy weren't breaking Persian law — they were breaking God's, exploiting the letter of business while violating the heart of covenant brotherhood."},{"greek":"יִרְאָה","translit":"yirah","gloss":"fear (of God)","note":"Nehemiah refused to exploit his position 'because of the fear of God' (v.15). The fear of God is what governs a man when no earthly authority is watching. It's the internal wall that keeps a leader from becoming the thing he's fighting."}],"thread":"Nehemiah refuses to profit from his position and instead bears cost for the people — a shadow of Christ, who had every right to be served yet came to serve and give His life. True leadership spends itself for others rather than extracting from them. The fear of God produces leaders who give more than they take.","elder":"You've seen leaders who used their position to serve and leaders who used it to extract. What has watching both over the years taught you about what the fear of God actually does to a man in power?","first":"Nehemiah held himself to a standard higher than he demanded of others. Where are you tempted to demand of others what you won't require of yourself?","questions":["The wealthy were technically 'within their rights' but violating their brothers. Where might you be doing what's legal but not what's loving?","Nehemiah's integrity was strongest where no one was checking — the 'fear of God.' What do you do differently when you think no one's watching?","He bore cost so others wouldn't be crushed. Where is God calling you to absorb a cost rather than pass the burden on?"],"forge":"Examine one area where you have power or advantage over someone (money, position, information). This week, use it to serve rather than extract — and if you've been extracting, make it right."},{"n":6,"passage":"6:1–19","title":"You Can't Come Down","theme":"Distraction, intimidation, and finishing the work","context":"The wall is nearly done — only the gates remain. This is the most dangerous moment, because the enemy's final strategy shifts from force to manipulation. Sanballat and Tobiah know they can't beat Nehemiah in a fight, so they try to lure him off the wall through distraction, slander, and fear.","text":"Four times the enemies invite Nehemiah to 'meet' in a village on the plain — really a trap to harm him. Four times he sends the same reply: 'I am doing a great work and cannot come down.' Then they try slander — a letter accusing him of plotting rebellion. He denies it and keeps building. Finally they hire a false prophet to frighten him into hiding in the temple, which would have discredited and sinned against him. Nehemiah discerns the deception and refuses. The wall is finished in fifty-two days — and even the enemies recognize it was done 'with the help of our God.'","words":[{"greek":"מְלָאכָה","translit":"melakah","gloss":"work / task / undertaking","note":"The 'great work' Nehemiah won't come down from. The same word for God's work of creation. Nehemiah sees the wall not as a construction project but as a divine assignment — which is exactly why no invitation, however flattering, can pull him off it."},{"greek":"יָרֵא","translit":"yare","gloss":"to fear / be intimidated","note":"The enemies' whole aim was to make Nehemiah afraid (v.9, 13, 19) so his hands would drop from the work. Intimidation is a strategy against builders. Nehemiah's counter-move every time: 'strengthen my hands' in prayer."}],"thread":"'I cannot come down' is the posture of a man who knows his assignment. Jesus lived it perfectly — undistractable, unbaitable, setting His face toward the work the Father gave Him even to the cross. The enemy still works by distraction and fear; the finished work belongs to those who refuse to come down.","elder":"You've watched good men get pulled off good work by distraction, offense, or fear. What have you learned about staying on the wall when everything's trying to lure you down?","first":"Nehemiah named his work 'great' and refused to trade it for lesser meetings. What lesser things most successfully pull you off the great work in front of you?","questions":["Nehemiah said 'I cannot come down' four times to the same trap. What invitation or distraction keeps coming back to pull you off your assignment?","The enemy shifted from force to manipulation near the finish. Where are you more vulnerable to flattery and fear than to open opposition?","He finished in 52 days because he wouldn't stop. What good work have you left 90% done because you came down before the gates went up?"],"forge":"Name the 'great work' God has given you for this season and the specific distraction pulling you off it. This week, practice Nehemiah's line — literally say 'I can't come down' — and finish one part you've been leaving undone."},{"n":7,"passage":"8:1–18","title":"The Word That Rebuilds the Man","theme":"Scripture, understanding, and the joy of the Lord","context":"The wall is finished — but Nehemiah knows a city is only as strong as the people inside it. So the focus shifts from stone to soul. The people gather and ask Ezra the scribe to bring out the Book of the Law. What follows is one of Scripture's great pictures of a community encountering God's Word together.","text":"Ezra reads the Law aloud from morning till midday, and the people stand and listen — hungry for it. The Levites move through the crowd, 'giving the sense, so that the people understood the reading' — the first picture of exposition, making the text clear. As the people understand, they weep, convicted. But Nehemiah tells them: this day is holy; don't mourn — 'the joy of the Lord is your strength.' They celebrate, share food with those who have none, and rediscover the Feast of Booths. Understanding the Word led to conviction, then to joy, then to obedience and generosity.","words":[{"greek":"בִּין","translit":"bin","gloss":"to understand / give sense","note":"Used repeatedly here — the Levites made the people 'understand' (v.7–8). It means to discern, to grasp the meaning, not just hear the sound. Reading the Word aloud wasn't enough; it had to be understood. This is the whole reason exposition exists."},{"greek":"חֶדְוָה","translit":"chedvah","gloss":"joy / gladness","note":"'The joy of the Lord is your strength' (v.10). This joy isn't a mood; it's a stronghold — the word carries the sense of a fortified gladness. When the Word convicts, the enemy wants despair; God gives joy that becomes a man's actual strength."}],"thread":"This is what the Word does: it exposes, then it heals; it convicts, then it gives joy. It points to Christ, the Word made flesh, in whom conviction always leads to grace, not condemnation. A man is rebuilt the same way a city is — by encountering God's Word, understanding it, and letting joy become his strength.","elder":"You've read Scripture for decades. When has the Word cut you and then, in the same season, become your strength and joy? What did that rebuild in you?","first":"The people wanted the Word explained so they could understand it — they were hungry. Where's your hunger level for actually understanding Scripture, not just hearing it?","questions":["The Levites made the Word understandable, and it changed the people. What's your plan for actually understanding Scripture, not just consuming it?","Conviction came first, then Nehemiah redirected them to joy. Do you tend to get stuck in mourning over sin, or skip conviction entirely?","'The joy of the Lord is your strength.' Where are you running on your own strength when God offers His joy as the fuel?"],"forge":"Pick one passage this week and don't just read it — work to understand it (context, meaning, application), then obey one thing it says. Notice whether understanding produces the joy Nehemiah promised."},{"n":8,"passage":"9–13 (selections)","title":"The Wall Is Easy, the Heart Is Hard","theme":"Covenant, backsliding, and finishing faithful","context":"The final chapters show the people's response and a sobering reality. In chapter 9 they confess and worship in a sweeping recital of God's faithfulness and their repeated failure. In chapter 10 they sign a written covenant to obey. But by chapter 13, Nehemiah returns from a trip to Persia to find much of it already unraveled — the very sins they'd just covenanted against.","text":"The people make solemn promises: no intermarriage that pulls them from God, keep the Sabbath, support the temple. For a while, it holds. But when Nehemiah leaves and returns, he finds Tobiah given a room in the temple, the Levites unpaid and scattered, the Sabbath violated by open trade, and men married to foreign wives whose children can't even speak the language of Judah. Nehemiah confronts it forcefully — throwing out Tobiah's furniture, restoring the Levites, shutting the gates on the Sabbath. The book ends not with triumph but with his repeated prayer: 'Remember me, O my God, for good.' The wall was finished in 52 days; the heart is a lifelong work.","words":[{"greek":"אָמָנָה","translit":"amanah","gloss":"firm covenant / binding pledge","note":"The written, signed agreement in chapter 10 (v.38). Rooted in the word for faithfulness and 'amen' — a sure, binding thing. The tragedy of chapter 13 is a signed amanah broken within a few years. Good intentions, even sworn ones, don't sustain obedience."},{"greek":"זָכַר","translit":"zakar","gloss":"remember","note":"The book's final refrain — 'Remember me, O my God' (13:14, 22, 31). The same word from chapter 1. Nehemiah began and ended asking God to remember. A faithful man's hope rests not in his own record but in God's remembering."}],"thread":"Nehemiah exposes the deepest problem: you can rebuild a wall in 52 days, but you can't fix the human heart with a covenant on paper. The people needed a new heart, not just new walls — the exact promise Ezekiel gave and Christ fulfilled. The gospel is God writing His law on the heart, doing inside a man what no external covenant ever could.","elder":"You've seen revivals fade and resolutions break — maybe your own. What have you learned about why external commitments fail, and what actually produces lasting change in a man?","first":"The people meant it when they signed — and still drifted. Where have your sincere resolutions unraveled the moment accountability left the room?","questions":["They covenanted sincerely and backslid quickly. Which of your genuine spiritual commitments has quietly eroded lately?","Nehemiah's reforms required constant vigilance — the moment he left, decay set in. What good thing in your life decays fast the moment you stop tending it?","The real need was a new heart, not a new wall. Where are you trying to fix by willpower what only God can change from the inside?"],"forge":"Identify one sincere commitment that has quietly unraveled. Rather than just re-resolving in your own strength, ask God to do the internal work — and put one accountability structure in place so it survives when motivation leaves."}]},{"id":"mark","title":"The Servant King","subtitle":"A Man's Study in Mark","book":"Mark","weeks":12,"status":"complete","accent":"#2A8C8C","blurb":"The fast-paced Gospel that asks one question: who is this man? Action, authority, and the call to follow Him to the cross and empty tomb.","sessions":[{"n":1,"passage":"1:1–20","title":"The King Arrives","theme":"The gospel's opening, and the call that leaves nets behind","context":"Mark is the shortest, fastest Gospel — written likely from Peter's eyewitness memories, aimed at Roman readers who valued action over genealogy. There's no Christmas story here. Mark opens at full sprint with a stunning claim in verse 1: this is 'the gospel of Jesus Christ, the Son of God.' Everything after is evidence for that headline.","text":"John the Baptist appears in the wilderness, preparing the way, baptizing and pointing to one mightier than himself. Jesus is baptized — the heavens tear open, the Spirit descends, the Father's voice declares 'You are my beloved Son.' Immediately (Mark's favorite word) the Spirit drives Jesus into the wilderness, tempted forty days. Then Jesus begins preaching: 'The kingdom of God is at hand; repent and believe.' He calls four fishermen — Simon, Andrew, James, John — and 'immediately' they leave their nets and follow. The King has arrived, and His first act is to summon men.","words":[{"greek":"εὐθύς","translit":"euthus","gloss":"immediately / at once","note":"Mark's signature word — he uses it over 40 times, more than the rest of the New Testament combined. It gives the Gospel its breathless pace and its point: the King is on the move, and the response He calls for is immediate, not eventual."},{"greek":"εὐαγγέλιον","translit":"euangelion","gloss":"gospel / good news","note":"In the Roman world, an 'euangelion' announced a military victory or an emperor's birth. Mark hijacks the imperial word: the real good news isn't about Caesar but about the true King. Verse 1 is a quiet act of defiance against Rome's whole claim."}],"thread":"The torn heavens and the Father's voice identify Jesus as the beloved Son at the very start — the King the whole Old Testament awaited. His first move is to call ordinary working men to follow. The gospel is the announcement that the King has come, and it demands the same response from us as from the fishermen: drop the nets, follow.","elder":"The fishermen left their livelihood immediately. Looking back, what did following Jesus cost you to leave — and was it worth what you thought you were giving up?","first":"Jesus called men in the middle of their ordinary work, not at a religious event. Where is He calling you to follow right now, in the middle of your regular life?","questions":["The Father called Jesus 'beloved' before He'd done any public ministry. How does being loved before performing challenge how you approach God?","The men left their nets 'immediately.' What net are you still holding that Jesus is asking you to drop?","Mark opens claiming Jesus is the Son of God — the whole book is evidence. What evidence in your own life backs that claim?"],"forge":"Identify one 'net' — a security, habit, or comfort — you're gripping instead of fully following Jesus. Take one concrete step to loosen your grip on it this week."},{"n":2,"passage":"1:21–45","title":"Authority Like No One Else","theme":"Power over demons, disease, and the priority of prayer","context":"Mark now stacks up demonstrations of Jesus' authority in rapid succession — a single day in Capernaum that establishes who this man is. Roman readers respected power and authority above almost everything; Mark shows them a Jesus whose authority outranks anything they'd known.","text":"In the synagogue, Jesus teaches with an authority that astonishes — 'not as the scribes.' A demon-possessed man cries out; Jesus commands the spirit to leave, and it obeys. His fame spreads instantly. He heals Simon's mother-in-law, then at sundown the whole town brings its sick and demon-oppressed, and He heals many. But watch the next morning: while it's still dark, Jesus goes off alone to pray. When the disciples find Him ('everyone is looking for you'), He doesn't return to the crowds — He moves on to preach elsewhere, because that's why He came. Then He touches and heals a leper — the untouchable — with compassion.","words":[{"greek":"ἐξουσία","translit":"exousia","gloss":"authority / right to act","note":"The crowd is amazed at Jesus' 'authority' (1:22, 27). Not just power (dunamis) but the rightful authority to command — even demons obey. The scribes quoted other authorities; Jesus is the authority. His word alone accomplishes what He says."},{"greek":"σπλαγχνίζομαι","translit":"splanchnizomai","gloss":"moved with compassion / gut-wrenched","note":"Jesus is 'moved with compassion' for the leper (1:41). The word refers to the inner organs — a visceral, gut-level pity. Jesus' authority isn't cold; the same power that silences demons is moved to its core by a suffering, untouchable man."}],"thread":"Jesus' authority over demons, disease, and defilement reveals the King reclaiming a broken creation. But the hinge of the chapter is His withdrawal to pray — even the Son of God, in constant demand, prioritized time alone with the Father. Power and prayer aren't opposites; His authority flowed from His communion.","elder":"Jesus rose before dawn to pray even when 'everyone was looking for him.' What have you learned over the years about protecting time with God against the pull of everyone's demands?","first":"Jesus refused to let the crowd's agenda ('everyone is looking for you') set His. Where is the pull of others' expectations pulling you off what God actually called you to?","questions":["The busiest man who ever lived guarded solitary prayer. What does your prayer life reveal about where your strength actually comes from?","Jesus touched the untouchable leper with gut-level compassion. Who are the 'untouchables' you keep at arm's length?","He moved on from success in Capernaum because of His mission. Where does staying in a comfortable win keep you from your actual calling?"],"forge":"Copy Jesus' pattern this week: get alone with God before the demands hit, even once. And move toward one 'untouchable' person with deliberate compassion."},{"n":3,"passage":"2:1–3:6","title":"Friction With the Religious","theme":"Forgiveness, mercy, and why the rule-keepers hated Him","context":"Jesus' authority now collides with the religious establishment. Mark groups five controversy stories that build toward a chilling conclusion — the religious leaders plotting to kill Him. The men most confident they knew God turn out to be His fiercest opponents. This is a warning to every religious man.","text":"Friends lower a paralyzed man through a roof; Jesus forgives his sins, then heals him to prove He has authority to forgive — a claim only God can make. He calls Levi, a tax collector, and eats with 'sinners,' saying He came for the sick, not the healthy. He's challenged on fasting, then on the Sabbath twice — His disciples pick grain, and He heals a man's withered hand on the Sabbath. Jesus declares the Sabbath was made for man, not man for the Sabbath, and grieves at the leaders' hardness of heart. Their response to His mercy: they begin plotting with the Herodians to destroy Him.","words":[{"greek":"σκληροκαρδία","translit":"sklērokardia","gloss":"hardness of heart","note":"Jesus is grieved at their 'hardness of heart' (3:5) — literally a hardened, calloused heart. The tragedy: the religious experts, not the sinners, had the hard hearts. Rule-keeping without mercy calcifies a man until he'd rather see a hand stay withered than admit he's wrong."},{"greek":"ἐξίστημι","translit":"existēmi","gloss":"to be amazed / beside oneself","note":"The crowds were 'amazed' (2:12) at the paralytic's healing. The word means to be put out of your normal state, astonished beyond composure. The common people were undone by Jesus' mercy; the religious leaders, seeing the same thing, hardened. Same evidence, opposite hearts."}],"thread":"Jesus claims the divine authority to forgive sins and consistently chooses mercy over ritual — revealing the heart of God against the cold religion of the day. He came for the sick, not the self-righteous. The offense of grace is that it welcomes the wrong people, which is exactly why the rule-keepers plotted His death. The gospel still offends the self-righteous.","elder":"You've been religious long enough to know how rule-keeping can harden a heart. Where have you seen (or caught) yourself preferring being right over showing mercy?","first":"Jesus ate with the 'wrong' people and it scandalized the religious. Who would it scandalize your circle to see you befriend — and what's stopping you?","questions":["The religious experts had the hardest hearts. Where might your spiritual knowledge be producing pride and hardness rather than mercy?","Jesus said He came for the sick, not the healthy. Do you approach God as someone sick who needs a doctor, or as someone basically fine?","'The Sabbath was made for man, not man for the Sabbath.' Where do you keep rules in a way that misses the person the rule was meant to serve?"],"forge":"Examine one area where you keep a 'rule' in a way that lacks mercy. This week, choose mercy over being right in one specific relationship — and befriend one person your circle might question."},{"n":4,"passage":"3:7–35","title":"The Twelve and the True Family","theme":"Calling, opposition, and who really belongs to Jesus","context":"Crowds now press Jesus from every direction. Amid the growing frenzy, He does two defining things: He appoints twelve men to be with Him, and He redefines family. Meanwhile opposition sharpens — His own family thinks He's lost His mind, and scribes accuse Him of working by Satan's power.","text":"Jesus withdraws to the sea, mobbed by crowds from every region. He goes up a mountain and appoints twelve apostles — 'that they might be with him' and be sent out to preach with authority. Then two forms of opposition: His family comes to seize Him, saying 'He is out of his mind,' and scribes from Jerusalem charge that He casts out demons by Beelzebul. Jesus dismantles the charge — a kingdom divided can't stand; He's the strong man binding Satan — and warns about blaspheming the Holy Spirit. Finally, told His mother and brothers are outside, He looks at those seated around Him: 'Whoever does the will of God, he is my brother and sister and mother.'","words":[{"greek":"ἀπόστολος","translit":"apostolos","gloss":"apostle / sent one","note":"Jesus appoints twelve 'apostles' (3:14) — literally 'sent ones,' envoys with the sender's authority. But note the order: first 'to be with him,' then 'to send them out.' Being with Jesus precedes being sent by Jesus. Presence before mission."},{"greek":"θέλημα","translit":"thelēma","gloss":"will / desire","note":"'Whoever does the will (thelēma) of God is my brother' (3:35). Jesus makes spiritual family, not blood family, the deepest bond — defined not by feeling but by doing God's will. Belonging to Jesus is proven by obedience, and it creates a brotherhood thicker than blood."}],"thread":"Jesus binds 'the strong man' — declaring war on Satan's kingdom and plundering it. And He creates a new family defined by doing the Father's will, foreshadowing the church, where men from every background become brothers through Christ. The men in a study like this are, by Jesus' own definition, family — brothers bound by a shared Father.","elder":"Jesus defined family by shared obedience to God, not blood. How has the family of God carried you when — or beyond what — your blood family could?","first":"The Twelve were called first 'to be with him,' then to be sent. Are you trying to do things for Jesus without first spending time with Him?","questions":["'To be with him' came before being sent. Where are you prioritizing activity for God over presence with God?","Jesus' own family thought He was crazy. Where does following Jesus fully risk misunderstanding, even from those closest to you?","He calls those who do God's will His brothers. What does it mean that the men in this room are, by Jesus' definition, your family?"],"forge":"Prioritize 'being with him' this week before 'doing for him' — guard time in His presence first. And invest in one spiritual brother as actual family, not just an acquaintance."},{"n":5,"passage":"4:1–41","title":"Seeds, Soil, and the Storm","theme":"The word, the kingdom's hidden growth, and fear vs. faith","context":"Mark now gathers Jesus' teaching in parables about the kingdom, then ends with a dramatic miracle that tests the disciples' faith. The chapter moves from how the kingdom grows (quietly, like seed) to a terrifying storm that exposes what the disciples really believe about the man in their boat.","text":"Jesus tells the parable of the sower: the same seed (the word) lands on four soils — hardened path, rocky ground, thorny weeds, and good soil — with radically different results. The difference isn't the seed; it's the soil, the heart's receptivity. He adds parables of the lamp, the growing seed (the kingdom grows mysteriously while the farmer sleeps), and the mustard seed (tiny start, huge result). Then evening comes; they cross the sea. A violent storm rises, the boat filling, while Jesus sleeps. Terrified, they wake Him: 'Do you not care that we are perishing?' He rebukes the wind — 'Peace! Be still!' — and it's instantly calm. Then to them: 'Why are you so afraid? Have you still no faith?' They're now afraid of a different thing: 'Who then is this?'","words":[{"greek":"καρποφορέω","translit":"karpophoreō","gloss":"to bear fruit","note":"The good soil 'bears fruit' (4:20), thirty, sixty, a hundredfold. The proof of good soil isn't hearing the word or even initial enthusiasm (the rocky soil had that) — it's fruit that lasts. The word's aim in a man is a fruitful life, not just a receptive moment."},{"greek":"δειλός","translit":"deilos","gloss":"cowardly / timid / fearful","note":"'Why are you so afraid (deilos)?' (4:40). A strong word — cowardly, timid fear. Jesus links their terror directly to a lack of faith. The opposite of fear here isn't bravery; it's trust in who's in the boat. Fear exposes what a man actually believes about Jesus."}],"thread":"The parables reveal a kingdom that grows quietly and unstoppably through the planted word, and the storm reveals the King who commands creation itself. The disciples' question — 'Who then is this?' — is Mark's whole point: only God rules wind and wave. The word that saves is the word of the One who calms storms; the soil He wants is a heart that trusts Him in the boat.","elder":"Four soils, one seed. Over a lifetime you've seen the word take root in some men and choke in others. What have you learned about what makes the difference — and what keeps your own soil good?","first":"The storm exposed what the disciples really believed. What recent 'storm' has exposed the actual state of your faith — not what you say you believe, but what you do under pressure?","questions":["Which soil best describes your heart right now — hardened, shallow, thorn-choked, or fruitful? Be honest about what's choking the word.","'Do you not care that we are perishing?' Where are you accusing God of not caring in a storm He's actually present in?","Jesus asked 'have you still no faith?' after all they'd seen. Where has God proven faithful before, yet you still panic as if He hasn't?"],"forge":"Identify what's currently 'choking the word' in your soil (busyness, comfort, worry, sin). Pull one weed this week. And name the storm you're in — then preach to yourself who's in the boat."},{"n":6,"passage":"5:1–43","title":"No One Too Far Gone","theme":"Deliverance, desperation, and the touch of faith","context":"Mark presents three people the world had written off — a demon-possessed outcast, a dying girl, and a chronically ill, ceremonially unclean woman — and shows Jesus' power reaching each one. These stories answer the disciples' question from the storm ('Who then is this?') with living proof.","text":"Across the sea, a man possessed by a legion of demons lives among the tombs, uncontrollable, self-harming. Jesus casts the demons into a herd of pigs; the man is restored, clothed, in his right mind, and sent home to tell his story. Back across the water, a synagogue ruler, Jairus, begs Jesus to heal his dying daughter. On the way, a woman who's bled for twelve years — unclean, isolated, broke from doctors — touches Jesus' cloak, believing that's enough. She's instantly healed; Jesus stops the whole crowd to call her 'daughter' and commend her faith. Meanwhile Jairus's daughter dies. Jesus tells him, 'Do not fear, only believe,' goes to the house, and raises the girl with a tender word: 'Little girl, arise.'","words":[{"greek":"σῴζω","translit":"sōzō","gloss":"to save / heal / make whole","note":"'Your faith has made you well (sōzō)' (5:34) — the same word means 'saved.' Physical healing and spiritual salvation share one word, because Jesus makes the whole person whole. The woman got more than a cured body; she got a Savior who called her 'daughter.'"},{"greek":"πίστις","translit":"pistis","gloss":"faith / trust","note":"Faith runs through all three stories — the woman's touch, Jairus's plea. Note it's not the amount of faith but its object. The woman's faith was mixed with superstition, yet Jesus honored it because it reached for Him. Desperate faith aimed at Jesus is enough."}],"thread":"Three hopeless cases — a possessed outcast, an unclean woman, a dead child — all met by a Jesus for whom no one is too far gone. He crosses every barrier (demonic, ceremonial, even death) and touches the untouchable. This is the reach of the gospel: the King who conquers death itself, and who stops for one desperate, trembling woman in a crowd.","elder":"You've known men and women the world had written off who were reached by Christ. Whose 'too far gone' story have you watched God rewrite?","first":"The woman pushed through shame and a crowd just to touch Jesus. What shame or fear is keeping you from reaching for Him with that kind of desperation?","questions":["Three people everyone had given up on were reached by Jesus. Who in your life have you written off as 'too far gone' for God?","The woman's faith was imperfect but reached for Jesus, and He honored it. Where are you waiting to have 'enough' faith instead of just reaching?","Jesus told Jairus, 'Do not fear, only believe,' right after news of death. Where is God asking you to keep believing past the point it seems hopeless?"],"forge":"Reach for Jesus this week with the desperation of that woman about one specific need — push past the shame or doubt that's held you back. And pray for one person you'd written off as too far gone."},{"n":7,"passage":"6:1–56","title":"Rejected at Home, Feeding the Crowd","theme":"Unbelief, mission, and the Shepherd who provides","context":"This chapter swings between rejection and provision. Jesus is dismissed in His hometown, sends out the Twelve, hears of John the Baptist's brutal death, then feeds five thousand and walks on water. It's a portrait of ministry's real texture — opposition and abundance, grief and glory, side by side.","text":"In Nazareth, the hometown crowd takes offense — 'isn't this just the carpenter?' — and Jesus can do little there because of their unbelief. He sends the Twelve out two by two with authority, traveling light, to preach repentance. Mark recounts John the Baptist's execution by Herod — a sober picture of the cost of faithfulness. The apostles return exhausted; Jesus calls them to rest, but crowds follow. Seeing them 'like sheep without a shepherd,' He's moved with compassion, teaches them, and feeds five thousand from five loaves and two fish, with twelve baskets left over. Then He sends the disciples ahead by boat, prays alone, and walks to them on the water through a storm — 'Take heart; it is I. Do not be afraid.'","words":[{"greek":"σκανδαλίζω","translit":"skandalizō","gloss":"to take offense / be tripped up","note":"The hometown crowd 'took offense' (6:3) — the root of our word 'scandal,' a trap or stumbling-block. Familiarity blinded them; they couldn't see the Son of God because they knew Him as the carpenter. Sometimes we miss Jesus precisely because we assume we already know Him."},{"greek":"ποιμήν","translit":"poimēn","gloss":"shepherd","note":"The crowds were 'like sheep without a shepherd' (6:34), and Jesus' compassion moves Him to feed them — echoing God as Israel's Shepherd (Psalm 23, Ezekiel 34). Jesus is the promised Shepherd-King, who leads, feeds, and lays down His life for the flock."}],"thread":"Jesus, rejected by those who thought they knew Him, reveals Himself as the true Shepherd who provides abundantly for the hungry and walks through the storm to His own. The feeding echoes God feeding Israel in the wilderness; the water-walking echoes God treading the waves. Mark keeps answering 'Who is this?' — He is God with us, the Shepherd of the sheep.","elder":"Familiarity made Nazareth miss Jesus. After many years in the faith, how do you guard against the 'I already know this' unbelief that dulls a man to Christ?","first":"Jesus sent the Twelve out with almost nothing but His authority. Where is fear of being unequipped keeping you from stepping into what He's calling you to?","questions":["The hometown crowd missed Jesus because they thought they knew Him. Where has over-familiarity dulled your sense of who Jesus really is?","Jesus was 'moved with compassion' by directionless people and met their real need. Who around you is a sheep without a shepherd, and how could you show that compassion?","'Take heart; it is I; do not be afraid.' Where do you need to hear Jesus say that in the storm you're currently rowing against?"],"forge":"Fight familiarity this week — come to a well-known passage or truth about Jesus asking Him to show you something new. And step out in one act of service you feel underequipped for, trusting His authority, not your resources."},{"n":8,"passage":"7:1–8:26","title":"Clean Hearts and Opened Eyes","theme":"Tradition vs. the heart, and gradual sight","context":"Jesus confronts the gap between external religion and the heart, extends His ministry to Gentiles, and performs two more feedings and healings. The section climaxes with a unique two-stage healing of a blind man — a deliberate picture of how the disciples (and we) come to see who Jesus is: gradually.","text":"The Pharisees criticize the disciples for eating with unwashed hands, breaking tradition. Jesus exposes them: they honor God with their lips while their hearts are far away, elevating human tradition over God's command. Then the key teaching: defilement isn't external — it's what comes out of the heart (evil thoughts, greed, pride, etc.) that defiles a man. He then heals a Gentile woman's daughter, honoring her persistent faith, and a deaf man. He feeds four thousand, is challenged by Pharisees demanding a sign, and warns the disciples about the 'leaven' of the Pharisees. Finally, He heals a blind man in two stages — first blurry ('I see men like trees walking'), then clearly — a living parable of dawning spiritual sight.","words":[{"greek":"κοινόω","translit":"koinoō","gloss":"to defile / make common","note":"What comes out of the heart 'defiles' (koinoō) a man (7:20) — makes him common, unclean. Jesus relocates defilement from the hands to the heart. The problem was never dirty hands; it's a dirty heart, and no amount of external washing reaches it."},{"greek":"καρδία","translit":"kardia",
