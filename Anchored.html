"gloss":"heart","note":"'Out of the heart come evil thoughts...' (7:21). In Hebrew thought the heart is the control center — mind, will, and desire together, not just emotion. Jesus diagnoses the human problem as a heart problem, which is why He came to give a new heart, not just new rules."}],"thread":"Jesus locates sin in the heart, not in external rituals — meaning the cure must be a new heart, which only He can give. The two-stage healing of the blind man mirrors the disciples' journey: they're beginning to see who Jesus is, but not yet clearly. Spiritual sight, like that healing, often comes gradually — and it's Jesus who opens eyes.","elder":"Jesus said defilement comes from the heart, not the outside. What has a long walk with God taught you about how deep the heart's problems go — and how patiently God works on them?","first":"The blind man saw gradually, not instantly. Where are you seeing Jesus 'like trees walking' — partially, blurrily — and needing Him to open your eyes further?","questions":["Jesus exposed lips that honored God while hearts were far away. Where does that describe you — right words, distant heart?","He listed what comes from the heart: greed, pride, deceit, lust. Which one is God putting His finger on in your heart right now?","Sight came in two stages. What are you starting to see about Jesus that you couldn't before — and where do you still need clearer vision?"],"forge":"Stop working on the 'hands' this week and let Jesus work on the heart — identify one heart issue (not behavior) behind a recurring struggle, and bring it honestly to Him and to a brother."},{"n":9,"passage":"8:27–9:1","title":"Who Do You Say I Am?","theme":"Confession, the cross, and the cost of following","context":"This is the hinge of Mark's entire Gospel — the exact center, both structurally and thematically. Everything before builds to the question Jesus now asks; everything after moves toward the cross. Peter finally names Jesus correctly, then immediately shows he's misunderstood what kind of Messiah Jesus is.","text":"At Caesarea Philippi, Jesus asks, 'Who do people say I am?' Then, pointedly: 'But who do you say I am?' Peter answers, 'You are the Christ.' Correct — but the moment Jesus explains that the Christ must suffer, be rejected, killed, and rise, Peter rebukes Him. Jesus rebukes Peter sharply: 'Get behind me, Satan! You are setting your mind on the things of man, not of God.' Then the cost is laid out for everyone: 'If anyone would come after me, let him deny himself, take up his cross, and follow me.' Whoever tries to save his life will lose it; whoever loses it for Christ and the gospel will save it. What does it profit a man to gain the whole world and forfeit his soul?","words":[{"greek":"Χριστός","translit":"Christos","gloss":"Christ / Anointed One","note":"Peter's confession: 'You are the Christos' (8:29) — the Messiah, God's anointed King. Peter has the title right but the job description wrong. He expects a conquering king, not a crucified one. Right confession, wrong cross — the exact mistake men still make about Jesus."},{"greek":"ἀπαρνέομαι","translit":"aparneomai","gloss":"to deny / disown utterly","note":"'Let him deny (aparneomai) himself' (8:34) — to renounce, to say no to. The same word used when Peter later 'denies' Christ. Following Jesus means disowning self-rule as thoroughly as Peter would later disown Jesus — a total renunciation of self as king."}],"thread":"This is the center of the Gospel: Jesus is the Christ, but a suffering, crucified Christ — not the conquering hero Peter wanted. And to follow Him is to take up a cross, not a crown. The gospel redefines both the Messiah and the man: Jesus saves by dying, and we follow by dying to self. There's no other road behind Him.","elder":"'Who do you say I am?' You've answered that question with your life for years. How has your understanding of who Jesus is deepened — or been corrected — over time?","first":"Peter wanted a Christ without a cross. Where do you want the benefits of following Jesus without the self-denial He requires?","questions":["Jesus makes it personal: not what others say, but 'who do YOU say I am?' How would your actual life — not your words — answer that?","Peter had the right title but the wrong expectations. Where have you wanted Jesus to be a different kind of King than He actually is?","'Deny yourself, take up your cross.' What specific cross is Jesus asking you to carry that you've been avoiding?"],"forge":"Answer Jesus' question this week in writing — who do YOU say He is — and name one specific way self is still on the throne. Take one concrete step to 'deny yourself' there and follow Him instead."},{"n":10,"passage":"9:2–50","title":"Glory, Then the Valley","theme":"Transfiguration, unbelief, and true greatness","context":"After the turn toward the cross, Jesus gives three disciples a glimpse of His glory, then descends immediately into a scene of failure and need. The chapter contrasts mountaintop glory with valley struggle, and repeatedly overturns the disciples' assumptions about greatness and status.","text":"On a high mountain, Jesus is transfigured — His clothes radiantly white — appearing with Moses and Elijah. The Father's voice again: 'This is my beloved Son; listen to him.' Coming down, they find the other disciples failing to cast out a demon from a boy. The father cries the honest prayer: 'I believe; help my unbelief!' Jesus casts out the spirit and tells the disciples this kind comes out only by prayer. Jesus again predicts His death and resurrection; they don't understand and are afraid to ask. Then, catching them arguing about who's greatest, He redefines greatness: 'If anyone would be first, he must be last of all and servant of all,' and welcomes a child. He warns severely against causing others to stumble.","words":[{"greek":"μεταμορφόω","translit":"metamorphoō","gloss":"to transfigure / transform","note":"Jesus was 'transfigured' (9:2) — the root of 'metamorphosis,' a transformation from within. For a moment the veil lifted and the disciples saw His true glory shine out. It wasn't a light shining on Him but the divine glory shining from within Him."},{"greek":"διάκονος","translit":"diakonos","gloss":"servant / one who serves","note":"'Servant (diakonos) of all' (9:35) — the word for a table-waiter, the lowest household role, root of 'deacon.' Jesus makes the servant's position the definition of greatness in His kingdom. The way up is down; the first is the one who serves everyone else."}],"thread":"The Father's command on the mountain — 'listen to him' — comes right after Jesus predicts His death, confirming that the glory and the cross belong together. And in the valley, Jesus meets honest, struggling faith ('help my unbelief') with power. True greatness, He insists, is servanthood — the pattern He'll perfect at the cross, where the King of glory becomes servant of all.","elder":"The father prayed, 'I believe; help my unbelief.' After decades of faith, does that prayer still fit you? What has taught you to hold belief and honest doubt together?","first":"The disciples argued about who was greatest. In your generation's world of status and comparison, where does that same argument play out in you?","questions":["'I believe; help my unbelief' — where does that honest, mixed prayer describe your faith right now?","Jesus said greatness is being 'servant of all.' Where are you chasing a version of greatness that's the opposite of servanthood?","The disciples failed to cast out the demon; Jesus said 'this kind only by prayer.' What are you trying to accomplish by effort that requires prayer you're not doing?"],"forge":"Pray the father's prayer this week — 'I believe; help my unbelief' — over your biggest area of doubt. And pursue greatness Jesus' way: find one hidden, servant-level act to do for someone who can't repay you."},{"n":11,"passage":"10:1–52","title":"The Cost and the Reward of Following","theme":"Marriage, wealth, servant-leadership, and seeing clearly","context":"On the road to Jerusalem and the cross, Jesus teaches on the things men wrestle with most — marriage and divorce, children, wealth, ambition. Each encounter exposes a heart issue and redefines the kingdom's values against the world's. It ends with a blind man who sees more clearly than the disciples.","text":"Jesus upholds God's design for marriage against casual divorce, then welcomes children as models of kingdom-receiving. A rich man asks how to inherit eternal life; Jesus, loving him, tells him to sell all and follow — and he walks away sorrowful, because he had great wealth. Jesus warns how hard it is for the rich to enter the kingdom ('easier for a camel through a needle's eye'), but 'with God all things are possible.' Peter notes they've left everything; Jesus promises reward, with persecutions, now and eternal life to come. James and John ask for the top seats; Jesus redefines leadership: the Gentiles lord it over people, 'but it shall not be so among you' — the great one serves, for even the Son of Man came 'not to be served but to serve, and to give his life as a ransom for many.' Finally, blind Bartimaeus cries out, is healed, and follows Jesus on the way.","words":[{"greek":"λύτρον","translit":"lutron","gloss":"ransom / price of release","note":"'To give his life as a ransom (lutron) for many' (10:45) — the price paid to free a slave or captive. This is the clearest statement of why Jesus came: His death purchases our freedom. The whole march to the cross is a rescue mission with a price attached."},{"greek":"διάκονος","translit":"diakonos","gloss":"servant","note":"Again 'servant' (10:43) — Jesus can't stop hammering it. Real authority in His kingdom is downward: the leader serves. And He models it Himself — the King who serves and dies. Leadership that lords over people is explicitly forbidden: 'it shall not be so among you.'"}],"thread":"The whole chapter drives to verse 45 — the Son of Man came to serve and give His life as a ransom. Marriage, wealth, and ambition are all reframed by the cross, where the King spends Himself for others. Bartimaeus, who 'sees' and follows, is the picture of the true disciple, while the rich man who couldn't let go is the warning. Following costs everything and is worth everything.","elder":"The rich man couldn't let go of his wealth to follow. Over the years, what have you had to release to keep following Jesus, and what did you gain that was worth more?","first":"James and John wanted status and position. Where is ambition for recognition competing with Jesus' call to serve in your life right now?","questions":["Jesus loved the rich man and still told him to let go of the one thing he trusted. What's your 'one thing' you'd struggle to release to follow fully?","'It shall not be so among you' — Jesus forbids lording over others. Where do you use authority (at work, home, church) to be served rather than to serve?","Bartimaeus knew exactly what he wanted from Jesus and cried out for it. If Jesus asked you 'what do you want me to do for you?', what's your honest answer?"],"forge":"Name the 'one thing' you'd find hardest to release for Jesus, and loosen your grip this week. And take one act of downward, servant-leadership toward someone you have authority over."},{"n":12,"passage":"11–16 (the Passion)","title":"The King Who Dies and Rises","theme":"The cross, the tomb, and the finished mission","context":"The final act. Jesus enters Jerusalem as king, confronts the corrupt temple system, faces down the religious leaders, institutes the Lord's Supper, is betrayed, tried, crucified, and raised. Mark, who's been building the whole time toward 'Who is this?', now gives the definitive answer at the cross and the empty tomb. This session covers the arc; a group may choose to slow down and take it over several weeks.","text":"Jesus enters Jerusalem to shouts of 'Hosanna,' then clears the temple, declaring it a house of prayer made a den of robbers. He silences the religious leaders' traps, teaches on the greatest commandment, and predicts the temple's fall. At a final meal He takes bread and cup — 'this is my body... my blood of the covenant, poured out for many.' In Gethsemane He prays, 'Abba, Father... not what I will, but what you will.' Betrayed by Judas, deserted by all, denied by Peter, He's condemned by the council and by Pilate, mocked, and crucified. At His death the temple curtain tears top to bottom, and a Roman centurion — a Gentile — confesses, 'Truly this man was the Son of God.' He's buried. On the third day, women find the tomb empty; a young man in white says, 'He has risen; he is not here.' Mark's abrupt ending leaves the reader facing the same choice as everyone in the book.","words":[{"greek":"ἐσχίσθη","translit":"eschisthē","gloss":"was torn / split","note":"The temple curtain 'was torn' (15:38) top to bottom — the same verb as the heavens being 'torn' at Jesus' baptism (1:10). Mark bookends his Gospel: heaven tore open to send the Son, and the curtain tore open at His death. The barrier between God and man is ripped away by the cross."},{"greek":"ἠγέρθη","translit":"ēgerthē","gloss":"he has been raised","note":"'He has risen (ēgerthē)' (16:6) — a passive form: he was raised, by the Father. The resurrection is God's vindication of His Son and the seal on everything Jesus claimed. The empty tomb is the answer to the whole book's question: this is the Son of God, alive."}],"thread":"Everything in Mark has driven here. The King reigns from a cross, the curtain tears so men can come to God, and a Gentile soldier gives the confession the whole Gospel aimed at: 'Truly this man was the Son of God.' Then the tomb is empty — death itself defeated. The good news of verse 1:1 is finished and proven. Mark ends abruptly on purpose, leaving every reader — including every man in the room — with the same decision: will you follow the risen King?","elder":"The centurion, watching Jesus die, confessed Him as the Son of God. Looking back over your life, what has most convinced you that this is true — that He is who He claimed?","first":"Mark ends with the empty tomb and a choice hanging in the air. Where are you in your response to the risen Jesus — following fully, hanging back, still deciding?","questions":["The curtain tore so men could come directly to God. Do you live like that access is real — coming boldly — or still relating to God at a distance?","In Gethsemane Jesus prayed 'not what I will, but what you will.' Where is God asking you to pray that same surrender right now?","A Gentile outsider gave the clearest confession in the book at the foot of the cross. What would it look like for the cross to draw that confession out of you afresh?"],"forge":"Sit at the cross and empty tomb this week — read the Passion slowly and let it land. Then answer Mark's closing question with action: name one concrete way you'll follow the risen King more fully, and take the first step."}]},{"id":"timothy","title":"Finish the Race","subtitle":"A Man's Study in 1 & 2 Timothy","book":"1–2 Timothy","weeks":8,"status":"complete","accent":"#B08A3E","blurb":"Paul's charge to a younger man: guard the gospel, lead well, endure hardship, and finish faithful. Mentorship, from the source.","sessions":[{"n":1,"passage":"1 Tim 1","title":"Guard What You Were Given","theme":"Sound doctrine, a clear conscience, and grace for the worst","context":"Paul writes to Timothy, his young protégé, whom he's left in Ephesus to lead a church under pressure from false teachers. Timothy is relatively young, sometimes timid, and facing men teaching a distorted gospel. This is a mentor's charge to a younger man stepping into hard leadership — the exact dynamic of a mixed-age room.","text":"Paul opens by charging Timothy to stop the false teachers — men obsessed with myths, speculation, and misusing the Law, who've wandered into meaningless talk. The goal of right teaching, Paul says, is love from a pure heart, a good conscience, and sincere faith. Then Paul turns personal: he was the worst of sinners — a blasphemer and persecutor — yet received mercy, so that Christ could display His perfect patience in him as an example. He charges Timothy to 'wage the good warfare,' holding faith and a good conscience, which some have shipwrecked.","words":[{"greek":"παραγγελία","translit":"parangelia","gloss":"charge / command","note":"A military term — an order passed down the chain of command. Paul isn't offering Timothy suggestions; he's relaying a commission. Sound teaching isn't one option among many; it's the assignment a leader is under orders to guard."},{"greek":"ναυαγέω","translit":"nauageō","gloss":"to shipwreck","note":"Some 'made shipwreck' of their faith (v.19) by rejecting a good conscience. The image is a vessel destroyed on rocks. Paul links doctrine and conscience — a man who ignores his conscience will eventually wreck his faith, however sound his theology sounds."}],"thread":"Paul's testimony is the gospel in miniature — the chief of sinners shown mercy as a pattern of Christ's patience for everyone after him. No man is too far gone; if grace reached Paul the persecutor, it reaches anyone. The gospel Timothy must guard is the same gospel that saved its fiercest enemy.","elder":"Paul held up his own past as evidence of grace, not something to hide. How has owning your worst chapters become a way to help younger men rather than a source of shame?","first":"Timothy was young, leading men who challenged him. Where does your age or inexperience make you want to shrink back from a responsibility God's given you?","questions":["Paul ties sound doctrine to a good conscience — you can't wreck one without eventually wrecking the other. Where is your conscience being quietly ignored?","He called himself the worst of sinners yet fully forgiven. Do you actually believe grace covers your worst, or are you still performing to earn it?","'Wage the good warfare.' What's the good fight God has specifically handed you to fight right now?"],"forge":"Identify one place you've been ignoring your conscience — a small compromise you keep excusing. Address it this week before it becomes a shipwreck, and tell a brother."},{"n":2,"passage":"1 Tim 2–3","title":"The Kind of Man Who Leads","theme":"Prayer, character, and the qualifications that matter","context":"Paul moves to how the church should function — starting with prayer, then order in worship, then the character required of leaders. In a culture obsessed with charisma and status, Paul lists qualifications for overseers and deacons that are almost entirely about character, not talent. This is Paul defining what a spiritually mature man actually looks like.","text":"First, Paul urges prayer for all people, especially those in authority, because God wants all people saved — there's one God and one mediator, Christ. Then the leadership qualifications: an overseer must be above reproach, faithful to his wife, sober-minded, self-controlled, hospitable, able to teach, not a drunk or violent or greedy, gentle, managing his own household well, not a new convert, and respected even by outsiders. Deacons likewise must be tested and proven. Notice: almost none of it is about skill. It's overwhelmingly about a man's character, home, and self-control.","words":[{"greek":"ἀνεπίλημπτος","translit":"anepilēmptos","gloss":"above reproach / beyond accusation","note":"The overarching qualification (3:2) — literally 'not able to be laid hold of.' Not sinless, but giving no legitimate handle for accusation. A man whose life offers no obvious place for an enemy to grab. Character with no exposed handle."},{"greek":"νηφάλιος","translit":"nēphalios","gloss":"sober-minded / clear-headed","note":"Originally 'not intoxicated,' it came to mean temperate, level-headed, free from excess that clouds judgment. A leader has to be a man others can trust to think clearly — not driven by impulse, appetite, or the emotion of the moment."}],"thread":"The qualifications describe, ultimately, a man being formed into the image of Christ — self-controlled, gentle, faithful, servant-hearted. No man arrives fully qualified; these are the marks the Spirit grows in a man over time. Leadership in God's house is character before competence, because the shepherd is meant to reflect the Chief Shepherd.","elder":"Paul weighted character far above talent. Over a lifetime, what have you seen matter more in the long run — a man's gifts or his character? Give an example.","first":"The list is mostly about self-control, home life, and reputation — not platform or skill. Which qualification feels most out of reach for you right now, and why?","questions":["Paul starts leadership with prayer for others. How much of your energy goes to praying for people versus managing them?","'Above reproach' means no legitimate handle for accusation. Where in your life is there a handle an enemy could grab?","The list emphasizes managing your own household well. What does the private state of your home say about your readiness to lead anywhere else?"],"forge":"Read the character list slowly and pick the one quality most lacking in you. Take one concrete step to grow it this week — especially if it's in how you lead at home."},{"n":3,"passage":"1 Tim 4","title":"Train Yourself for Godliness","theme":"Discipline, example, and not despising your youth","context":"Paul warns that some will abandon the faith, following deceiving teachings — including a false spirituality that forbids marriage and certain foods, treating God's good creation as evil. Against that, Paul gives Timothy a positive charge: train yourself, teach well, and don't let anyone look down on you for being young.","text":"Paul says everything God created is good, received with thanksgiving. Then the core exhortation: have nothing to do with godless myths; instead, 'train yourself for godliness.' Physical training has some value, but godliness has value for all of life and the life to come. He charges Timothy: don't let anyone despise your youth — set an example in speech, conduct, love, faith, and purity. Devote yourself to Scripture, to teaching, to your gifting. 'Keep a close watch on yourself and on the teaching,' persevering, because in doing so you'll save both yourself and your hearers.","words":[{"greek":"γυμνάζω","translit":"gumnazō","gloss":"to train / exercise","note":"Root of 'gymnasium.' Paul borrows the athlete's world: godliness isn't passive, it's trained for — deliberate, repeated, disciplined effort like a competitor in the gymnasium. A godly man is made the way an athlete is made: reps, not wishes."},{"greek":"τύπος","translit":"tupos","gloss":"example / pattern / imprint","note":"'Set the believers an example' (4:12) — a tupos is a mark left by a strike, a mold, a stamp. Timothy's life is to be a die that presses its shape onto others. A leader teaches as much by the pattern of his life as by his words."}],"thread":"'Train yourself for godliness' assumes grace does the saving and discipline does the growing. This is the Christian life: the Spirit empowers, and the man trains. Christ Himself is the pattern Timothy imprints onto others — a leader reproduces in men what Christ has reproduced in him.","elder":"Paul says train for godliness like an athlete trains his body. What spiritual disciplines have actually shaped you over the decades — and which did you neglect and regret?","first":"Timothy was told not to let anyone look down on his youth, but to earn respect by example. Where do you use your age as an excuse instead of setting an example?","questions":["You train what you value. What does the way you spend your time and effort reveal about whether you're training for godliness or something else?","Paul lists five areas of example: speech, conduct, love, faith, purity. Which is strongest in you, and which is weakest?","'Keep a close watch on yourself and the teaching.' Where have you stopped watching yourself closely — and what's slipping as a result?"],"forge":"Choose one spiritual discipline and 'train' it this week like an athlete — same time, deliberate reps (prayer, Scripture, fasting, service). Treat godliness as something you practice, not just believe."},{"n":4,"passage":"1 Tim 5–6","title":"Honor, Contentment, and the Love of Money","theme":"Relationships, generosity, and what to chase","context":"Paul gives Timothy practical wisdom for leading a diverse congregation — how to treat older and younger men and women, how to care for widows, how to honor elders, how to handle wealth. It culminates in one of Scripture's sharpest warnings about money and one of its clearest calls to contentment.","text":"Treat older men as fathers, younger as brothers, older women as mothers, younger as sisters — with all purity. Honor and provide for widows truly in need; a man who won't provide for his family 'has denied the faith.' Honor elders who lead well. Then the money teaching: godliness with contentment is great gain — we brought nothing in and take nothing out. The love of money is a root of all kinds of evil; some, craving it, have wandered from the faith and pierced themselves with grief. Command the rich not to trust wealth but to be generous, storing up treasure for the age to come, taking hold of 'that which is truly life.'","words":[{"greek":"αὐτάρκεια","translit":"autarkeia","gloss":"contentment / self-sufficiency","note":"'Godliness with contentment is great gain' (6:6). In Paul's world this word meant a self-sufficiency independent of circumstances. Paul redefines it — his sufficiency is in Christ, not himself. Contentment is wealth that no market can touch."},{"greek":"φιλαργυρία","translit":"philarguria","gloss":"love of money","note":"Literally 'love of silver' (6:10). Note precisely what Paul says is the root of evil — not money, but the love of it. The problem isn't the metal; it's the affection. A poor man can love money and a rich man can hold it loosely."}],"thread":"Paul's teaching on money flows from the gospel: Christ, though rich, became poor to make us rich. A man secure in that inheritance is free from the grip of greed — free to be generous, content, and to hold wealth as a tool, not a treasure. 'That which is truly life' is found in God, never in gain.","elder":"You've watched the love of money 'pierce' men over a lifetime — marriages, integrity, peace. What have you seen it cost, and what does real contentment look like in the men who found it?","first":"You're in your building years, where the pull to chase money is strongest. How do you pursue provision hard without letting the love of it take root?","questions":["Paul says the love of money — not money itself — is the danger. Honestly, where does that love have a grip on you, regardless of how much you have?","'Godliness with contentment is great gain.' Where is discontent driving you right now, and what would contentment change?","He tells the rich to be generous and 'take hold of that which is truly life.' What are you gripping that isn't truly life?"],"forge":"Test your grip on money this week with one deliberate act of generosity that actually costs you something — and examine honestly where the 'love of money,' not money itself, is steering your decisions."},{"n":5,"passage":"2 Tim 1","title":"Fan Into Flame","theme":"Courage, the Spirit, and guarding the deposit","context":"Second Timothy is Paul's last letter — written from a Roman prison, likely awaiting execution. This is a dying mentor's final charge to the son in the faith he loves most. Everything here carries the weight of a man near the end, pouring his heart into the one who'll carry on. Timothy is discouraged and possibly fearful; Paul writes to reignite him.","text":"Paul recalls Timothy's sincere faith, passed down through his grandmother Lois and mother Eunice. Then the charge: 'fan into flame the gift of God' in you — for God gave us a spirit not of fear, but of power, love, and self-control. So don't be ashamed of the gospel or of Paul's chains; join in suffering for it by God's power. Paul isn't ashamed, because he knows whom he has believed and is convinced God will guard what he's entrusted to Him. Then to Timothy: guard the good deposit entrusted to you, by the Holy Spirit who dwells in us. He notes some deserted him, but one man, Onesiphorus, refreshed him and wasn't ashamed of his chains.","words":[{"greek":"ἀναζωπυρέω","translit":"anazōpureō","gloss":"to fan into flame / rekindle","note":"A vivid image (1:6) — to stir dying embers back into fire. Timothy's gift hadn't died; it had dimmed. The call isn't to get a new gift but to rekindle the one he has. Spiritual fire needs tending, or it fades to coals."},{"greek":"παραθήκη","translit":"parathēkē","gloss":"deposit / entrusted treasure","note":"The 'good deposit' Timothy must guard (1:14) — a banking term for something valuable placed in trust. The gospel is treasure handed to Timothy to protect and pass on intact. A steward doesn't own the deposit; he guards it for the next man."}],"thread":"Paul's confidence in prison — 'I know whom I have believed' — is gospel courage. The Spirit God gives is one of power, love, and self-control, not fear. The same Spirit that raised Christ guards the deposit in us and fans the flame. A man's courage isn't self-generated; it's the fruit of knowing the One he's trusted.","elder":"Paul, near death, poured everything into a younger man. Who fanned your flame when it was dimming — and into whom are you pouring now?","first":"Timothy's fire had dimmed, not died. What gift or calling in you has cooled to embers, and what's caused it to dim?","questions":["'A spirit not of fear but of power, love, and self-control.' Which of those three do you most need fanned into flame right now?","Paul guarded the 'deposit' to pass it on intact. What has been entrusted to you — faith, family, calling — that you're responsible to guard and hand on?","Some deserted Paul; Onesiphorus refreshed him. Which are you being to the people under pressure around you — a deserter or a refresher?"],"forge":"Identify the gift or calling that's dimmed to embers in you. Take one deliberate action this week to fan it back into flame — and be an 'Onesiphorus' to one person carrying a heavy load."},{"n":6,"passage":"2 Tim 2","title":"Soldier, Athlete, Farmer","theme":"Endurance, focus, and reliable men","context":"Paul gives Timothy a series of vivid pictures of what faithful endurance looks like, then the key to multiplication — entrusting the message to reliable men. This is the mentorship engine of the whole Anchored vision: a man discipled to disciple others. Paul is describing how the gospel outlives any one man.","text":"Be strong in grace, Paul says, and entrust what you've heard to 'faithful men who will be able to teach others also' — four generations of discipleship in one verse. Then three images of the faithful man: a soldier who doesn't get entangled in civilian affairs but aims to please his commanding officer; an athlete who competes by the rules to win the crown; a hard-working farmer who gets the first share of the crop. Endurance is the theme — remember Jesus Christ, raised from the dead. Paul suffers, even in chains, but 'the word of God is not bound.' He calls Timothy to avoid foolish quarrels and be a workman who rightly handles the word of truth, gentle and patient, a vessel for honorable use.","words":[{"greek":"παρατίθημι","translit":"paratithēmi","gloss":"to entrust / deposit with","note":"'Entrust to faithful men' (2:2) — the same root as the 'deposit' from chapter 1. The gospel is passed hand to hand, man to man. Multiplication, not addition: Timothy trains men who train men. This single verse is the blueprint for generational discipleship."},{"greek":"ὀρθοτομέω","translit":"orthotomeō","gloss":"to cut straight / rightly handle","note":"'Rightly handling the word of truth' (2:15) — literally to cut a straight road or plow a straight furrow. The workman doesn't twist or wander through Scripture; he cuts it straight, handling the text accurately. Sloppy handling of the Word is called out as shameful work."}],"thread":"'Entrust to faithful men who will teach others' is the gospel's engine — Christ discipled the Twelve, who discipled the church, down to this room. Paul endures chains because the risen Christ makes the suffering worth it and the word unbound. A man's labor for the gospel, like a farmer's, is hard but harvest-bound.","elder":"'Entrust to faithful men who will teach others.' Who poured into you, and who have you poured into that's now pouring into others? Trace the line if you can.","first":"Soldier, athlete, farmer — all three endure and stay focused. Which image most challenges how you're currently living: the distracted soldier, the rule-breaking athlete, or the lazy farmer?","questions":["Paul describes four generations of discipleship in one verse. Where are you in that chain — who's discipling you, and who are you discipling?","The soldier avoids getting 'entangled in civilian affairs.' What good-but-secondary things are entangling you and blurring your mission?","'Rightly handling the word of truth' is called a workman's skill. How much real effort do you put into handling Scripture accurately?"],"forge":"Name one 'faithful man' you could begin pouring into — even informally. Take the first step this week. And identify one 'entanglement' pulling you off mission, and cut it."},{"n":7,"passage":"2 Tim 3","title":"Godless Times and a God-Breathed Book","theme":"Cultural decay, Scripture, and standing firm","context":"Paul warns Timothy about the character of the last days — a startlingly modern-sounding list of a self-absorbed, godless culture. Against that backdrop, he anchors Timothy to two things: the example of a faithful mentor's life, and the sufficiency of Scripture. This is a man being equipped to stand firm when the culture erodes.","text":"In the last days come 'times of difficulty': people will be lovers of self, lovers of money, proud, abusive, ungrateful, unholy, without self-control, lovers of pleasure rather than lovers of God — having the appearance of godliness but denying its power. Paul tells Timothy to avoid such people. Then he contrasts Timothy's own upbringing: 'you have followed my teaching, my conduct, my aim' — you've known the Scriptures from childhood, which make you wise for salvation. Then the anchor verse: all Scripture is God-breathed and profitable for teaching, reproof, correction, and training in righteousness, so that the man of God may be complete, equipped for every good work.","words":[{"greek":"θεόπνευστος","translit":"theopneustos","gloss":"God-breathed / inspired","note":"'All Scripture is God-breathed' (3:16) — a word Paul may have coined, combining 'God' and 'breath.' Scripture isn't merely about God; it's breathed out by Him. That's why it can equip a man completely — its source is the mouth of God Himself."},{"greek":"ἄρτιος","translit":"artios","gloss":"complete / fully fitted","note":"The man of God is made 'complete' (3:17) — capable, fully suited to his purpose, like a tool fitted exactly to its job. Scripture doesn't just inform a man; it equips and completes him for every good work. Nothing else needed to be fully outfitted."}],"thread":"In a decaying culture, Paul doesn't hand Timothy a strategy — he hands him the God-breathed Word and a faithful example. Scripture is sufficient because it's Christ's own breath, and it points to Christ on every page ('wise for salvation through faith in Christ Jesus'). The man anchored to the Word stands when the culture falls.","elder":"Paul's list of the 'last days' sounds like today. Having watched culture shift over decades, what has kept you standing firm, and what have you seen topple men who weren't anchored?","first":"The culture Paul describes is the water you swim in daily. Which item on his list — lovers of self, money, pleasure — has most shaped your generation, and you?","questions":["Paul's antidote to a godless culture was a God-breathed book and a godly example. How central is Scripture actually to how you navigate the culture?","'Appearance of godliness but denying its power' — where might that describe you: the look of faith without its transforming power?","Scripture is said to make a man 'complete, equipped for every good work.' Do you treat it that way, or as one input among many?"],"forge":"Pick one area where the culture has shaped you more than Scripture has. This week, deliberately let the God-breathed Word reshape your thinking on it — and find a 'Paul' whose example you can follow."},{"n":8,"passage":"2 Tim 4","title":"I Have Finished the Race","theme":"Faithfulness to the end, and the crown that waits","context":"These are among the last recorded words of Paul before his execution. He knows the end is near. He gives Timothy a final, solemn charge, then reflects on his own life with staggering peace, and closes with personal notes that reveal both loneliness and hope. This is how a man finishes — and how he hands the baton.","text":"Paul charges Timothy solemnly, before God: preach the word, in season and out; be ready, reprove, rebuke, exhort with patience — because a time is coming when people won't tolerate sound teaching but will gather teachers to suit their own desires. So keep a clear head, endure suffering, do the work of an evangelist, fulfill your ministry. Then Paul turns to himself: 'I am already being poured out as a drink offering; the time of my departure has come. I have fought the good fight, I have finished the race, I have kept the faith.' A crown of righteousness awaits — for him and all who long for Christ's appearing. He asks Timothy to come soon; some have deserted him, but the Lord stood by him and will bring him safely home.","words":[{"greek":"σπένδομαι","translit":"spendomai","gloss":"to be poured out as a drink offering","note":"'I am already being poured out' (4:6) — the image of the drink offering poured out beside a sacrifice. Paul sees his entire life, and now his death, as an offering poured out to God. Not wasted, not tragic — an offering. A life spent, deliberately, for God."},{"greek":"ἀγών","translit":"agōn","gloss":"fight / contest / race","note":"'I have fought the good fight' (4:7) — root of 'agony.' It's the athletic contest, the struggle demanding everything. Paul doesn't say he won every round; he says he fought the good fight and finished the course. Faithfulness to the end, not a flawless record, is the goal."}],"thread":"Paul faces death with peace because his hope is Christ and the crown of righteousness Christ gives — not earned, but awarded to all who love His appearing. This is how the gospel lets a man die: poured out, finished, faithful, and unafraid. The race is run toward a Person, and the finish line is His face.","elder":"Paul could say 'I have finished the race, I have kept the faith' at the end. What does finishing well look like to you now, and what are you doing to make sure you can say those words?","first":"Paul handed the baton to a younger man as he finished. You're near the start of your race — what kind of man do you want to be handing the baton to at the end?","questions":["'I have fought the good fight, finished the race, kept the faith.' If your life ended today, which of those three could you honestly say?","Paul saw his life as an offering 'poured out.' Are you spending your life deliberately for something, or letting it leak away?","He longed for Christ's appearing. Does the return of Christ actually shape how you live, or is it an abstract belief?"],"forge":"Write your own version of Paul's three lines — the fight, the race, the faith — as the man you want to be at the end. Then take one step this week that moves you toward being able to say them honestly."}]}];
const LENSES = [["Context","Who wrote it, why"],["Text","What it says"],["Language","Words English flattens"],["Thread","Where Christ is"],["Forge","What it demands"]];

function anchor(size,color,stroke){
  color=color||"#2A8C8C";stroke=stroke||2;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.4"/><line x1="12" y1="7.4" x2="12" y2="21"/><line x1="7" y1="11" x2="17" y2="11"/><path d="M4 15c0 4 3.6 6 8 6s8-2 8-6"/></svg>';
}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

let route={view:"home"};
function go(r){route=r;render();window.scrollTo(0,0);}

function header(){
  var back = route.view!=="home" ? '<span class="back eyebrow" onclick="go({view:\'home\'})">← All Studies</span>' : '';
  return '<header><div class="hbar"><div class="logo" onclick="go({view:\'home\'})">'+anchor(23,"#3FB0AE")+'<span class="disp">ANCHORED</span></div><span class="htag eyebrow">Men\'s Curriculum</span>'+back+'</div></header>';
}
function footer(){return '<footer>'+anchor(20,"#8EA6AA")+'<div class="eyebrow">Anchored Steps · True Balance</div></footer>';}

function home(){
  var chips = LENSES.map(function(l,i){return '<div class="lens-chip"><span class="num">'+(i+1)+'</span><span style="font-weight:600">'+l[0]+'</span><span class="d">· '+l[1]+'</span></div>';}).join("");
  var cards = TRACKS.map(function(t){
    return '<div class="tcard" style="border-top-color:'+t.accent+'" onclick="go({view:\'track\',tid:\''+t.id+'\'})">'
      +'<div class="row"><div class="eyebrow" style="color:'+t.accent+'">'+esc(t.book)+' · '+t.weeks+' weeks</div>'
      +'<span class="badge" style="background:'+t.accent+'">Ready</span></div>'
      +'<h3 class="disp">'+esc(t.title)+'</h3><div class="sub disp">'+esc(t.subtitle)+'</div>'
      +'<div class="blurb">'+esc(t.blurb)+'</div>'
      +'<div class="go" style="color:'+t.accent+'">Open study →</div></div>';
  }).join("");
  return '<section class="hero"><div class="hero-ghost">'+anchor(320,"#ffffff",1)+'</div>'
    +'<div class="wrap hero-in"><div class="eyebrow" style="color:#3FB0AE;margin-bottom:16px">Expository study · built for ages 25–77</div>'
    +'<h1 class="disp">Open the text.<br>Let it forge men.</h1>'
    +'<p>One method, many books. Every study runs the same five lenses — so a room of mixed ages goes deep together, and every man leaves with something to do.</p>'
    +'<div class="lens-strip">'+chips+'</div></div></section>'
    +'<section class="sec"><div class="wrap"><div class="sec-head"><span class="eyebrow">The Library</span><h2 class="disp">Studies</h2><span class="note">Four books. More can be added.</span></div>'
    +'<div class="grid">'+cards+'</div>'
    +'<div class="note-box">'+anchor(26,"#8EA6AA")+'<div><strong style="color:var(--ink)">Add a book:</strong> every study is one data object in the same shape. Author the sessions, drop it in the library, and it inherits the whole method — lenses, mixed-age prompts, and the Forge.</div></div>'
    +'</div></section>';
}

function track(){
  var t=TRACKS.find(function(x){return x.id===route.tid;});
  var rows=t.sessions.map(function(s,i){
    return '<div class="wrow" onclick="go({view:\'session\',tid:\''+t.id+'\',idx:'+i+'})">'
      +'<div class="wnum">'+String(s.n).padStart(2,"0")+'</div>'
      +'<div style="flex:1"><div><span class="wt">'+esc(s.title)+'</span><span class="wp" style="color:'+t.accent+'">'+esc(t.book)+' '+esc(s.passage)+'</span></div>'
      +'<div class="wtheme">'+esc(s.theme)+'</div></div>'
      +'<div class="arrow" style="color:'+t.accent+'">→</div></div>';
  }).join("");
  return '<section class="thero"><div class="wrap-narrow thero-in"><div class="eyebrow">'+esc(t.book)+' · '+t.weeks+' weeks · expository</div>'
    +'<h1 class="disp">'+esc(t.title)+'</h1><div class="sub disp">'+esc(t.subtitle)+'</div><p>'+esc(t.blurb)+'</p></div></section>'
    +'<section><div class="wrap-narrow"><div class="wlist">'+rows+'</div></div></section>';
}

function session(){
  var t=TRACKS.find(function(x){return x.id===route.tid;});
  var s=t.sessions[route.idx]; var total=t.sessions.length;
  var words=s.words.map(function(w){
    return '<div class="wordcard"><div class="top"><bdi class="gk">'+esc(w.greek)+'</bdi> <span class="tl">('+esc(w.translit)+')</span> <span class="gl">&#8212; '+esc(w.gloss)+'</span></div><div class="nt">'+esc(w.note)+'</div></div>';
  }).join("");
  var qs=s.questions.map(function(q,i){return '<li><span class="qn">'+(i+1)+'</span><span class="qt">'+esc(q)+'</span></li>';}).join("");
  var prevD=route.idx===0?"disabled":""; var nextD=route.idx===total-1?"disabled":"";
  return '<section class="shero"><div class="wrap-narrow shero-in"><div class="eyebrow">'+esc(t.title)+' · Week '+s.n+' of '+total+' · '+esc(t.book)+' '+esc(s.passage)+'</div>'
    +'<h1 class="disp">'+esc(s.title)+'</h1><div class="stheme disp">'+esc(s.theme)+'</div></div></section>'
    +'<section class="sbody"><div class="wrap-narrow">'
    +'<div class="block"><div class="eyebrow lbl" style="color:var(--teal)">① Context</div><div class="body">'+esc(s.context)+'</div></div>'
    +'<div class="block"><div class="eyebrow lbl" style="color:var(--teal)">② Text — what the passage says</div><div class="body">'+esc(s.text)+'</div></div>'
    +'<div class="block"><div class="eyebrow lbl" style="color:var(--gold)">③ Language — words worth knowing</div><div class="words">'+words+'</div></div>'
    +'<div class="block"><div class="eyebrow lbl" style="color:var(--teal)">④ Thread — where Christ is</div><div class="body">'+esc(s.thread)+'</div></div>'
    +'<div class="eyebrow" style="color:var(--navy);margin-bottom:10px">⑤ Forge — the questions</div>'
    +'<div class="prompt elder"><span class="plbl">Elder Wisdom&nbsp;&nbsp;</span><span class="ptext">'+esc(s.elder)+'</span></div>'
    +'<div class="prompt first"><span class="plbl">First Steps&nbsp;&nbsp;</span><span class="ptext">'+esc(s.first)+'</span></div>'
    +'<div class="qhead">For the table:</div><ol class="qlist">'+qs+'</ol>'
    +'<div class="forge">'+anchor(28,"#3FB0AE")+'<div><div class="eyebrow flbl">The Forge · this week</div><div class="ftext">'+esc(s.forge)+'</div></div></div>'
    +'<div class="snav"><button class="nbtn" '+prevD+' onclick="go({view:\'session\',tid:\''+t.id+'\',idx:'+(route.idx-1)+'})">← Previous</button>'
    +'<button class="nbtn primary" '+nextD+' onclick="go({view:\'session\',tid:\''+t.id+'\',idx:'+(route.idx+1)+'})">Next →</button></div>'
    +'</div></section>';
}

function render(){
  var body="";
  if(route.view==="home")body=home();
  else if(route.view==="track")body=track();
  else if(route.view==="session")body=session();
  document.getElementById("app").innerHTML=header()+body+footer();
}
render();
</script>
</body>
</html>
