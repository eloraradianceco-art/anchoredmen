ole book's question: this is the Son of God, alive."}],"thread":"Everything in Mark has driven here. The King reigns from a cross, the curtain tears so men can come to God, and a Gentile soldier gives the confession the whole Gospel aimed at: 'Truly this man was the Son of God.' Then the tomb is empty — death itself defeated. The good news of verse 1:1 is finished and proven. Mark ends abruptly on purpose, leaving every reader — including every man in the room — with the same decision: will you follow the risen King?","elder":"The centurion, watching Jesus die, confessed Him as the Son of God. Looking back over your life, what has most convinced you that this is true — that He is who He claimed?","first":"Mark ends with the empty tomb and a choice hanging in the air. Where are you in your response to the risen Jesus — following fully, hanging back, still deciding?","questions":["The curtain tore so men could come directly to God. Do you live like that access is real — coming boldly — or still relating to God at a distance?","In Gethsemane Jesus prayed 'not what I will, but what you will.' Where is God asking you to pray that same surrender right now?","A Gentile outsider gave the clearest confession in the book at the foot of the cross. What would it look like for the cross to draw that confession out of you afresh?"],"forge":"Sit at the cross and empty tomb this week — read the Passion slowly and let it land. Then answer Mark's closing question with action: name one concrete way you'll follow the risen King more fully, and take the first step.","formation":{"culture":"The culture leaves a man perpetually deciding — never committing. It celebrates keeping your options open, hedging, staying non-committal, treating every conviction as provisional. Even about Christ, a man is encouraged to admire, consider, and remain comfortably undecided, because commitment feels like a loss of freedom. And so he stands at the empty tomb, moved but non-committal, forever on the fence.\n\nMark ends abruptly on purpose — the empty tomb, and a choice hanging in the air. A Gentile soldier, watching Jesus die, gave the confession the whole Gospel aimed at: 'Truly this man was the Son of God.' The human heart delays surrender indefinitely if allowed; that's ancient. The man who was never called to decide stays perpetually at the fence, admiring a risen King he never actually follows.","inventory":{"lead":"**Mark ends with a choice hanging in the air. Where are you in your response to the risen Jesus — following fully, hanging back, or still 'deciding'?**","prompts":["In Gethsemane Jesus surrendered fully; the culture keeps you hedging. Where are you keeping your options open with God instead of committing?","A Gentile outsider gave the clearest confession in the book at the foot of the cross. What would it look like for the cross to draw that confession fresh out of you?"],"land":"How do you see the culture — keep your options open, never commit — impacting your response to the risen King?"},"step":{"milestone":"Week 12 of 12 — Will You Follow the Risen King?","body":"You've reached the end of the longest study, and Mark won't let you leave neutral. Look back across twelve weeks: from 'beloved' at the baptism, through the question 'who is this man,' to the cross and the empty tomb. The whole Gospel has driven to one decision, and Mark ends abruptly to force it. The mark of a man who's finished well isn't that he admires Jesus — it's that he's answered the question with his life and named one concrete way he'll follow the risen King more fully. The tomb is empty. The choice is yours. What's your answer?"},"prayer":"Father, I've stayed comfortably undecided — admiring Jesus, keeping my options open, never fully committing. But the tomb is empty, and the choice won't wait. Draw out of me the confession the soldier gave at the cross: truly, this is the Son of God. I don't want to just admire the risen King. I want to follow Him. Take my answer, and take my life. Amen."}}]},{"id":"timothy","title":"Finish the Race","subtitle":"A Man's Study in 1 & 2 Timothy","book":"1–2 Timothy","weeks":8,"status":"complete","accent":"#B08A3E","blurb":"Paul's charge to a younger man: guard the gospel, lead well, endure hardship, and finish faithful. Mentorship, from the source.","sessions":[{"n":1,"passage":"1 Tim 1","title":"Guard What You Were Given","theme":"Sound doctrine, a clear conscience, and grace for the worst","context":"Paul writes to Timothy, his young protégé, whom he's left in Ephesus to lead a church under pressure from false teachers. Timothy is relatively young, sometimes timid, and facing men teaching a distorted gospel. This is a mentor's charge to a younger man stepping into hard leadership — the exact dynamic of a mixed-age room.","text":"Paul opens by charging Timothy to stop the false teachers — men obsessed with myths, speculation, and misusing the Law, who've wandered into meaningless talk. The goal of right teaching, Paul says, is love from a pure heart, a good conscience, and sincere faith. Then Paul turns personal: he was the worst of sinners — a blasphemer and persecutor — yet received mercy, so that Christ could display His perfect patience in him as an example. He charges Timothy to 'wage the good warfare,' holding faith and a good conscience, which some have shipwrecked.","words":[{"greek":"παραγγελία","translit":"parangelia","gloss":"charge / command","note":"A military term — an order passed down the chain of command. Paul isn't offering Timothy suggestions; he's relaying a commission. Sound teaching isn't one option among many; it's the assignment a leader is under orders to guard."},{"greek":"ναυαγέω","translit":"nauageō","gloss":"to shipwreck","note":"Some 'made shipwreck' of their faith (v.19) by rejecting a good conscience. The image is a vessel destroyed on rocks. Paul links doctrine and conscience — a man who ignores his conscience will eventually wreck his faith, however sound his theology sounds."}],"thread":"Paul's testimony is the gospel in miniature — the chief of sinners shown mercy as a pattern of Christ's patience for everyone after him. No man is too far gone; if grace reached Paul the persecutor, it reaches anyone. The gospel Timothy must guard is the same gospel that saved its fiercest enemy.","elder":"Paul held up his own past as evidence of grace, not something to hide. How has owning your worst chapters become a way to help younger men rather than a source of shame?","first":"Timothy was young, leading men who challenged him. Where does your age or inexperience make you want to shrink back from a responsibility God's given you?","questions":["Paul ties sound doctrine to a good conscience — you can't wreck one without eventually wrecking the other. Where is your conscience being quietly ignored?","He called himself the worst of sinners yet fully forgiven. Do you actually believe grace covers your worst, or are you still performing to earn it?","'Wage the good warfare.' What's the good fight God has specifically handed you to fight right now?"],"forge":"Identify one place you've been ignoring your conscience — a small compromise you keep excusing. Address it this week before it becomes a shipwreck, and tell a brother.","formation":{"culture":"The culture tells a man to bury his worst chapters, to curate a highlight reel, to never let anyone see the wreckage. Shame is meant to be hidden, and a man's past failures are liabilities to be managed, not evidence of anything good. So he hides, performs, and lives in quiet fear of being found out.\n\nPaul did the opposite — he held up his past as the chief of sinners as proof of grace, so Christ's patience could be displayed in him. He also linked sound doctrine to a good conscience: ignore the conscience long enough and you shipwreck the faith. The human heart hides its shame and quiets its conscience; both are old. The man who was never shown that grace covers his worst either drowns in shame or learns to silence the warning voice inside.","inventory":{"lead":"**Where is your conscience being quietly ignored — the small compromise you keep excusing that could become a shipwreck?**","prompts":["Paul called himself the worst of sinners yet fully forgiven. Do you actually believe grace covers your worst, or are you still performing to earn it?","'Wage the good warfare.' What's the specific good fight God has handed you to fight right now?"],"land":"How do you see the culture — hide your shame, curate the highlight reel — impacting your honesty about your past and your conscience?"},"step":{"milestone":"Week 1 of 8 — Guard What You Were Given","body":"The start of Paul's charge to a younger man — and to you. The mark of a man starting well here is that he's stopped hiding his worst behind performance and started listening to the conscience he's been ignoring. A maturing man knows grace reaches even the chief of sinners, which frees him to be honest. Address the one compromise you keep excusing this week, before it becomes a shipwreck — and tell a brother."},"prayer":"Father, I've hidden my worst chapters and quietly ignored my conscience, excusing compromises I know will wreck me. Thank You that grace reached even the chief of sinners — which means it reaches me. Let me stop performing and start trusting that mercy. Sharpen my conscience, and give me courage to address what I've been excusing. Help me wage the good fight. Amen."}},{"n":2,"passage":"1 Tim 2–3","title":"The Kind of Man Who Leads","theme":"Prayer, character, and the qualifications that matter","context":"Paul moves to how the church should function — starting with prayer, then order in worship, then the character required of leaders. In a culture obsessed with charisma and status, Paul lists qualifications for overseers and deacons that are almost entirely about character, not talent. This is Paul defining what a spiritually mature man actually looks like.","text":"First, Paul urges prayer for all people, especially those in authority, because God wants all people saved — there's one God and one mediator, Christ. Then the leadership qualifications: an overseer must be above reproach, faithful to his wife, sober-minded, self-controlled, hospitable, able to teach, not a drunk or violent or greedy, gentle, managing his own household well, not a new convert, and respected even by outsiders. Deacons likewise must be tested and proven. Notice: almost none of it is about skill. It's overwhelmingly about a man's character, home, and self-control.","words":[{"greek":"ἀνεπίλημπτος","translit":"anepilēmptos","gloss":"above reproach / beyond accusation","note":"The overarching qualification (3:2) — literally 'not able to be laid hold of.' Not sinless, but giving no legitimate handle for accusation. A man whose life offers no obvious place for an enemy to grab. Character with no exposed handle."},{"greek":"νηφάλιος","translit":"nēphalios","gloss":"sober-minded / clear-headed","note":"Originally 'not intoxicated,' it came to mean temperate, level-headed, free from excess that clouds judgment. A leader has to be a man others can trust to think clearly — not driven by impulse, appetite, or the emotion of the moment."}],"thread":"The qualifications describe, ultimately, a man being formed into the image of Christ — self-controlled, gentle, faithful, servant-hearted. No man arrives fully qualified; these are the marks the Spirit grows in a man over time. Leadership in God's house is character before competence, because the shepherd is meant to reflect the Chief Shepherd.","elder":"Paul weighted character far above talent. Over a lifetime, what have you seen matter more in the long run — a man's gifts or his character? Give an example.","first":"The list is mostly about self-control, home life, and reputation — not platform or skill. Which qualification feels most out of reach for you right now, and why?","questions":["Paul starts leadership with prayer for others. How much of your energy goes to praying for people versus managing them?","'Above reproach' means no legitimate handle for accusation. Where in your life is there a handle an enemy could grab?","The list emphasizes managing your own household well. What does the private state of your home say about your readiness to lead anywhere else?"],"forge":"Read the character list slowly and pick the one quality most lacking in you. Take one concrete step to grow it this week — especially if it's in how you lead at home.","formation":{"culture":"The culture crowns charisma and calls it leadership. It elevates the loud, the gifted, the magnetic, and pays almost no attention to character — until the character collapses and takes everything with it. A man is taught to build a platform, sharpen his skills, and project confidence, while the private man, the home, and the self-control go unexamined.\n\nPaul's qualifications for leaders are almost entirely about character — above reproach, self-controlled, faithful at home, gentle, tested — and barely about talent at all. The human heart prefers to develop its gifts and neglect its character; that's ancient. The man who was never taught that character outranks charisma builds an impressive exterior over an unexamined interior, and it eventually cracks.","inventory":{"lead":"**'Above reproach' means no legitimate handle for accusation. Where in your life is there a handle an enemy could grab?**","prompts":["Paul weighted character far above talent. What does the private state of your home say about your readiness to lead anywhere else?","Which qualification — self-control, faithfulness, gentleness, a well-managed home — feels most out of reach for you right now, and why?"],"land":"How do you see the culture — charisma over character, platform over private life — impacting where you invest your growth?"},"step":{"milestone":"Week 2 of 8 — Character Before Competence","body":"Early in the charge, a man learns that God's measure of a leader is character, not charisma. The mark of growth here is that you've stopped building only the exterior and started examining the interior — the home, the self-control, the private man. A maturing man knows the shepherd is meant to reflect the Chief Shepherd in character before competence. Pick the one character quality most lacking in you and take a concrete step to grow it — especially in how you lead at home."},"prayer":"Father, I've worked on the exterior — the gifts, the platform, the image — while the private man went unexamined. Show me the handles in my life an enemy could grab. Grow in me the character Paul described: self-control, faithfulness, gentleness, a home well-led. Make me a man whose insides match his outsides, reflecting the Chief Shepherd. Amen."}},{"n":3,"passage":"1 Tim 4","title":"Train Yourself for Godliness","theme":"Discipline, example, and not despising your youth","context":"Paul warns that some will abandon the faith, following deceiving teachings — including a false spirituality that forbids marriage and certain foods, treating God's good creation as evil. Against that, Paul gives Timothy a positive charge: train yourself, teach well, and don't let anyone look down on you for being young.","text":"Paul says everything God created is good, received with thanksgiving. Then the core exhortation: have nothing to do with godless myths; instead, 'train yourself for godliness.' Physical training has some value, but godliness has value for all of life and the life to come. He charges Timothy: don't let anyone despise your youth — set an example in speech, conduct, love, faith, and purity. Devote yourself to Scripture, to teaching, to your gifting. 'Keep a close watch on yourself and on the teaching,' persevering, because in doing so you'll save both yourself and your hearers.","words":[{"greek":"γυμνάζω","translit":"gumnazō","gloss":"to train / exercise","note":"Root of 'gymnasium.' Paul borrows the athlete's world: godliness isn't passive, it's trained for — deliberate, repeated, disciplined effort like a competitor in the gymnasium. A godly man is made the way an athlete is made: reps, not wishes."},{"greek":"τύπος","translit":"tupos","gloss":"example / pattern / imprint","note":"'Set the believers an example' (4:12) — a tupos is a mark left by a strike, a mold, a stamp. Timothy's life is to be a die that presses its shape onto others. A leader teaches as much by the pattern of his life as by his words."}],"thread":"'Train yourself for godliness' assumes grace does the saving and discipline does the growing. This is the Christian life: the Spirit empowers, and the man trains. Christ Himself is the pattern Timothy imprints onto others — a leader reproduces in men what Christ has reproduced in him.","elder":"Paul says train for godliness like an athlete trains his body. What spiritual disciplines have actually shaped you over the decades — and which did you neglect and regret?","first":"Timothy was told not to let anyone look down on his youth, but to earn respect by example. Where do you use your age as an excuse instead of setting an example?","questions":["You train what you value. What does the way you spend your time and effort reveal about whether you're training for godliness or something else?","Paul lists five areas of example: speech, conduct, love, faith, purity. Which is strongest in you, and which is weakest?","'Keep a close watch on yourself and the teaching.' Where have you stopped watching yourself closely — and what's slipping as a result?"],"forge":"Choose one spiritual discipline and 'train' it this week like an athlete — same time, deliberate reps (prayer, Scripture, fasting, service). Treat godliness as something you practice, not just believe.","formation":{"culture":"The culture treats godliness as either automatic or irrelevant — something that just happens, or something that doesn't matter next to skill and hustle. It pours enormous discipline into the body, the career, the craft, and almost none into the soul. A man will train for years for a physical goal and never once train for godliness, because no one taught him it takes reps.\n\nPaul told Timothy to 'train yourself for godliness' — the athlete's word, deliberate and disciplined — and not to let anyone despise his youth, but to set an example. The human heart drifts toward whatever it doesn't actively train; that's old. The man who was never taught that godliness is built like an athlete is built — through reps, not wishes — stays spiritually soft while sharpening everything else.","inventory":{"lead":"**You train what you value. What does the way you spend your time and effort reveal — are you training for godliness or something else?**","prompts":["Paul lists five areas of example: speech, conduct, love, faith, purity. Which is strongest in you, and which is weakest?","Where have you stopped 'keeping a close watch on yourself' — and what's slipping as a result?"],"land":"How do you see the culture — discipline for the body and career, none for the soul — impacting your spiritual training?"},"step":{"milestone":"Week 3 of 8 — Train for Godliness","body":"Nearing the middle, a man is called to train for godliness the way an athlete trains — deliberately, with reps. The mark of growth here is that you've started treating godliness as something you practice, not just believe, and setting an example rather than excusing yourself by age. A maturing man watches himself closely and trains the soul like others train the body. Pick one discipline and train it this week like an athlete — same time, deliberate reps."},"prayer":"Father, I've trained my body, my career, my craft — and left my soul soft. Teach me to train for godliness the way an athlete trains: deliberate reps, not vague wishes. Sharpen my example in speech, conduct, love, faith, and purity. Help me keep a close watch on myself, and treat godliness as something I practice, not just profess. Amen."}},{"n":4,"passage":"1 Tim 5–6","title":"Honor, Contentment, and the Love of Money","theme":"Relationships, generosity, and what to chase","context":"Paul gives Timothy practical wisdom for leading a diverse congregation — how to treat older and younger men and women, how to care for widows, how to honor elders, how to handle wealth. It culminates in one of Scripture's sharpest warnings about money and one of its clearest calls to contentment.","text":"Treat older men as fathers, younger as brothers, older women as mothers, younger as sisters — with all purity. Honor and provide for widows truly in need; a man who won't provide for his family 'has denied the faith.' Honor elders who lead well. Then the money teaching: godliness with contentment is great gain — we brought nothing in and take nothing out. The love of money is a root of all kinds of evil; some, craving it, have wandered from the faith and pierced themselves with grief. Command the rich not to trust wealth but to be generous, storing up treasure for the age to come, taking hold of 'that which is truly life.'","words":[{"greek":"αὐτάρκεια","translit":"autarkeia","gloss":"contentment / self-sufficiency","note":"'Godliness with contentment is great gain' (6:6). In Paul's world this word meant a self-sufficiency independent of circumstances. Paul redefines it — his sufficiency is in Christ, not himself. Contentment is wealth that no market can touch."},{"greek":"φιλαργυρία","translit":"philarguria","gloss":"love of money","note":"Literally 'love of silver' (6:10). Note precisely what Paul says is the root of evil — not money, but the love of it. The problem isn't the metal; it's the affection. A poor man can love money and a rich man can hold it loosely."}],"thread":"Paul's teaching on money flows from the gospel: Christ, though rich, became poor to make us rich. A man secure in that inheritance is free from the grip of greed — free to be generous, content, and to hold wealth as a tool, not a treasure. 'That which is truly life' is found in God, never in gain.","elder":"You've watched the love of money 'pierce' men over a lifetime — marriages, integrity, peace. What have you seen it cost, and what does real contentment look like in the men who found it?","first":"You're in your building years, where the pull to chase money is strongest. How do you pursue provision hard without letting the love of it take root?","questions":["Paul says the love of money — not money itself — is the danger. Honestly, where does that love have a grip on you, regardless of how much you have?","'Godliness with contentment is great gain.' Where is discontent driving you right now, and what would contentment change?","He tells the rich to be generous and 'take hold of that which is truly life.' What are you gripping that isn't truly life?"],"forge":"Test your grip on money this week with one deliberate act of generosity that actually costs you something — and examine honestly where the 'love of money,' not money itself, is steering your decisions.","formation":{"culture":"The culture insists that more is the answer — more money, more security, more accumulation — and quietly promises that contentment lives just past the next acquisition. It never arrives. A man is trained to chase, to compare, to measure his worth by his net worth, and to believe that discontent is just ambition and the love of money is just being responsible.\n\nPaul cut to it: godliness with contentment is great gain, and the love of money — not money itself — is a root of all kinds of evil that has pierced many men through. The human heart loves silver and calls it security; that's ancient. The man who was never taught contentment in Christ chases a horizon that always recedes and wounds himself on the pursuit.","inventory":{"lead":"**Where does the love of money — not money itself — have a grip on you, regardless of how much you actually have?**","prompts":["'Godliness with contentment is great gain.' Where is discontent driving you right now, and what would genuine contentment change?","Paul tells the rich to be generous and 'take hold of that which is truly life.' What are you gripping that isn't truly life?"],"land":"How do you see the culture — more is the answer, worth equals net worth — impacting your contentment and your grip on money?"},"step":{"milestone":"Week 4 of 8 — Contentment and the Love of Money","body":"At the midpoint, a man confronts one of Scripture's sharpest warnings — the love of money — and its cure, contentment in Christ. The mark of growth here is that you can name where that love grips you regardless of your bank balance, and you're learning contentment as wealth no market can touch. A maturing man holds money as a tool, not a treasure. Test your grip this week with one act of generosity that actually costs you something."},"prayer":"Father, I've believed the lie that contentment lives just past the next acquisition, and let the love of money — not just money — take root in me. Free me from the grip of silver. Teach me godliness with contentment, the great gain that no market can touch. Loosen my hands to be generous, and help me take hold of what is truly life: You. Amen."}},{"n":5,"passage":"2 Tim 1","title":"Fan Into Flame","theme":"Courage, the Spirit, and guarding the deposit","context":"Second Timothy is Paul's last letter — written from a Roman prison, likely awaiting execution. This is a dying mentor's final charge to the son in the faith he loves most. Everything here carries the weight of a man near the end, pouring his heart into the one who'll carry on. Timothy is discouraged and possibly fearful; Paul writes to reignite him.","text":"Paul recalls Timothy's sincere faith, passed down through his grandmother Lois and mother Eunice. Then the charge: 'fan into flame the gift of God' in you — for God gave us a spirit not of fear, but of power, love, and self-control. So don't be ashamed of the gospel or of Paul's chains; join in suffering for it by God's power. Paul isn't ashamed, because he knows whom he has believed and is convinced God will guard what he's entrusted to Him. Then to Timothy: guard the good deposit entrusted to you, by the Holy Spirit who dwells in us. He notes some deserted him, but one man, Onesiphorus, refreshed him and wasn't ashamed of his chains.","words":[{"greek":"ἀναζωπυρέω","translit":"anazōpureō","gloss":"to fan into flame / rekindle","note":"A vivid image (1:6) — to stir dying embers back into fire. Timothy's gift hadn't died; it had dimmed. The call isn't to get a new gift but to rekindle the one he has. Spiritual fire needs tending, or it fades to coals."},{"greek":"παραθήκη","translit":"parathēkē","gloss":"deposit / entrusted treasure","note":"The 'good deposit' Timothy must guard (1:14) — a banking term for something valuable placed in trust. The gospel is treasure handed to Timothy to protect and pass on intact. A steward doesn't own the deposit; he guards it for the next man."}],"thread":"Paul's confidence in prison — 'I know whom I have believed' — is gospel courage. The Spirit God gives is one of power, love, and self-control, not fear. The same Spirit that raised Christ guards the deposit in us and fans the flame. A man's courage isn't self-generated; it's the fruit of knowing the One he's trusted.","elder":"Paul, near death, poured everything into a younger man. Who fanned your flame when it was dimming — and into whom are you pouring now?","first":"Timothy's fire had dimmed, not died. What gift or calling in you has cooled to embers, and what's caused it to dim?","questions":["'A spirit not of fear but of power, love, and self-control.' Which of those three do you most need fanned into flame right now?","Paul guarded the 'deposit' to pass it on intact. What has been entrusted to you — faith, family, calling — that you're responsible to guard and hand on?","Some deserted Paul; Onesiphorus refreshed him. Which are you being to the people under pressure around you — a deserter or a refresher?"],"forge":"Identify the gift or calling that's dimmed to embers in you. Take one deliberate action this week to fan it back into flame — and be an 'Onesiphorus' to one person carrying a heavy load.","formation":{"culture":"The culture tells a man to handle it alone, to feel his fear as failure, and to let his fire quietly die without tending it. It offers no honest eldership — no older man pouring courage into a younger one — so a man's gifts dim to embers and his fear goes unaddressed. He's left to manufacture his own courage and usually can't.\n\nPaul, near death in a prison cell, poured everything into Timothy: 'fan into flame the gift of God' — because God gave a spirit not of fear but of power, love, and self-control. The human heart, untended and un-mentored, lets its fire fade and its fear rule; that's old. The man who never had someone fan his flame lets the gift go cold and calls the fear permanent.","inventory":{"lead":"**What gift or calling in you has cooled to embers — and what caused it to dim?**","prompts":["'A spirit not of fear but of power, love, and self-control.' Which of those three do you most need fanned into flame right now?","Some deserted Paul; Onesiphorus refreshed him. Which are you being to the people under pressure around you — a deserter or a refresher?"],"land":"How do you see the culture — handle it alone, no honest eldership, fear as failure — impacting your fire and your courage?"},"step":{"milestone":"Week 5 of 8 — Fan Into Flame","body":"Past the midpoint, and Paul's final letter begins — a dying mentor reigniting a younger man. The mark of growth here is that you've named the gift that dimmed and the fear that ruled, and you've taken a deliberate step to fan the flame back — trusting the Spirit of power, love, and self-control. A maturing man tends his fire and refreshes others rather than deserting them. Fan your dimmed gift back to flame this week, and be an 'Onesiphorus' to one person carrying a heavy load."},"prayer":"Father, my fire has dimmed to embers and my fear has been ruling where Your Spirit should. Fan the flame back in me. Remind me the Spirit You gave is one of power, love, and self-control — not fear. Give me courage that isn't self-manufactured but rooted in knowing You. And let me be a refresher to someone whose fire is fading. Amen."}},{"n":6,"passage":"2 Tim 2","title":"Soldier, Athlete, Farmer","theme":"Endurance, focus, and reliable men","context":"Paul gives Timothy a series of vivid pictures of what faithful endurance looks like, then the key to multiplication — entrusting the message to reliable men. This is the mentorship engine of the whole Anchored vision: a man discipled to disciple others. Paul is describing how the gospel outlives any one man.","text":"Be strong in grace, Paul says, and entrust what you've heard to 'faithful men who will be able to teach others also' — four generations of discipleship in one verse. Then three images of the faithful man: a soldier who doesn't get entangled in civilian affairs but aims to please his commanding officer; an athlete who competes by the rules to win the crown; a hard-working farmer who gets the first share of the crop. Endurance is the theme — remember Jesus Christ, raised from the dead. Paul suffers, even in chains, but 'the word of God is not bound.' He calls Timothy to avoid foolish quarrels and be a workman who rightly handles the word of truth, gentle and patient, a vessel for honorable use.","words":[{"greek":"παρατίθημι","translit":"paratithēmi","gloss":"to entrust / deposit with","note":"'Entrust to faithful men' (2:2) — the same root as the 'deposit' from chapter 1. The gospel is passed hand to hand, man to man. Multiplication, not addition: Timothy trains men who train men. This single verse is the blueprint for generational discipleship."},{"greek":"ὀρθοτομέω","translit":"orthotomeō","gloss":"to cut straight / rightly handle","note":"'Rightly handling the word of truth' (2:15) — literally to cut a straight road or plow a straight furrow. The workman doesn't twist or wander through Scripture; he cuts it straight, handling the text accurately. Sloppy handling of the Word is called out as shameful work."}],"thread":"'Entrust to faithful men who will teach others' is the gospel's engine — Christ discipled the Twelve, who discipled the church, down to this room. Paul endures chains because the risen Christ makes the suffering worth it and the word unbound. A man's labor for the gospel, like a farmer's, is hard but harvest-bound.","elder":"'Entrust to faithful men who will teach others.' Who poured into you, and who have you poured into that's now pouring into others? Trace the line if you can.","first":"Soldier, athlete, farmer — all three endure and stay focused. Which image most challenges how you're currently living: the distracted soldier, the rule-breaking athlete, or the lazy farmer?","questions":["Paul describes four generations of discipleship in one verse. Where are you in that chain — who's discipling you, and who are you discipling?","The soldier avoids getting 'entangled in civilian affairs.' What good-but-secondary things are entangling you and blurring your mission?","'Rightly handling the word of truth' is called a workman's skill. How much real effort do you put into handling Scripture accurately?"],"forge":"Name one 'faithful man' you could begin pouring into — even informally. Take the first step this week. And identify one 'entanglement' pulling you off mission, and cut it.","formation":{"culture":"The culture builds a man to consume, not to reproduce — to take in endlessly and pass on nothing. It has no vision for multiplication, for pouring into a younger man who pours into another. And it entangles a man in a thousand good-but-secondary things until he's too distracted to fight the actual battle or run the actual race.\n\nPaul handed Timothy the blueprint: entrust what you've heard to faithful men who will teach others also — four generations of discipleship in one verse — and gave three images of the focused man: the unentangled soldier, the disciplined athlete, the hardworking farmer. The human heart drifts into distraction and consumption; that's old. The man who was never poured into, and never taught to pour into others, ends the line instead of extending it.","inventory":{"lead":"**Where are you in the chain — who's discipling you, and who are you pouring into? Or does the line stop with you?**","prompts":["The soldier avoids getting 'entangled in civilian affairs.' What good-but-secondary things are entangling you and blurring your mission?","'Rightly handling the word of truth' is a workman's skill. How much real effort do you put into handling Scripture accurately?"],"land":"How do you see the culture — consume, don't reproduce; stay entangled — impacting whether you're extending the line or ending it?"},"step":{"milestone":"Week 6 of 8 — Soldier, Athlete, Farmer","body":"Deep in the final letter, a man learns the engine of the whole vision: pour into faithful men who pour into others. The mark of growth here is that you can locate yourself in the chain of discipleship and have named one faithful man to begin pouring into — while cutting an entanglement that blurs your mission. A maturing man reproduces rather than merely consumes. Take the first step toward pouring into one 'faithful man' this week, and cut one entanglement."},"prayer":"Father, I've been built to consume, not to reproduce — taking in and passing on nothing. Show me where I am in the chain: who's pouring into me, and who I'm meant to pour into. Give me a faithful man to invest in. And cut the entanglements — the good-but-secondary things — that blur my mission and dull my focus. Let the line extend through me. Amen."}},{"n":7,"passage":"2 Tim 3","title":"Godless Times and a God-Breathed Book","theme":"Cultural decay, Scripture, and standing firm","context":"Paul warns Timothy about the character of the last days — a startlingly modern-sounding list of a self-absorbed, godless culture. Against that backdrop, he anchors Timothy to two things: the example of a faithful mentor's life, and the sufficiency of Scripture. This is a man being equipped to stand firm when the culture erodes.","text":"In the last days come 'times of difficulty': people will be lovers of self, lovers of money, proud, abusive, ungrateful, unholy, without self-control, lovers of pleasure rather than lovers of God — having the appearance of godliness but denying its power. Paul tells Timothy to avoid such people. Then he contrasts Timothy's own upbringing: 'you have followed my teaching, my conduct, my aim' — you've known the Scriptures from childhood, which make you wise for salvation. Then the anchor verse: all Scripture is God-breathed and profitable for teaching, reproof, correction, and training in righteousness, so that the man of God may be complete, equipped for every good work.","words":[{"greek":"θεόπνευστος","translit":"theopneustos","gloss":"God-breathed / inspired","note":"'All Scripture is God-breathed' (3:16) — a word Paul may have coined, combining 'God' and 'breath.' Scripture isn't merely about God; it's breathed out by Him. That's why it can equip a man completely — its source is the mouth of God Himself."},{"greek":"ἄρτιος","translit":"artios","gloss":"complete / fully fitted","note":"The man of God is made 'complete' (3:17) — capable, fully suited to his purpose, like a tool fitted exactly to its job. Scripture doesn't just inform a man; it equips and completes him for every good work. Nothing else needed to be fully outfitted."}],"thread":"In a decaying culture, Paul doesn't hand Timothy a strategy — he hands him the God-breathed Word and a faithful example. Scripture is sufficient because it's Christ's own breath, and it points to Christ on every page ('wise for salvation through faith in Christ Jesus'). The man anchored to the Word stands when the culture falls.","elder":"Paul's list of the 'last days' sounds like today. Having watched culture shift over decades, what has kept you standing firm, and what have you seen topple men who weren't anchored?","first":"The culture Paul describes is the water you swim in daily. Which item on his list — lovers of self, money, pleasure — has most shaped your generation, and you?","questions":["Paul's antidote to a godless culture was a God-breathed book and a godly example. How central is Scripture actually to how you navigate the culture?","'Appearance of godliness but denying its power' — where might that describe you: the look of faith without its transforming power?","Scripture is said to make a man 'complete, equipped for every good work.' Do you treat it that way, or as one input among many?"],"forge":"Pick one area where the culture has shaped you more than Scripture has. This week, deliberately let the God-breathed Word reshape your thinking on it — and find a 'Paul' whose example you can follow.","formation":{"culture":"The culture is the water a man swims in, and Paul's list of the last days reads like today's feed: lovers of self, lovers of money, lovers of pleasure rather than lovers of God — with the appearance of godliness but none of its power. It shapes a man more than he knows, and it offers him a form of religion that looks fine and changes nothing. Its formation is constant, ambient, and mostly invisible.\n\nPaul's antidote wasn't a strategy — it was the God-breathed Word and a faithful example. Scripture is enough to make a man complete, fully equipped. The human heart is discipled by whatever it's most immersed in; that's ancient. The man who lets the culture form him more than Scripture ends up with the appearance of godliness and none of its power.","inventory":{"lead":"**Which item on Paul's list — lovers of self, money, pleasure — has most shaped your generation, and you?**","prompts":["'Appearance of godliness but denying its power' — where might that describe you: the look of faith without its transforming power?","Scripture is said to make a man 'complete, equipped for every good work.' Do you treat it that way, or as one input among many?"],"land":"How do you see the culture — its constant, ambient formation — shaping you more than Scripture does?"},"step":{"milestone":"Week 7 of 8 — Godless Times, a God-Breathed Book","body":"Nearly finished, a man is equipped to stand firm as the culture erodes — anchored to the God-breathed Word and a faithful example. The mark of growth here is that you can name where the culture has formed you more than Scripture, and you've begun letting the Word reshape your thinking there. A maturing man treats Scripture as sufficient to complete him, not as one input among many. Pick one area the culture has shaped more than Scripture, and let the Word reshape it this week."},"prayer":"Father, the culture has formed me more than I know — lover of self, of comfort, of pleasure — while wearing the appearance of godliness. Forgive the form of religion that denies Your power. Anchor me to Your God-breathed Word, enough to make me complete. Reshape my thinking where the culture has bent it, and give me a faithful example to follow. Amen."}},{"n":8,"passage":"2 Tim 4","title":"I Have Finished the Race","theme":"Faithfulness to the end, and the crown that waits","context":"These are among the last recorded words of Paul before his execution. He knows the end is near. He gives Timothy a final, solemn charge, then reflects on his own life with staggering peace, and closes with personal notes that reveal both loneliness and hope. This is how a man finishes — and how he hands the baton.","text":"Paul charges Timothy solemnly, before God: preach the word, in season and out; be ready, reprove, rebuke, exhort with patience — because a time is coming when people won't tolerate sound teaching but will gather teachers to suit their own desires. So keep a clear head, endure suffering, do the work of an evangelist, fulfill your ministry. Then Paul turns to himself: 'I am already being poured out as a drink offering; the time of my departure has come. I have fought the good fight, I have finished the race, I have kept the faith.' A crown of righteousness awaits — for him and all who long for Christ's appearing. He asks Timothy to come soon; some have deserted him, but the Lord stood by him and will bring him safely home.","words":[{"greek":"σπένδομαι","translit":"spendomai","gloss":"to be poured out as a drink offering","note":"'I am already being poured out' (4:6) — the image of the drink offering poured out beside a sacrifice. Paul sees his entire life, and now his death, as an offering poured out to God. Not wasted, not tragic — an offering. A life spent, deliberately, for God."},{"greek":"ἀγών","translit":"agōn","gloss":"fight / contest / race","note":"'I have fought the good fight' (4:7) — root of 'agony.' It's the athletic contest, the struggle demanding everything. Paul doesn't say he won every round; he says he fought the good fight and finished the course. Faithfulness to the end, not a flawless record, is the goal."}],"thread":"Paul faces death with peace because his hope is Christ and the crown of righteousness Christ gives — not earned, but awarded to all who love His appearing. This is how the gospel lets a man die: poured out, finished, faithful, and unafraid. The race is run toward a Person, and the finish line is His face.","elder":"Paul could say 'I have finished the race, I have kept the faith' at the end. What does finishing well look like to you now, and what are you doing to make sure you can say those words?","first":"Paul handed the baton to a younger man as he finished. You're near the start of your race — what kind of man do you want to be handing the baton to at the end?","questions":["'I have fought the good fight, finished the race, kept the faith.' If your life ended today, which of those three could you honestly say?","Paul saw his life as an offering 'poured out.' Are you spending your life deliberately for something, or letting it leak away?","He longed for Christ's appearing. Does the return of Christ actually shape how you live, or is it an abstract belief?"],"forge":"Write your own version of Paul's three lines — the fight, the race, the faith — as the man you want to be at the end. Then take one step this week that moves you toward being able to say them honestly.","formation":{"culture":"The culture has no vision for finishing well — for a life poured out, deliberately, all the way to the end. It teaches a man to accumulate, to preserve himself, to coast when he can, and to fear death rather than face it with peace. It measures a life by what it gathered, not by whether it was spent for something worth spending it on.\n\nPaul, facing execution, wrote: 'I have fought the good fight, I have finished the race, I have kept the faith' — a life poured out like a drink offering, unafraid, handing the baton to a younger man. The human heart wants to preserve itself and let life leak away; that's old. The man who was never shown how to finish faithful either coasts to the end or clings to a life he was meant to spend.","inventory":{"lead":"**If your life ended today — the fight, the race, the faith — which of those three could you honestly say you'd kept?**","prompts":["Paul saw his life as an offering 'poured out.' Are you spending your life deliberately for something, or letting it leak away?","He longed for Christ's appearing. Does the return of Christ actually shape how you live, or is it an abstract belief?"],"land":"How do you see the culture — accumulate, preserve yourself, fear the end — impacting whether you'll finish poured out?"},"step":{"milestone":"Week 8 of 8 — I Have Finished the Race","body":"You've reached the end — of Timothy, and perhaps of a long road through these studies. Paul hands the baton with peace: fought the good fight, finished the race, kept the faith. The mark of a man who's finished well isn't a flawless record — it's a life being spent deliberately for Christ, unafraid of the end, already pouring into the next man. Look back over eight weeks: guard the gospel, character, training, contentment, courage, multiplication, standing firm — and now finishing faithful. Write your own version of Paul's three lines as the man you want to be at the end, and take one step toward being able to say them honestly. Then hand someone else the baton."},"prayer":"Father, teach me to finish well — not to coast, not to cling, but to be poured out like a drink offering, deliberately, all the way to the end. Let me one day say with Paul: I have fought the good fight, finished the race, kept the faith. Let the hope of Christ's appearing shape how I live today. And show me the younger man I'm meant to hand the baton to. Amen."}}]}];
const LENSES = [["Context","Who wrote it, why"],["Text","What it says"],["Language","Words English flattens"],["Thread","Where Christ is"],["Forge","What it demands"]];

function anchor(size,color,stroke){
  color=color||"#2A8C8C";stroke=stroke||2;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.4"/><line x1="12" y1="7.4" x2="12" y2="21"/><line x1="7" y1="11" x2="17" y2="11"/><path d="M4 15c0 4 3.6 6 8 6s8-2 8-6"/></svg>';
}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

let route={view:"home"};
function go(r){route=r;render();window.scrollTo(0,0);}

function header(){
  var back = route.view!=="home" ? '<span class="back eyebrow" onclick="go({view:\'home\'})">← All Studies</span>' : '';
  return '<header><div class="hbar"><div class="logo" onclick="go({view:\'home\'})">'+anchor(23,"#3FB0AE")+'<span class="disp">ANCHORED</span></div><span class="htag eyebrow">Men\'s Curriculum</span>'+back+'</div></header>';
}
function footer(){return '<footer>'+anchor(20,"#8EA6AA")+'<div class="eyebrow">Anchored Steps · True Balance</div></footer>';}

function home(){
  var chips = LENSES.map(function(l,i){return '<div class="lens-chip"><span class="num">'+(i+1)+'</span><span style="font-weight:600">'+l[0]+'</span><span class="d">· '+l[1]+'</span></div>';}).join("");
  var cards = TRACKS.map(function(t){
    return '<div class="tcard" style="border-top-color:'+t.accent+'" onclick="go({view:\'track\',tid:\''+t.id+'\'})">'
      +'<div class="row"><div class="eyebrow" style="color:'+t.accent+'">'+esc(t.book)+' · '+t.weeks+' weeks</div>'
      +'<span class="badge" style="background:'+t.accent+'">Ready</span></div>'
      +'<h3 class="disp">'+esc(t.title)+'</h3><div class="sub disp">'+esc(t.subtitle)+'</div>'
      +'<div class="blurb">'+esc(t.blurb)+'</div>'
      +'<div class="go" style="color:'+t.accent+'">Open study →</div></div>';
  }).join("");
  return '<section class="hero"><div class="hero-ghost">'+anchor(320,"#ffffff",1)+'</div>'
    +'<div class="wrap hero-in"><div class="eyebrow" style="color:#3FB0AE;margin-bottom:16px">Expository study · built for ages 25–77</div>'
    +'<h1 class="disp">Open the text.<br>Let it forge men.</h1>'
    +'<p>One method, many books. Every study runs the same five lenses — so a room of mixed ages goes deep together, and every man leaves with something to do.</p>'
    +'<div class="lens-strip">'+chips+'</div></div></section>'
    +'<section class="sec"><div class="wrap"><div class="sec-head"><span class="eyebrow">The Library</span><h2 class="disp">Studies</h2><span class="note">Four books. More can be added.</span></div>'
    +'<div class="grid">'+cards+'</div>'
    +'<div class="note-box">'+anchor(26,"#8EA6AA")+'<div><strong style="color:var(--ink)">Add a book:</strong> every study is one data object in the same shape. Author the sessions, drop it in the library, and it inherits the whole method — lenses, mixed-age prompts, and the Forge.</div></div>'
    +'</div></section>';
}

function track(){
  var t=TRACKS.find(function(x){return x.id===route.tid;});
  var rows=t.sessions.map(function(s,i){
    return '<div class="wrow" onclick="go({view:\'session\',tid:\''+t.id+'\',idx:'+i+'})">'
      +'<div class="wnum">'+String(s.n).padStart(2,"0")+'</div>'
      +'<div style="flex:1"><div><span class="wt">'+esc(s.title)+'</span><span class="wp" style="color:'+t.accent+'">'+esc(t.book)+' '+esc(s.passage)+'</span></div>'
      +'<div class="wtheme">'+esc(s.theme)+'</div></div>'
      +'<div class="arrow" style="color:'+t.accent+'">→</div></div>';
  }).join("");
  return '<section class="thero"><div class="wrap-narrow thero-in"><div class="eyebrow">'+esc(t.book)+' · '+t.weeks+' weeks · expository</div>'
    +'<h1 class="disp">'+esc(t.title)+'</h1><div class="sub disp">'+esc(t.subtitle)+'</div><p>'+esc(t.blurb)+'</p></div></section>'
    +'<section><div class="wrap-narrow"><div class="wlist">'+rows+'</div></div></section>';
}

function paras(txt){
  return String(txt).split(/\n\n+/).map(function(p){return '<p>'+esc(p)+'</p>';}).join("");
}
function boldLead(txt){
  // convert **...** to <strong>...</strong> after escaping
  return esc(txt).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
}
function fCulture(f){
  if(!f) return "";
  return '<div class="fpart"><div class="eyebrow flabel" style="color:var(--slate)">Cultural Context</div><div class="fbody">'+paras(f.culture)+'</div></div>';
}
function fInventory(f){
  if(!f) return "";
  var prompts = (f.inventory.prompts||[]).map(function(p){return '<li>'+esc(p)+'</li>';}).join("");
  return '<div class="fpart"><div class="eyebrow flabel" style="color:var(--gold)">The Inventory</div>'
    + '<div class="finv"><div class="flead">'+boldLead(f.inventory.lead)+'</div>'
    + (prompts?'<ul class="fprompts">'+prompts+'</ul>':'')
    + '<div class="fland">'+esc(f.inventory.land)+'</div></div></div>';
}
function fStep(f){
  if(!f) return "";
  return '<div class="fpart" style="margin-top:26px"><div class="eyebrow flabel" style="color:var(--tealLight)">Anchored Step</div>'
    + '<div class="fstep"><div class="fmile">'+anchor(16,"#5FC8C6")+'<span class="disp">'+esc(f.step.milestone)+'</span></div>'
    + '<div class="fstepbody">'+esc(f.step.body)+'</div></div></div>';
}
function fPrayer(f){
  if(!f) return "";
  return '<div class="fpart" style="margin-top:22px"><div class="eyebrow flabel fplabel">Prayer</div>'
    + '<div class="fpray"><div class="fpraytext">'+esc(f.prayer)+'</div></div></div>';
}

function session(){
  var t=TRACKS.find(function(x){return x.id===route.tid;});
  var s=t.sessions[route.idx]; var total=t.sessions.length;
  var words=s.words.map(function(w){
    return '<div class="wordcard"><div class="top"><bdi class="gk">'+esc(w.greek)+'</bdi> <span class="tl">('+esc(w.translit)+')</span> <span class="gl">&#8212; '+esc(w.gloss)+'</span></div><div class="nt">'+esc(w.note)+'</div></div>';
  }).join("");
  var qs=s.questions.map(function(q,i){return '<li><span class="qn">'+(i+1)+'</span><span class="qt">'+esc(q)+'</span></li>';}).join("");
  var prevD=route.idx===0?"disabled":""; var nextD=route.idx===total-1?"disabled":"";
  return '<section class="shero"><div class="wrap-narrow shero-in"><div class="eyebrow">'+esc(t.title)+' · Week '+s.n+' of '+total+' · '+esc(t.book)+' '+esc(s.passage)+'</div>'
    +'<h1 class="disp">'+esc(s.title)+'</h1><div class="stheme disp">'+esc(s.theme)+'</div></div></section>'
    +'<section class="sbody"><div class="wrap-narrow">'
    +'<div class="block"><div class="eyebrow lbl" style="color:var(--teal)">① Context</div><div class="body">'+esc(s.context)+'</div></div>'
    +'<div class="block"><div class="eyebrow lbl" style="color:var(--teal)">② Text — what the passage says</div><div class="body">'+esc(s.text)+'</div></div>'
    +'<div class="block"><div class="eyebrow lbl" style="color:var(--gold)">③ Language — words worth knowing</div><div class="words">'+words+'</div></div>'
    +'<div class="block"><div class="eyebrow lbl" style="color:var(--teal)">④ Thread — where Christ is</div><div class="body">'+esc(s.thread)+'</div></div>'
    +'<div class="formation">'+fCulture(s.formation)+fInventory(s.formation)+'</div>'
    +'<div class="eyebrow" style="color:var(--tealLight);margin:30px 0 10px">The Table — discussion</div>'
    +'<div class="prompt elder"><span class="plbl">Elder Wisdom&nbsp;&nbsp;</span><span class="ptext">'+esc(s.elder)+'</span></div>'
    +'<div class="prompt first"><span class="plbl">First Steps&nbsp;&nbsp;</span><span class="ptext">'+esc(s.first)+'</span></div>'
    +'<div class="qhead">For the table:</div><ol class="qlist">'+qs+'</ol>'
    +fStep(s.formation)
    +'<div class="forge">'+anchor(28,"#3FB0AE")+'<div><div class="eyebrow flbl">The Forge · this week</div><div class="ftext">'+esc(s.forge)+'</div></div></div>'
    +fPrayer(s.formation)
    +'<div class="snav"><button class="nbtn" '+prevD+' onclick="go({view:\'session\',tid:\''+t.id+'\',idx:'+(route.idx-1)+'})">← Previous</button>'
    +'<button class="nbtn primary" '+nextD+' onclick="go({view:\'session\',tid:\''+t.id+'\',idx:'+(route.idx+1)+'})">Next →</button></div>'
    +'</div></section>';
}

function render(){
  var body="";
  if(route.view==="home")body=home();
  else if(route.view==="track")body=track();
  else if(route.view==="session")body=session();
  document.getElementById("app").innerHTML=header()+body+footer();
}
render();
</script>
</body>
</html>
