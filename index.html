god is their belly, they glory in their shame, with minds set on earthly things. But our citizenship is in heaven, and from it we await a Savior, the Lord Jesus Christ.", "words": [{"greek": "διώκω", "translit": "diōkō", "gloss": "press on / pursue", "note": "To chase down, the word for a hunter pursuing prey or a runner driving for the tape. The same word used for persecuting — the intensity Paul once aimed at the church he now aims at Christ."}, {"greek": "ἐπεκτείνομαι", "translit": "epekteinomai", "gloss": "straining forward", "note": "A runner's word — body stretched out, head forward, everything reaching for the line. It describes physical strain, not calm intention."}, {"greek": "πολίτευμα", "translit": "politeuma", "gloss": "citizenship / commonwealth", "note": "Philippi was a Roman colony whose residents held Roman citizenship though most had never seen Rome. Paul reuses their proudest fact as an analogy: your real colony is elsewhere."}], "thread": "'I press on to make it my own, because Christ Jesus has made me His own.' The pursuit is a response to already being possessed. A man runs hard not to secure the prize but because he's already been secured.", "elder": "What has kept you pressing on over decades when other men drifted? Be specific about the practices.", "first": "What's behind you that you can't seem to stop looking at — a failure or a success?", "questions": ["Paul says he hasn't arrived. Where have you quietly settled and called it maturity?", "'Forgetting what lies behind' includes past wins, not just failures. Which is harder for you to leave?", "'Their god is their belly' — appetite as the thing you serve. Where does that describe you honestly?"], "forge": "Name the one thing behind you — failure or success — that's keeping you from straining forward. Tell one man what it is and what pressing on would actually require this week.", "formation": {"culture": "The culture keeps a man staring backward. Every platform is an archive of his highlights and his worst moments, and the algorithm serves both. He's either nostalgic for a version of himself he can't return to, or shackled to a failure he can't outrun. Meanwhile arrival is sold constantly — the idea that some achievement will finally settle it.\n\nUnderneath is a very old backward pull. Israel in the wilderness kept looking back at Egypt — at the food, not the chains. Lot's wife turned around. The heart romanticizes what's behind because what's ahead requires strain. Paul's language is deliberately athletic: forward motion is uncomfortable, it costs, and a man doesn't drift into it. He also refuses the fantasy of arrival — he hasn't obtained it and says so twice.", "inventory": {"lead": "What are you still looking back at — the failure or the highlight — and how is it keeping you from straining forward?", "prompts": ["Is your backward pull shame or nostalgia? Name the specific memory you keep returning to.", "Where have you quietly decided you've arrived and stopped pressing? What's the evidence?"], "land": "How do you see this pull — nostalgia and shame both looking backward — shaping whether you're actually moving?"}, "step": {"milestone": "Week 6 of 8 — Straining Forward", "body": "Late in the letter, the question shifts from what a man believes to whether he's still moving. The mark of growth here is that he can name what's behind him that has his attention and take one concrete step forward anyway. A maturing man neither romanticizes his past nor hides from it — he presses on, because the One who already took hold of him is ahead, not behind."}, "prayer": "Father, I keep looking backward — sometimes at my failures, sometimes at my best days — and either way I've stopped running. You took hold of me; let that be why I press on rather than what I'm trying to earn. Show me what to leave behind this week, and give me the strain to reach forward. Amen."}}, {"n": 7, "passage": "4:1–9", "title": "Anxious for Nothing", "theme": "Peace that guards — and what a man puts in his mind", "context": "Paul names two women in a public letter because their conflict is threatening the church, then moves straight into his most quoted passage on anxiety. The placement isn't accidental — the peace he describes is offered right where relational tension is real.", "text": "I entreat Euodia and Syntyche to agree in the Lord. Rejoice in the Lord always; again I will say, rejoice. Let your reasonableness be known to everyone. The Lord is at hand; do not be anxious about anything, but in everything by prayer and supplication with thanksgiving let your requests be made known to God. And the peace of God, which surpasses all understanding, will guard your hearts and minds in Christ Jesus. Finally, whatever is true, honorable, just, pure, lovely, commendable — if there is any excellence, anything worthy of praise — think about these things. What you have learned and received and heard and seen in me, practice these things, and the God of peace will be with you.", "words": [{"greek": "ἐπιεικής", "translit": "epieikēs", "gloss": "reasonableness / forbearance", "note": "The quality of not insisting on your full rights — gentle fairness that yields. Notoriously hard to translate. Paul puts it right after a conflict between two people, on purpose."}, {"greek": "φρουρέω", "translit": "phroureō", "gloss": "to guard / garrison", "note": "A military term for soldiers standing watch at a city gate. Philippi had a garrison. Peace isn't described as a feeling here — it's a posted sentry around the mind."}, {"greek": "λογίζομαι", "translit": "logizomai", "gloss": "to reckon / calculate", "note": "An accounting term — to take inventory deliberately. 'Think about these things' is not passive musing but the intentional work of counting up what's true."}], "thread": "The peace 'surpasses understanding' and guards like a garrison — it isn't produced by figuring the situation out. A man can have peace before he has answers, which is the only reason peace is available in most real situations.", "elder": "What have you learned about handling anxiety over the years that actually works?", "first": "What are you anxious about right now that you've never specifically prayed about? Name it.", "questions": ["Paul pairs prayer with thanksgiving. Why do you think gratitude is part of the prescription for anxiety?", "Peace 'guards' like a garrison rather than explaining. Where do you need peace before you'll get answers?", "Verse 8 is a deliberate inventory of what you put in your mind. What's actually on your list right now?"], "forge": "Take the specific thing you're most anxious about. Pray it through with thanksgiving every day this week — actual words, not vague worry — and write down what changes.", "formation": {"culture": "Anxiety is now the water a man swims in and the culture has monetized it. Stay informed, stay ahead, stay ready — the vigilance never ends and there's always another thing to track. And a man is told to manage it privately: medicate it, optimize it, out-work it, but don't say it out loud.\n\nUnderneath is a very old refusal to hand things over. Anxiety is, at bottom, carrying what you were never designed to carry — being your own providence. The Israelites gathering extra manna were doing exactly this. Paul's antidote is almost offensively simple: pray specifically, give thanks, and then deliberately control what you put in your mind. Two of the three are things a man can start this week, and the third is God's job.", "inventory": {"lead": "What are you carrying as though its outcome depends on your vigilance — and have you ever actually handed it over in words?", "prompts": ["Name the anxiety you've thought about a hundred times and prayed about specifically maybe once.", "Run verse 8 against your actual intake this week. What's genuinely on the list — true, honorable, pure?"], "land": "How do you see this pull — endless vigilance, private management — shaping what you carry alone?"}, "step": {"milestone": "Week 7 of 8 — Guarded, Not Figured Out", "body": "Near the end, and this is the week that most directly meets a man where he actually lives. The mark of growth here is that he's prayed something specifically rather than worried about it generally, and that he's taken inventory of what he's feeding his mind. A maturing man stops requiring answers before he'll accept peace."}, "prayer": "Father, I've carried things as though the outcome depended on my vigilance, and I've called it responsibility. Teach me to actually hand it over in words instead of turning it over in my head. Guard my heart and mind with a peace I don't have to understand first. And help me be deliberate about what I let in. Amen."}}, {"n": 8, "passage": "4:10–23", "title": "The Secret of Contentment", "theme": "Learned contentment, real generosity, and strength for either", "context": "Paul closes by thanking them for a financial gift, but he's careful — he wants them to know his joy wasn't contingent on it. What he says about contentment is one of the most misused verses in scripture, and its actual context is money.", "text": "I rejoiced greatly that now at length you have revived your concern for me. Not that I am speaking of being in need, for I have learned in whatever situation I am to be content. I know how to be brought low, and I know how to abound. In any and every circumstance, I have learned the secret of facing plenty and hunger, abundance and need. I can do all things through Him who strengthens me. Yet it was kind of you to share my trouble. And my God will supply every need of yours according to His riches in glory in Christ Jesus.", "words": [{"greek": "αὐτάρκης", "translit": "autarkēs", "gloss": "content / self-sufficient", "note": "A Stoic term meaning independent of circumstances. Paul borrows it and redefines it — his sufficiency isn't in himself but in Christ, which is the opposite of what the Stoics meant."}, {"greek": "μυέω", "translit": "myeō", "gloss": "learned the secret / initiated", "note": "The word for being initiated into a mystery religion. Paul says contentment came through a process of initiation — it was learned over time, not received at conversion."}, {"greek": "ἐνδυναμόω", "translit": "endynamoō", "gloss": "to strengthen / empower", "note": "'I can do all things through Him who strengthens me' — in context this means enduring plenty and hunger, not achieving whatever you want. The strength is for contentment in either direction."}], "thread": "'I have learned' — contentment isn't a temperament some men are born with. Paul was initiated into it through both abundance and hunger, which means the circumstances a man resents may be the exact curriculum.", "elder": "Which was harder for you spiritually — the lean years or the good ones? What did each teach you?", "first": "Which are you in right now, plenty or need — and how is it affecting your walk with God?", "questions": ["Paul says he learned contentment. What has God used to teach it to you, and are you still resisting the lesson?", "He says abundance required learning too. How can plenty be as spiritually dangerous as need?", "'I can do all things' is about enduring both extremes. How does that context change how you've used that verse?"], "forge": "Give something away this week that costs you — money, time, or a possession you'd rather keep. Then name out loud one thing you're content with that you've been treating as not enough.", "formation": {"culture": "The culture is built on manufactured discontent. Every ad, feed, and comparison exists to make a man aware of a gap, and contentment would break the whole machine. So he's trained to always be one upgrade away — and to read that restlessness as ambition rather than as the appetite it is.\n\nUnderneath is the oldest dissatisfaction there is: a garden full of everything and one tree that wasn't enough. Israel had manna every morning and wanted meat. The heart's default is to notice the gap. What's striking in Paul is that he names abundance as equally dangerous — he had to learn contentment in plenty too. Most men assume more would settle them. Paul says he had to be initiated into being content with more, same as with less.", "inventory": {"lead": "Where is manufactured discontent running you — and what would it take for you to call what you have enough?", "prompts": ["Name the gap you're most aware of right now. Who told you it was a gap?", "Which has done more spiritual damage to you: not having, or having? Be honest about the season you're in."], "land": "How do you see this pull — always one upgrade from enough — shaping your peace and your generosity?"}, "step": {"milestone": "Week 8 of 8 — Learned Contentment", "body": "You've reached the end. Look back at eight weeks — God's follow-through, a life with nothing left to threaten, the downward move, effort without panic, credentials counted as loss, straining forward, peace as a garrison, and now contentment learned in both directions. The mark of a man finishing well here isn't that his circumstances improved; it's that he's stopped requiring them to. Paul wrote every word of this in chains, joyful, having learned the secret. That was available to him and it's available to you — but it's learned, which means the season you're resenting may be the classroom."}, "prayer": "Father, I've let manufactured discontent set the terms of my life and called it drive. Teach me the secret Paul learned — in plenty and in need. Strengthen me not to get more but to be content with what You've given. Let me hold it loosely enough to give some of it away. Thank You that You supply what I actually need. Amen."}}]}, {"id": "proverbs", "title": "The Trained Man", "subtitle": "A Man's Study in Proverbs", "book": "Proverbs", "weeks": 10, "status": "complete", "accent": "#2A8C8C", "blurb": "A father teaching his son how to live. Fear of the Lord, the company you keep, money, work, the tongue, appetite, anger, and the long arc of a disciplined life. Organized by theme, not chapter.", "sessions": [{"n": 1, "passage": "1:1–7; 9:10", "title": "Where Wisdom Starts", "theme": "The fear of the Lord — the beginning, not the topic", "context": "Proverbs is a father's instruction to his son, collected largely under Solomon. It isn't a book of promises; it's a book of patterns — how life generally works when God designed it. Read it as a father talking, not a contract. And notice it opens by telling you where wisdom starts, before it tells you anything else.", "text": "The proverbs of Solomon, son of David, king of Israel: to know wisdom and instruction, to understand words of insight, to receive instruction in wise dealing, in righteousness, justice, and equity; to give prudence to the simple, knowledge and discretion to the youth. The fear of the LORD is the beginning of knowledge; fools despise wisdom and instruction. The fear of the LORD is the beginning of wisdom, and the knowledge of the Holy One is insight.", "words": [{"greek": "יִרְאַת יְהוָה", "translit": "yir'at YHWH", "gloss": "the fear of the LORD", "note": "Not terror and not mere respect. The awed recognition that God is God and you are not — the posture that makes learning possible. A man who has it can be taught; a man without it cannot."}, {"greek": "חָכְמָה", "translit": "chokmah", "gloss": "wisdom / skill", "note": "Used of craftsmen building the tabernacle — skill in making something well. Biblical wisdom is less about knowing facts than about skillful living, the way a carpenter knows wood."}, {"greek": "אֱוִיל", "translit": "evil", "gloss": "fool", "note": "One of several Hebrew words for fool. This one isn't unintelligent — he's morally stubborn. He despises instruction not because he can't grasp it but because he won't be corrected."}], "thread": "Christ is called the wisdom of God, and in Him are hidden all the treasures of wisdom and knowledge. Proverbs describes wisdom as something to pursue; the New Testament reveals wisdom as a person you can know.", "elder": "Who taught you to fear the Lord — and what did that look like in practice, not in theory?", "first": "Be honest: is there anyone in your life right now who is actually allowed to correct you?", "questions": ["'Fools despise instruction' — the issue is teachability, not intelligence. Where are you unteachable right now?", "Wisdom is described as skill, like a craftsman's. What area of life are you unskilled in and have stopped trying to improve?", "What would change this week if you actually lived like God is God and you are not?"], "forge": "Ask one man in this group to name a blind spot he sees in you. Don't defend, explain, or contextualize. Just write it down and say thank you.", "formation": {"culture": "The culture tells a man to trust himself above all — follow your gut, be your own authority, nobody knows you like you do. Correction is reframed as disrespect, and submission to any outside authority reads as weakness. A man is expected to be the final court of appeal on his own life.\n\nUnderneath is the original offer: you will be like God, deciding for yourself what is good. That instinct doesn't feel like rebellion from the inside — it feels like maturity and independence. Which is exactly why the fool in Proverbs isn't stupid. He's a man who cannot be told anything, and he's usually confident. Wisdom starts the moment a man accepts that he is not the highest authority on himself.", "inventory": {"lead": "Who is actually allowed to tell you something you don't want to hear — and when did you last let them?", "prompts": ["Name the last correction you received. Did you receive it, or did you explain why they were wrong?", "Where are you the final authority in your life in a way you'd never say out loud?"], "land": "How do you see this cultural pull — trust yourself above all — shaping whether you can actually be taught?"}, "step": {"milestone": "Week 1 of 10 — Teachable", "body": "Everything in this book depends on whether a man can be told something. The mark of a man starting well here isn't that he knows more — it's that he's opened a door for someone to correct him and didn't slam it. A maturing man knows the difference between the fool and the wise man in Proverbs isn't intelligence; it's whether instruction gets in."}, "prayer": "Father, I've made myself the final authority on my own life and called it being my own man. Give me the fear of the LORD — the honest recognition that You are God and I am not. Make me teachable. Send men who will tell me the truth, and give me the humility to actually hear it. Amen."}}, {"n": 2, "passage": "13:20; 27:17; 22:24–25; 18:24", "title": "The Company You Keep", "theme": "Friendship, influence, and who you're becoming by proximity", "context": "Proverbs assumes what modern men often deny: you become like the men you're around. It's stated as a mechanism, not a warning — proximity does its work whether you intend it or not.", "text": "Whoever walks with the wise becomes wise, but the companion of fools will suffer harm. Iron sharpens iron, and one man sharpens another. Make no friendship with a man given to anger, nor go with a wrathful man, lest you learn his ways and entangle yourself in a snare. A man of many companions may come to ruin, but there is a friend who sticks closer than a brother.", "words": [{"greek": "הָלַךְ", "translit": "halak", "gloss": "to walk", "note": "Ongoing movement, not a single visit. 'Walks with the wise' means sustained proximity over time — the influence in this proverb is slow, not immediate."}, {"greek": "חָדַד", "translit": "chadad", "gloss": "to sharpen", "note": "Iron on iron produces friction, heat, and sparks — and removes metal. Sharpening is not a comfortable process and both blades lose something."}, {"greek": "דָּבֵק", "translit": "dabeq", "gloss": "cling / stick close", "note": "The same root used for a man clinging to his wife in Genesis 2. Applied to friendship, it describes a bond of loyalty stronger than blood relation."}], "thread": "Christ called His disciples friends and laid down His life for them — the friend who sticks closer than a brother. Every good friendship in Proverbs is a shadow of the one He offers.", "elder": "Who has sharpened you most over the years — and what did that friendship actually cost both of you?", "first": "Who are the three men you spend the most time with? Are you becoming more like them or less?", "questions": ["'Walks with' means sustained proximity. Who's shaping you right now that you didn't consciously choose?", "Iron sharpening iron involves friction and loss. Where have you avoided a friendship that would actually sharpen you because it'd be uncomfortable?", "Proverbs warns specifically about the angry man's influence. Whose patterns are you picking up without noticing?"], "forge": "Identify one relationship that's dulling you and one that would sharpen you. Take a concrete step this week — reduce the first, initiate the second. Tell the group both names.", "formation": {"culture": "The culture insists a man is a self-made individual, uninfluenced by his surroundings — that he can consume anything, spend time with anyone, and remain untouched. Meanwhile it has engineered the most powerful influence machinery in history and calls it entertainment. A man is told he's immune and simultaneously farmed for his attention.\n\nUnderneath is the pride of thinking we're the exception. Lot pitched his tent toward Sodom and ended up in it. Solomon's own wives turned his heart. Proverbs treats influence as physics — walk with the wise and you become wise; keep company with fools and you suffer harm. The mechanism doesn't ask your permission or care about your intentions.", "inventory": {"lead": "Who are you becoming by proximity — and would you have chosen it on purpose?", "prompts": ["Name the three voices you hear most in a week, counting screens. What are they forming in you?", "Where have you told yourself you're the exception — that this influence doesn't affect you?"], "land": "How do you see this pull — you are the self-made exception — shaping who you let close?"}, "step": {"milestone": "Week 2 of 10 — Sharpened or Dulled", "body": "Wisdom is caught more than taught, which makes proximity a decision rather than an accident. The mark of growth here is that a man has actually moved — pulled back from one relationship and stepped toward another. A maturing man stops assuming he's immune and starts choosing his influences the way he'd choose a diet."}, "prayer": "Father, I've assumed I'm the exception — that I can be around anything and stay unchanged. Show me who's actually forming me. Give me the courage to pull back from what's dulling me and to pursue the friendship that will cost me something and make me sharper. Amen."}}, {"n": 3, "passage": "10:4; 12:11; 6:6–11; 22:29", "title": "Work and the Sluggard", "theme": "Diligence, laziness, and the man who's good at what he does", "context": "Proverbs devotes remarkable attention to the sluggard — and portrays him not as a man who refuses to work but as a man who always has a reason. He's comic and tragic at once, and the humor is deliberate.", "text": "A slack hand causes poverty, but the hand of the diligent makes rich. Whoever works his land will have plenty of bread, but he who follows worthless pursuits lacks sense. Go to the ant, O sluggard; consider her ways, and be wise. Without having any chief, officer, or ruler, she prepares her bread in summer and gathers her food in harvest. How long will you lie there, O sluggard? A little sleep, a little slumber, a little folding of the hands to rest, and poverty will come upon you like a robber. Do you see a man skillful in his work? He will stand before kings.", "words": [{"greek": "עָצֵל", "translit": "atsel", "gloss": "sluggard", "note": "Appears fourteen times in Proverbs and nowhere else in scripture. He's not unemployed — he's a man who starts and doesn't finish, always with a plausible reason."}, {"greek": "חָרוּץ", "translit": "charuts", "gloss": "diligent", "note": "Originally 'sharp' or 'cut into' — decisive, incisive. The diligent man isn't merely busy; he's pointed. Busyness and diligence are not the same thing in Proverbs."}, {"greek": "מָהִיר", "translit": "mahir", "gloss": "skillful / quick", "note": "Used of a scribe skilled in his craft. 'Skillful in his work' is what puts a man before kings — competence is treated as a spiritual matter, not just an economic one."}], "thread": "Christ said 'My Father is working until now, and I am working.' Work isn't a curse in scripture — it predates the fall. The curse added thorns, not labor. A man's diligence reflects the God who works.", "elder": "What did you learn about work from your father or the man who trained you — good or bad?", "first": "Where do you start things and not finish them? Name the actual pattern.", "questions": ["The sluggard always has a reason. What's your most frequent reason for not doing the thing you know you should?", "Proverbs distinguishes busy from diligent. Which are you, honestly, and what's the evidence?", "'Skillful in his work' stands before kings. Where have you stopped trying to get better at what you do?"], "forge": "Name one thing you've started and abandoned. This week, either finish it, formally kill it, or schedule the next concrete step. No fourth option.", "formation": {"culture": "The culture sells two false pictures of work. One is the hustle — worth measured in output, rest treated as weakness, a man's identity fused to his production. The other is the escape — work as the thing to minimize, optimize away, or retire from as fast as possible. Neither treats work as good in itself.\n\nUnderneath is the fall's distortion of something that was originally a gift. Adam was given a garden to work before there was any curse in it. The sluggard's problem in Proverbs isn't that he hates work in principle — it's that he wants the harvest without the season, and he can always explain the delay. That instinct to want the result without the process is as old as Eden and it's remarkably easy to justify.", "inventory": {"lead": "Where do you want the harvest without the season — and what reason have you been using?", "prompts": ["Name the thing you've abandoned or perpetually delayed. Say the actual excuse you use out loud.", "Is your failure closer to the hustle or the escape? What is it costing the people around you?"], "land": "How do you see this pull — identity fused to output, or escape from work entirely — shaping how you labor?"}, "step": {"milestone": "Week 3 of 10 — Diligence Over Excuses", "body": "This is the most practical week so far and the easiest to nod along to without changing. The mark of growth here is that a man has closed a loop — finished something, killed something, or scheduled a real next step. A maturing man stops narrating his intentions and starts producing evidence, and he can tell the difference between being busy and being diligent."}, "prayer": "Father, I want harvests I haven't worked for and I'm skilled at explaining the delay. Show me the pattern of starting and not finishing. Make me diligent rather than merely busy. Let me work as a man made in the image of a God who works. Amen."}}, {"n": 4, "passage": "3:9–10; 11:24–25; 22:7; 30:8–9", "title": "Money, Generosity, and Enough", "theme": "Wealth, debt, giving, and the prayer for neither poverty nor riches", "context": "Proverbs talks about money constantly and without embarrassment — how it's earned, kept, given, and lost. Agur's prayer in chapter 30 is one of the most unusual requests in scripture, and it names both dangers honestly.", "text": "Honor the LORD with your wealth and with the firstfruits of all your produce; then your barns will be filled with plenty. One gives freely, yet grows all the richer; another withholds what he should give, and only suffers want. Whoever brings blessing will be enriched, and one who waters will himself be watered. The rich rules over the poor, and the borrower is the slave of the lender. Two things I ask of you; deny them not before I die: remove far from me falsehood and lying; give me neither poverty nor riches; feed me with the food that is needful for me, lest I be full and deny you and say, 'Who is the LORD?' or lest I be poor and steal and profane the name of my God.", "words": [{"greek": "רֵאשִׁית", "translit": "reshit", "gloss": "firstfruits / first portion", "note": "The first and best, given before you know how the rest of the harvest turns out. Honoring God with the first portion is an act of trust precisely because the outcome isn't yet secured."}, {"greek": "עֶבֶד", "translit": "eved", "gloss": "slave / servant", "note": "The ordinary word for a bondservant. 'The borrower is the slave of the lender' is not a metaphor about feelings — it's a statement about who actually controls your options."}, {"greek": "חֹק", "translit": "choq", "gloss": "portion / allotted measure", "note": "Agur asks for his allotted portion — the ration assigned to him. Not more, not less. A deliberate request for enough, which almost no man prays."}], "thread": "Christ, though rich, became poor for our sake, so that by His poverty we might become rich. Every instruction about generosity in Proverbs is downstream of a God who gave first and gave most.", "elder": "What have you learned about money over a lifetime that you wish someone had told you at thirty?", "first": "What's your relationship with money right now — fear, control, avoidance, or something else? Name it.", "questions": ["Firstfruits means giving before you know how it turns out. Where do you give from the leftovers instead?", "'The borrower is slave to the lender.' Where has debt actually limited your freedom to obey God?", "Agur asks for neither poverty nor riches. Could you honestly pray that prayer? What in you resists it?"], "forge": "Look at what you actually gave last month, not what you intended. Then give one gift this week that costs you something you'd notice.", "formation": {"culture": "Money is the culture's real scoreboard, and it's never done counting. More is always the answer — more income, more margin, more security — and a man's worth quietly indexes to his number. Generosity is treated as something you do after you've arrived, which conveniently never happens.\n\nUnderneath is the ancient belief that security can be stored. The rich fool built bigger barns. Israel gathered extra manna and watched it rot. Agur's prayer is startling because he names both dangers — riches make a man say 'who is the LORD,' and poverty makes him steal. Most men only fear one of those, and it's rarely the first one. A man who can't say 'enough' has no defense against the scoreboard.", "inventory": {"lead": "What number would finally be enough — and what does it tell you that the number has always moved?", "prompts": ["Does your giving come off the top or out of the leftovers? Look at last month, not your intentions.", "Which of Agur's two dangers is actually yours right now — forgetting God in plenty, or panicking in lack?"], "land": "How do you see this pull — the endless scoreboard — shaping your generosity and your peace?"}, "step": {"milestone": "Week 4 of 10 — Money in Its Place", "body": "This is where a man's theology gets tested by his bank statement. The mark of growth here is that he's looked at actual numbers rather than intentions, and given something that registered. A maturing man can say the word 'enough' and mean it, and he gives from the first portion rather than what's left after everything else got its share."}, "prayer": "Father, I've let a moving number decide whether I'm doing well, and my giving has come from the leftovers. Teach me to honor You with the first portion, before I know how it turns out. Give me neither poverty nor riches — give me enough, and make me content with it. Amen."}}, {"n": 5, "passage": "10:19; 15:1; 18:21; 26:20–22", "title": "The Weight of Words", "theme": "The tongue, gossip, and the answer that turns away wrath", "context": "Proverbs returns to speech more than almost any other subject. It treats words as having actual force — capable of building or destroying — and it's brutally specific about gossip, which most men don't classify as a sin at all.", "text": "When words are many, transgression is not lacking, but whoever restrains his lips is prudent. A soft answer turns away wrath, but a harsh word stirs up anger. Death and life are in the power of the tongue, and those who love it will eat its fruits. For lack of wood the fire goes out, and where there is no whisperer, quarreling ceases. The words of a whisperer are like delicious morsels; they go down into the inner parts of the body.", "words": [{"greek": "נִרְגָּן", "translit": "nirgan", "gloss": "whisperer / gossip", "note": "One who murmurs and mutters — passing information in a lowered voice. Proverbs treats him as the fuel supply of a fire; remove him and the quarrel dies for lack of wood."}, {"greek": "רַךְ", "translit": "rak", "gloss": "soft / tender", "note": "Gentle, yielding. The soft answer isn't weak or dishonest — it's deliberately non-escalating, and Proverbs presents it as the more powerful move."}, {"greek": "מִתְלַהֲמִים", "translit": "mitlahamim", "gloss": "delicious morsels", "note": "Choice bits of food swallowed greedily. The word describes how gossip is received — it tastes good going down, which is exactly why it spreads."}], "thread": "'No corrupting talk, only such as is good for building up' — and Christ Himself is called the Word. A man's speech either reflects the God who speaks and creates, or the accuser who slanders.", "elder": "When have your words done real damage — and what did you learn about your mouth from it?", "first": "Where does your speech run ahead of your judgment most — anger, humor, or gossip?", "questions": ["'When words are many, transgression is not lacking.' Where do you talk too much, and what's driving it?", "Proverbs says gossip tastes good. Be honest — why do you actually enjoy hearing something about someone?", "A soft answer is presented as the stronger move. Where would that cost you the most to try this week?"], "forge": "Go one week without saying anything about a person you wouldn't say with them in the room. When you catch yourself, stop mid-sentence. Report how often it happened.", "formation": {"culture": "The culture rewards the fastest, sharpest mouth. Wit is currency, the takedown gets applause, and a man is measured by how well he can cut. And gossip has been fully rebranded — it's venting, processing, keeping people informed, asking for prayer. Almost nothing is called what it is.\n\nUnderneath is an ancient use of the tongue: to elevate ourselves by lowering someone else. The serpent's first act was to speak against God's character. Slander is not a small sin in scripture — it's the accuser's own trade. What makes Proverbs uncomfortable is how it names the pleasure: gossip goes down like delicious morsels. Men don't gossip because they're careless. They do it because it tastes good.", "inventory": {"lead": "What have you said about someone recently that you wouldn't have said with them standing there — and what did you get out of saying it?", "prompts": ["Name your category: sharp humor, angry escalation, or the whisper. Which is your particular failure?", "Proverbs says gossip is enjoyable. What need in you does it actually feed?"], "land": "How do you see this pull — wit as currency, gossip renamed — shaping how you use your mouth?"}, "step": {"milestone": "Week 5 of 10 — Restrained Speech", "body": "The midpoint, and the sin most men have never once confessed. The mark of growth here isn't smoother speech — it's that a man has caught himself mid-sentence and stopped, and can name what the gossip was feeding. A maturing man understands that his tongue is disproportionate to its size, and he stops treating his words as harmless."}, "prayer": "Father, my mouth has run ahead of my judgment and I've called it honesty, humor, or venting. Show me what I'm actually feeding when I speak about people. Restrain my lips. Give me the soft answer where I want the sharp one, and make my words build instead of burn. Amen."}}, {"n": 6, "passage": "5:1–14; 6:27–29; 7:6–23", "title": "Appetite and the Path", "theme": "Sexual wisdom — the path, the cost, and the honest accounting", "context": "A father warns his son about sexual sin across multiple chapters, and the striking thing is his method. He doesn't moralize in the abstract — he walks the son down the road step by step and shows him where it ends.", "text": "My son, be attentive to my wisdom; for the lips of a forbidden woman drip honey, and her speech is smoother than oil, but in the end she is bitter as wormwood, sharp as a two-edged sword. Her feet go down to death; her steps follow the path to Sheol. Keep your way far from her, lest you give your honor to others and your years to the merciless. Can a man carry fire next to his chest and his clothes not be burned? At the end of your life you groan, when your flesh and body are consumed, and you say, 'How I hated discipline, and my heart despised reproof!'", "words": [{"greek": "לַעֲנָה", "translit": "la'anah", "gloss": "wormwood", "note": "A bitter desert plant. The contrast is deliberate — honey at the lips, wormwood in the end. Proverbs never denies that sin tastes good at the start; it insists on showing the finish."}, {"greek": "מוּסָר", "translit": "musar", "gloss": "discipline / correction", "note": "Training that involves correction, often painful. The regret at the end of chapter 5 is specifically about having hated this — not about the woman, but about refusing correction."}, {"greek": "דֶּרֶךְ", "translit": "derek", "gloss": "way / path", "note": "A road, a habitual course. Proverbs treats sexual sin as a path with a direction and a destination, not as isolated incidents. You don't arrive somewhere you weren't walking toward."}], "thread": "Christ was tempted in every way as we are, yet without sin — and He is able to sympathize with weakness. Proverbs shows the road; the gospel offers both a way out mid-road and mercy for the man already far down it.", "elder": "What have you learned about guarding yourself in this area that a younger man wouldn't think of?", "first": "What's the first step on the path for you — not the act, the step before it?", "questions": ["Proverbs shows the whole road rather than just condemning the destination. What's your actual first step, and where does it usually happen?", "The regret in chapter 5 is about hating correction, not just about the sin. Who could have told you the truth, and did you let them?", "'Can a man carry fire next to his chest?' Where are you playing with proximity and calling it control?"], "forge": "Name the specific first step on your path — the app, the hour, the room, the situation. Put one concrete barrier there this week and tell one man exactly what it is so he can check.", "formation": {"culture": "The culture has made sexual sin frictionless, private, and reframed as health. It's available in seconds, requires no relationship, leaves no obvious evidence, and any conviction about it is treated as repression or shame. The one thing never discussed is the arc — where the road actually goes.\n\nUnderneath is the oldest pattern in the book: something that looks good, promises life, and delivers isolation. Proverbs is unusually honest that the honey is real — it doesn't pretend the appeal is fake. What it insists on is the accounting. Fire against the chest burns regardless of intent, and the road has a destination whether or not a man is thinking about it while he walks. The father's warning is not that the son will be caught. It's that he'll arrive.", "inventory": {"lead": "What's the first step on your path — the one before the one you'd confess — and what have you told yourself about it?", "prompts": ["Where are you carrying fire against your chest and calling it self-control?", "Who actually knows the truth about this area? If no one, what is the secrecy protecting?"], "land": "How do you see this pull — frictionless, private, relabeled as health — shaping what you permit yourself?"}, "step": {"milestone": "Week 6 of 10 — Off the Path", "body": "The most confronting week in the book, and the one most likely to get vague answers. The mark of growth here is specific and verifiable: a man has named his actual first step and put a real barrier there with one other man knowing. A maturing man stops negotiating privately with something that has a known destination."}, "prayer": "Father, I've let something honey-sweet stay in my life without ever looking at where the road ends. Give me the honesty to name the first step, not just the act. Put men around me who will ask. Let me hate the path more than I love the taste, and give me mercy for how far I've already walked. Amen."}}, {"n": 7, "passage": "14:29; 15:18; 16:32; 19:11; 29:11", "title": "Slow to Anger", "theme": "Self-control, provocation, and the strength of restraint", "context": "Proverbs treats anger management not as temperament but as strength — and ranks it above military conquest. In an honor culture where a slight demanded response, that ranking was countercultural.", "text": "Whoever is slow to anger has great understanding, but he who has a hasty temper exalts folly. A hot-tempered man stirs up strife, but he who is slow to anger quiets contention. Whoever is slow to anger is better than the mighty, and he who rules his spirit than he who takes a city. Good sense makes one slow to anger, and it is his glory to overlook an offense. A fool gives full vent to his spirit, but a wise man quietly holds it back.", "words": [{"greek": "אֶרֶךְ אַפַּיִם", "translit": "erek appayim", "gloss": "slow to anger", "note": "Literally 'long of nostrils' — an idiom from the flaring of the nose in rage. A long fuse. The same phrase describes God's own character in Exodus 34."}, {"greek": "מָשַׁל", "translit": "mashal", "gloss": "to rule", "note": "To govern or have dominion — used of kings. Applied here to a man's own spirit, and rated above capturing a city. The hardest territory to govern is yourself."}, {"greek": "עָבַר", "translit": "avar", "gloss": "to pass over / overlook", "note": "To let something go by without responding. Proverbs calls this a man's glory — the deliberate choice not to collect on a slight."}], "thread": "'Slow to anger' is God's own self-description. A man who rules his spirit is imitating the character God announced about Himself — abounding in steadfast love, slow to anger.", "elder": "What's helped you actually govern your temper over the years? Something practical.", "first": "What provokes you fastest — being disrespected, being wrong, or being inconvenienced?", "questions": ["Proverbs rates ruling your spirit above taking a city. Why do you think it's harder?", "'It is his glory to overlook an offense.' What offense are you currently unwilling to let pass?", "The fool 'gives full vent.' Where has venting been called honesty in your life?"], "forge": "Identify your fastest trigger. This week, when it fires, delay your response by a full sixty seconds before speaking. Report what changed and what it cost.", "formation": {"culture": "The culture treats venting as health and restraint as repression. Let it out, don't bottle it up, express what you feel — and anyone asking you to govern yourself is asking you to be inauthentic. Meanwhile outrage is monetized, and a man is trained by every platform to respond fast and hot.\n\nUnderneath is an old confusion between having a feeling and being ruled by one. Cain's face fell and God warned him that sin was crouching at the door — the anger wasn't the sin, the surrender to it was. Proverbs doesn't say a man shouldn't feel anger; it says the fool gives it full vent while the wise man holds it back. And it ranks that restraint above conquest, which tells you how rare and how strong it actually is.", "inventory": {"lead": "What provokes you fastest — and who in your life absorbs the cost of it?", "prompts": ["When you 'just being honest,' how often is it actually venting? Ask someone who lives with you.", "What offense are you holding onto that Proverbs would call your glory to overlook?"], "land": "How do you see this pull — venting as health, restraint as repression — shaping how you handle provocation?"}, "step": {"milestone": "Week 7 of 10 — Ruling Your Own Spirit", "body": "Deep into the book, and the territory has moved inward. The mark of growth here is that a man knows his specific trigger and has actually delayed a reaction rather than resolved to be calmer. A maturing man understands that ruling his own spirit is harder and more valuable than any external conquest, and that the people closest to him feel the difference first."}, "prayer": "Father, I've called my venting honesty and made the people closest to me absorb it. You describe Yourself as slow to anger — make me like You in that. Give me a longer fuse and the strength to overlook what doesn't need collecting. Let me rule my own spirit before I try to rule anything else. Amen."}}, {"n": 8, "passage": "11:2; 16:18; 27:2; 3:5–7", "title": "Pride and the Fall", "theme": "Humility, self-assessment, and leaning on your own understanding", "context": "Proverbs treats pride as the master sin — the one that precedes destruction and shows up in a man's certainty about himself. Chapter 3's famous verses are usually quoted for guidance; their sharper edge is the warning about being wise in your own eyes.", "text": "When pride comes, then comes disgrace, but with the humble is wisdom. Pride goes before destruction, and a haughty spirit before a fall. Let another praise you, and not your own mouth; a stranger, and not your own lips. Trust in the LORD with all your heart, and do not lean on your own understanding. In all your ways acknowledge Him, and He will make straight your paths. Be not wise in your own eyes; fear the LORD, and turn away from evil.", "words": [{"greek": "זָדוֹן", "translit": "zadon", "gloss": "pride / presumption", "note": "Arrogant presumption — acting beyond your station without reference to God. Related to the verb for boiling over. It's pride that has become action, not merely attitude."}, {"greek": "שָׁעַן", "translit": "sha'an", "gloss": "to lean / rest weight on", "note": "To put your full weight on something for support. 'Do not lean on your own understanding' isn't a ban on thinking — it's a warning about which structure bears the load."}, {"greek": "יָשַׁר", "translit": "yashar", "gloss": "to make straight", "note": "To make a path level and passable. God straightening a path doesn't mean removing obstacles from a man's plan — it means the way itself becomes navigable."}], "thread": "Christ, being in the form of God, humbled Himself to the point of death — and God exalted Him. The pattern Proverbs describes finds its clearest expression at the cross: down, then up, and God does the lifting.", "elder": "Where has pride cost you something you can't get back? Tell these men plainly.", "first": "Where are you certain you're right in a way you haven't examined recently?", "questions": ["'Do not lean on your own understanding' — where are you putting full weight on your own read of a situation?", "'Let another praise you, not your own mouth.' Where do you promote yourself, even subtly?", "'Be not wise in your own eyes' is the sharper warning. What would it take for someone to change your mind about something important?"], "forge": "Ask your wife or closest friend: 'Where am I overconfident?' Don't defend. Write down what they say and bring it back to the group.", "formation": {"culture": "The culture requires self-promotion and calls it visibility. A man builds his brand, tells his own story, projects certainty — and doubt or deference is treated as weakness or poor positioning. Confidence is the product being sold, and being wise in your own eyes is essentially the job description.\n\nUnderneath is the first sin. The serpent's pitch was that a man could decide for himself what was good — self-sufficiency in the place of dependence. Every proud man since has been re-running it. What makes Proverbs' warning so pointed is that pride is invisible from inside; a man being wise in his own eyes never feels arrogant, he feels correct. Which is why the only reliable test is external, and why Proverbs says let someone else do the praising.", "inventory": {"lead": "Where are you wise in your own eyes — and who would tell you if you were wrong?", "prompts": ["What are you fully leaning on your own read about right now? Career, marriage, a decision, a person?", "When did someone last change your mind about something that mattered? If you can't remember, that's the answer."], "land": "How do you see this pull — self-promotion and projected certainty — keeping you from being corrected?"}, "step": {"milestone": "Week 8 of 10 — Not Wise in Your Own Eyes", "body": "This is the sin that undoes everything the book has built. The mark of growth here is that a man has actively invited a hard assessment and received it without argument. A maturing man understands that pride never feels like pride from the inside — it feels like being right — so he builds external checks rather than trusting his own read."}, "prayer": "Father, I'm rarely aware of my own pride because from inside it just feels like being right. Show me where I'm leaning entirely on my own understanding. Give me people who will tell me the truth and the humility to receive it. Let another do the praising, and let me trust You with the parts I can't see. Amen."}}, {"n": 9, "passage": "22:6; 13:24; 27:23–24; 31:8–9", "title": "The Long Arc of Responsibility", "theme": "Fathering, stewardship, and speaking for those who can't", "context": "Proverbs closes its instruction with the long view — what a man builds that outlasts him. Children, flocks, and the vulnerable. These are the responsibilities that don't pay off quickly and can't be outsourced.", "text": "Train up a child in the way he should go; even when he is old he will not depart from it. Whoever spares the rod hates his son, but he who loves him is diligent to discipline him. Know well the condition of your flocks, and give attention to your herds, for riches do not last forever; and does a crown endure to all generations? Open your mouth for the mute, for the rights of all who are destitute. Open your mouth, judge righteously, defend the rights of the poor and needy.", "words": [{"greek": "חָנַךְ", "translit": "chanak", "gloss": "train / dedicate", "note": "Used of dedicating a house or temple. Training a child is treated as consecration — setting him apart for a purpose, not merely managing his behavior."}, {"greek": "מוּסָר", "translit": "musar", "gloss": "discipline / instruction", "note": "The same word from chapter 5. Discipline here is corrective formation, and Proverbs frames withholding it as a failure of love rather than kindness."}, {"greek": "יָדַע", "translit": "yada", "gloss": "to know intimately", "note": "'Know well the condition of your flocks' uses the deep word for knowing — the same used for personal, relational knowledge. Stewardship requires attention, not just ownership."}], "thread": "'As a father shows compassion to his children, so the LORD shows compassion to those who fear Him.' Every faithful father is a dim picture of the Father, and every man's stewardship reflects the God who knows His sheep by name.", "elder": "What do you know now about raising children or carrying responsibility that you'd tell your younger self?", "first": "What has been entrusted to you that you haven't been paying attention to?", "questions": ["'Know well the condition of your flocks.' What's under your care that you've stopped actually inspecting?", "Proverbs says withholding discipline is a failure of love. Where are you avoiding a hard conversation because it's uncomfortable?", "'Open your mouth for the mute.' Who has no voice in your world, and what would speaking up cost you?"], "forge": "Pick one thing entrusted to you that you've neglected — a child, an employee, your health, your marriage. Do one concrete act of attention this week. Not a promise. An action.", "formation": {"culture": "The culture rewards what pays off fast and can be seen. Long, unglamorous stewardship — raising children, tending a marriage, quietly caring for something over decades — has no metrics and no audience. And responsibility itself is framed as a burden to minimize rather than a weight worth carrying.\n\nUnderneath is a preference for the immediate over the enduring. Esau traded a birthright for a bowl of soup because the soup was now. Men have always been willing to trade the long thing for the near thing. What Proverbs keeps insisting is that riches don't last and a crown doesn't endure — the only things that outlive a man are what he formed in other people. That work is slow, unrecognized, and almost never urgent, which is exactly why it gets deferred.", "inventory": {"lead": "What's been entrusted to you that you've stopped actually inspecting — and who is quietly paying for that?", "prompts": ["Name the hard conversation you've been avoiding with someone under your care. What's the real reason?", "Where have you traded a long, unglamorous responsibility for something that paid off faster?"], "land": "How do you see this pull — fast returns and visible wins — shaping what you neglect?"}, "step": {"milestone": "Week 9 of 10 — The Long View", "body": "Near the end, and the horizon lengthens. The mark of growth here is that a man has actually inspected something he'd stopped looking at and taken one act of attention. A maturing man measures his life by what outlasts him rather than by what pays this quarter, and he stops deferring the slow work that nobody applauds."}, "prayer": "Father, I've given my best attention to what pays off fast and neglected what actually lasts. Show me what You've entrusted to me that I've stopped inspecting. Give me courage for the hard conversation I'm avoiding and patience for work that won't be recognized. Let what I build outlive me. Amen."}}, {"n": 10, "passage": "4:18–27; 31:10–31", "title": "The Path of the Righteous", "theme": "Guarding the heart, finishing well, and the woman of valor", "context": "Chapter 4 is the father's summary charge — guard everything, because everything flows from the heart. And the book closes with the woman of Proverbs 31, who is best read not as a checklist for wives but as wisdom herself, embodied and at work.", "text": "The path of the righteous is like the light of dawn, which shines brighter and brighter until full day. The way of the wicked is like deep darkness; they do not know over what they stumble. Keep your heart with all vigilance, for from it flow the springs of life. Put away from you crooked speech, and put devious talk far from you. Let your eyes look directly forward. Ponder the path of your feet; then all your ways will be sure. An excellent wife who can find? She is far more precious than jewels. Charm is deceitful and beauty is vain, but a woman who fears the LORD is to be praised.", "words": [{"greek": "נָצַר", "translit": "natsar", "gloss": "to guard / keep watch", "note": "A military term for garrisoning a fortress. 'Keep your heart with all vigilance' is posting a watch — the heart is treated as the position that must not fall."}, {"greek": "חַיִל", "translit": "chayil", "gloss": "valor / strength", "note": "The word for an army's might or a warrior's valor. Proverbs 31 calls her an 'eshet chayil' — a woman of valor. It's military vocabulary, not domestic."}, {"greek": "אֹרַח", "translit": "orach", "gloss": "path / way", "note": "A well-worn track. The righteous path brightens gradually toward full day — Proverbs' picture of growth is incremental and directional, not sudden."}], "thread": "Christ is the light of the world, and the path that shines brighter until full day is the path of a man walking toward Him. The gradual brightening is sanctification — slow, real, and headed somewhere.", "elder": "Looking back, has the path gotten brighter? Tell these men honestly what the long arc has actually looked like.", "first": "What's the one thing in your heart right now that most needs a guard posted on it?", "questions": ["'Keep your heart with all vigilance, for from it flow the springs.' What's flowing out of you that tells you what's in there?", "The path brightens gradually. Where have you expected sudden change and gotten discouraged by slow growth?", "Proverbs 31 is wisdom embodied and at work. What would it look like for wisdom to be that visible in your daily life?"], "forge": "Name the one area of your heart that most needs a guard. Put one specific, concrete watch on it — and ask a man in this group to check on it in thirty days.", "formation": {"culture": "The culture manages the outside and leaves the inside alone. Optimize your appearance, your output, your presentation — and treat the heart as either irrelevant or as something that just is what it is. Where it does address the interior, the message is to follow it rather than guard it: your heart knows, trust what you feel.\n\nUnderneath is a very old inversion. Scripture says the heart is the wellspring and also that it's deceitful above all things — which means it must be guarded, not simply obeyed. Proverbs treats it as a fortress with a garrison posted, because everything downstream comes from it. A man who only manages the outside is defending the wrong wall. And the brightening path is a promise that the guarding actually works over time — slowly, which is the part men find hardest to accept.", "inventory": {"lead": "What's coming out of you that reveals what's actually in your heart — and where have you left it unguarded?", "prompts": ["Under pressure this month, what came out? Anger, withdrawal, appetite, deceit? That's the spring, not an accident.", "Where have you been following your heart when Proverbs says to guard it?"], "land": "How do you see this pull — manage the outside, trust the inside — leaving the real position undefended?"}, "step": {"milestone": "Week 10 of 10 — Brighter Until Full Day", "body": "You've reached the end. Look back at ten weeks — teachable, sharpened, diligent, honest about money, restrained in speech, off the path, ruling your spirit, humbled, stewarding the long things, and now guarding the heart everything flows from. The mark of a man finishing well here isn't that he's arrived — Proverbs never promises that. It's that the path is brightening, which means he's still walking and still being corrected. Post a guard on your heart, keep men close enough to tell you the truth, and keep walking. It gets brighter."}, "prayer": "Father, I've managed the outside and left my heart unguarded, and what comes out under pressure tells the truth about what's in there. Post a watch on it. Let what flows out of me be life instead of poison. Thank You that the path brightens gradually — keep me walking, keep me teachable, and keep me in the company of men who will tell me the truth. Amen."}}]}];
const LENSES = [["Context","Who wrote it, why"],["Text","What it says"],["Language","Words English flattens"],["Thread","Where Christ is"],["Forge","What it demands"]];

function anchor(size,color,stroke){
  color=color||"#2A8C8C";stroke=stroke||2;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.4"/><line x1="12" y1="7.4" x2="12" y2="21"/><line x1="7" y1="11" x2="17" y2="11"/><path d="M4 15c0 4 3.6 6 8 6s8-2 8-6"/></svg>';
}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

let route={view:"home"};
function go(r){route=r;render();window.scrollTo(0,0);}

function header(){
  var back = route.view!=="home" ? '<span class="back eyebrow" onclick="go({view:\'home\'})">← All Studies</span>' : '';
  return '<header><div class="hbar"><div class="logo" onclick="go({view:\'home\'})">'+anchor(23,"#3FB0AE")+'<span class="disp">ANCHORED</span></div><span class="htag eyebrow">Men\'s Curriculum</span>'+back+'</div></header>';
}
function footer(){return '<footer>'+anchor(20,"#8EA6AA")+'<div class="eyebrow">Anchored Steps · True Balance</div></footer>';}

function home(){
  var chips = LENSES.map(function(l,i){return '<div class="lens-chip"><span class="num">'+(i+1)+'</span><span style="font-weight:600">'+l[0]+'</span><span class="d">· '+l[1]+'</span></div>';}).join("");
  var cards = TRACKS.map(function(t){
    return '<div class="tcard" style="border-top-color:'+t.accent+'" onclick="go({view:\'track\',tid:\''+t.id+'\'})">'
      +'<div class="row"><div class="eyebrow" style="color:'+t.accent+'">'+esc(t.book)+' · '+t.weeks+' weeks</div>'
      +'<span class="badge" style="background:'+t.accent+'">Ready</span></div>'
      +'<h3 class="disp">'+esc(t.title)+'</h3><div class="sub disp">'+esc(t.subtitle)+'</div>'
      +'<div class="blurb">'+esc(t.blurb)+'</div>'
      +'<div class="go" style="color:'+t.accent+'">Open study →</div></div>';
  }).join("");
  return '<section class="hero"><div class="hero-ghost">'+anchor(320,"#ffffff",1)+'</div>'
    +'<div class="wrap hero-in"><div class="eyebrow" style="color:#3FB0AE;margin-bottom:16px">Expository study · built for ages 25–77</div>'
    +'<h1 class="disp">Open the text.<br>Let it forge men.</h1>'
    +'<p>One method, many books. Every study runs the same five lenses — so a room of mixed ages goes deep together, and every man leaves with something to do.</p>'
    +'<div class="lens-strip">'+chips+'</div></div></section>'
    +'<section class="sec"><div class="wrap"><div class="sec-head"><span class="eyebrow">The Library</span><h2 class="disp">Studies</h2><span class="note">Eight books. More can be added.</span></div>'
    +'<div class="grid">'+cards+'</div>'
    +'<div class="note-box">'+anchor(26,"#8EA6AA")+'<div><strong style="color:var(--ink)">Add a book:</strong> every study is one data object in the same shape. Author the sessions, drop it in the library, and it inherits the whole method — lenses, mixed-age prompts, and the Forge.</div></div>'
    +'</div></section>';
}

function track(){
  var t=TRACKS.find(function(x){return x.id===route.tid;});
  var rows=t.sessions.map(function(s,i){
    return '<div class="wrow" onclick="go({view:\'session\',tid:\''+t.id+'\',idx:'+i+'})">'
      +'<div class="wnum">'+String(s.n).padStart(2,"0")+'</div>'
      +'<div style="flex:1"><div><span class="wt">'+esc(s.title)+'</span><span class="wp" style="color:'+t.accent+'">'+esc(t.book)+' '+esc(s.passage)+'</span></div>'
      +'<div class="wtheme">'+esc(s.theme)+'</div></div>'
      +'<div class="arrow" style="color:'+t.accent+'">→</div></div>';
  }).join("");
  return '<section class="thero"><div class="wrap-narrow thero-in"><div class="eyebrow">'+esc(t.book)+' · '+t.weeks+' weeks · expository</div>'
    +'<h1 class="disp">'+esc(t.title)+'</h1><div class="sub disp">'+esc(t.subtitle)+'</div><p>'+esc(t.blurb)+'</p></div></section>'
    +'<section><div class="wrap-narrow"><div class="wlist">'+rows+'</div></div></section>';
}

function paras(txt){
  return String(txt).split(/\n\n+/).map(function(p){return '<p>'+esc(p)+'</p>';}).join("");
}
function boldLead(txt){
  // convert **...** to <strong>...</strong> after escaping
  return esc(txt).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
}
function fCulture(f){
  if(!f) return "";
  return '<div class="fpart"><div class="eyebrow flabel" style="color:var(--slate)">Cultural Context</div><div class="fbody">'+paras(f.culture)+'</div></div>';
}
function fInventory(f){
  if(!f) return "";
  var prompts = (f.inventory.prompts||[]).map(function(p){return '<li>'+esc(p)+'</li>';}).join("");
  return '<div class="fpart"><div class="eyebrow flabel" style="color:var(--gold)">The Inventory</div>'
    + '<div class="finv"><div class="flead">'+boldLead(f.inventory.lead)+'</div>'
    + (prompts?'<ul class="fprompts">'+prompts+'</ul>':'')
    + '<div class="fland">'+esc(f.inventory.land)+'</div></div></div>';
}
function fStep(f){
  if(!f) return "";
  return '<div class="fpart" style="margin-top:26px"><div class="eyebrow flabel" style="color:var(--tealLight)">Anchored Step</div>'
    + '<div class="fstep"><div class="fmile">'+anchor(16,"#5FC8C6")+'<span class="disp">'+esc(f.step.milestone)+'</span></div>'
    + '<div class="fstepbody">'+esc(f.step.body)+'</div></div></div>';
}
function fPrayer(f){
  if(!f) return "";
  return '<div class="fpart" style="margin-top:22px"><div class="eyebrow flabel fplabel">Prayer</div>'
    + '<div class="fpray"><div class="fpraytext">'+esc(f.prayer)+'</div></div></div>';
}

function session(){
  var t=TRACKS.find(function(x){return x.id===route.tid;});
  var s=t.sessions[route.idx]; var total=t.sessions.length;
  var words=s.words.map(function(w){
    return '<div class="wordcard"><div class="top"><bdi class="gk">'+esc(w.greek)+'</bdi> <span class="tl">('+esc(w.translit)+')</span> <span class="gl">&#8212; '+esc(w.gloss)+'</span></div><div class="nt">'+esc(w.note)+'</div></div>';
  }).join("");
  var qs=s.questions.map(function(q,i){return '<li><span class="qn">'+(i+1)+'</span><span class="qt">'+esc(q)+'</span></li>';}).join("");
  var prevD=route.idx===0?"disabled":""; var nextD=route.idx===total-1?"disabled":"";
  return '<section class="shero"><div class="wrap-narrow shero-in"><div class="eyebrow">'+esc(t.title)+' · Week '+s.n+' of '+total+' · '+esc(t.book)+' '+esc(s.passage)+'</div>'
    +'<h1 class="disp">'+esc(s.title)+'</h1><div class="stheme disp">'+esc(s.theme)+'</div></div></section>'
    +'<section class="sbody"><div class="wrap-narrow">'
    +'<div class="block"><div class="eyebrow lbl" style="color:var(--teal)">① Context</div><div class="body">'+esc(s.context)+'</div></div>'
    +'<div class="block"><div class="eyebrow lbl" style="color:var(--teal)">② Text — what the passage says</div><div class="body">'+esc(s.text)+'</div></div>'
    +'<div class="block"><div class="eyebrow lbl" style="color:var(--gold)">③ Language — words worth knowing</div><div class="words">'+words+'</div></div>'
    +'<div class="block"><div class="eyebrow lbl" style="color:var(--teal)">④ Thread — where Christ is</div><div class="body">'+esc(s.thread)+'</div></div>'
    +'<div class="formation">'+fCulture(s.formation)+fInventory(s.formation)+'</div>'
    +'<div class="eyebrow" style="color:var(--tealLight);margin:30px 0 10px">The Table — discussion</div>'
    +'<div class="prompt elder"><span class="plbl">Elder Wisdom&nbsp;&nbsp;</span><span class="ptext">'+esc(s.elder)+'</span></div>'
    +'<div class="prompt first"><span class="plbl">First Steps&nbsp;&nbsp;</span><span class="ptext">'+esc(s.first)+'</span></div>'
    +'<div class="qhead">For the table:</div><ol class="qlist">'+qs+'</ol>'
    +fStep(s.formation)
    +'<div class="forge">'+anchor(28,"#3FB0AE")+'<div><div class="eyebrow flbl">The Forge · this week</div><div class="ftext">'+esc(s.forge)+'</div></div></div>'
    +fPrayer(s.formation)
    +'<div class="snav"><button class="nbtn" '+prevD+' onclick="go({view:\'session\',tid:\''+t.id+'\',idx:'+(route.idx-1)+'})">← Previous</button>'
    +'<button class="nbtn primary" '+nextD+' onclick="go({view:\'session\',tid:\''+t.id+'\',idx:'+(route.idx+1)+'})">Next →</button></div>'
    +'</div></section>';
}

function render(){
  var body="";
  if(route.view==="home")body=home();
  else if(route.view==="track")body=track();
  else if(route.view==="session")body=session();
  document.getElementById("app").innerHTML=header()+body+footer();
}
render();
</script>
</body>
</html>
