1], [10, 21, "Jesus looking at him loved him, and said to him, “One thing you lack. Go, sell whatever you have, and give to the poor, and you will have treasure in heaven; and come, follow me, taking up the cross.”", 1], [10, 22, "But his face fell at that saying, and he went away sorrowful, for he was one who had great possessions.", 1], [10, 23, "Jesus looked around, and said to his disciples, “How difficult it is for those who have riches to enter into God’s Kingdom!”", 0], [10, 24, "The disciples were amazed at his words. But Jesus answered again, “Children, how hard it is for those who trust in riches to enter into God’s Kingdom!", 1], [10, 25, "It is easier for a camel to go through a needle’s eye than for a rich man to enter into God’s Kingdom.”", 0], [10, 26, "They were exceedingly astonished, saying to him, “Then who can be saved?”", 1], [10, 27, "Jesus, looking at them, said, “With men it is impossible, but not with God, for all things are possible with God.”", 1], [10, 28, "Peter began to tell him, “Behold, we have left all, and have followed you.”", 1], [10, 29, "Jesus said, “Most certainly I tell you, there is no one who has left house, or brothers, or sisters, or father, or mother, or wife, or children, or land, for my sake, and for the sake of the Good News,", 1], [10, 30, "but he will receive one hundred times more now in this time: houses, brothers, sisters, mothers, children, and land, with persecutions; and in the age to come eternal life.", 0], [10, 31, "But many who are first will be last; and the last first.”", 0], [10, 32, "They were on the way, going up to Jerusalem; and Jesus was going in front of them, and they were amazed; and those who followed were afraid. He again took the twelve, and began to tell them the things that were going to happen to him.", 1], [10, 33, "“Behold, we are going up to Jerusalem. The Son of Man will be delivered to the chief priests and the scribes. They will condemn him to death, and will deliver him to the Gentiles.", 0], [10, 34, "They will mock him, spit on him, scourge him, and kill him. On the third day he will rise again.”", 0], [10, 35, "James and John, the sons of Zebedee, came near to him, saying, “Teacher, we want you to do for us whatever we will ask.”", 1], [10, 36, "He said to them, “What do you want me to do for you?”", 1], [10, 37, "They said to him, “Grant to us that we may sit, one at your right hand, and one at your left hand, in your glory.”", 1], [10, 38, "But Jesus said to them, “You don’t know what you are asking. Are you able to drink the cup that I drink, and to be baptized with the baptism that I am baptized with?”", 1], [10, 39, "They said to him, “We are able.” Jesus said to them, “You shall indeed drink the cup that I drink, and you shall be baptized with the baptism that I am baptized with;", 1], [10, 40, "but to sit at my right hand and at my left hand is not mine to give, but for whom it has been prepared.”", 0], [10, 41, "When the ten heard it, they began to be indignant toward James and John.", 1], [10, 42, "Jesus summoned them, and said to them, “You know that they who are recognized as rulers over the nations lord it over them, and their great ones exercise authority over them.", 1], [10, 43, "But it shall not be so among you, but whoever wants to become great among you shall be your servant.", 0], [10, 44, "Whoever of you wants to become first among you, shall be bondservant of all.", 0], [10, 45, "For the Son of Man also came not to be served, but to serve, and to give his life as a ransom for many.”", 0], [10, 46, "They came to Jericho. As he went out from Jericho, with his disciples and a great multitude, the son of Timaeus, Bartimaeus, a blind beggar, was sitting by the road.", 1], [10, 47, "When he heard that it was Jesus the Nazarene, he began to cry out, and say, “Jesus, you son of David, have mercy on me!”", 0], [10, 48, "Many rebuked him, that he should be quiet, but he cried out much more, “You son of David, have mercy on me!”", 0], [10, 49, "Jesus stood still, and said, “Call him.” They called the blind man, saying to him, “Cheer up! Get up. He is calling you!”", 1], [10, 50, "He, casting away his cloak, sprang up, and came to Jesus.", 1], [10, 51, "Jesus asked him, “What do you want me to do for you?” The blind man said to him, “Rabboni, that I may see again.”", 1], [10, 52, "Jesus said to him, “Go your way. Your faith has made you well.” Immediately he received his sight, and followed Jesus on the way.", 1]]}]}, {"sel": 1, "segs": [{"ref": "Mark 11:1–11", "v": [[11, 1, "When they came near to Jerusalem, to Bethsphage and Bethany, at the Mount of Olives, he sent two of his disciples,", 1], [11, 2, "and said to them, “Go your way into the village that is opposite you. Immediately as you enter into it, you will find a young donkey tied, on which no one has sat. Untie him, and bring him.", 0], [11, 3, "If anyone asks you, ‘Why are you doing this?’ say, ‘The Lord needs him;’ and immediately he will send him back here.”", 0], [11, 4, "They went away, and found a young donkey tied at the door outside in the open street, and they untied him.", 1], [11, 5, "Some of those who stood there asked them, “What are you doing, untying the young donkey?”", 0], [11, 6, "They said to them just as Jesus had said, and they let them go.", 0], [11, 7, "They brought the young donkey to Jesus, and threw their garments on it, and Jesus sat on it.", 1], [11, 8, "Many spread their garments on the way, and others were cutting down branches from the trees, and spreading them on the road.", 0], [11, 9, "Those who went in front, and those who followed, cried out, “Hosanna! Blessed is he who comes in the name of the Lord!", 0], [11, 10, "Blessed is the kingdom of our father David that is coming in the name of the Lord! Hosanna in the highest!”", 0], [11, 11, "Jesus entered into the temple in Jerusalem. When he had looked around at everything, it being now evening, he went out to Bethany with the twelve.", 1]]}, {"ref": "Mark 11:15–18", "v": [[11, 15, "They came to Jerusalem, and Jesus entered into the temple, and began to throw out those who sold and those who bought in the temple, and overthrew the money changers’ tables, and the seats of those who sold the doves.", 1], [11, 16, "He would not allow anyone to carry a container through the temple.", 0], [11, 17, "He taught, saying to them, “Isn’t it written, ‘My house will be called a house of prayer for all the nations?’ But you have made it a den of robbers!”", 0], [11, 18, "The chief priests and the scribes heard it, and sought how they might destroy him. For they feared him, because all the multitude was astonished at his teaching.", 1]]}, {"ref": "Mark 12:28–34", "v": [[12, 28, "One of the scribes came, and heard them questioning together, and knowing that he had answered them well, asked him, “Which commandment is the greatest of all?”", 1], [12, 29, "Jesus answered, “The greatest is, ‘Hear, Israel, the Lord our God, the Lord is one:", 1], [12, 30, "you shall love the Lord your God with all your heart, and with all your soul, and with all your mind, and with all your strength.’ This is the first commandment.", 0], [12, 31, "The second is like this, ‘You shall love your neighbor as yourself.’ There is no other commandment greater than these.”", 0], [12, 32, "The scribe said to him, “Truly, teacher, you have said well that he is one, and there is none other but he,", 1], [12, 33, "and to love him with all the heart, and with all the understanding, with all the soul, and with all the strength, and to love his neighbor as himself, is more important than all whole burnt offerings and sacrifices.”", 0], [12, 34, "When Jesus saw that he answered wisely, he said to him, “You are not far from God’s Kingdom.” No one dared ask him any question after that.", 1]]}, {"ref": "Mark 14:22–25", "v": [[14, 22, "As they were eating, Jesus took bread, and when he had blessed, he broke it, and gave to them, and said, “Take, eat. This is my body.”", 1], [14, 23, "He took the cup, and when he had given thanks, he gave to them. They all drank of it.", 1], [14, 24, "He said to them, “This is my blood of the new covenant, which is poured out for many.", 0], [14, 25, "Most certainly I tell you, I will no more drink of the fruit of the vine, until that day when I drink it anew in God’s Kingdom.”", 0]]}, {"ref": "Mark 14:32–42", "v": [[14, 32, "They came to a place which was named Gethsemane. He said to his disciples, “Sit here, while I pray.”", 1], [14, 33, "He took with him Peter, James, and John, and began to be greatly troubled and distressed.", 0], [14, 34, "He said to them, “My soul is exceedingly sorrowful, even to death. Stay here, and watch.”", 0], [14, 35, "He went forward a little, and fell on the ground, and prayed that, if it were possible, the hour might pass away from him.", 1], [14, 36, "He said, “Abba, Father, all things are possible to you. Please remove this cup from me. However, not what I desire, but what you desire.”", 0], [14, 37, "He came and found them sleeping, and said to Peter, “Simon, are you sleeping? Couldn’t you watch one hour?", 1], [14, 38, "Watch and pray, that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.”", 0], [14, 39, "Again he went away, and prayed, saying the same words.", 1], [14, 40, "Again he returned, and found them sleeping, for their eyes were very heavy, and they didn’t know what to answer him.", 0], [14, 41, "He came the third time, and said to them, “Sleep on now, and take your rest. It is enough. The hour has come. Behold, the Son of Man is betrayed into the hands of sinners.", 0], [14, 42, "Arise! Let’s get going. Behold: he who betrays me is at hand.”", 0]]}, {"ref": "Mark 15:33–41", "v": [[15, 33, "When the sixth hour had come, there was darkness over the whole land until the ninth hour.", 1], [15, 34, "At the ninth hour Jesus cried with a loud voice, saying, “Eloi, Eloi, lama sabachthani?” which is, being interpreted, “My God, my God, why have you forsaken me?”", 0], [15, 35, "Some of those who stood by, when they heard it, said, “Behold, he is calling Elijah.”", 1], [15, 36, "One ran, and filling a sponge full of vinegar, put it on a reed, and gave it to him to drink, saying, “Let him be. Let’s see whether Elijah comes to take him down.”", 1], [15, 37, "Jesus cried out with a loud voice, and gave up the spirit.", 1], [15, 38, "The veil of the temple was torn in two from the top to the bottom.", 0], [15, 39, "When the centurion, who stood by opposite him, saw that he cried out like this and breathed his last, he said, “Truly this man was the Son of God!”", 0], [15, 40, "There were also women watching from afar, among whom were both Mary Magdalene, and Mary the mother of James the less and of Joses, and Salome;", 1], [15, 41, "who, when he was in Galilee, followed him and served him; and many other women who came up with him to Jerusalem.", 0]]}, {"ref": "Mark 16:1–8", "v": [[16, 1, "When the Sabbath was past, Mary Magdalene, and Mary the mother of James, and Salome, bought spices, that they might come and anoint him.", 1], [16, 2, "Very early on the first day of the week, they came to the tomb when the sun had risen.", 0], [16, 3, "They were saying among themselves, “Who will roll away the stone from the door of the tomb for us?”", 0], [16, 4, "for it was very big. Looking up, they saw that the stone was rolled back.", 0], [16, 5, "Entering into the tomb, they saw a young man sitting on the right side, dressed in a white robe, and they were amazed.", 1], [16, 6, "He said to them, “Don’t be amazed. You seek Jesus, the Nazarene, who has been crucified. He has risen. He is not here. Behold, the place where they laid him!", 0], [16, 7, "But go, tell his disciples and Peter, ‘He goes before you into Galilee. There you will see him, as he said to you.’ ”", 0], [16, 8, "They went out, and fled from the tomb, for trembling and astonishment had come on them. They said nothing to anyone; for they were afraid.", 1]]}]}], "timothy": [{"sel": 0, "segs": [{"ref": "1 Timothy 1", "v": [[1, 1, "Paul, an apostle of Jesus Christ according to the commandment of God our Savior and the Lord Jesus Christ our hope;", 1], [1, 2, "to Timothy, my true child in faith: Grace, mercy, and peace, from God our Father and Christ Jesus our Lord.", 0], [1, 3, "As I urged you when I was going into Macedonia, stay at Ephesus that you might command certain men not to teach a different doctrine,", 1], [1, 4, "and not to pay attention to myths and endless genealogies, which cause disputes, rather than God’s stewardship, which is in faith—", 0], [1, 5, "but the goal of this command is love, out of a pure heart and a good conscience and sincere faith,", 0], [1, 6, "from which things some, having missed the mark, have turned away to vain talking,", 0], [1, 7, "desiring to be teachers of the law, though they understand neither what they say, nor about what they strongly affirm.", 0], [1, 8, "But we know that the law is good, if a person uses it lawfully,", 0], [1, 9, "as knowing this, that law is not made for a righteous person, but for the lawless and insubordinate, for the ungodly and sinners, for the unholy and profane, for murderers of fathers and murderers of mothers, for manslayers,", 0], [1, 10, "for the sexually immoral, for homosexuals, for slave-traders, for liars, for perjurers, and for any other thing contrary to the sound doctrine,", 0], [1, 11, "according to the Good News of the glory of the blessed God, which was committed to my trust.", 0], [1, 12, "I thank him who enabled me, Christ Jesus our Lord, because he counted me faithful, appointing me to service;", 1], [1, 13, "although I used to be a blasphemer, a persecutor, and insolent. However, I obtained mercy, because I did it ignorantly in unbelief.", 0], [1, 14, "The grace of our Lord abounded exceedingly with faith and love which is in Christ Jesus.", 0], [1, 15, "The saying is faithful and worthy of all acceptance, that Christ Jesus came into the world to save sinners, of whom I am chief.", 0], [1, 16, "However, for this cause I obtained mercy, that in me first, Jesus Christ might display all his patience for an example of those who were going to believe in him for eternal life.", 0], [1, 17, "Now to the King eternal, immortal, invisible, to God who alone is wise, be honor and glory forever and ever. Amen.", 0], [1, 18, "I commit this instruction to you, my child Timothy, according to the prophecies which were given to you before, that by them you may wage the good warfare,", 1], [1, 19, "holding faith and a good conscience, which some having thrust away made a shipwreck concerning the faith,", 0], [1, 20, "of whom are Hymenaeus and Alexander, whom I delivered to Satan, that they might be taught not to blaspheme.", 0]]}]}, {"sel": 0, "segs": [{"ref": "1 Timothy 2–3", "v": [[2, 1, "I exhort therefore, first of all, that petitions, prayers, intercessions, and givings of thanks be made for all men:", 1], [2, 2, "for kings and all who are in high places, that we may lead a tranquil and quiet life in all godliness and reverence.", 0], [2, 3, "For this is good and acceptable in the sight of God our Savior,", 0], [2, 4, "who desires all people to be saved and come to full knowledge of the truth.", 0], [2, 5, "For there is one God, and one mediator between God and men, the man Christ Jesus,", 0], [2, 6, "who gave himself as a ransom for all, the testimony in its own times,", 0], [2, 7, "to which I was appointed a preacher and an apostle—I am telling the truth in Christ, not lying—a teacher of the Gentiles in faith and truth.", 0], [2, 8, "I desire therefore that the men in every place pray, lifting up holy hands without anger and doubting.", 1], [2, 9, "In the same way, that women also adorn themselves in decent clothing, with modesty and propriety, not just with braided hair, gold, pearls, or expensive clothing,", 0], [2, 10, "but with good works, which is appropriate for women professing godliness.", 0], [2, 11, "Let a woman learn in quietness with full submission.", 0], [2, 12, "But I don’t permit a woman to teach, nor to exercise authority over a man, but to be in quietness.", 0], [2, 13, "For Adam was formed first, then Eve.", 0], [2, 14, "Adam wasn’t deceived, but the woman, being deceived, has fallen into disobedience;", 0], [2, 15, "but she will be saved through her childbearing, if they continue in faith, love, and sanctification with sobriety.", 0], [3, 1, "This is a faithful saying: someone who seeks to be an overseer desires a good work.", 1], [3, 2, "The overseer therefore must be without reproach, the husband of one wife, temperate, sensible, modest, hospitable, good at teaching;", 0], [3, 3, "not a drinker, not violent, not greedy for money, but gentle, not quarrelsome, not covetous;", 0], [3, 4, "one who rules his own house well, having children in subjection with all reverence;", 0], [3, 5, "(but how could someone who doesn’t know how to rule one’s own house take care of God’s assembly?)", 0], [3, 6, "not a new convert, lest being puffed up he fall into the same condemnation as the devil.", 0], [3, 7, "Moreover he must have good testimony from those who are outside, to avoid falling into reproach and the snare of the devil.", 0], [3, 8, "Servants, in the same way, must be reverent, not double-tongued, not addicted to much wine, not greedy for money,", 1], [3, 9, "holding the mystery of the faith in a pure conscience.", 0], [3, 10, "Let them also first be tested; then let them serve if they are blameless.", 0], [3, 11, "Their wives in the same way must be reverent, not slanderers, temperate, and faithful in all things.", 0], [3, 12, "Let servants be husbands of one wife, ruling their children and their own houses well.", 0], [3, 13, "For those who have served well gain for themselves a good standing, and great boldness in the faith which is in Christ Jesus.", 0], [3, 14, "These things I write to you, hoping to come to you shortly;", 1], [3, 15, "but if I wait long, that you may know how men ought to behave themselves in God’s house, which is the assembly of the living God, the pillar and ground of the truth.", 0], [3, 16, "Without controversy, the mystery of godliness is great:\nGod was revealed in the flesh,\njustified in the spirit,\nseen by angels,\npreached among the nations,\nbelieved on in the world,\nand received up in glory.", 0]]}]}, {"sel": 0, "segs": [{"ref": "1 Timothy 4", "v": [[4, 1, "But the Spirit says expressly that in later times some will fall away from the faith, paying attention to seducing spirits and doctrines of demons,", 1], [4, 2, "through the hypocrisy of men who speak lies, branded in their own conscience as with a hot iron,", 0], [4, 3, "forbidding marriage and commanding to abstain from foods which God created to be received with thanksgiving by those who believe and know the truth.", 0], [4, 4, "For every creature of God is good, and nothing is to be rejected, if it is received with thanksgiving.", 0], [4, 5, "For it is sanctified through the word of God and prayer.", 0], [4, 6, "If you instruct the brothers of these things, you will be a good servant of Christ Jesus, nourished in the words of the faith, and of the good doctrine which you have followed.", 1], [4, 7, "But refuse profane and old wives’ fables. Exercise yourself toward godliness.", 0], [4, 8, "For bodily exercise has some value, but godliness has value in all things, having the promise of the life which is now, and of that which is to come.", 0], [4, 9, "This saying is faithful and worthy of all acceptance.", 0], [4, 10, "For to this end we both labor and suffer reproach, because we have set our trust in the living God, who is the Savior of all men, especially of those who believe.", 0], [4, 11, "Command and teach these things.", 0], [4, 12, "Let no man despise your youth; but be an example to those who believe, in word, in your way of life, in love, in spirit, in faith, and in purity.", 1], [4, 13, "Until I come, pay attention to reading, to exhortation, and to teaching.", 0], [4, 14, "Don’t neglect the gift that is in you, which was given to you by prophecy, with the laying on of the hands of the elders.", 0], [4, 15, "Be diligent in these things. Give yourself wholly to them, that your progress may be revealed to all.", 0], [4, 16, "Pay attention to yourself and to your teaching. Continue in these things, for in doing this you will save both yourself and those who hear you.", 0]]}]}, {"sel": 0, "segs": [{"ref": "1 Timothy 5–6", "v": [[5, 1, "Don’t rebuke an older man, but exhort him as a father; the younger men as brothers;", 1], [5, 2, "the elder women as mothers; the younger as sisters, in all purity.", 0], [5, 3, "Honor widows who are widows indeed.", 0], [5, 4, "But if any widow has children or grandchildren, let them learn first to show piety toward their own family and to repay their parents, for this is acceptable in the sight of God.", 0], [5, 5, "Now she who is a widow indeed and desolate, has her hope set on God, and continues in petitions and prayers night and day.", 0], [5, 6, "But she who gives herself to pleasure is dead while she lives.", 0], [5, 7, "Also command these things, that they may be without reproach.", 0], [5, 8, "But if anyone doesn’t provide for his own, and especially his own household, he has denied the faith, and is worse than an unbeliever.", 0], [5, 9, "Let no one be enrolled as a widow under sixty years old, having been the wife of one man,", 0], [5, 10, "being approved by good works, if she has brought up children, if she has been hospitable to strangers, if she has washed the saints’ feet, if she has relieved the afflicted, and if she has diligently followed every good work.", 0], [5, 11, "But refuse younger widows, for when they have grown wanton against Christ, they desire to marry,", 1], [5, 12, "having condemnation, because they have rejected their first pledge.", 0], [5, 13, "Besides, they also learn to be idle, going about from house to house. Not only idle, but also gossips and busybodies, saying things which they ought not.", 0], [5, 14, "I desire therefore that the younger widows marry, bear children, rule the household, and give no occasion to the adversary for insulting.", 0], [5, 15, "For already some have turned away after Satan.", 0], [5, 16, "If any man or woman who believes has widows, let them relieve them, and don’t let the assembly be burdened, that it might relieve those who are widows indeed.", 0], [5, 17, "Let the elders who rule well be counted worthy of double honor, especially those who labor in the word and in teaching.", 1], [5, 18, "For the Scripture says, “You shall not muzzle the ox when it treads out the grain.” And, “The laborer is worthy of his wages.”", 0], [5, 19, "Don’t receive an accusation against an elder, except at the word of two or three witnesses.", 1], [5, 20, "Those who sin, reprove in the sight of all, that the rest also may be in fear.", 0], [5, 21, "I command you in the sight of God, and the Lord Jesus Christ, and the chosen angels, that you observe these things without prejudice, doing nothing by partiality.", 0], [5, 22, "Lay hands hastily on no one. Don’t be a participant in other people’s sins. Keep yourself pure.", 0], [5, 23, "Be no longer a drinker of water only, but use a little wine for your stomach’s sake and your frequent infirmities.", 0], [5, 24, "Some men’s sins are evident, preceding them to judgment, and some also follow later.", 1], [5, 25, "In the same way also there are good works that are obvious, and those that are otherwise can’t be hidden.", 0], [6, 1, "Let as many as are bondservants under the yoke count their own masters worthy of all honor, that the name of God and the doctrine not be blasphemed.", 1], [6, 2, "Those who have believing masters, let them not despise them because they are brothers, but rather let them serve them, because those who partake of the benefit are believing and beloved. Teach and exhort these things.", 0], [6, 3, "If anyone teaches a different doctrine, and doesn’t consent to sound words, the words of our Lord Jesus Christ, and to the doctrine which is according to godliness,", 1], [6, 4, "he is conceited, knowing nothing, but obsessed with arguments, disputes, and word battles, from which come envy, strife, insulting, evil suspicions,", 0], [6, 5, "constant friction of people of corrupt minds and destitute of the truth, who suppose that godliness is a means of gain. Withdraw yourself from such.", 0], [6, 6, "But godliness with contentment is great gain.", 1], [6, 7, "For we brought nothing into the world, and we certainly can’t carry anything out.", 0], [6, 8, "But having food and clothing, we will be content with that.", 0], [6, 9, "But those who are determined to be rich fall into a temptation, a snare, and many foolish and harmful lusts, such as drown men in ruin and destruction.", 0], [6, 10, "For the love of money is a root of all kinds of evil. Some have been led astray from the faith in their greed, and have pierced themselves through with many sorrows.", 0], [6, 11, "But you, man of God, flee these things, and follow after righteousness, godliness, faith, love, perseverance, and gentleness.", 1], [6, 12, "Fight the good fight of faith. Take hold of the eternal life to which you were called, and you confessed the good confession in the sight of many witnesses.", 0], [6, 13, "I command you before God, who gives life to all things, and before Christ Jesus, who before Pontius Pilate testified the good confession,", 0], [6, 14, "that you keep the commandment without spot, blameless, until the appearing of our Lord Jesus Christ,", 0], [6, 15, "which in its own times he will show, who is the blessed and only Ruler, the King of kings, and Lord of lords.", 0], [6, 16, "He alone has immortality, dwelling in unapproachable light, whom no man has seen, nor can see: to whom be honor and eternal power. Amen.", 0], [6, 17, "Charge those who are rich in this present world that they not be arrogant, nor have their hope set on the uncertainty of riches, but on the living God, who richly provides us with everything to enjoy;", 1], [6, 18, "that they do good, that they be rich in good works, that they be ready to distribute, willing to share;", 0], [6, 19, "laying up in store for themselves a good foundation against the time to come, that they may lay hold of eternal life.", 0], [6, 20, "Timothy, guard that which is committed to you, turning away from the empty chatter and oppositions of what is falsely called knowledge,", 1], [6, 21, "which some profess, and thus have wandered from the faith. Grace be with you. Amen.", 0]]}]}, {"sel": 0, "segs": [{"ref": "2 Timothy 1", "v": [[1, 1, "Paul, an apostle of Jesus Christ through the will of God, according to the promise of the life which is in Christ Jesus,", 1], [1, 2, "to Timothy, my beloved child: Grace, mercy, and peace, from God the Father and Christ Jesus our Lord.", 0], [1, 3, "I thank God, whom I serve as my forefathers did, with a pure conscience. How unceasing is my memory of you in my petitions, night and day", 1], [1, 4, "longing to see you, remembering your tears, that I may be filled with joy;", 0], [1, 5, "having been reminded of the sincere faith that is in you, which lived first in your grandmother Lois, and your mother Eunice, and, I am persuaded, in you also.", 0], [1, 6, "For this cause, I remind you that you should stir up the gift of God which is in you through the laying on of my hands.", 1], [1, 7, "For God didn’t give us a spirit of fear, but of power, love, and self-control.", 0], [1, 8, "Therefore don’t be ashamed of the testimony of our Lord, nor of me his prisoner; but endure hardship for the Good News according to the power of God,", 0], [1, 9, "who saved us and called us with a holy calling, not according to our works, but according to his own purpose and grace, which was given to us in Christ Jesus before times eternal,", 0], [1, 10, "but has now been revealed by the appearing of our Savior, Christ Jesus, who abolished death, and brought life and immortality to light through the Good News.", 0], [1, 11, "For this I was appointed as a preacher, an apostle, and a teacher of the Gentiles.", 0], [1, 12, "For this cause I also suffer these things. Yet I am not ashamed, for I know him whom I have believed, and I am persuaded that he is able to guard that which I have committed to him against that day.", 0], [1, 13, "Hold the pattern of sound words which you have heard from me, in faith and love which is in Christ Jesus.", 1], [1, 14, "That good thing which was committed to you, guard through the Holy Spirit who dwells in us.", 0], [1, 15, "This you know, that all who are in Asia turned away from me, of whom are Phygelus and Hermogenes.", 1], [1, 16, "May the Lord grant mercy to the house of Onesiphorus, for he often refreshed me, and was not ashamed of my chain,", 0], [1, 17, "but when he was in Rome, he sought me diligently and found me", 0], [1, 18, "(the Lord grant to him to find the Lord’s mercy in that day); and in how many things he served at Ephesus, you know very well.", 0]]}]}, {"sel": 0, "segs": [{"ref": "2 Timothy 2", "v": [[2, 1, "You therefore, my child, be strengthened in the grace that is in Christ Jesus.", 1], [2, 2, "The things which you have heard from me among many witnesses, commit the same things to faithful men, who will be able to teach others also.", 0], [2, 3, "You therefore must endure hardship as a good soldier of Christ Jesus.", 0], [2, 4, "No soldier on duty entangles himself in the affairs of life, that he may please him who enrolled him as a soldier.", 0], [2, 5, "Also, if anyone competes in athletics, he isn’t crowned unless he has competed by the rules.", 0], [2, 6, "The farmer who labors must be the first to get a share of the crops.", 0], [2, 7, "Consider what I say, and may the Lord give you understanding in all things.", 0], [2, 8, "Remember Jesus Christ, risen from the dead, of the offspring of David, according to my Good News,", 1], [2, 9, "in which I suffer hardship to the point of chains as a criminal. But God’s word isn’t chained.", 0], [2, 10, "Therefore I endure all things for the chosen ones’ sake, that they also may obtain the salvation which is in Christ Jesus with eternal glory.", 0], [2, 11, "This saying is trustworthy:\n“For if we died with him,\nwe will also live with him.", 0], [2, 12, "If we endure,\nwe will also reign with him.\nIf we deny him,\nhe also will deny us.", 0], [2, 13, "If we are faithless,\nhe remains faithful;\nfor he can’t deny himself.”", 0], [2, 14, "Remind them of these things, charging them in the sight of the Lord, that they don’t argue about words, to no profit, to the subverting of those who hear.", 1], [2, 15, "Give diligence to present yourself approved by God, a workman who doesn’t need to be ashamed, properly handling the Word of Truth.", 1], [2, 16, "But shun empty chatter, for it will go further in ungodliness,", 0], [2, 17, "and those words will consume like gangrene, of whom is Hymenaeus and Philetus:", 0], [2, 18, "men who have erred concerning the truth, saying that the resurrection is already past, and overthrowing the faith of some.", 0], [2, 19, "However God’s firm foundation stands, having this seal, “The Lord knows those who are his,” and, “Let every one who names the name of the Lord depart from unrighteousness.”", 0], [2, 20, "Now in a large house there are not only vessels of gold and of silver, but also of wood and of clay. Some are for honor, and some for dishonor.", 0], [2, 21, "If anyone therefore purges himself from these, he will be a vessel for honor, sanctified, and suitable for the master’s use, prepared for every good work.", 0], [2, 22, "Flee from youthful lusts; but pursue righteousness, faith, love, and peace with those who call on the Lord out of a pure heart.", 1], [2, 23, "But refuse foolish and ignorant questionings, knowing that they generate strife.", 0], [2, 24, "The Lord’s servant must not quarrel, but be gentle toward all, able to teach, patient,", 0], [2, 25, "in gentleness correcting those who oppose him: perhaps God may give them repentance leading to a full knowledge of the truth,", 0], [2, 26, "and they may recover themselves out of the devil’s snare, having been taken captive by him to his will.", 0]]}]}, {"sel": 0, "segs": [{"ref": "2 Timothy 3", "v": [[3, 1, "But know this: that in the last days, grievous times will come.", 1], [3, 2, "For men will be lovers of self, lovers of money, boastful, arrogant, blasphemers, disobedient to parents, unthankful, unholy,", 0], [3, 3, "without natural affection, unforgiving, slanderers, without self-control, fierce, not lovers of good,", 0], [3, 4, "traitors, headstrong, conceited, lovers of pleasure rather than lovers of God,", 0], [3, 5, "holding a form of godliness, but having denied its power. Turn away from these, also.", 0], [3, 6, "For some of these are people who creep into houses and take captive gullible women loaded down with sins, led away by various lusts,", 0], [3, 7, "always learning, and never able to come to the knowledge of the truth.", 0], [3, 8, "Even as Jannes and Jambres opposed Moses, so these also oppose the truth, men corrupted in mind, who concerning the faith are rejected.", 0], [3, 9, "But they will proceed no further. For their folly will be evident to all men, as theirs also came to be.", 0], [3, 10, "But you followed my teaching, conduct, purpose, faith, patience, love, steadfastness,", 0], [3, 11, "persecutions, and sufferings: those things that happened to me at Antioch, Iconium, and Lystra. I endured those persecutions. The Lord delivered me out of them all.", 0], [3, 12, "Yes, and all who desire to live godly in Christ Jesus will suffer persecution.", 0], [3, 13, "But evil men and impostors will grow worse and worse, deceiving and being deceived.", 0], [3, 14, "But you remain in the things which you have learned and have been assured of ng you have purified your souls in your obedience to the truth through the Spirit in sincere brotherly affection, love one another from the heart fervently,", 1], [1, 23, "having been born again, not of corruptible seed, but of incorruptible, through the word of God, which lives and remains forever.", 0], [1, 24, "For,\n“All flesh is like grass,\nand all of man’s glory like the flower in the grass.\nThe grass withers, and its flower falls;", 0], [1, 25, "but the Lord’s word endures forever.” This is the word of Good News which was preached to you.", 0], [2, 1, "Putting away therefore all wickedness, all deceit, hypocrisies, envies, and all evil speaking,", 1], [2, 2, "as newborn babies, long for the pure milk of the Word, that with it you may grow,", 0], [2, 3, "if indeed you have tasted that the Lord is gracious:", 0]]}]}, {"sel": 0, "segs": [{"ref": "1 Peter 2:4–12", "v": [[2, 4, "coming to him, a living stone, rejected indeed by men, but chosen by God, precious.", 0], [2, 5, "You also, as living stones, are built up as a spiritual house, to be a holy priesthood, to offer up spiritual sacrifices, acceptable to God through Jesus Christ.", 0], [2, 6, "Because it is contained in Scripture,\n“Behold, I lay in Zion a chief cornerstone, chosen and precious:\nHe who believes in him will not be disappointed.”", 0], [2, 7, "For you who believe therefore is the honor, but for those who are disobedient,\n“The stone which the builders rejected\nhas become the chief cornerstone,”", 1], [2, 8, "and,\n“a stumbling stone and a rock of offense.” For they stumble at the word, being disobedient, to which also they were appointed.", 1], [2, 9, "But you are a chosen race, a royal priesthood, a holy nation, a people for God’s own possession, that you may proclaim the excellence of him who called you out of darkness into his marvelous light.", 0], [2, 10, "In the past, you were not a people, but now are God’s people, who had not obtained mercy, but now have obtained mercy.", 0], [2, 11,  15, "But sanctify the Lord God in your hearts. Always be ready to give an answer to everyone who asks you a reason concerning the hope that is in you, with humility and fear,", 0], [3, 16, "having a good conscience. Thus, while you are spoken against as evildoers, they may be disappointed who curse your good way of life in Christ.", 0], [3, 17, "For it is better, if it is God’s will, that you suffer for doing well than for doing evil.", 0], [3, 18, "Because Christ also suffered for sins once, the righteous for the unrighteous, that he might bring you to God, being put to death in the flesh, but made alive in the Spirit,", 0], [3, 19, "in whom he also went and preached to the spirits in prison,", 0], [3, 20, "who before were disobedient, when God waited patiently in the days of Noah, while the ship was being built. In it, few, that is, eight souls, were saved through water.", 0], [3, 21, "This is a symbol of baptism, which now saves you—not the putting away of the filth of the flesh, but the answer of a good conscience toward God, through the resurrection of Jesus Christ,", 0], [3, 22, "who is at the right hand of God, having gone into heaven, angels and authorities and powers being made subject to him.", 0], [4, 1, "Therefore, since Christ suffered for us in the flesh, arm yourselves also with the same mind; for he who has suffered in the flesh has ceased from sin,", 1], [4, 2, "that you no longer should live the rest of your time in the flesh for the lusts of men, but for the will of God.", 0], [4, 3, "For we have spent enough of our past time doing the desire of the Gentiles, and having walked in lewdness, lusts, drunken binges, orgies, carousings, and abominable idolatries.", 0], [4, 4, "They think it is strange that you don’t run with them into the same excess of riot, blaspheming.", 0], [4, 5, "They will give account to him who is ready to judge the living and the dead.", 0], [4, 6, "For to this end the Good News was preached even to the dead, that they might ator.", 0]]}]}, {"sel": 0, "segs": [{"ref": "1 Peter 5:1–14", "v": [[5, 1, "Therefore I exhort the elders among you, as a fellow elder, and a witness of the sufferings of Christ, and who will also share in the glory that will be revealed.", 1], [5, 2, "Shepherd the flock of God which is among you, exercising the oversight, not under compulsion, but voluntarily, not for dishonest gain, but willingly;", 0], [5, 3, "not as lording it over those entrusted to you, but making yourselves examples to the flock.", 0], [5, 4, "When the chief Shepherd is revealed, you will receive the crown of glory that doesn’t fade away.", 0], [5, 5, "Likewise, you younger ones, be subject to the elder. Yes, all of you clothe yourselves with humility, to subject yourselves to one another; for “God resists the proud, but gives grace to the humble.”", 1], [5, 6, "Humble yourselves therefore under the mighty hand of God, that he may exalt you in due time,", 0], [5, 7, "casting all your worries on him, because he cares for you.", 0], [5, 8, "Be sober and self-controlled. Be watchful. Your adversary, the devil, walks around like a roaring lion, seeking whom he may devour.", 1], [5, 9, "Withstand him steadfast in your faith, knowing that your brothers who are in the world are undergoing the same sufferings.", 0], [5, 10, "But may the God of all grace, who called you to his eternal glory by Christ Jesus, after you have suffered a little while, perfect, establish, strengthen, and settle you.", 0], [5, 11, "To him be the glory and the power forever and ever. Amen.", 0], [5, 12, "Through Silvanus, our faithful brother, as I consider him, I have written to you briefly, exhorting, and testifying that this is the true grace of God in which you stand.", 1], [5, 13, "She who is in Babylon, chosen together with you, greets you. So does Mark, my son.", 0], [5, 14, "Greet one another with a kiss of love. Peace be to all of you who are in Christ Jesus. Amen.", 0]]}]}], "philippians": [{"sel": 0, "segs": [{"ref": "Philippians 1:1–11", "v": [[1, 1, "Paul and Timothy, servants of Jesus Christ; To all the saints in Christ Jesus who are at Philippi, with the overseers and servants:", 1], [1, 2, "Grace to you, and peace from God our Father and the Lord Jesus Christ.", 0], [1, 3, "I thank my God whenever I remember you,", 0], [1, 4, "always in every request of mine on behalf of you all, making my requests with joy,", 0], [1, 5, "for your partnership in furtherance of the Good News from the first day until now;", 0], [1, 6, "being confident of this very thing, that he who began a good work in you will complete it until the day of Jesus Christ.", 0], [1, 7, "It is even right for me to think this way on behalf of all of you, because I have you in my heart, because both in my bonds and in the defense and confirmation of the Good News, you all are partakers with me of grace.", 0], [1, 8, "For God is my witness, how I long after all of you in the tender mercies of Christ Jesus.", 0], [1, 9, "This I pray, that your love may abound yet more and more in knowledge and all discernment,", 1], [1, 10, "so that you may approve the things that are excellent, that you may be sincere and without offense to the day of Christ,", 0], [1, 11, "being filled with the fruits of righteousness, which are through Jesus Christ, to the glory and praise of God.", 0]]}]}, {"sel": 0, "segs": [{"ref": "Philippians 1:12–30", "v": [[1, 12, "Now I desire to have you know, brothers, that the things which happened to me have turned out rather to the progress of the Good News,", 1], [1, 13, "so that it became evident to the whole palace guard, and to all the rest, that my bonds are in Christ,", 0], [1, 14, "and that most of the brothers in the Lord, being confident through my bonds, are more abundantly bold to speak the word of God without fear.", 0], [1, 15, "Some indeed preach Christ even out of envy and strife, and some also out of good will.", 0], [1, 16, "The former insincerely preach Christ from selfish ambition, thinking that they add affliction to my chains;", 0], [1, 17, "but the latter out of love, knowing that I am appointed for the defense of the Good News.", 0], [1, 18, "What does it matter? Only that in every way, whether in pretense or in truth, Christ is proclaimed. I rejoice in this, yes, and will rejoice.", 1], [1, 19, "For I know that this will turn out to my salvation, through your prayers and the supply of the Spirit of Jesus Christ,", 0], [1, 20, "according to my earnest expectation and hope, that I will in no way be disappointed, but with all boldness, as always, now also Christ will be magnified in my body, whether by life or by death.", 0], [1, 21, "For to me to live is Christ, and to die is gain.", 0], [1, 22, "But if I live on in the flesh, this will bring fruit from my work; yet I don’t know what I will choose.", 0], [1, 23, "But I am hard pressed between the two, having the desire to depart and be with Christ, which is far better.", 0], [1, 24, "Yet to remain in the flesh is more needful for your sake.", 0], [1, 25, "Having this confidence, I know that I will remain, yes, and remain with you all for your progress and joy in the faith,", 0], [1, 26, "that your rejoicing may abound in Christ Jesus in me through my presence with you again.", 0], [1, 27, "Only let your way of life be worthy of the Good News of Christ, that whether I come and see you or am absent, I may hear of your state, that you stand firm in one spirit, with one soul striving for the faith of the Good News;", 1], [1, 28, "and in nothing frightened by the adversaries, which is for them a proof of destruction, but to you of salvation, and that from God.", 0], [1, 29, "Because it has been granted to you on behalf of Christ, not only to believe in him, but also to suffer on his behalf,", 0], [1, 30, "having the same conflict which you saw in me and now hear is in me.", 0]]}]}, {"sel": 0, "segs": [{"ref": "Philippians 2:1–11", "v": [[2, 1, "If therefore there is any exhortation in Christ f your faith, I rejoice, and rejoice with you all.", 0], [2, 18, "In the same way, you also rejoice, and rejoice with me.", 0], [2, 19, "But I hope in the Lord Jesus to send Timothy to you soon, that I also may be cheered up when I know how you are doing.", 1], [2, 20, "For I have no one else like-minded, who will truly care about you.", 0], [2, 21, "For they all seek their own, not the things of Jesus Christ.", 0], [2, 22, "But you know the proof of him, that as a child serves a father, so he served with me in furtherance of the Good News.", 0], [2, 23, "Therefore I hope to send him at once, as soon as I see how it will go with me.", 0], [2, 24, "But I trust in the Lord that I myself also will come shortly.", 0], [2, 25, "But I counted it necessary to send to you Epaphroditus, my brother, fellow worker, fellow soldier, and your apostle and servant of my need,", 0], [2, 26, "since he longed for you all, and was very troubled because you had heard that he was sick.", 0], [2, 27, "For indeed he was sick, nearly to death, but God had mercy on him, and not on him only, but on me also, that I might not have sorrow on sorrow.", 0], [2, 28, "I have sent him therefore the more diligently, that when you see him again, you may rejoice, and that I may be the less sorrowful.", 0], [2, 29, "Receive him therefore in the Lord with all joy, and hold such people in honor,", 0], [2, 30, "because for the work of Christ he came near to death, risking his life to supply that which was lacking in your service toward me.", 0]]}]}, {"sel": 0, "segs": [{"ref": "Philippians 3:1–11", "v": [[3, 1, "Finally, my brothers, rejoice in the Lord! To write the same things to you, to me indeed is not tiresome, but for you it is safe.", 1], [3, 2, "Beware of the dogs; beware of the evil workers; beware of the false circumcision.", 0], [3, 3, "For we are the circumcision, who worship God in the Spirit, and rejoice in Christ Jesus, and have no confidence in the flesh;", 0], [3, 4, "though I myself might function anchor(size,color,stroke){
  color=color||"#2A8C8C";stroke=stroke||2;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.4"/><line x1="12" y1="7.4" x2="12" y2="21"/><line x1="7" y1="11" x2="17" y2="11"/><path d="M4 15c0 4 3.6 6 8 6s8-2 8-6"/></svg>';
}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

let route={view:"home"};
function go(r){route=r;render();window.scrollTo(0,0);}

function header(){
  var back = route.view!=="home" ? '<span class="back eyebrow" onclick="go({view:\'home\'})">← All Studies</span>' : '';
  return '<header><div class="hbar"><div class="logo" onclick="go({view:\'home\'})">'+anchor(23,"#3FB0AE")+'<span class="disp">ANCHORED</span></div><span class="htag eyebrow">Men\'s Curriculum</span>'+back+'</div></header>';
}
function footer(){return '<footer>'+anchor(20,"#8EA6AA")+'<div class="eyebrow">Anchored Steps · True Balance</div></footer>';}

function home(){
  var chips = LENSES.map(function(l,i){return '<div class="lens-chip"><span class="num">'+(i+1)+'</span><span style="font-weight:600">'+l[0]+'</span><span class="d">· '+l[1]+'</span></div>';}).join("");
  var cards = TRACKS.map(function(t){
    return '<div class="tcard" style="border-top-color:'+t.accent+'" onclick="go({view:\'track\',tid:\''+t.id+'\'})">'
      +'<div class="row"><div class="eyebrow" style="color:'+t.accent+'">'+esc(t.book)+' · '+t.weeks+' weeks</div>'
      +'<span class="badge" style="background:'+t.accent+'">Ready</span></div>'
      +'<h3 class="disp">'+esc(t.title)+'</h3><div class="sub disp">'+esc(t.subtitle)+'</div>'
      +'<div class="blurb">'+esc(t.blurb)+'</div>'
      +'<div class="go" style="color:'+t.accent+'">Open study →</div></div>';
  }).join("");
  return '<section class="hero"><div class="hero-ghost">'+anchor(320,"#ffffff",1)+'</div>'
    +'<div class="wrap hero-in"><div class="eyebrow" style="color:#3FB0AE;margin-bottom:16px">Expository study · built for ages 25–77</div>'
    +'<h1 class="disp">Open the text.<br>Let it forge men.</h1>'
    +'<p>One method, many books. Every study runs the same five lenses — so a room of mixed ages goes deep together, and every man leaves with something to do.</p>'
    +'<div class="lens-strip">'+chips+'</div></div></section>'
    +'<section class="sec"><div class="wrap"><div class="sec-head"><span class="eyebrow">The Library</span><h2 class="disp">Studies</h2><span class="note">Eight books. More can be added.</span></div>'
    +'<div class="grid">'+cards+'</div>'
    +'<div class="note-box">'+anchor(26,"#8EA6AA")+'<div><strong style="color:var(--ink)">Add a book:</strong> every study is one data object in the same shape. Author the sessions, drop it in the library, and it inherits the whole method — lenses, mixed-age prompts, and the Forge.</div></div>'
    +'</div></section>';
}

function track(){
  var t=TRACKS.find(function(x){return x.id===route.tid;});
  var rows=t.sessions.map(function(s,i){
    return '<div class="wrow" onclick="go({view:\'session\',tid:\''+t.id+'\',idx:'+i+'})">'
      +'<div class="wnum">'+String(s.n).padStart(2,"0")+'</div>'
      +'<div style="flex:1"><div><span class="wt">'+esc(s.title)+'</span><span class="wp" style="color:'+t.accent+'">'+esc(t.book)+' '+esc(s.passage)+'</span></div>'
      +'<div class="wtheme">'+esc(s.theme)+'</div></div>'
      +'<div class="arrow" style="color:'+t.accent+'">→</div></div>';
  }).join("");
  return '<section class="thero"><div class="wrap-narrow thero-in"><div class="eyebrow">'+esc(t.book)+' · '+t.weeks+' weeks · expository</div>'
    +'<h1 class="disp">'+esc(t.title)+'</h1><div class="sub disp">'+esc(t.subtitle)+'</div><p>'+esc(t.blurb)+'</p></div></section>'
    +'<section><div class="wrap-narrow"><div class="wlist">'+rows+'</div></div></section>';
}

function paras(txt){
  return String(txt).split(/\n\n+/).map(function(p){return '<p>'+esc(p)+'</p>';}).join("");
}
function boldLead(txt){
  // convert **...** to <strong>...</strong> after escaping
  return esc(txt).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
}
function fCulture(f){
  if(!f) return "";
  return '<div class="fpart"><div class="eyebrow flabel" style="color:var(--slate)">Cultural Context</div><div class="fbody">'+paras(f.culture)+'</div></div>';
}
function fInventory(f){
  if(!f) return "";
  var prompts = (f.inventory.prompts||[]).map(function(p){return '<li>'+esc(p)+'</li>';}).join("");
  return '<div class="fpart"><div class="eyebrow flabel" style="color:var(--gold)">The Inventory</div>'
    + '<div class="finv"><div class="flead">'+boldLead(f.inventory.lead)+'</div>'
    + (prompts?'<ul class="fprompts">'+prompts+'</ul>':'')
    + '<div class="fland">'+esc(f.inventory.land)+'</div></div></div>';
}
function fStep(f){
  if(!f) return "";
  return '<div class="fpart" style="margin-top:26px"><div class="eyebrow flabel" style="color:var(--tealLight)">Anchored Step</div>'
    + '<div class="fstep"><div class="fmile">'+anchor(16,"#5FC8C6")+'<span class="disp">'+esc(f.step.milestone)+'</span></div>'
    + '<div class="fstepbody">'+esc(f.step.body)+'</div></div></div>';
}
function fPrayer(f){
  if(!f) return "";
  return '<div class="fpart" style="margin-top:22px"><div class="eyebrow flabel fplabel">Prayer</div>'
    + '<div class="fpray"><div class="fpraytext">'+esc(f.prayer)+'</div></div></div>';
}

function session(){
  var t=TRACKS.find(function(x){return x.id===route.tid;});
  var s=t.sessions[route.idx]; var total=t.sessions.length;
  var words=s.words.map(function(w){
    return '<div class="wordcard"><div class="top"><bdi class="gk">'+esc(w.greek)+'</bdi> <span class="tl">('+esc(w.translit)+')</span> <span class="gl">&#8212; '+esc(w.gloss)+'</span></div><div class="nt">'+esc(w.note)+'</div></div>';
  }).join("");
  var qs=s.questions.map(function(q,i){return '<li><span class="qn">'+(i+1)+'</span><span class="qt">'+esc(q)+'</span></li>';}).join("");
  var prevD=route.idx===0?"disabled":""; var nextD=route.idx===total-1?"disabled":"";
  return '<section class="shero"><div class="wrap-narrow shero-in"><div class="eyebrow">'+esc(t.title)+' · Week '+s.n+' of '+total+' · '+esc(t.book)+' '+esc(s.passage)+'</div>'
    +'<h1 class="disp">'+esc(s.title)+'</h1><div class="stheme disp">'+esc(s.theme)+'</div></div></section>'
    +'<section class="sbody"><div class="wrap-narrow">'
    +scriptureBlock()
    +'<div class="block"><div class="eyebrow lbl" style="color:var(--teal)">① Context</div><div class="body">'+esc(s.context)+'</div></div>'
    +'<div class="block"><div class="eyebrow lbl" style="color:var(--teal)">② Text — what the passage says</div><div class="body">'+esc(s.text)+'</div></div>'
    +'<div class="block"><div class="eyebrow lbl" style="color:var(--gold)">③ Language — words worth knowing</div><div class="words">'+words+'</div></div>'
    +'<div class="block"><div class="eyebrow lbl" style="color:var(--teal)">④ Thread — where Christ is</div><div class="body">'+esc(s.thread)+'</div></div>'
    +'<div class="formation">'+fCulture(s.formation)+fInventory(s.formation)+'</div>'
    +'<div class="eyebrow" style="color:var(--tealLight);margin:30px 0 10px">The Table — discussion</div>'
    +'<div class="prompt elder"><span class="plbl">Elder Wisdom&nbsp;&nbsp;</span><span class="ptext">'+esc(s.elder)+'</span></div>'
    +'<div class="prompt first"><span class="plbl">First Steps&nbsp;&nbsp;</span><span class="ptext">'+esc(s.first)+'</span></div>'
    +'<div class="qhead">For the table:</div><ol class="qlist">'+qs+'</ol>'
    +fStep(s.formation)
    +'<div class="forge">'+anchor(28,"#3FB0AE")+'<div><div class="eyebrow flbl">The Forge · this week</div><div class="ftext">'+esc(s.forge)+'</div></div></div>'
    +fPrayer(s.formation)
    +'<div class="snav"><button class="nbtn" '+prevD+' onclick="go({view:\'session\',tid:\''+t.id+'\',idx:'+(route.idx-1)+'})">← Previous</button>'
    +'<button class="nbtn primary" '+nextD+' onclick="go({view:\'session\',tid:\''+t.id+'\',idx:'+(route.idx+1)+'})">Next →</button></div>'
    +'</div></section>';
}

/* ---------- Scripture reader / walkthrough ---------- */
function scrData(){
  var rec=(SCRIPTURE[route.tid]||[])[route.idx];
  return rec||null;
}
function scrFlat(rec){
  var flat=[]; rec.segs.forEach(function(g,gi){ g.v.forEach(function(v,vi){ flat.push([gi,vi]); }); });
  return flat;
}
function scrVerseHTML(v, cls, idx, first){
  var lines=String(v[2]).split("\n");
  var label = (v[1]===1 && !first) ? v[0]+':'+v[1] : String(v[1]);
  var sup='<sup>'+label+'</sup>';
  var body = lines.length>1
    ? lines.map(function(l,k){return '<span class="ln">'+(k===0?sup:'')+esc(l)+'</span>';}).join("")
    : sup+esc(v[2]);
  var attrs = idx===undefined ? '' : ' data-i="'+idx+'" onclick="scrJump('+idx+')"';
  return '<span class="v'+(lines.length>1?' poet':'')+(cls?' '+cls:'')+'"'+attrs+'>'+body+' </span>';
}
function scriptureBlock(){
  var t=TRACKS.find(function(x){return x.id===route.tid;});
  var s=t.sessions[route.idx];
  var rec=scrData(); if(!rec) return '';
  if(!route.scr) route.scr={mode:"read",i:0};
  var st=route.scr, flat=scrFlat(rec), walk=st.mode==="walk";
  var multi=rec.segs.length>1;
  var segsHTML="", n=0;
  rec.segs.forEach(function(g,gi){
    var paras=[], cur="";
    g.v.forEach(function(v,vi){
      var idx=n++;
      var cls="";
      if(walk) cls = idx===st.i ? "cur" : (idx<st.i ? "done" : "dim");
      if(v[3] && cur){ paras.push(cur); cur=""; }
      cur += scrVerseHTML(v, cls, walk ? idx : undefined, vi===0);
    });
    if(cur) paras.push(cur);
    segsHTML += '<div class="scr-seg">'
      + (multi||rec.sel ? '<div class="scr-ref">'+esc(g.ref)+'</div>' : '')
      + '<div class="scr-text">'+paras.map(function(p){return '<p>'+p+'</p>';}).join("")+'</div></div>';
  });
  // chapter context for multi-chapter passages: show chapter number when it changes
  var pct = flat.length>1 ? Math.round((st.i)/(flat.length-1)*100) : 100;
  var cv = flat[st.i]; var cvv = rec.segs[cv[0]].v[cv[1]];
  var nav = walk
    ? '<div class="scr-nav"><button class="nbtn" onclick="scrStep(-1)" '+(st.i===0?'disabled':'')+'>← Back</button>'
      +'<div class="prog"><i style="width:'+pct+'%"></i></div>'
      +'<div class="cnt">'+cvv[0]+':'+cvv[1]+'</div>'
      +'<button class="nbtn primary" onclick="scrStep(1)" '+(st.i===flat.length-1?'disabled':'')+'>Next →</button></div>'
    : '';
  var words = (s.words||[]).map(function(w){
    return '<span class="wc"><bdi>'+esc(w.greek)+'</bdi>'+esc(w.gloss)+'</span>';
  }).join("");
  var selNote = rec.sel ? '<div class="scr-sel">Selected passages from '+esc(t.book)+' '+esc(s.passage.replace(/ \(.*\)/,""))+' — the full section is long, so these are the key moments the session draws on.</div>' : '';
  return '<div class="scr'+(walk?' scr-walk':'')+'" id="scr">'
    +'<div class="scr-top"><div class="eyebrow" style="color:var(--gold)">Scripture · read it first</div>'
    +'<div class="seg-toggle"><button class="'+(walk?'':'on')+'" onclick="scrMode(\'read\')">Read</button>'
    +'<button class="'+(walk?'on':'')+'" onclick="scrMode(\'walk\')">Verse by verse</button></div></div>'
    +'<div class="scr-title disp">'+esc(t.book)+' '+esc(s.passage)+'</div>'
    +'<div class="scr-sub">'+(walk?'Tap Next (or the → key) to move one verse at a time. Tap any verse to jump to it.':'Read the whole passage aloud together before the five lenses.')+'</div>'
    + selNote + segsHTML + nav
    + (walk && words ? '<div class="scr-words"><span class="wl">Words to watch for</span>'+words+'</div>' : '')
    +'<div class="scr-foot">'+esc(SCRIPTURE_VERSION.name)+' ('+esc(SCRIPTURE_VERSION.abbr)+') · '+esc(SCRIPTURE_VERSION.note)+'</div>'
    +'</div>';
}
function scrRefresh(scroll){
  var el=document.getElementById("scr"); if(!el) return;
  el.outerHTML=scriptureBlock();
  if(scroll){ var c=document.querySelector("#scr .v.cur"); if(c) c.scrollIntoView({block:"center",behavior:"smooth"}); }
}
function scrMode(m){ route.scr={mode:m,i:0}; scrRefresh(false); }
function scrStep(d){
  var rec=scrData(); if(!rec||!route.scr||route.scr.mode!=="walk") return;
  var max=scrFlat(rec).length-1;
  route.scr.i=Math.max(0,Math.min(max,route.scr.i+d)); scrRefresh(true);
}
function scrJump(i){ if(route.scr&&route.scr.mode==="walk"){ route.scr.i=i; scrRefresh(false); } }
document.addEventListener("keydown",function(e){
  if(route.view!=="session"||!route.scr||route.scr.mode!=="walk") return;
  if(e.key==="ArrowRight"){ e.preventDefault(); scrStep(1); }
  else if(e.key==="ArrowLeft"){ e.preventDefault(); scrStep(-1); }
});

function render(){
  var body="";
  if(route.view==="home")body=home();
  else if(route.view==="track")body=track();
  else if(route.view==="session")body=session();
  document.getElementById("app").innerHTML=header()+body+footer();
}
render();
</script>
</body>
</html>
