ing had sent captains of the army and horsemen with me.", 0], [2, 10, "When Sanballat the Horonite, and Tobiah the servant, the Ammonite, heard of it, it grieved them exceedingly, because a man had come to seek the welfare of the children of Israel.", 0], [2, 11, "So I came to Jerusalem, and was there three days.", 0], [2, 12, "I arose in the night, I and a few men with me. I didn’t tell anyone what my God put into my heart to do for Jerusalem. There wasn’t any animal with me, except the animal that I rode on.", 0], [2, 13, "I went out by night by the valley gate, even toward the jackal’s well, then to the dung gate, and inspected the walls of Jerusalem, which were broken down, and its gates were consumed with fire.", 0], [2, 14, "Then I went on to the spring gate and to the king’s pool, but there was no place for the animal that was under me to pass.", 0], [2, 15, "Then I went up in the night by the brook, and inspected the wall; and I turned back, and entered by the valley gate, and so returned.", 0], [2, 16, "The rulers didn’t know where I went, or what I did. I had not as yet told it to the Jews, nor to the priests, nor to the nobles, nor to the rulers, nor to the rest who did the work.", 0], [2, 17, "Then I said to them, “You see the bad situation that we are in, how Jerusalem lies waste, and its gates are burned with fire. Come, let’s build up the wall of Jerusalem, that we won’t be disgraced.”", 1], [2, 18, "I told them of the hand of my God which was good on me, as also of the king’s words that he had spoken to me. They said, “Let’s rise up and build.” So they strengthened their hands for the good work.", 0], [2, 19, "But when Sanballat the Horonite, Tobiah the Ammonite servant, and Geshem the Arabian, heard it, they ridiculed us, and despised us, and said, “What is this thing that you are doing? Will you rebel against the king?”", 1], [2, 20, "Then I answered them, and said to them, “The God of heaven will prosper us. Therefore we, his servants, will arise and build; but you have no portion, nor right, nor memorial, in Jerusalem.”", 1]]}]}, {"sel": 0, "segs": [{"ref": "Nehemiah 3:1–32", "v": [[3, 1, "Then Eliashib the high priest rose up with his brothers the priests, and they built the sheep gate. They sanctified it, and set up its doors. They sanctified it even to the tower of Hammeah, to the tower of Hananel.", 1], [3, 2, "Next to him the men of Jericho built. Next to them Zaccur the son of Imri built.", 0], [3, 3, "The sons of Hassenaah built the fish gate. They laid its beams, and set up its doors, its bolts, and its bars.", 1], [3, 4, "Next to them, Meremoth the son of Uriah, the son of Hakkoz made repairs. Next to them, Meshullam the son of Berechiah, the son of Meshezabel made repairs. Next to them, Zadok the son of Baana made repairs.", 0], [3, 5, "Next to them, the Tekoites made repairs; but their nobles didn’t put their necks to the Lord’s work.", 0], [3, 6, "Joiada the son of Paseah and Meshullam the son of Besodeiah repaired the old gate. They laid its beams, and set up its doors, and its bolts, and its bars.", 1], [3, 7, "Next to them, Melatiah the Gibeonite, and Jadon the Meronothite, the men of Gibeon and of Mizpah, repaired the residence of the governor beyond the River.", 0], [3, 8, "Next to him, Uzziel the son of Harhaiah, goldsmiths, made repairs. Next to him, Hananiah, one of the perfumers, made repairs, and they fortified Jerusalem even to the wide wall.", 0], [3, 9, "Next to them, Rephaiah the son of Hur, the ruler of half the district of Jerusalem, made repairs.", 0], [3, 10, "Next to them, Jedaiah the son of Harumaph made repairs across from his house. Next to him, Hattush the son of Hashabneiah made repairs.", 0], [3, 11, "Malchijah the son of Harim, and Hasshub the son of Pahathmoab, repaired another portion, and the tower of the furnaces.", 0], [3, 12, "Next to him, Shallum the son of Hallohesh, the ruler of half the district of Jerusalem, he and his daughters, made repairs.", 0], [3, 13, "Hanun and the inhabitants of Zanoah repaired the valley gate. They built it, and set up its doors, its bolts, and its bars, and one thousand cubits of the wall to the dung gate.", 1], [3, 14, "Malchijah the son of Rechab, the ruler of the district of Beth Haccherem repaired the dung gate. He built it, and set up its doors, its bolts, and its bars.", 1], [3, 15, "Shallun the son of Colhozeh, the ruler of the district of Mizpah repaired the spring gate. He built it, and covered it, and set up its doors, its bolts, and its bars, and the wall of the pool of Shelah by the king’s garden, even to the stairs that go down from David’s city.", 1], [3, 16, "After him, Nehemiah the son of Azbuk, the ruler of half the district of Beth Zur, made repairs to the place opposite the tombs of David, and to the pool that was made, and to the house of the mighty men.", 0], [3, 17, "After him, the Levites, Rehum the son of Bani made repairs. Next to him, Hashabiah, the ruler of half the district of Keilah, made repairs for his district.", 0], [3, 18, "After him, their brothers, Bavvai the son of Henadad, the ruler of half the district of Keilah made repairs.", 0], [3, 19, "Next to him, Ezer the son of Jeshua, the ruler of Mizpah, repaired another portion, across from the ascent to the armory at the turning of the wall.", 0], [3, 20, "After him, Baruch the son of Zabbai earnestly repaired another portion, from the turning of the wall to the door of the house of Eliashib the high priest.", 0], [3, 21, "After him, Meremoth the son of Uriah the son of Hakkoz repaired another portion, from the door of the house of Eliashib even to the end of the house of Eliashib.", 0], [3, 22, "After him, the priests, the men of the Plain made repairs.", 0], [3, 23, "After them, Benjamin and Hasshub made repairs across from their house. After them, Azariah the son of Maaseiah the son of Ananiah made repairs beside his own house.", 0], [3, 24, "After him, Binnui the son of Henadad repaired another portion, from the house of Azariah to the turning of the wall, and to the corner.", 0], [3, 25, "Palal the son of Uzai made repairs opposite the turning of the wall, and the tower that stands out from the upper house of the king, which is by the court of the guard. After him Pedaiah the son of Parosh made repairs.", 0], [3, 26, "(Now the temple servants lived in Ophel, to the place opposite the water gate toward the east, and the tower that stands out.)", 0], [3, 27, "After him the Tekoites repaired another portion, opposite the great tower that stands out, and to the wall of Ophel.", 0], [3, 28, "Above the horse gate, the priests made repairs, everyone across from his own house.", 1], [3, 29, "After them, Zadok the son of Immer made repairs across from his own house. After him, Shemaiah the son of Shecaniah, the keeper of the east gate made repairs.", 0], [3, 30, "After him, Hananiah the son of Shelemiah, and Hanun the sixth son of Zalaph, repaired another portion. After him, Meshullam the son of Berechiah made repairs across from his room.", 0], [3, 31, "After him, Malchijah, one of the goldsmiths to the house of the temple servants, and of the merchants, made repairs opposite the gate of Hammiphkad, and to the ascent of the corner.", 0], [3, 32, "Between the ascent of the corner and the sheep gate, the goldsmiths and the merchants made repairs.", 0]]}]}, {"sel": 0, "segs": [{"ref": "Nehemiah 4:1–23", "v": [[4, 1, "But when Sanballat heard that we were building the wall, he was angry, and was very indignant, and mocked the Jews.", 1], [4, 2, "He spoke before his brothers and the army of Samaria, and said, “What are these feeble Jews doing? Will they fortify themselves? Will they sacrifice? Will they finish in a day? Will they revive the stones out of the heaps of rubbish, since they are burned?”", 0], [4, 3, "Now Tobiah the Ammonite was by him, and he said, “What they are building, if a fox climbed up it, he would break down their stone wall.”", 1], [4, 4, "“Hear, our God; for we are despised. Turn back their reproach on their own head. Give them up for a plunder in a land of captivity.", 1], [4, 5, "Don’t cover their iniquity. Don’t let their sin be blotted out from before you; for they have insulted the builders.”", 0], [4, 6, "So we built the wall; and all the wall was joined together to half its height: for the people had a mind to work.", 1], [4, 7, "But when Sanballat, Tobiah, the Arabians, the Ammonites, and the Ashdodites heard that the repairing of the walls of Jerusalem went forward, and that the breaches began to be filled, they were very angry;", 1], [4, 8, "and they all conspired together to come and fight against Jerusalem, and to cause confusion among us.", 0], [4, 9, "But we made our prayer to our God, and set a watch against them day and night because of them.", 0], [4, 10, "Judah said, “The strength of the bearers of burdens is fading, and there is much rubble; so that we are not able to build the wall.”", 0], [4, 11, "Our adversaries said, “They will not know or see, until we come in among them and kill them, and cause the work to cease.”", 0], [4, 12, "When the Jews who lived by them came, they said to us ten times from all places, “Wherever you turn, they will attack us.”", 1], [4, 13, "Therefore I set guards in the lowest parts of the space behind the wall, in the open places. I set the people by family groups with their swords, their spears, and their bows.", 1], [4, 14, "I looked, and rose up, and said to the nobles, to the rulers, and to the rest of the people, “Don’t be afraid of them! Remember the Lord, who is great and awesome, and fight for your brothers, your sons, your daughters, your wives, and your houses.”", 0], [4, 15, "When our enemies heard that it was known to us, and God had brought their counsel to nothing, all of us returned to the wall, everyone to his work.", 1], [4, 16, "From that time forth, half of my servants did the work, and half of them held the spears, the shields, the bows, and the coats of mail; and the rulers were behind all the house of Judah.", 0], [4, 17, "Those who built the wall, and those who bore burdens loaded themselves; everyone with one of his hands did the work, and with the other held his weapon.", 0], [4, 18, "Among the builders, everyone wore his sword at his side, and so built. He who sounded the trumpet was by me.", 0], [4, 19, "I said to the nobles, and to the rulers and to the rest of the people, “The work is great and large, and we are separated on the wall, far from one another.", 0], [4, 20, "Wherever you hear the sound of the trumpet, rally there to us. Our God will fight for us.”", 0], [4, 21, "So we did the work. Half of the people held the spears from the rising of the morning until the stars appeared.", 1], [4, 22, "Likewise at the same time I said to the people, “Let everyone with his servant lodge within Jerusalem, that in the night they may be a guard to us, and may labor in the day.”", 0], [4, 23, "So neither I, nor my brothers, nor my servants, nor the men of the guard who followed me, none of us took off our clothes. Everyone took his weapon to the water.", 0]]}]}, {"sel": 0, "segs": [{"ref": "Nehemiah 5:1–19", "v": [[5, 1, "Then there arose a great cry of the people and of their wives against their brothers the Jews.", 1], [5, 2, "For there were some who said, “We, our sons and our daughters, are many. Let us get grain, that we may eat and live.”", 0], [5, 3, "There were also some who said, “We are mortgaging our fields, our vineyards, and our houses. Let us get grain, because of the famine.”", 0], [5, 4, "There were also some who said, “We have borrowed money for the king’s tribute using our fields and our vineyards as collateral.", 0], [5, 5, "Yet now our flesh is as the flesh of our brothers, our children as their children. Behold, we bring our sons and our daughters into bondage to be servants, and some of our daughters have been brought into bondage. It is also not in our power to help it, because other men have our fields and our vineyards.”", 0], [5, 6, "I was very angry when I heard their cry and these words.", 1], [5, 7, "Then I consulted with myself, and contended with the nobles and the rulers, and said to them, “You exact usury, everyone of his brother.” I held a great assembly against them.", 0], [5, 8, "I said to them, “We, after our ability, have redeemed our brothers the Jews that were sold to the nations; and would you even sell your brothers, and should they be sold to us?” Then they held their peace, and found not a word to say.", 0], [5, 9, "Also I said, “The thing that you do is not good. Shouldn’t you walk in the fear of our God, because of the reproach of the nations our enemies?", 0], [5, 10, "I likewise, my brothers and my servants, lend them money and grain. Please let us stop this usury.", 0], [5, 11, "Please restore to them, even today, their fields, their vineyards, their olive groves, and their houses, also the hundredth part of the money, and of the grain, the new wine, and the oil, that you are charging them.”", 0], [5, 12, "Then they said, “We will restore them, and will require nothing of them. We will do so, even as you say.” Then I called the priests, and took an oath of them, that they would do according to this promise.", 1], [5, 13, "Also I shook out my lap, and said, “So may God shake out every man from his house, and from his labor, that doesn’t perform this promise; even may he be shaken out and emptied like this.” All the assembly said, “Amen,” and praised Yahweh. The people did according to this promise.", 0], [5, 14, "Moreover from the time that I was appointed to be their governor in the land of Judah, from the twentieth year even to the thirty-second year of Artaxerxes the king, that is, twelve years, I and my brothers have not eaten the bread of the governor.", 1], [5, 15, "But the former governors who were before me were supported by the people, and took bread and wine from them, plus forty shekels of silver; yes, even their servants ruled over the people; but I didn’t do so, because of the fear of God.", 0], [5, 16, "Yes, I also continued in the work of this wall. We didn’t buy any land. All my servants were gathered there to the work.", 0], [5, 17, "Moreover there were at my table, of the Jews and the rulers, one hundred fifty men, in addition to those who came to us from among the nations that were around us.", 0], [5, 18, "Now that which was prepared for one day was one ox and six choice sheep. Also fowls were prepared for me, and once in ten days a store of all sorts of wine. Yet for all this, I didn’t demand the governor’s pay, because the bondage was heavy on this people.", 0], [5, 19, "Remember me, my God, for good, all that I have done for this people.", 0]]}]}, {"sel": 0, "segs": [{"ref": "Nehemiah 6:1–19", "v": [[6, 1, "Now when it was reported to Sanballat, Tobiah, and to Geshem the Arabian, and to the rest of our enemies, that I had built the wall, and that there was no breach left in it (though even to that time I had not set up the doors in the gates)", 1], [6, 2, "Sanballat and Geshem sent to me, saying, “Come! Let’s meet together in the villages in the plain of Ono.” But they intended to harm me.", 0], [6, 3, "I sent messengers to them, saying, “I am doing a great work, so that I can’t come down. Why should the work cease, while I leave it, and come down to you?”", 1], [6, 4, "They sent to me four times like this; and I answered them the same way.", 0], [6, 5, "Then Sanballat sent his servant to me the same way the fifth time with an open letter in his hand,", 0], [6, 6, "in which was written, “It is reported among the nations, and Gashmu says it, that you and the Jews intend to rebel. Because of that, you are building the wall. You would be their king, according to these words.", 0], [6, 7, "You have also appointed prophets to proclaim of you at Jerusalem, saying, ‘There is a king in Judah!’ Now it will be reported to the king according to these words. Come now therefore, and let’s take counsel together.”", 0], [6, 8, "Then I sent to him, saying, “There are no such things done as you say, but you imagine them out of your own heart.”", 1], [6, 9, "For they all would have made us afraid, saying, “Their hands will be weakened from the work, that it not be done.” But now, strengthen my hands.", 0], [6, 10, "I went to the house of Shemaiah the son of Delaiah the son of Mehetabel, who was shut in at his home; and he said, “Let us meet together in God’s house, within the temple, and let’s shut the doors of the temple; for they will come to kill you. Yes, in the night they will come to kill you.”", 1], [6, 11, "I said, “Should a man like me flee? Who is there that, being such as I, would go into the temple to save his life? I will not go in.”", 1], [6, 12, "I discerned, and behold, God had not sent him; but he pronounced this prophecy against me. Tobiah and Sanballat had hired him.", 0], [6, 13, "He hired so that I would be afraid, do so, and sin, and that they might have material for an evil report, that they might reproach me.", 0], [6, 14, "“Remember, my God, Tobiah and Sanballat according to these their works, and also the prophetess Noadiah, and the rest of the prophets, that would have put me in fear.”", 0], [6, 15, "So the wall was finished in the twenty-fifth day of Elul, in fifty-two days.", 1], [6, 16, "When all our enemies heard of it, all the nations that were around us were afraid, and they lost their confidence; for they perceived that this work was done by our God.", 0], [6, 17, "Moreover in those days the nobles of Judah sent many letters to Tobiah, and Tobiah’s letters came to them.", 0], [6, 18, "For there were many in Judah sworn to him, because he was the son-in-law of Shecaniah the son of Arah; and his son Jehohanan had taken the daughter of Meshullam the son of Berechiah as wife.", 0], [6, 19, "Also they spoke of his good deeds before me, and reported my words to him. Tobiah sent letters to put me in fear.", 0]]}]}, {"sel": 0, "segs": [{"ref": "Nehemiah 8:1–18", "v": [[8, 1, "All the people gathered themselves together as one man into the wide place that was in front of the water gate; and they spoke to Ezra the scribe to bring the book of the law of Moses, which Yahweh had commanded to Israel.", 1], [8, 2, "Ezra the priest brought the law before the assembly, both men and women, and all who could hear with understanding, on the first day of the seventh month.", 0], [8, 3, "He read from it before the wide place that was in front of the water gate from early morning until midday, in the presence of the men and the women, and of those who could understand. The ears of all the people were attentive to the book of the law.", 0], [8, 4, "Ezra the scribe stood on a pulpit of wood, which they had made for the purpose; and beside him stood Mattithiah, Shema, Anaiah, Uriah, Hilkiah, and Maaseiah, on his right hand; and on his left hand, Pedaiah, Mishael, Malchijah, Hashum, Hashbaddanah, Zechariah, and Meshullam.", 0], [8, 5, "Ezra opened the book in the sight of all the people (for he was above all the people), and when he opened it, all the people stood up.", 0], [8, 6, "Then Ezra blessed Yahweh, the great God. All the people answered, “Amen, Amen,” with the lifting up of their hands. They bowed their heads, and worshiped Yahweh with their faces to the ground.", 0], [8, 7, "Also Jeshua, Bani, Sherebiah, Jamin, Akkub, Shabbethai, Hodiah, Maaseiah, Kelita, Azariah, Jozabad, Hanan, Pelaiah, and the Levites, caused the people to understand the law; and the people stayed in their place.", 0], [8, 8, "They read in the book, in the law of God, distinctly; and they gave the sense, so that they understood the reading.", 0], [8, 9, "Nehemiah, who was the governor, and Ezra the priest and scribe, and the Levites who taught the people, said to all the people, “Today is holy to Yahweh your God. Don’t mourn, nor weep.” For all the people wept when they heard the words of the law.", 1], [8, 10, "Then he said to them, “Go your way. Eat the fat, drink the sweet, and send portions to him for whom nothing is prepared, for today is holy to our Lord. Don’t be grieved, for the joy of Yahweh is your strength.”", 0], [8, 11, "So the Levites calmed all the people, saying, “Hold your peace, for the day is holy. Don’t be grieved.”", 1], [8, 12, "All the people went their way to eat, to drink, to send portions, and to celebrate, because they had understood the words that were declared to them.", 1], [8, 13, "On the second day, the heads of fathers’ households of all the people, the priests, and the Levites were gathered together to Ezra the scribe, to study the words of the law.", 1], [8, 14, "They found written in the law how Yahweh had commanded by Moses that the children of Israel should dwell in booths in the feast of the seventh month;", 0], [8, 15, "and that they should publish and proclaim in all their cities, and in Jerusalem, saying, “Go out to the mountain, and get olive branches, branches of wild olive, myrtle branches, palm branches, and branches of thick trees, to make temporary shelters, as it is written.”", 0], [8, 16, "So the people went out, and brought them, and made themselves temporary shelters, everyone on the roof of his house, in their courts, in the courts of God’s house, in the wide place of the water gate, and in the wide place of Ephraim’s gate.", 1], [8, 17, "All the assembly of those who had come back out of the captivity made temporary shelters, and lived in the temporary shelters; for since the days of Jeshua the son of Nun to that day the children of Israel had not done so. There was very great gladness.", 0], [8, 18, "Also day by day, from the first day to the last day, he read in the book of the law of God. They kept the feast seven days; and on the eighth day was a solemn assembly, according to the ordinance.", 0]]}]}, {"sel": 1, "segs": [{"ref": "Nehemiah 9:1–3", "v": [[9, 1, "Now in the twenty-fourth day of this month the children of Israel were assembled with fasting, with sackcloth, and dirt on them.", 1], [9, 2, "The offspring of Israel separated themselves from all foreigners and stood and confessed their sins and the iniquities of their fathers.", 0], [9, 3, "They stood up in their place, and read in the book of the law of Yahweh their God a fourth part of the day; and a fourth part they confessed, and worshiped Yahweh their God.", 0]]}, {"ref": "Nehemiah 9:5–6", "v": [[9, 5, "Then the Levites, Jeshua, and Kadmiel, Bani, Hashabneiah, Sherebiah, Hodiah, Shebaniah, and Pethahiah, said, “Stand up and bless Yahweh your God from everlasting to everlasting! Blessed be your glorious name, which is exalted above all blessing and praise!", 1], [9, 6, "You are Yahweh, even you alone. You have made heaven, the heaven of heavens, with all their army, the earth and all things that are on it, the seas and all that is in them, and you preserve them all. The army of heaven worships you.", 0]]}, {"ref": "Nehemiah 9:32–38", "v": [[9, 32, "Now therefore, our God, the great, the mighty, and the awesome God, who keeps covenant and loving kindness, don’t let all the travail seem little before you, that has come on us, on our kings, on our princes, on our priests, on our prophets, on our fathers, and on all your people, since the time of the kings of Assyria to this day.", 1], [9, 33, "However you are just in all that has come on us; for you have dealt truly, but we have done wickedly.", 0], [9, 34, "Also our kings, our princes, our priests, and our fathers have not kept your law, nor listened to your commandments and your testimonies with which you testified against them.", 0], [9, 35, "For they have not served you in their kingdom, and in your great goodness that you gave them, and in the large and rich land which you gave before them. They didn’t turn from their wicked works.", 0], [9, 36, "“Behold, we are servants today, and as for the land that you gave to our fathers to eat its fruit and its good, behold, we are servants in it.", 1], [9, 37, "It yields much increase to the kings whom you have set over us because of our sins. Also they have power over our bodies and over our livestock, at their pleasure, and we are in great distress.", 0], [9, 38, "Yet for all this, we make a sure covenant, and write it; and our princes, our Levites, and our priests, seal it.”", 0]]}, {"ref": "Nehemiah 10:28–29", "v": [[10, 28, "The rest of the people, the priests, the Levites, the gatekeepers, the singers, the temple servants, and all those who had separated themselves from the peoples of the lands to the law of God, their wives, their sons, and their daughters—everyone who had knowledge, and understanding—", 1], [10, 29, "joined with their brothers, their nobles, and entered into a curse, and into an oath, to walk in God’s law, which was given by Moses the servant of God, and to observe and do all the commandments of Yahweh our Lord, and his ordinances and his statutes;", 0]]}, {"ref": "Nehemiah 13:4–14", "v": [[13, 4, "Now before this, Eliashib the priest, who was appointed over the rooms of the house of our God, being allied to Tobiah,", 1], [13, 5, "had prepared for him a great room, where before they laid the meal offerings, the frankincense, the vessels, and the tithes of the grain, the new wine, and the oil, which were given by commandment to the Levites, the singers, and the gatekeepers; and the wave offerings for the priests.", 0], [13, 6, "But in all this, I was not at Jerusalem; for in the thirty-second year of Artaxerxes king of Babylon I went to the king; and after some days I asked leave of the king,", 0], [13, 7, "and I came to Jerusalem, and understood the evil that Eliashib had done for Tobiah, in preparing him a room in the courts of God’s house.", 0], [13, 8, "It grieved me severely. Therefore I threw all Tobiah’s household stuff out of the room.", 0], [13, 9, "Then I commanded, and they cleansed the rooms. I brought into them the vessels of God’s house, with the meal offerings and the frankincense again.", 0], [13, 10, "I perceived that the portions of the Levites had not been given them; so that the Levites and the singers, who did the work, had each fled to his field.", 1], [13, 11, "Then I contended with the rulers, and said, “Why is God’s house forsaken?” I gathered them together, and set them in their place.", 0], [13, 12, "Then all Judah brought the tithe of the grain, the new wine, and the oil to the treasuries.", 0], [13, 13, "I made treasurers over the treasuries, Shelemiah the priest, and Zadok the scribe, and of the Levites, Pedaiah: and next to them was Hanan the son of Zaccur, the son of Mattaniah; for they were counted faithful, and their business was to distribute to their brothers.", 0], [13, 14, "Remember me, my God, concerning this, and don’t wipe out my good deeds that I have done for the house of my God, and for its observances.", 1]]}, {"ref": "Nehemiah 13:15–22", "v": [[13, 15, "In those days I saw some men treading wine presses on the Sabbath in Judah, bringing in sheaves, and loading donkeys; also with wine, grapes, figs, and all kinds of burdens, which they brought into Jerusalem on the Sabbath day; and I testified against them in the day in which they sold food.", 1], [13, 16, "Some men of Tyre also lived there, who brought in fish and all kinds of wares, and sold on the Sabbath to the children of Judah, and in Jerusalem.", 0], [13, 17, "Then I contended with the nobles of Judah, and said to them, “What evil thing is this that you do, and profane the Sabbath day?", 0], [13, 18, "Didn’t your fathers do this, and didn’t our God bring all this evil on us, and on this city? Yet you bring more wrath on Israel by profaning the Sabbath.”", 0], [13, 19, "It came to pass that when the gates of Jerusalem began to be dark before the Sabbath, I commanded that the doors should be shut, and commanded that they should not be opened until after the Sabbath. I set some of my servants over the gates, so that no burden should be brought in on the Sabbath day.", 1], [13, 20, "So the merchants and sellers of all kinds of wares camped outside of Jerusalem once or twice.", 0], [13, 21, "Then I testified against them, and said to them, “Why do you stay around the wall? If you do so again, I will lay hands on you.” From that time on, they didn’t come on the Sabbath.", 0], [13, 22, "I commanded the Levites that they should purify themselves, and that they should come and keep the gates, to sanctify the Sabbath day. Remember to me, my God, this also, and spare me according to the greatness of your loving kindness.", 0]]}, {"ref": "Nehemiah 13:23–31", "v": [[13, 23, "In those days I also saw the Jews who had married women of Ashdod, of Ammon, and of Moab;", 1], [13, 24, "and their children spoke half in the speech of Ashdod, and could not speak in the Jews’ language, but according to the language of each people.", 0], [13, 25, "I contended with them, and cursed them, and struck certain of them, and plucked off their hair, and made them swear by God, “You shall not give your daughters to their sons, nor take their daughters for your sons, or for yourselves.", 0], [13, 26, "Didn’t Solomon king of Israel sin by these things? Yet among many nations there was no king like him, and he was loved by his God, and God made him king over all Israel. Nevertheless foreign women caused even him to sin.", 0], [13, 27, "Shall we then listen to you to do all this great evil, to trespass against our God in marrying foreign women?”", 0], [13, 28, "One of the sons of Joiada, the son of Eliashib the high priest, was son-in-law to Sanballat the Horonite; therefore I chased him from me.", 1], [13, 29, "Remember them, my God, because they have defiled the priesthood, and the covenant of the priesthood and of the Levites.", 0], [13, 30, "Thus I cleansed them from all foreigners, and appointed duties for the priests and for the Levites, everyone in his work;", 1], [13, 31, "and for the wood offering, at times appointed, and for the first fruits. Remember me, my God, for good.", 0]]}]}], "mark": [{"sel": 0, "segs": [{"ref": "Mark 1:1–20", "v": [[1, 1, "The beginning of the Good News of Jesus Christ, the Son of God.", 1], [1, 2, "As it is written in the prophets,\n“Behold, I send my messenger before your face,\nwho will prepare your way before you:", 0], [1, 3, "the voice of one crying in the wilderness,\n‘Make ready the way of the Lord!\nMake his paths straight!’ ”", 0], [1, 4, "John came baptizing in the wilderness and preaching the baptism of repentance for forgiveness of sins.", 1], [1, 5, "All the country of Judea and all those of Jerusalem went out to him. They were baptized by him in the Jordan river, confessing their sins.", 0], [1, 6, "John was clothed with camel’s hair and a leather belt around his waist. He ate locusts and wild honey.", 0], [1, 7, "He preached, saying, “After me comes he who is mightier than I, the thong of whose sandals I am not worthy to stoop down and loosen.", 0], [1, 8, "I baptized you in water, but he will baptize you in the Holy Spirit.”", 0], [1, 9, "In those days, Jesus came from Nazareth of Galilee, and was baptized by John in the Jordan.", 1], [1, 10, "Immediately coming up from the water, he saw the heavens parting, and the Spirit descending on him like a dove.", 0], [1, 11, "A voice came out of the sky, “You are my beloved Son, in whom I am well pleased.”", 0], [1, 12, "Immediately the Spirit drove him out into the wilderness.", 1], [1, 13, "He was there in the wilderness forty days tempted by Satan. He was with the wild animals; and the angels were serving him.", 0], [1, 14, "Now after John was taken into custody, Jesus came into Galilee, preaching the Good News of God’s Kingdom,", 1], [1, 15, "and saying, “The time is fulfilled, and God’s Kingdom is at hand! Repent, and believe in the Good News.”", 0], [1, 16, "Passing along by the sea of Galilee, he saw Simon and Andrew, the brother of Simon, casting a net into the sea, for they were fishermen.", 1], [1, 17, "Jesus said to them, “Come after me, and I will make you into fishers for men.”", 0], [1, 18, "Immediately they left their nets, and followed him.", 1], [1, 19, "Going on a little further from there, he saw James the son of Zebedee, and John, his brother, who were also in the boat mending the nets.", 0], [1, 20, "Immediately he called them, and they left their father, Zebedee, in the boat with the hired servants, and went after him.", 0]]}]}, {"sel": 0, "segs": [{"ref": "Mark 1:21–45", "v": [[1, 21, "They went into Capernaum, and immediately on the Sabbath day he entered into the synagogue and taught.", 0], [1, 22, "They were astonished at his teaching, for he taught them as having authority, and not as the scribes.", 0], [1, 23, "Immediately there was in their synagogue a man with an unclean spirit, and he cried out,", 0], [1, 24, "saying, “Ha! What do we have to do with you, Jesus, you Nazarene? Have you come to destroy us? I know you who you are: the Holy One of God!”", 0], [1, 25, "Jesus rebuked him, saying, “Be quiet, and come out of him!”", 1], [1, 26, "The unclean spirit, convulsing him and crying with a loud voice, came out of him.", 1], [1, 27, "They were all amazed, so that they questioned among themselves, saying, “What is this? A new teaching? For with authority he commands even the unclean spirits, and they obey him!”", 0], [1, 28, "The report of him went out immediately everywhere into all the region of Galilee and its surrounding area.", 0], [1, 29, "Immediately, when they had come out of the synagogue, they came into the house of Simon and Andrew, with James and John.", 1], [1, 30, "Now Simon’s wife’s mother lay sick with a fever, and immediately they told him about her.", 0], [1, 31, "He came and took her by the hand, and raised her up. The fever left her immediately, and she served them.", 0], [1, 32, "At evening, when the sun had set, they brought to him all who were sick, and those who were possessed by demons.", 0], [1, 33, "All the city was gathered together at the door.", 0], [1, 34, "He healed many who were sick with various diseases, and cast out many demons. He didn’t allow the demons to speak, because they knew him.", 0], [1, 35, "Early in the morning, while it was still dark, he rose up and went out, and departed into a deserted place, and prayed there.", 1], [1, 36, "Simon and those who were with him searched for him.", 0], [1, 37, "They found him and told him, “Everyone is looking for you.”", 0], [1, 38, "He said to them, “Let’s go elsewhere into the next towns, that I may preach there also, because I came out for this reason.”", 1], [1, 39, "He went into their synagogues throughout all Galilee, preaching and casting out demons.", 0], [1, 40, "A leper came to him, begging him, kneeling down to him, and saying to him, “If you want to, you can make me clean.”", 1], [1, 41, "Being moved with compassion, he stretched out his hand, and touched him, and said to him, “I want to. Be made clean.”", 1], [1, 42, "When he had said this, immediately the leprosy departed from him, and he was made clean.", 0], [1, 43, "He strictly warned him, and immediately sent him out,", 0], [1, 44, "and said to him, “See you say nothing to anybody, but go show yourself to the priest, and offer for your cleansing the things which Moses commanded, for a testimony to them.”", 0], [1, 45, "But he went out, and began to proclaim it much, and to spread about the matter, so that Jesus could no more openly enter into a city, but was outside in desert places. People came to him from everywhere.", 1]]}]}, {"sel": 0, "segs": [{"ref": "Mark 2:1–3:6", "v": [[2, 1, "When he entered again into Capernaum after some days, it was heard that he was in the house.", 1], [2, 2, "Immediately many were gathered together, so that there was no more room, not even around the door; and he spoke the word to them.", 0], [2, 3, "Four people came, carrying a paralytic to him.", 0], [2, 4, "When they could not come near to him for the crowd, they removed the roof where he was. When they had broken it up, they let down the mat that the paralytic was lying on.", 0], [2, 5, "Jesus, seeing their faith, said to the paralytic, “Son, your sins are forgiven you.”", 0], [2, 6, "But there were some of the scribes sitting there, and reasoning in their hearts,", 1], [2, 7, "“Why does this man speak blasphemies like that? Who can forgive sins but God alone?”", 0], [2, 8, "Immediately Jesus, perceiving in his spirit that they so reasoned within themselves, said to them, “Why do you reason these things in your hearts?", 1], [2, 9, "Which is easier, to tell the paralytic, ‘Your sins are forgiven;’ or to say, ‘Arise, and take up your bed, and walk?’", 0], [2, 10, "But that you may know that the Son of Man has authority on earth to forgive sins”—he said to the paralytic—", 0], [2, 11, "“I tell you, arise, take up your mat, and go to your house.”", 0], [2, 12, "He arose, and immediately took up the mat, and went out in front of them all; so that they were all amazed, and glorified God, saying, “We never saw anything like this!”", 1], [2, 13, "He went out again by the seaside. All the multitude came to him, and he taught them.", 1], [2, 14, "As he passed by, he saw Levi, the son of Alphaeus, sitting at the tax office, and he said to him, “Follow me.” And he arose and followed him.", 0], [2, 15, "He was reclining at the table in his house, and many tax collectors and sinners sat down with Jesus and his disciples, for there were many, and they followed him.", 1], [2, 16, "The scribes and the Pharisees, when they saw that he was eating with the sinners and tax collectors, said to his disciples, “Why is it that he eats and drinks with tax collectors and sinners?”", 0], [2, 17, "When Jesus heard it, he said to them, “Those who are healthy have no need for a physician, but those who are sick. I came not to call the righteous, but sinners to repentance.”", 1], [2, 18, "John’s disciples and the Pharisees were fasting, and they came and asked him, “Why do John’s disciples and the disciples of the Pharisees fast, but your disciples don’t fast?”", 1], [2, 19, "Jesus said to them, “Can the groomsmen fast while the bridegroom is with them? As long as they have the bridegroom with them, they can’t fast.", 1], [2, 20, "But the days will come when the bridegroom will be taken away from them, and then they will fast in that day.", 0], [2, 21, "No one sews a piece of unshrunk cloth on an old garment, or else the patch shrinks and the new tears away from the old, and a worse hole is made.", 0], [2, 22, "No one puts new wine into old wineskins, or else the new wine will burst the skins, and the wine pours out, and the skins will be destroyed; but they put new wine into fresh wineskins.”", 0], [2, 23, "He was going on the Sabbath day through the grain fields, and his disciples began, as they went, to pluck the ears of grain.", 1], [2, 24, "The Pharisees said to him, “Behold, why do they do that which is not lawful on the Sabbath day?”", 0], [2, 25, "He said to them, “Did you never read what David did, when he had need, and was hungry—he, and those who were with him?", 1], [2, 26, "How he entered into God’s house at the time of Abiathar the high priest, and ate the show bread, which is not lawful to eat except for the priests, and gave also to those who were with him?”", 0], [2, 27, "He said to them, “The Sabbath was made for man, not man for the Sabbath.", 0], [2, 28, "Therefore the Son of Man is lord even of the Sabbath.”", 0], [3, 1, "He entered again into the synagogue, and there was a man there who had his hand withered.", 1], [3, 2, "They watched him, whether he would heal him on the Sabbath day, that they might accuse him.", 0], [3, 3, "He said to the man who had his hand withered, “Stand up.”", 0], [3, 4, "He said to them, “Is it lawful on the Sabbath day to do good, or to do harm? To save a life, or to kill?” But they were silent.", 0], [3, 5, "When he had looked around at them with anger, being grieved at the hardening of their hearts, he said to the man, “Stretch out your hand.” He stretched it out, and his hand was restored as healthy as the other.", 0], [3, 6, "The Pharisees went out, and immediately conspired with the Herodians against him, how they might destroy him.", 0]]}]}, {"sel": 0, "segs": [{"ref": "Mark 3:7–35", "v": [[3, 7, "Jesus withdrew to the sea with his disciples, and a great multitude followed him from Galilee, from Judea,", 1], [3, 8, "from Jerusalem, from Idumaea, beyond the Jordan, and those from around Tyre and Sidon. A great multitude, hearing what great things he did, came to him.", 0], [3, 9, "He spoke to his disciples that a little boat should stay near him because of the crowd, so that they wouldn’t press on him.", 0], [3, 10, "For he had healed many, so that as many as had diseases pressed on him that they might touch him.", 0], [3, 11, "The unclean spirits, whenever they saw him, fell down before him, and cried, “You are the Son of God!”", 0], [3, 12, "He sternly warned them that they should not make him known.", 0], [3, 13, "He went up into the mountain, and called to himself those whom he wanted, and they went to him.", 1], [3, 14, "He appointed twelve, that they might be with him, and that he might send them out to preach,", 0], [3, 15, "and to have authority to heal sicknesses and to cast out demons:", 0], [3, 16, "Simon (to whom he gave the name Peter);", 0], [3, 17, "James the son of Zebedee; and John, the brother of James, (whom he called Boanerges, which means, Sons of Thunder);", 0], [3, 18, "Andrew; Philip; Bartholomew; Matthew; Thomas; James, the son of Alphaeus; Thaddaeus; Simon the Zealot;", 0], [3, 19, "and Judas Iscariot, who also betrayed him. Then he came into a house.", 0], [3, 20, "The multitude came together again, so that they could not so much as eat bread.", 0], [3, 21, "When his friends heard it, they went out to seize him; for they said, “He is insane.”", 0], [3, 22, "The scribes who came down from Jerusalem said, “He has Beelzebul,” and, “By the prince of the demons he casts out the demons.”", 0], [3, 23, "He summoned them, and said to them in parables, “How can Satan cast out Satan?", 1], [3, 24, "If a kingdom is divided against itself, that kingdom cannot stand.", 0], [3, 25, "If a house is divided against itself, that house cannot stand.", 0], [3, 26, "If Satan has risen up against himself, and is divided, he can’t stand, but has an end.", 0], [3, 27, "But no one can enter into the house of the strong man to plunder unless he first binds the strong man; then he will plunder his house.", 0], [3, 28, "Most certainly I tell you, all sins of the descendants of man will be forgiven, including their blasphemies with which they may blaspheme;", 0], [3, 29, "but whoever may blaspheme against the Holy Spirit never has forgiveness, but is subject to eternal condemnation.”", 0], [3, 30, "—because they said, “He has an unclean spirit.”", 0], [3, 31, "His mother and his brothers came, and standing outside, they sent to him, calling him.", 1], [3, 32, "A multitude was sitting around him, and they told him, “Behold, your mother, your brothers, and your sisters are outside looking for you.”", 0], [3, 33, "He answered them, “Who are my mother and my brothers?”", 1], [3, 34, "Looking around at those who sat around him, he said, “Behold, my mother and my brothers!", 0], [3, 35, "For whoever does the will of God is my brother, my sister, and mother.”", 0]]}]}, {"sel": 0, "segs": [{"ref": "Mark 4:1–41", "v": [[4, 1, "Again he began to teach by the seaside. A great multitude was gathered to him, so that he entered into a boat in the sea, and sat down. All the multitude were on the land by the sea.", 1], [4, 2, "He taught them many things in parables, and told them in his teaching,", 0], [4, 3, "“Listen! Behold, the farmer went out to sow,", 0], [4, 4, "and as he sowed, some seed fell by the road, and the birds came and devoured it.", 0], [4, 5, "Others fell on the rocky ground, where it had little soil, and immediately it sprang up, because it had no depth of soil.", 0], [4, 6, "When the sun had risen, it was scorched; and because it had no root, it withered away.", 0], [4, 7, "Others fell among the thorns, and the thorns grew up, and choked it, and it yielded no fruit.", 0], [4, 8, "Others fell into the good ground, and yielded fruit, growing up and increasing. Some produced thirty times, some sixty times, and some one hundred times as much.”", 0], [4, 9, "He said, “Whoever has ears to hear, let him hear.”", 0], [4, 10, "When he was alone, those who were around him with the twelve asked him about the parables.", 1], [4, 11, "He said to them, “To you is given the mystery of God’s Kingdom, but to those who are outside, all things are done in parables,", 0], [4, 12, "that ‘seeing they may see, and not perceive; and hearing they may hear, and not understand; lest perhaps they should turn again, and their sins should be forgiven them.’ ”", 0], [4, 13, "He said to them, “Don’t you understand this parable? How will you understand all of the parables?", 1], [4, 14, "The farmer sows the word.", 0], [4, 15, "The ones by the road are the ones where the word is sown; and when they have heard, immediately Satan comes, and takes away the word which has been sown in them.", 0], [4, 16, "These in the same way are those who are sown on the rocky places, who, when they have heard the word, immediately receive it with joy.", 0], [4, 17, "They have no root in themselves, but are short-lived. When oppression or persecution arises because of the word, immediately they stumble.", 0], [4, 18, "Others are those who are sown among the thorns. These are those who have heard the word,", 0], [4, 19, "and the cares of this age, and the deceitfulness of riches, and the lusts of other things entering in choke the word, and it becomes unfruitful.", 0], [4, 20, "Those which were sown on the good ground are those who hear the word, and accept it, and bear fruit, some thirty times, some sixty times, and some one hundred times.”", 0], [4, 21, "He said to them, “Is the lamp brought to be put under a basket or under a bed? Isn’t it put on a stand?", 1], [4, 22, "For there is nothing hidden, except that it should be made known; neither was anything made secret, but that it should come to light.", 0], [4, 23, "If any man has ears to hear, let him hear.”", 0], [4, 24, "He said to them, “Take heed what you hear. With whatever measure you measure, it will be measured to you, and more will be given to you who hear.", 1], [4, 25, "For whoever has, to him more will be given, and he who doesn’t have, even that which he has will be taken away from him.”", 0], [4, 26, "He said, “God’s Kingdom is as if a man should cast seed on the earth,", 1], [4, 27, "and should sleep and rise night and day, and the seed should spring up and grow, though he doesn’t know how.", 0], [4, 28, "For the earth bears fruit: first the blade, then the ear, then the full grain in the ear.", 0], [4, 29, "But when the fruit is ripe, immediately he puts in the sickle, because the harvest has come.”", 0], [4, 30, "He said, “How will we liken God’s Kingdom? Or with what parable will we illustrate it?", 1], [4, 31, "It’s like a grain of mustard seed, which, when it is sown in the earth, though it is less than all the seeds that are on the earth,", 0], [4, 32, "yet when it is sown, grows up, and becomes greater than all the herbs, and puts out great branches, so that the birds of the sky can lodge under its shadow.”", 0], [4, 33, "With many such parables he spoke the word to them, as they were able to hear it.", 1], [4, 34, "Without a parable he didn’t speak to them; but privately to his own disciples he explained everything.", 0], [4, 35, "On that day, when evening had come, he said to them, “Let’s go over to the other side.”", 1], [4, 36, "Leaving the multitude, they took him with them, even as he was, in the boat. Other small boats were also with him.", 0], [4, 37, "A big wind storm arose, and the waves beat into the boat, so much that the boat was already filled.", 0], [4, 38, "He himself was in the stern, asleep on the cushion, and they woke him up, and told him, “Teacher, don’t you care that we are dying?”", 0], [4, 39, "He awoke, and rebuked the wind, and said to the sea, “Peace! Be still!” The wind ceased, and there was a great calm.", 1], [4, 40, "He said to them, “Why are you so afraid? How is it that you have no faith?”", 0], [4, 41, "They were greatly afraid, and said to one another, “Who then is this, that even the wind and the sea obey him?”", 1]]}]}, {"sel": 0, "segs": [{"ref": "Mark 5:1–43", "v": [[5, 1, "They came to the other side of the sea, into the country of the Gadarenes.", 1], [5, 2, "When he had come out of the boat, immediately a man with an unclean spirit met him out of the tombs.", 0], [5, 3, "He lived in the tombs. Nobody could bind him any more, not even with chains,", 0], [5, 4, "because he had been often bound with fetters and chains, and the chains had been torn apart by him, and the fetters broken in pieces. Nobody had the strength to tame him.", 0], [5, 5, "Always, night and day, in the tombs and in the mountains, he was crying out, and cutting himself with stones.", 0], [5, 6, "When he saw Jesus from afar, he ran and bowed down to him,", 0], [5, 7, "and crying out with a loud voice, he said, “What have I to do with you, Jesus, you Son of the Most High God? I adjure you by God, don’t torment me.”", 0], [5, 8, "For he said to him, “Come out of the man, you unclean spirit!”", 0], [5, 9, "He asked him, “What is your name?” He said to him, “My name is Legion, for we are many.”", 1], [5, 10, "He begged him much that he would not send them away out of the country.", 0], [5, 11, "Now on the mountainside there was a great herd of pigs feeding.", 0], [5, 12, "All the demons begged him, saying, “Send us into the pigs, that we may enter into them.”", 0], [5, 13, "At once Jesus gave them permission. The unclean spirits came out and entered into the pigs. The herd of about two thousand rushed down the steep bank into the sea, and they were drowned in the sea.", 1], [5, 14, "Those who fed them fled, and told it in the city and in the country. The people came to see what it was that had happened.", 0], [5, 15, "They came to Jesus, and saw him who had been possessed by demons sitting, clothed, and in his right mind, even him who had the legion; and they were afraid.", 0], [5, 16, "Those who saw it declared to them what happened to him who was possessed by demons, and about the pigs.", 0], [5, 17, "They began to beg him to depart from their region.", 0], [5, 18, "As he was entering into the boat, he who had been possessed by demons begged him that he might be with him.", 1], [5, 19, "He didn’t allow him, but said to him, “Go to your house, to your friends, and tell them what great things the Lord has done for you, and how he had mercy on you.”", 0], [5, 20, "He went his way, and began to proclaim in Decapolis how Jesus had done great things for him, and everyone marveled.", 1], [5, 21, "When Jesus had crossed back over in the boat to the other side, a great multitude was gathered to him; and he was by the sea.", 1], [5, 22, "Behold, one of the rulers of the synagogue, Jairus by name, came; and seeing him, he fell at his feet,", 0], [5, 23, "and begged him much, saying, “My little daughter is at the point of death. Please come and lay your hands on her, that she may be made healthy, and live.”", 0], [5, 24, "He went with him, and a great multitude followed him, and they pressed upon him on all sides.", 1], [5, 25, "A certain woman, who had a discharge of blood for twelve years,", 0], [5, 26, "and had suffered many things by many physicians, and had spent all that she had, and was no better, but rather grew worse,", 0], [5, 27, "having heard the things concerning Jesus, came up behind him in the crowd, and touched his clothes.", 0], [5, 28, "For she said, “If I just touch his clothes, I will be made well.”", 0], [5, 29, "Immediately the flow of her blood was dried up, and she felt in her body that she was healed of her affliction.", 0], [5, 30, "Immediately Jesus, perceiving in himself that the power had gone out from him, turned around in the crowd, and asked, “Who touched my clothes?”", 1], [5, 31, "His disciples said to him, “You see the multitude pressing against you, and you say, ‘Who touched me?’ ”", 1], [5, 32, "He looked around to see her who had done this thing.", 1], [5, 33, "But the woman, fearing and trembling, knowing what had been done to her, came and fell down before him, and told him all the truth.", 0], [5, 34, "He said to her, “Daughter, your faith has made you well. Go in peace, and be cured of your disease.”", 1], [5, 35, "While he was still speaking, people came from the synagogue ruler’s house saying, “Your daughter is dead. Why bother the Teacher any more?”", 1], [5, 36, "But Jesus, when he heard the message spoken, immediately said to the ruler of the synagogue, “Don’t be afraid, only believe.”", 1], [5, 37, "He allowed no one to follow him, except Peter, James, and John the brother of James.", 0], [5, 38, "He came to the synagogue ruler’s house, and he saw an uproar, weeping, and great wailing.", 0], [5, 39, "When he had entered in, he said to them, “Why do you make an uproar and weep? The child is not dead, but is asleep.”", 0], [5, 40, "They ridiculed him. But he, having put them all out, took the father of the child, her mother, and those who were with him, and went in where the child was lying.", 1], [5, 41, "Taking the child by the hand, he said to her, “Talitha cumi!” which means, being interpreted, “Girl, I tell you, get up!”", 0], [5, 42, "Immediately the girl rose up and walked, for she was twelve years old. They were amazed with great amazement.", 0], [5, 43, "He strictly ordered them that no one should know this, and commanded that something should be given to her to eat.", 0]]}]}, {"sel": 0, "segs": [{"ref": "Mark 6:1–56", "v": [[6, 1, "He went out from there. He came into his own country, and his disciples followed him.", 1], [6, 2, "When the Sabbath had come, he began to teach in the synagogue, and many hearing him were astonished, saying, “Where did this man get these things?” and, “What is the wisdom that is given to this man, that such mighty works come about by his hands?", 0], [6, 3, "Isn’t this the carpenter, the son of Mary, and brother of James, Joses, Judah, and Simon? Aren’t his sisters here with us?” They were offended at him.", 0], [6, 4, "Jesus said to them, “A prophet is not without honor, except in his own country, and among his own relatives, and in his own house.”", 1], [6, 5, "He could do no mighty work there, except that he laid his hands on a few sick people, and healed them.", 0], [6, 6, "He marveled because of their unbelief. He went around the villages teaching.", 0], [6, 7, "He called to himself the twelve, and began to send them out two by two; and he gave them authority over the unclean spirits.", 0], [6, 8, "He commanded them that they should take nothing for their journey, except a staff only: no bread, no wallet, no money in their purse,", 0], [6, 9, "but to wear sandals, and not put on two tunics.", 0], [6, 10, "He said to them, “Wherever you enter into a house, stay there until you depart from there.", 0], [6, 11, "Whoever will not receive you nor hear you, as you depart from there, shake off the dust that is under your feet for a testimony against them. Assuredly, I tell you, it will be more tolerable for Sodom and Gomorrah in the day of judgment than for that city!”", 0], [6, 12, "They went out and preached that people should repent.", 1], [6, 13, "They cast out many demons, and anointed many with oil who were sick, and healed them.", 0], [6, 14, "King Herod heard this, for his name had become known, and he said, “John the Baptizer has risen from the dead, and therefore these powers are at work in him.”", 0], [6, 15, "But others said, “He is Elijah.” Others said, “He is a prophet, or like one of the prophets.”", 0], [6, 16, "But Herod, when he heard this, said, “This is John, whom I beheaded. He has risen from the dead.”", 0], [6, 17, "For Herod himself had sent out and arrested John, and bound him in prison for the sake of Herodias, his brother Philip’s wife, for he had married her.", 0], [6, 18, "For John said to Herod, “It is not lawful for you to have your brother’s wife.”", 0], [6, 19, "Herodias set herself against him, and desired to kill him, but she couldn’t,", 0], [6, 20, "for Herod feared John, knowing that he was a righteous and holy man, and kept him safe. When he heard him, he did many things, and he heard him gladly.", 0], [6, 21, "Then a convenient day came, that Herod on his birthday made a supper for his nobles, the high officers, and the chief men of Galilee.", 1], [6, 22, "When the daughter of Herodias herself came in and danced, she pleased Herod and those sitting with him. The king said to the young lady, “Ask me whatever you want, and I will give it to you.”", 0], [6, 23, "He swore to her, “Whatever you shall ask of me, I will give you, up to half of my kingdom.”", 0], [6, 24, "She went out, and said to her mother, “What shall I ask?” She said, “The head of John the Baptizer.”", 1], [6, 25, "She came in immediately with haste to the king, and asked, “I want you to give me right now the head of John the Baptizer on a platter.”", 1], [6, 26, "The king was exceedingly sorry, but for the sake of his oaths, and of his dinner guests, he didn’t wish to refuse her.", 1], [6, 27, "Immediately the king sent out a soldier of his guard, and commanded to bring John’s head, and he went and beheaded him in the prison,", 0], [6, 28, "and brought his head on a platter, and gave it to the young lady; and the young lady gave it to her mother.", 0], [6, 29, "When his disciples heard this, they came and took up his corpse, and laid it in a tomb.", 1], [6, 30, "The apostles gathered themselves together to Jesus, and they told him all things, whatever they had done, and whatever they had taught.", 1], [6, 31, "He said to them, “You come apart into a deserted place, and rest awhile.” For there were many coming and going, and they had no leisure so much as to eat.", 0], [6, 32, "They went away in the boat to a deserted place by themselves.", 0], [6, 33, "They saw them going, and many recognized him and ran there on foot from all the cities. They arrived before them and came together to him.", 0], [6, 34, "Jesus came out, saw a great multitude, and he had compassion on them, because they were like sheep without a shepherd, and he began to teach them many things.", 0], [6, 35, "When it was late in the day, his disciples came to him, and said, “This place is deserted, and it is late in the day.", 0], [6, 36, "Send them away, that they may go into the surrounding country and villages, and buy themselves bread, for they have nothing to eat.”", 0], [6, 37, "But he answered them, “You give them something to eat.” They asked him, “Shall we go and buy two hundred denarii worth of bread, and give them something to eat?”", 1], [6, 38, "He said to them, “How many loaves do you have? Go see.” When they knew, they said, “Five, and two fish.”", 1], [6, 39, "He commanded them that everyone should sit down in groups on the green grass.", 1], [6, 40, "They sat down in ranks, by hundreds and by fifties.", 0], [6, 41, "He took the five loaves and the two fish, and looking up to heaven, he blessed and broke the loaves, and he gave to his disciples to set before them, and he divided the two fish among them all.", 0], [6, 42, "They all ate, and were filled.", 0], [6, 43, "They took up twelve baskets full of broken pieces and also of the fish.", 0], [6, 44, "Those who ate the loaves were five thousand men.", 0], [6, 45, "Immediately he made his disciples get into the boat, and to go ahead to the other side, to Bethsaida, while he himself sent the multitude away.", 1], [6, 46, "After he had taken leave of them, he went up the mountain to pray.", 0], [6, 47, "When evening had come, the boat was in the middle of the sea, and he was alone on the land.", 1], [6, 48, "Seeing them distressed in rowing, for the wind was contrary to them, about the fourth watch of the night he came to them, walking on the sea, and he would have passed by them,", 0], [6, 49, "but they, when they saw him walking on the sea, supposed that it was a ghost, and cried out;", 0], [6, 50, "for they all saw him, and were troubled. But he immediately spoke with them, and said to them, “Cheer up! It is I! Don’t be afraid.”", 0], [6, 51, "He got into the boat with them; and the wind ceased, and they were very amazed among themselves, and marveled;", 0], [6, 52, "for they hadn’t understood about the loaves, but their hearts were hardened.", 0], [6, 53, "When they had crossed over, they came to land at Gennesaret, and moored to the shore.", 1], [6, 54, "When they had come out of the boat, immediately the people recognized him,", 0], [6, 55, "and ran around that whole region, and began to bring those who were sick, on their mats, to where they heard he was.", 0], [6, 56, "Wherever he entered, into villages, or into cities, or into the country, they laid the sick in the marketplaces, and begged him that they might just touch the fringe of his garment; and as many as touched him were made well.", 0]]}]}, {"sel": 0, "segs": [{"ref": "Mark 7:1–8:26", "v": [[7, 1, "Then the Pharisees and some of the scribes gathered together to him, having come from Jerusalem.", 1], [7, 2, "Now when they saw some of his disciples eating bread with defiled, that is unwashed, hands, they found fault.", 0], [7, 3, "(For the Pharisees and all the Jews don’t eat unless they wash their hands and forearms, holding to the tradition of the elders.", 0], [7, 4, "They don’t eat when they come from the marketplace unless they bathe themselves, and there are many other things, which they have received to hold to: washings of cups, pitchers, bronze vessels, and couches.)", 0], [7, 5, "The Pharisees and the scribes asked him, “Why don’t your disciples walk according to the tradition of the elders, but eat their bread with unwashed hands?”", 0], [7, 6, "He answered them, “Well did Isaiah prophesy of you hypocrites, as it is written,\n‘This people honors me with their lips,\nbut their heart is far from me.", 1], [7, 7, "But they worship me in vain,\nteaching as doctrines the commandments of men.’", 0], [7, 8, "“For you set aside the commandment of God, and hold tightly to the tradition of men—the washing of pitchers and cups, and you do many other such things.”", 1], [7, 9, "He said to them, “Full well do you reject the commandment of God, that you may keep your tradition.", 0], [7, 10, "For Moses said, ‘Honor your father and your mother;’ and, ‘He who speaks evil of father or mother, let him be put to death.’", 0], [7, 11, "But you say, ‘If a man tells his father or his mother, “Whatever profit you might have received from me is Corban,” ’ ” that is to say, given to God,", 0], [7, 12, "“then you no longer allow him to do anything for his father or his mother,", 0], [7, 13, "making void the word of God by your tradition, which you have handed down. You do many things like this.”", 0], [7, 14, "He called all the multitude to himself, and said to them, “Hear me, all of you, and understand.", 1], [7, 15, "There is nothing from outside of the man, that going into him can defile him; but the things which proceed out of the man are those that defile the man.", 0], [7, 16, "If anyone has ears to hear, let him hear!”", 0], [7, 17, "When he had entered into a house away from the multitude, his disciples asked him about the parable.", 1], [7, 18, "He said to them, “Are you also without understanding? Don’t you perceive that whatever goes into the man from outside can’t defile him,", 0], [7, 19, "because it doesn’t go into his heart, but into his stomach, then into the latrine, making all foods clean?”", 0], [7, 20, "He said, “That which proceeds out of the man, that defiles the man.", 0], [7, 21, "For from within, out of the hearts of men, proceed evil thoughts, adulteries, sexual sins, murders, thefts,", 0], [7, 22, "covetings, wickedness, deceit, lustful desires, an evil eye, blasphemy, pride, and foolishness.", 0], [7, 23, "All these evil things come from within, and defile the man.”", 0], [7, 24, "From there he arose, and went away into the borders of Tyre and Sidon. He entered into a house, and didn’t want anyone to know it, but he couldn’t escape notice.", 1], [7, 25, "For a woman, whose little daughter had an unclean spirit, having heard of him, came and fell down at his feet.", 0], [7, 26, "Now the woman was a Greek, a Syrophoenician by race. She begged him that he would cast the demon out of her daughter.", 0], [7, 27, "But Jesus said to her, “Let the children be filled first, for it is not appropriate to take the children’s bread and throw it to the dogs.”", 0], [7, 28, "But she answered him, “Yes, Lord. Yet even the dogs under the table eat the children’s crumbs.”", 1], [7, 29, "He said to her, “For this saying, go your way. The demon has gone out of your daughter.”", 1], [7, 30, "She went away to her house, and found the child having been laid on the bed, with the demon gone out.", 1], [7, 31, "Again he departed from the borders of Tyre and Sidon, and came to the sea of Galilee, through the middle of the region of Decapolis.", 1], [7, 32, "They brought to him one who was deaf and had an impediment in his speech. They begged him to lay his hand on him.", 0], [7, 33, "He took him aside from the multitude, privately, and put his fingers into his ears, and he spat, and touched his tongue.", 0], [7, 34, "Looking up to heaven, he sighed, and said to him, “Ephphatha!” that is, “Be opened!”", 0], [7, 35, "Immediately his ears were opened, and the impediment of his tongue was released, and he spoke clearly.", 0], [7, 36, "He commanded them that they should tell no one, but the more he commanded them, so much the more widely they proclaimed it.", 0], [7, 37, "They were astonished beyond measure, saying, “He has done all things well. He makes even the deaf hear, and the mute speak!”", 0], [8, 1, "In those days, when there was a very great multitude, and they had nothing to eat, Jesus called his disciples to himself, and said to them,", 1], [8, 2, "“I have compassion on the multitude, because they have stayed with me now three days, and have nothing to eat.", 0], [8, 3, "If I send them away fasting to their home, they will faint on the way, for some of them have come a long way.”", 0], [8, 4, "His disciples answered him, “From where could one satisfy these people with bread here in a deserted place?”", 1], [8, 5, "He asked them, “How many loaves do you have?” They said, “Seven.”", 1], [8, 6, "He commanded the multitude to sit down on the ground, and he took the seven loaves. Having given thanks, he broke them, and gave them to his disciples to serve, and they served the multitude.", 1], [8, 7, "They had a few small fish. Having blessed them, he said to serve these also.", 0], [8, 8, "They ate, and were filled. They took up seven baskets of broken pieces that were left over.", 0], [8, 9, "Those who had eaten were about four thousand. Then he sent them away.", 0], [8, 10, "Immediately he entered into the boat with his disciples, and came into the region of Dalmanutha.", 1], [8, 11, "The Pharisees came out and began to question him, seeking from him a sign from heaven, and testing him.", 0], [8, 12, "He sighed deeply in his spirit, and said, “Why does this generation seek a sign? Most certainly I tell you, no sign will be given to this generation.”", 0], [8, 13, "He left them, and again entering into the boat, departed to the other side.", 1], [8, 14, "They forgot to take bread; and they didn’t have more than one loaf in the boat with them.", 0], [8, 15, "He warned them, saying, “Take heed: beware of the yeast of the Pharisees and the yeast of Herod.”", 0], [8, 16, "They reasoned with one another, saying, “It’s because we have no bread.”", 1], [8, 17, "Jesus, perceiving it, said to them, “Why do you reason that it’s because you have no bread? Don’t you perceive yet, neither understand? Is your heart still hardened?", 1], [8, 18, "Having eyes, don’t you see? Having ears, don’t you hear? Don’t you remember?", 0], [8, 19, "When I broke the five loaves among the five thousand, how many baskets full of broken pieces did you take up?” They told him, “Twelve.”", 0], [8, 20, "“When the seven loaves fed the four thousand, how many baskets full of broken pieces did you take up?” They told him, “Seven.”", 1], [8, 21, "He asked them, “Don’t you understand yet?”", 1], [8, 22, "He came to Bethsaida. They brought a blind man to him, and begged him to touch him.", 1], [8, 23, "He took hold of the blind man by the hand, and brought him out of the village. When he had spat on his eyes, and laid his hands on him, he asked him if he saw anything.", 0], [8, 24, "He looked up, and said, “I see men; for I see them like trees walking.”", 1], [8, 25, "Then again he laid his hands on his eyes. He looked intently, and was restored, and saw everyone clearly.", 1], [8, 26, "He sent him away to his house, saying, “Don’t enter into the village, nor tell anyone in the village.”", 0]]}]}, {"sel": 0, "segs": [{"ref": "Mark 8:27–9:1", "v": [[8, 27, "Jesus went out, with his disciples, into the villages of Caesarea Philippi. On the way he asked his disciples, “Who do men say that I am?”", 1], [8, 28, "They told him, “John the Baptizer, and others say Elijah, but others: one of the prophets.”", 1], [8, 29, "He said to them, “But who do you say that I am?” Peter answered, “You are the Christ.”", 1], [8, 30, "He commanded them that they should tell no one about him.", 1], [8, 31, "He began to teach them that the Son of Man must suffer many things, and be rejected by the elders, the chief priests, and the scribes, and be killed, and after three days rise again.", 0], [8, 32, "He spoke to them openly. Peter took him, and began to rebuke him.", 0], [8, 33, "But he, turning around, and seeing his disciples, rebuked Peter, and said, “Get behind me, Satan! For you have in mind not the things of God, but the things of men.”", 0], [8, 34, "He called the multitude to himself with his disciples, and said to them, “Whoever wants to come after me, let him deny himself, and take up his cross, and follow me.", 1], [8, 35, "For whoever wants to save his life will lose it; and whoever will lose his life for my sake and the sake of the Good News will save it.", 0], [8, 36, "For what does it profit a man, to gain the whole world, and forfeit his life?", 0], [8, 37, "For what will a man give in exchange for his life?", 0], [8, 38, "For whoever will be ashamed of me and of my words in this adulterous and sinful generation, the Son of Man also will be ashamed of him, when he comes in his Father’s glory, with the holy angels.”", 0], [9, 1, "He said to them, “Most certainly I tell you, there are some standing here who will in no way taste death until they see God’s Kingdom come with power.”", 1]]}]}, {"sel": 0, "segs": [{"ref": "Mark 9:2–50", "v": [[9, 2, "After six days Jesus took with him Peter, James, and John, and brought them up onto a high mountain privately by themselves, and he was changed into another form in front of them.", 1], [9, 3, "His clothing became glistening, exceedingly white, like snow, such as no launderer on earth can whiten them.", 0], [9, 4, "Elijah and Moses appeared to them, and they were talking with Jesus.", 0], [9, 5, "Peter answered Jesus, “Rabbi, it is good for us to be here. Let’s make three tents: one for you, one for Moses, and one for Elijah.”", 1], [9, 6, "For he didn’t know what to say, for they were very afraid.", 0], [9, 7, "A cloud came, overshadowing them, and a voice came out of the cloud, “This is my beloved Son. Listen to him.”", 1], [9, 8, "Suddenly looking around, they saw no one with them any more, except Jesus only.", 1], [9, 9, "As they were coming down from the mountain, he commanded them that they should tell no one what things they had seen, until after the Son of Man had risen from the dead.", 1], [9, 10, "They kept this saying to themselves, questioning what the “rising from the dead” meant.", 0], [9, 11, "They asked him, saying, “Why do the scribes say that Elijah must come first?”", 1], [9, 12, "He said to them, “Elijah indeed comes first, and restores all things. How is it written about the Son of Man, that he should suffer many things and be despised?", 1], [9, 13, "But I tell you that Elijah has come, and they have also done to him whatever they wanted to, even as it is written about him.”", 0], [9, 14, "Coming to the disciples, he saw a great multitude around them, and scribes questioning them.", 1], [9, 15, "Immediately all the multitude, when they saw him, were greatly amazed, and running to him, greeted him.", 0], [9, 16, "He asked the scribes, “What are you asking them?”", 0], [9, 17, "One of the multitude answered, “Teacher, I brought to you my son, who has a mute spirit;", 1], [9, 18, "and wherever it seizes him, it throws him down, and he foams at the mouth, and grinds his teeth, and wastes away. I asked your disciples to cast it out, and they weren’t able.”", 0], [9, 19, "He answered him, “Unbelieving generation, how long shall I be with you? How long shall I bear with you? Bring him to me.”", 1], [9, 20, "They brought him to him, and when he saw him, immediately the spirit convulsed him, and he fell on the ground, wallowing and foaming at the mouth.", 1], [9, 21, "He asked his father, “How long has it been since this has come to him?” He said, “From childhood.", 1], [9, 22, "Often it has cast him both into the fire and into the water to destroy him. But if you can do anything, have compassion on us, and help us.”", 0], [9, 23, "Jesus said to him, “If you can believe, all things are possible to him who believes.”", 1], [9, 24, "Immediately the father of the child cried out with tears, “I believe. Help my unbelief!”", 1], [9, 25, "When Jesus saw that a multitude came running together, he rebuked the unclean spirit, saying to him, “You mute and deaf spirit, I command you, come out of him, and never enter him again!”", 1], [9, 26, "After crying out and convulsing him greatly, it came out of him. The boy became like one dead, so much that most of them said, “He is dead.”", 1], [9, 27, "But Jesus took him by the hand, and raised him up; and he arose.", 0], [9, 28, "When he had come into the house, his disciples asked him privately, “Why couldn’t we cast it out?”", 1], [9, 29, "He said to them, “This kind can come out by nothing, except by prayer and fasting.”", 0], [9, 30, "They went out from there, and passed through Galilee. He didn’t want anyone to know it.", 1], [9, 31, "For he was teaching his disciples, and said to them, “The Son of Man is being handed over to the hands of men, and they will kill him; and when he is killed, on the third day he will rise again.”", 0], [9, 32, "But they didn’t understand the saying, and were afraid to ask him.", 1], [9, 33, "He came to Capernaum, and when he was in the house he asked them, “What were you arguing among yourselves on the way?”", 1], [9, 34, "But they were silent, for they had disputed with one another on the way about who was the greatest.", 1], [9, 35, "He sat down, and called the twelve; and he said to them, “If any man wants to be first, he shall be last of all, and servant of all.”", 1], [9, 36, "He took a little child, and set him in the middle of them. Taking him in his arms, he said to them,", 0], [9, 37, "“Whoever receives one such little child in my name, receives me, and whoever receives me, doesn’t receive me, but him who sent me.”", 0], [9, 38, "John said to him, “Teacher, we saw someone who doesn’t follow us casting out demons in your name; and we forbade him, because he doesn’t follow us.”", 1], [9, 39, "But Jesus said, “Don’t forbid him, for there is no one who will do a mighty work in my name, and be able quickly to speak evil of me.", 1], [9, 40, "For whoever is not against us is on our side.", 0], [9, 41, "For whoever will give you a cup of water to drink in my name, because you are Christ’s, most certainly I tell you, he will in no way lose his reward.", 0], [9, 42, "Whoever will cause one of these little ones who believe in me to stumble, it would be better for him if he were thrown into the sea with a millstone hung around his neck.", 0], [9, 43, "If your hand causes you to stumble, cut it off. It is better for you to enter into life maimed, rather than having your two hands to go into Gehenna, into the unquenchable fire,", 0], [9, 44, "‘where their worm doesn’t die, and the fire is not quenched.’", 0], [9, 45, "If your foot causes you to stumble, cut it off. It is better for you to enter into life lame, rather than having your two feet to be cast into Gehenna, into the fire that will never be quenched—", 0], [9, 46, "‘where their worm doesn’t die, and the fire is not quenched.’", 0], [9, 47, "If your eye causes you to stumble, cast it out. It is better for you to enter into God’s Kingdom with one eye, rather than having two eyes to be cast into the Gehenna of fire,", 0], [9, 48, "‘where their worm doesn’t die, and the fire is not quenched.’", 0], [9, 49, "For everyone will be salted with fire, and every sacrifice will be seasoned with salt.", 0], [9, 50, "Salt is good, but if the salt has lost its saltiness, with what will you season it? Have salt in yourselves, and be at peace with one another.”", 0]]}]}, {"sel": 0, "segs": [{"ref": "Mark 10:1–52", "v": [[10, 1, "He arose from there and came into the borders of Judea and beyond the Jordan. Multitudes came together to him again. As he usually did, he was again teaching them.", 1], [10, 2, "Pharisees came to him testing him, and asked him, “Is it lawful for a man to divorce his wife?”", 0], [10, 3, "He answered, “What did Moses command you?”", 1], [10, 4, "They said, “Moses allowed a certificate of divorce to be written, and to divorce her.”", 1], [10, 5, "But Jesus said to them, “For your hardness of heart, he wrote you this commandment.", 1], [10, 6, "But from the beginning of the creation, God made them male and female.", 0], [10, 7, "For this cause a man will leave his father and mother, and will join to his wife,", 0], [10, 8, "and the two will become one flesh, so that they are no longer two, but one flesh.", 0], [10, 9, "What therefore God has joined together, let no man separate.”", 0], [10, 10, "In the house, his disciples asked him again about the same matter.", 1], [10, 11, "He said to them, “Whoever divorces his wife, and marries another, commits adultery against her.", 0], [10, 12, "If a woman herself divorces her husband, and marries another, she commits adultery.”", 0], [10, 13, "They were bringing to him little children, that he should touch them, but the disciples rebuked those who were bringing them.", 1], [10, 14, "But when Jesus saw it, he was moved with indignation, and said to them, “Allow the little children to come to me! Don’t forbid them, for God’s Kingdom belongs to such as these.", 0], [10, 15, "Most certainly I tell you, whoever will not receive God’s Kingdom like a little child, he will in no way enter into it.”", 0], [10, 16, "He took them in his arms, and blessed them, laying his hands on them.", 0], [10, 17, "As he was going out into the way, one ran to him, knelt before him, and asked him, “Good Teacher, what shall I do that I may inherit eternal life?”", 1], [10, 18, "Jesus said to him, “Why do you call me good? No one is good except one—God.", 1], [10, 19, "You know the commandments: ‘Do not murder,’ ‘Do not commit adultery,’ ‘Do not steal,’ ‘Do not give false testimony,’ ‘Do not defraud,’ ‘Honor your father and mother.’ ”", 0], [10, 20, "He said to him, “Teacher, I have observed all these things from my youth.”",
