 his assets to the liability column, because they were keeping him from Christ."}, {"greek": "ὑπερέχω", "translit": "hyperechō", "gloss": "surpassing worth", "note": "To hold above, to be superior in value. The whole calculation turns on this word — the trade only makes sense if what he gained genuinely exceeds what he lost."}], "thread": "Paul wants a righteousness 'not my own.' Every credential he lists was legitimate — the problem wasn't that he'd earned them dishonestly, but that having them made it harder to receive what could only be given.", "elder": "What did you have to let go of — an identity, a position, an achievement — to actually follow Christ?", "first": "What's on your résumé that you'd struggle to count as loss? Say the specific thing.", "questions": ["Paul's credentials were real and legitimate. Why were they a liability rather than just neutral?", "He uses a crude word on purpose. Is there anything in your life you'd have that reaction to next to Christ — or is it all still valuable?", "'Righteousness not my own.' Where are you still building a case for yourself?"], "forge": "Write down your three biggest credentials — the things you'd mention to establish yourself. Pray over the list and ask God to show you which one is functioning as your righteousness.", "formation": {"culture": "A man is his résumé. Title, income, physique, platform, the schools, the reps — introductions are credential exchanges and worth is established in the first ninety seconds. The culture doesn't just permit this; it requires it, and a man with nothing to list feels like nothing.\n\nUnderneath is the impulse to build a case for ourselves before God and everyone else. Fig leaves were the first résumé. The Pharisee in the temple listed his accomplishments while the tax collector had nothing to present. What makes Paul's move so severe is that his credentials were genuinely excellent — this isn't a man dumping failures, it's a man dumping successes, because success is the harder idol to name.", "inventory": {"lead": "Which of your genuine accomplishments is quietly functioning as your righteousness — and how would you feel if it were taken?", "prompts": ["What do you mention early when meeting someone, and what are you hoping it establishes?", "If your top credential disappeared tomorrow, what would be left of your sense of being a man of worth?"], "land": "How do you see this pull — you are your résumé — shaping what you're unwilling to count as loss?"}, "step": {"milestone": "Week 5 of 8 — The Trade", "body": "Past the midpoint, and this week asks for something specific: naming an actual asset, not a vice. The mark of growth here is that a man can identify a legitimate accomplishment that's doing spiritual work it was never meant to do. A maturing man stops building the case for himself, because he's found a righteousness he could never have earned and doesn't have to defend."}, "prayer": "Father, I've built a case for myself out of real accomplishments, and it's kept me from receiving what only You can give. Show me which credential is functioning as my righteousness. Let knowing Christ be worth more to me than anything on my list — and let me actually feel the difference, not just say it. Amen."}}, {"n": 6, "passage": "3:12–21", "title": "Press On", "theme": "Forgetting what's behind, straining toward what's ahead", "context": "Paul immediately guards against a misreading. Having said he wants to know Christ, he clarifies that he hasn't arrived — and gives the athletic image that defines his whole approach to the Christian life.", "text": "Not that I have already obtained this or am already perfect, but I press on to make it my own, because Christ Jesus has made me His own. Brothers, I do not consider that I have made it my own. But one thing I do: forgetting what lies behind and straining forward to what lies ahead, I press on toward the goal for the prize of the upward call of God in Christ Jesus. Their end is destruction, their god is their belly, they glory in their shame, with minds set on earthly things. But our citizenship is in heaven, and from it we await a Savior, the Lord Jesus Christ.", "words": [{"greek": "διώκω", "translit": "diōkō", "gloss": "press on / pursue", "note": "To chase down, the word for a hunter pursuing prey or a runner driving for the tape. The same word used for persecuting — the intensity Paul once aimed at the church he now aims at Christ."}, {"greek": "ἐπεκτείνομαι", "translit": "epekteinomai", "gloss": "straining forward", "note": "A runner's word — body stretched out, head forward, everything reaching for the line. It describes physical strain, not calm intention."}, {"greek": "πολίτευμα", "translit": "politeuma", "gloss": "citizenship / commonwealth", "note": "Philippi was a Roman colony whose residents held Roman citizenship though most had never seen Rome. Paul reuses their proudest fact as an analogy: your real colony is elsewhere."}], "thread": "'I press on to make it my own, because Christ Jesus has made me His own.' The pursuit is a response to already being possessed. A man runs hard not to secure the prize but because he's already been secured.", "elder": "What has kept you pressing on over decades when other men drifted? Be specific about the practices.", "first": "What's behind you that you can't seem to stop looking at — a failure or a success?", "questions": ["Paul says he hasn't arrived. Where have you quietly settled and called it maturity?", "'Forgetting what lies behind' includes past wins, not just failures. Which is harder for you to leave?", "'Their god is their belly' — appetite as the thing you serve. Where does that describe you honestly?"], "forge": "Name the one thing behind you — failure or success — that's keeping you from straining forward. Tell one man what it is and what pressing on would actually require this week.", "formation": {"culture": "The culture keeps a man staring backward. Every platform is an archive of his highlights and his worst moments, and the algorithm serves both. He's either nostalgic for a version of himself he can't return to, or shackled to a failure he can't outrun. Meanwhile arrival is sold constantly — the idea that some achievement will finally settle it.\n\nUnderneath is a very old backward pull. Israel in the wilderness kept looking back at Egypt — at the food, not the chains. Lot's wife turned around. The heart romanticizes what's behind because what's ahead requires strain. Paul's language is deliberately athletic: forward motion is uncomfortable, it costs, and a man doesn't drift into it. He also refuses the fantasy of arrival — he hasn't obtained it and says so twice.", "inventory": {"lead": "What are you still looking back at — the failure or the highlight — and how is it keeping you from straining forward?", "prompts": ["Is your backward pull shame or nostalgia? Name the specific memory you keep returning to.", "Where have you quietly decided you've arrived and stopped pressing? What's the evidence?"], "land": "How do you see this pull — nostalgia and shame both looking backward — shaping whether you're actually moving?"}, "step": {"milestone": "Week 6 of 8 — Straining Forward", "body": "Late in the letter, the question shifts from what a man believes to whether he's still moving. The mark of growth here is that he can name what's behind him that has his attention and take one concrete step forward anyway. A maturing man neither romanticizes his past nor hides from it — he presses on, because the One who already took hold of him is ahead, not behind."}, "prayer": "Father, I keep looking backward — sometimes at my failures, sometimes at my best days — and either way I've stopped running. You took hold of me; let that be why I press on rather than what I'm trying to earn. Show me what to leave behind this week, and give me the strain to reach forward. Amen."}}, {"n": 7, "passage": "4:1–9", "title": "Anxious for Nothing", "theme": "Peace that guards — and what a man puts in his mind", "context": "Paul names two women in a public letter because their conflict is threatening the church, then moves straight into his most quoted passage on anxiety. The placement isn't accidental — the peace he describes is offered right where relational tension is real.", "text": "I entreat Euodia and Syntyche to agree in the Lord. Rejoice in the Lord always; again I will say, rejoice. Let your reasonableness be known to everyone. The Lord is at hand; do not be anxious about anything, but in everything by prayer and supplication with thanksgiving let your requests be made known to God. And the peace of God, which surpasses all understanding, will guard your hearts and minds in Christ Jesus. Finally, whatever is true, honorable, just, pure, lovely, commendable — if there is any excellence, anything worthy of praise — think about these things. What you have learned and received and heard and seen in me, practice these things, and the God of peace will be with you.", "words": [{"greek": "ἐπιεικής", "translit": "epieikēs", "gloss": "reasonableness / forbearance", "note": "The quality of not insisting on your full rights — gentle fairness that yields. Notoriously hard to translate. Paul puts it right after a conflict between two people, on purpose."}, {"greek": "φρουρέω", "translit": "phroureō", "gloss": "to guard / garrison", "note": "A military term for soldiers standing watch at a city gate. Philippi had a garrison. Peace isn't described as a feeling here — it's a posted sentry around the mind."}, {"greek": "λογίζομαι", "translit": "logizomai", "gloss": "to reckon / calculate", "note": "An accounting term — to take inventory deliberately. 'Think about these things' is not passive musing but the intentional work of counting up what's true."}], "thread": "The peace 'surpasses understanding' and guards like a garrison — it isn't produced by figuring the situation out. A man can have peace before he has answers, which is the only reason peace is available in most real situations.", "elder": "What have you learned about handling anxiety over the years that actually works?", "first": "What are you anxious about right now that you've never specifically prayed about? Name it.", "questions": ["Paul pairs prayer with thanksgiving. Why do you think gratitude is part of the prescription for anxiety?", "Peace 'guards' like a garrison rather than explaining. Where do you need peace before you'll get answers?", "Verse 8 is a deliberate inventory of what you put in your mind. What's actually on your list right now?"], "forge": "Take the specific thing you're most anxious about. Pray it through with thanksgiving every day this week — actual words, not vague worry — and write down what changes.", "formation": {"culture": "Anxiety is now the water a man swims in and the culture has monetized it. Stay informed, stay ahead, stay ready — the vigilance never ends and there's always another thing to track. And a man is told to manage it privately: medicate it, optimize it, out-work it, but don't say it out loud.\n\nUnderneath is a very old refusal to hand things over. Anxiety is, at bottom, carrying what you were never designed to carry — being your own providence. The Israelites gathering extra manna were doing exactly this. Paul's antidote is almost offensively simple: pray specifically, give thanks, and then deliberately control what you put in your mind. Two of the three are things a man can start this week, and the third is God's job.", "inventory": {"lead": "What are you carrying as though its outcome depends on your vigilance — and have you ever actually handed it over in words?", "prompts": ["Name the anxiety you've thought about a hundred times and prayed about specifically maybe once.", "Run verse 8 against your actual intake this week. What's genuinely on the list — true, honorable, pure?"], "land": "How do you see this pull — endless vigilance, private management — shaping what you carry alone?"}, "step": {"milestone": "Week 7 of 8 — Guarded, Not Figured Out", "body": "Near the end, and this is the week that most directly meets a man where he actually lives. The mark of growth here is that he's prayed something specifically rather than worried about it generally, and that he's taken inventory of what he's feeding his mind. A maturing man stops requiring answers before he'll accept peace."}, "prayer": "Father, I've carried things as though the outcome depended on my vigilance, and I've called it responsibility. Teach me to actually hand it over in words instead of turning it over in my head. Guard my heart and mind with a peace I don't have to understand first. And help me be deliberate about what I let in. Amen."}}, {"n": 8, "passage": "4:10–23", "title": "The Secret of Contentment", "theme": "Learned contentment, real generosity, and strength for either", "context": "Paul closes by thanking them for a financial gift, but he's careful — he wants them to know his joy wasn't contingent on it. What he says about contentment is one of the most misused verses in scripture, and its actual context is money.", "text": "I rejoiced greatly that now at length you have revived your concern for me. Not that I am speaking of being in need, for I have learned in whatever situation I am to be content. I know how to be brought low, and I know how to abound. In any and every circumstance, I have learned the secret of facing plenty and hunger, abundance and need. I can do all things through Him who strengthens me. Yet it was kind of you to share my trouble. And my God will supply every need of yours according to His riches in glory in Christ Jesus.", "words": [{"greek": "αὐτάρκης", "translit": "autarkēs", "gloss": "content / self-sufficient", "note": "A Stoic term meaning independent of circumstances. Paul borrows it and redefines it — his sufficiency isn't in himself but in Christ, which is the opposite of what the Stoics meant."}, {"greek": "μυέω", "translit": "myeō", "gloss": "learned the secret / initiated", "note": "The word for being initiated into a mystery religion. Paul says contentment came through a process of initiation — it was learned over time, not received at conversion."}, {"greek": "ἐνδυναμόω", "translit": "endynamoō", "gloss": "to strengthen / empower", "note": "'I can do all things through Him who strengthens me' — in context this means enduring plenty and hunger, not achieving whatever you want. The strength is for contentment in either direction."}], "thread": "'I have learned' — contentment isn't a temperament some men are born with. Paul was initiated into it through both abundance and hunger, which means the circumstances a man resents may be the exact curriculum.", "elder": "Which was harder for you spiritually — the lean years or the good ones? What did each teach you?", "first": "Which are you in right now, plenty or need — and how is it affecting your walk with God?", "questions": ["Paul says he learned contentment. What has God used to teach it to you, and are you still resisting the lesson?", "He says abundance required learning too. How can plenty be as spiritually dangerous as need?", "'I can do all things' is about enduring both extremes. How does that context change how you've used that verse?"], "forge": "Give something away this week that costs you — money, time, or a possession you'd rather keep. Then name out loud one thing you're content with that you've been treating as not enough.", "formation": {"culture": "The culture is built on manufactured discontent. Every ad, feed, and comparison exists to make a man aware of a gap, and contentment would break the whole machine. So he's trained to always be one upgrade away — and to read that restlessness as ambition rather than as the appetite it is.\n\nUnderneath is the oldest dissatisfaction there is: a garden full of everything and one tree that wasn't enough. Israel had manna every morning and wanted meat. The heart's default is to notice the gap. What's striking in Paul is that he names abundance as equally dangerous — he had to learn contentment in plenty too. Most men assume more would settle them. Paul says he had to be initiated into being content with more, same as with less.", "inventory": {"lead": "Where is manufactured discontent running you — and what would it take for you to call what you have enough?", "prompts": ["Name the gap you're most aware of right now. Who told you it was a gap?", "Which has done more spiritual damage to you: not having, or having? Be honest about the season you're in."], "land": "How do you see this pull — always one upgrade from enough — shaping your peace and your generosity?"}, "step": {"milestone": "Week 8 of 8 — Learned Contentment", "body": "You've reached the end. Look back at eight weeks — God's follow-through, a life with nothing left to threaten, the downward move, effort without panic, credentials counted as loss, straining forward, peace as a garrison, and now contentment learned in both directions. The mark of a man finishing well here isn't that his circumstances improved; it's that he's stopped requiring them to. Paul wrote every word of this in chains, joyful, having learned the secret. That was available to him and it's available to you — but it's learned, which means the season you're resenting may be the classroom."}, "prayer": "Father, I've let manufactured discontent set the terms of my life and called it drive. Teach me the secret Paul learned — in plenty and in need. Strengthen me not to get more but to be content with what You've given. Let me hold it loosely enough to give some of it away. Thank You that You supply what I actually need. Amen."}}]}, {"id": "proverbs", "title": "The Trained Man", "subtitle": "A Man's Study in Proverbs", "book": "Proverbs", "weeks": 10, "status": "complete", "accent": "#2A8C8C", "blurb": "A father teaching his son how to live. Fear of the Lord, the company you keep, money, work, the tongue, appetite, anger, and the long arc of a disciplined life. Organized by theme, not chapter.", "sessions": [{"n": 1, "passage": "1:1–7; 9:10", "title": "Where Wisdom Starts", "theme": "The fear of the Lord — the beginning, not the topic", "context": "Proverbs is a father's instruction to his son, collected largely under Solomon. It isn't a book of promises; it's a book of patterns — how life generally works when God designed it. Read it as a father talking, not a contract. And notice it opens by telling you where wisdom starts, before it tells you anything else.", "text": "The proverbs of Solomon, son of David, king of Israel: to know wisdom and instruction, to understand words of insight, to receive instruction in wise dealing, in righteousness, justice, and equity; to give prudence to the simple, knowledge and discretion to the youth. The fear of the LORD is the beginning of knowledge; fools despise wisdom and instruction. The fear of the LORD is the beginning of wisdom, and the knowledge of the Holy One is insight.", "words": [{"greek": "יִרְאַת יְהוָה", "translit": "yir'at YHWH", "gloss": "the fear of the LORD", "note": "Not terror and not mere respect. The awed recognition that God is God and you are not — the posture that makes learning possible. A man who has it can be taught; a man without it cannot."}, {"greek": "חָכְמָה", "translit": "chokmah", "gloss": "wisdom / skill", "note": "Used of craftsmen building the tabernacle — skill in making something well. Biblical wisdom is less about knowing facts than about skillful living, the way a carpenter knows wood."}, {"greek": "אֱוִיל", "translit": "evil", "gloss": "fool", "note": "One of several Hebrew words for fool. This one isn't unintelligent — he's morally stubborn. He despises instruction not because he can't grasp it but because he won't be corrected."}], "thread": "Christ is called the wisdom of God, and in Him are hidden all the treasures of wisdom and knowledge. Proverbs describes wisdom as something to pursue; the New Testament reveals wisdom as a person you can know.", "elder": "Who taught you to fear the Lord — and what did that look like in practice, not in theory?", "first": "Be honest: is there anyone in your life right now who is actually allowed to correct you?", "questions": ["'Fools despise instruction' — the issue is teachability, not intelligence. Where are you unteachable right now?", "Wisdom is described as skill, like a craftsman's. What area of life are you unskilled in and have stopped trying to improve?", "What would change this week if you actually lived like God is God and you are not?"], "forge": "Ask one man in this group to name a blind spot he sees in you. Don't defend, explain, or contextualize. Just write it down and say thank you.", "formation": {"culture": "The culture tells a man to trust himself above all — follow your gut, be your own authority, nobody knows you like you do. Correction is reframed as disrespect, and submission to any outside authority reads as weakness. A man is expected to be the final court of appeal on his own life.\n\nUnderneath is the original offer: you will be like God, deciding for yourself what is good. That instinct doesn't feel like rebellion from the inside — it feels like maturity and independence. Which is exactly why the fool in Proverbs isn't stupid. He's a man who cannot be told anything, and he's usually confident. Wisdom starts the moment a man accepts that he is not the highest authority on himself.", "inventory": {"lead": "Who is actually allowed to tell you something you don't want to hear — and when did you last let them?", "prompts": ["Name the last correction you received. Did you receive it, or did you explain why they were wrong?", "Where are you the final authority in your life in a way you'd never say out loud?"], "land": "How do you see this cultural pull — trust yourself above all — shaping whether you can actually be taught?"}, "step": {"milestone": "Week 1 of 10 — Teachable", "body": "Everything in this book depends on whether a man can be told something. The mark of a man starting well here isn't that he knows more — it's that he's opened a door for someone to correct him and didn't slam it. A maturing man knows the difference between the fool and the wise man in Proverbs isn't intelligence; it's whether instruction gets in."}, "prayer": "Father, I've made myself the final authority on my own life and called it being my own man. Give me the fear of the LORD — the honest recognition that You are God and I am not. Make me teachable. Send men who will tell me the truth, and give me the humility to actually hear it. Amen."}}, {"n": 2, "passage": "13:20; 27:17; 22:24–25; 18:24", "title": "The Company You Keep", "theme": "Friendship, influence, and who you're becoming by proximity", "context": "Proverbs assumes what modern men often deny: you become like the men you're around. It's stated as a mechanism, not a warning — proximity does its work whether you intend it or not.", "text": "Whoever walks with the wise becomes wise, but the companion of fools will suffer harm. Iron sharpens iron, and one man sharpens another. Make no friendship with a man given to anger, nor go with a wrathful man, lest you learn his ways and entangle yourself in a snare. A man of many companions may come to ruin, but there is a friend who sticks closer than a brother.", "words": [{"greek": "הָלַךְ", "translit": "halak", "gloss": "to walk", "note": "Ongoing movement, not a single visit. 'Walks with the wise' means sustained proximity over time — the influence in this proverb is slow, not immediate."}, {"greek": "חָדַד", "translit": "chadad", "gloss": "to sharpen", "note": "Iron on iron produces friction, heat, and sparks — and removes metal. Sharpening is not a comfortable process and both blades lose something."}, {"greek": "דָּבֵק", "translit": "dabeq", "gloss": "cling / stick close", "note": "The same root used for a man clinging to his wife in Genesis 2. Applied to friendship, it describes a bond of loyalty stronger than blood relation."}], "thread": "Christ called His disciples friends and laid down His life for them — the friend who sticks closer than a brother. Every good friendship in Proverbs is a shadow of the one He offers.", "elder": "Who has sharpened you most over the years — and what did that friendship actually cost both of you?", "first": "Who are the three men you spend the most time with? Are you becoming more like them or less?", "questions": ["'Walks with' means sustained proximity. Who's shaping you right now that you didn't consciously choose?", "Iron sharpening iron involves friction and loss. Where have you avoided a friendship that would actually sharpen you because it'd be uncomfortable?", "Proverbs warns specifically about the angry man's influence. Whose patterns are you picking up without noticing?"], "forge": "Identify one relationship that's dulling you and one that would sharpen you. Take a concrete step this week — reduce the first, initiate the second. Tell the group both names.", "formation": {"culture": "The culture insists a man is a self-made individual, uninfluenced by his surroundings — that he can consume anything, spend time with anyone, and remain untouched. Meanwhile it has engineered the most powerful influence machinery in history and calls it entertainment. A man is told he's immune and simultaneously farmed for his attention.\n\nUnderneath is the pride of thinking we're the exception. Lot pitched his tent toward Sodom and ended up in it. Solomon's own wives turned his heart. Proverbs treats influence as physics — walk with the wise and you become wise; keep company with fools and you suffer harm. The mechanism doesn't ask your permission or care about your intentions.", "inventory": {"lead": "Who are you becoming by proximity — and would you have chosen it on purpose?", "prompts": ["Name the three voices you hear most in a week, counting screens. What are they forming in you?", "Where have you told yourself you're the exception — that this influence doesn't affect you?"], "land": "How do you see this pull — you are the self-made exception — shaping who you let close?"}, "step": {"milestone": "Week 2 of 10 — Sharpened or Dulled", "body": "Wisdom is caught more than taught, which makes proximity a decision rather than an accident. The mark of growth here is that a man has actually moved — pulled back from one relationship and stepped toward another. A maturing man stops assuming he's immune and starts choosing his influences the way he'd choose a diet."}, "prayer": "Father, I've assumed I'm the exception — that I can be around anything and stay unchanged. Show me who's actually forming me. Give me the courage to pull back from what's dulling me and to pursue the friendship that will cost me something and make me sharper. Amen."}}, {"n": 3, "passage": "10:4; 12:11; 6:6–11; 22:29", "title": "Work and the Sluggard", "theme": "Diligence, laziness, and the man who's good at what he does", "context": "Proverbs devotes remarkable attention to the sluggard — and portrays him not as a man who refuses to work but as a man who always has a reason. He's comic and tragic at once, and the humor is deliberate.", "text": "A slack hand causes poverty, but the hand of the diligent makes rich. Whoever works his land will have plenty of bread, but he who follows worthless pursuits lacks sense. Go to the ant, O sluggard; consider her ways, and be wise. Without having any chief, officer, or ruler, she prepares her bread in summer and gathers her food in harvest. How long will you lie there, O sluggard? A little sleep, a little slumber, a little folding of the hands to rest, and poverty will come upon you like a robber. Do you see a man skillful in his work? He will stand before kings.", "words": [{"greek": "עָצֵל", "translit": "atsel", "gloss": "sluggard", "note": "Appears fourteen times in Proverbs and nowhere else in scripture. He's not unemployed — he's a man who starts and doesn't finish, always with a plausible reason."}, {"greek": "חָרוּץ", "translit": "charuts", "gloss": "diligent", "note": "Originally 'sharp' or 'cut into' — decisive, incisive. The diligent man isn't merely busy; he's pointed. Busyness and diligence are not the same thing in Proverbs."}, {"greek": "מָהִיר", "translit": "mahir", "gloss": "skillful / quick", "note": "Used of a scribe skilled in his craft. 'Skillful in his work' is what puts a man before kings — competence is treated as a spiritual matter, not just an economic one."}], "thread": "Christ said 'My Father is working until now, and I am working.' Work isn't a curse in scripture — it predates the fall. The curse added thorns, not labor. A man's diligence reflects the God who works.", "elder": "What did you learn about work from your father or the man who trained you — good or bad?", "first": "Where do you start things and not finish them? Name the actual pattern.", "questions": ["The sluggard always has a reason. What's your most frequent reason for not doing the thing you know you should?", "Proverbs distinguishes busy from diligent. Which are you, honestly, and what's the evidence?", "'Skillful in his work' stands before kings. Where have you stopped trying to get better at what you do?"], "forge": "Name one thing you've started and abandoned. This week, either finish it, formally kill it, or schedule the next concrete step. No fourth option.", "formation": {"culture": "The culture sells two false pictures of work. One is the hustle — worth measured in output, rest treated as weakness, a man's identity fused to his production. The other is the escape — work as the thing to minimize, optimize away, or retire from as fast as possible. Neither treats work as good in itself.\n\nUnderneath is the fall's distortion of something that was originally a gift. Adam was given a garden to work before there was any curse in it. The sluggard's problem in Proverbs isn't that he hates work in principle — it's that he wants the harvest without the season, and he can always explain the delay. That instinct to want the result without the process is as old as Eden and it's remarkably easy to justify.", "inventory": {"lead": "Where do you want the harvest without the season — and what reason have you been using?", "prompts": ["Name the thing you've abandoned or perpetually delayed. Say the actual excuse you use out loud.", "Is your failure closer to the hustle or the escape? What is it costing the people around you?"], "land": "How do you see this pull — identity fused to output, or escape from work entirely — shaping how you labor?"}, "step": {"milestone": "Week 3 of 10 — Diligence Over Excuses", "body": "This is the most practical week so far and the easiest to nod along to without changing. The mark of growth here is that a man has closed a loop — finished something, killed something, or scheduled a real next step. A maturing man stops narrating his intentions and starts producing evidence, and he can tell the difference between being busy and being diligent."}, "prayer": "Father, I want harvests I haven't worked for and I'm skilled at explaining the delay. Show me the pattern of starting and not finishing. Make me diligent rather than merely busy. Let me work as a man made in the image of a God who works. Amen."}}, {"n": 4, "passage": "3:9–10; 11:24–25; 22:7; 30:8–9", "title": "Money, Generosity, and Enough", "theme": "Wealth, debt, giving, and the prayer for neither poverty nor riches", "context": "Proverbs talks about money constantly and without embarrassment — how it's earned, kept, given, and lost. Agur's prayer in chapter 30 is one of the most unusual requests in scripture, and it names both dangers honestly.", "text": "Honor the LORD with your wealth and with the firstfruits of all your produce; then your barns will be filled with plenty. One gives freely, yet grows all the richer; another withholds what he should give, and only suffers want. Whoever brings blessing will be enriched, and one who waters will himself be watered. The rich rules over the poor, and the borrower is the slave of the lender. Two things I ask of you; deny them not before I die: remove far from me falsehood and lying; give me neither poverty nor riches; feed me with the food that is needful for me, lest I be full and deny you and say, 'Who is the LORD?' or lest I be poor and steal and profane the name of my God.", "words": [{"greek": "רֵאשִׁית", "translit": "reshit", "gloss": "firstfruits / first portion", "note": "The first and best, given before you know how the rest of the harvest turns out. Honoring God with the first portion is an act of trust precisely because the outcome isn't yet secured."}, {"greek": "עֶבֶד", "translit": "eved", "gloss": "slave / servant", "note": "The ordinary word for a bondservant. 'The borrower is the slave of the lender' is not a metaphor about feelings — it's a statement about who actually controls your options."}, {"greek": "חֹק", "translit": "choq", "gloss": "portion / allotted measure", "note": "Agur asks for his allotted portion — the ration assigned to him. Not more, not less. A deliberate request for enough, which almost no man prays."}], "thread": "Christ, though rich, became poor for our sake, so that by His poverty we might become rich. Every instruction about generosity in Proverbs is downstream of a God who gave first and gave most.", "elder": "What have you learned about money over a lifetime that you wish someone had told you at thirty?", "first": "What's your relationship with money right now — fear, control, avoidance, or something else? Name it.", "questions": ["Firstfruits means giving before you know how it turns out. Where do you give from the leftovers instead?", "'The borrower is slave to the lender.' Where has debt actually limited your freedom to obey God?", "Agur asks for neither poverty nor riches. Could you honestly pray that prayer? What in you resists it?"], "forge": "Look at what you actually gave last month, not what you intended. Then give one gift this week that costs you something you'd notice.", "formation": {"culture": "Money is the culture's real scoreboard, and it's never done counting. More is always the answer — more income, more margin, more security — and a man's worth quietly indexes to his number. Generosity is treated as something you do after you've arrived, which conveniently never happens.\n\nUnderneath is the ancient belief that security can be stored. The rich fool built bigger barns. Israel gathered extra manna and watched it rot. Agur's prayer is startling because he names both dangers — riches make a man say 'who is the LORD,' and poverty makes him steal. Most men only fear one of those, and it's rarely the first one. A man who can't say 'enough' has no defense against the scoreboard.", "inventory": {"lead": "What number would finally be enough — and what does it tell you that the number has always moved?", "prompts": ["Does your giving come off the top or out of the leftovers? Look at last month, not your intentions.", "Which of Agur's two dangers is actually yours right now — forgetting God in plenty, or panicking in lack?"], "land": "How do you see this pull — the endless scoreboard — shaping your generosity and your peace?"}, "step": {"milestone": "Week 4 of 10 — Money in Its Place", "body": "This is where a man's theology gets tested by his bank statement. The mark of growth here is that he's looked at actual numbers rather than intentions, and given something that registered. A maturing man can say the word 'enough' and mean it, and he gives from the first portion rather than what's left after everything else got its share."}, "prayer": "Father, I've let a moving number decide whether I'm doing well, and my giving has come from the leftovers. Teach me to honor You with the first portion, before I know how it turns out. Give me neither poverty nor riches — give me enough, and make me content with it. Amen."}}, {"n": 5, "passage": "10:19; 15:1; 18:21; 26:20–22", "title": "The Weight of Words", "theme": "The tongue, gossip, and the answer that turns away wrath", "context": "Proverbs returns to speech more than almost any other subject. It treats words as having actual force — capable of building or destroying — and it's brutally specific about gossip, which most men don't classify as a sin at all.", "text": "When words are many, transgression is not lacking, but whoever restrains his lips is prudent. A soft answer turns away wrath, but a harsh word stirs up anger. Death and life are in the power of the tongue, and those who love it will eat its fruits. For lack of wood the fire goes out, and where there is no whisperer, quarreling ceases. The words of a whisperer are like delicious morsels; they go down into the inner parts of the body.", "words": [{"greek": "נִרְגָּן", "translit": "nirgan", "gloss": "whisperer / gossip", "note": "One who murmurs and mutters — passing information in a lowered voice. Proverbs treats him as the fuel supply of a fire; remove him and the quarrel dies for lack of wood."}, {"greek": "רַךְ", "translit": "rak", "gloss": "soft / tender", "note": "Gentle, yielding. The soft answer isn't weak or dishonest — it's deliberately non-escalating, and Proverbs presents it as the more powerful move."}, {"greek": "מִתְלַהֲמִים", "translit": "mitlahamim", "gloss": "delicious morsels", "note": "Choice bits of food swallowed greedily. The word describes how gossip is received — it tastes good going down, which is exactly why it spreads."}], "thread": "'No corrupting talk, only such as is good for building up' — and Christ Himself is called the Word. A man's speech either reflects the God who speaks and creates, or the accuser who slanders.", "elder": "When have your words done real damage — and what did you learn about your mouth from it?", "first": "Where does your speech run ahead of your judgment most — anger, humor, or gossip?", "questions": ["'When words are many, transgression is not lacking.' Where do you talk too much, and what's driving it?", "Proverbs says gossip tastes good. Be honest — why do you actually enjoy hearing something about someone?", "A soft answer is presented as the stronger move. Where would that cost you the most to try this week?"], "forge": "Go one week without saying anything about a person you wouldn't say with them in the room. When you catch yourself, stop mid-sentence. Report how often it happened.", "formation": {"culture": "The culture rewards the fastest, sharpest mouth. Wit is currency, the takedown gets applause, and a man is measured by how well he can cut. And gossip has been fully rebranded — it's venting, processing, keeping people informed, asking for prayer. Almost nothing is called what it is.\n\nUnderneath is an ancient use of the tongue: to elevate ourselves by lowering someone else. The serpent's first act was to speak against God's character. Slander is not a small sin in scripture — it's the accuser's own trade. What makes Proverbs uncomfortable is how it names the pleasure: gossip goes down like delicious morsels. Men don't gossip because they're careless. They do it because it tastes good.", "inventory": {"lead": "What have you said about someone recently that you wouldn't have said with them standing there — and what did you get out of saying it?", "prompts": ["Name your category: sharp humor, angry escalation, or the whisper. Which is your particular failure?", "Proverbs says gossip is enjoyable. What need in you does it actually feed?"], "land": "How do you see this pull — wit as currency, gossip renamed — shaping how you use your mouth?"}, "step": {"milestone": "Week 5 of 10 — Restrained Speech", "body": "The midpoint, and the sin most men have never once confessed. The mark of growth here isn't smoother speech — it's that a man has caught himself mid-sentence and stopped, and can name what the gossip was feeding. A maturing man understands that his tongue is disproportionate to its size, and he stops treating his words as harmless."}, "prayer": "Father, my mouth has run ahead of my judgment and I've called it honesty, humor, or venting. Show me what I'm actually feeding when I speak about people. Restrain my lips. Give me the soft answer where I want the sharp one, and make my words build instead of burn. Amen."}}, {"n": 6, "passage": "5:1–14; 6:27–29; 7:6–23", "title": "Appetite and the Path", "theme": "Sexual wisdom — the path, the cost, and the honest accounting", "context": "A father warns his son about sexual sin across multiple chapters, and the striking thing is his method. He doesn't moralize in the abstract — he walks the son down the road step by step and shows him where it ends.", "text": "My son, be attentive to my wisdom; for the lips of a forbidden woman drip honey, and her speech is smoother than oil, but in the end she is bitter as wormwood, sharp as a two-edged sword. Her feet go down to death; her steps follow the path to Sheol. Keep your way far from her, lest you give your honor to others and your years to the merciless. Can a man carry fire next to his chest and his clothes not be burned? At the end of your life you groan, when your flesh and body are consumed, and you say, 'How I hated discipline, and my heart despised reproof!'", "words": [{"greek": "לַעֲנָה", "translit": "la'anah", "gloss": "wormwood", "note": "A bitter desert plant. The contrast is deliberate — honey at the lips, wormwood in the end. Proverbs never denies that sin tastes good at the start; it insists on showing the finish."}, {"greek": "מוּסָר", "translit": "musar", "gloss": "discipline / correction", "note": "Training that involves correction, often painful. The regret at the end of chapter 5 is specifically about having hated this — not about the woman, but about refusing correction."}, {"greek": "דֶּרֶךְ", "translit": "derek", "gloss": "way / path", "note": "A road, a habitual course. Proverbs treats sexual sin as a path with a direction and a destination, not as isolated incidents. You don't arrive somewhere you weren't walking toward."}], "thread": "Christ was tempted in every way as we are, yet without sin — and He is able to sympathize with weakness. Proverbs shows the road; the gospel offers both a way out mid-road and mercy for the man already far down it.", "elder": "What have you learned about guarding yourself in this area that a younger man wouldn't think of?", "first": "What's the first step on the path for you — not the act, the step before it?", "questions": ["Proverbs shows the whole road rather than just condemning the destination. What's your actual first step, and where does it usually happen?", "The regret in chapter 5 is about hating correction, not just about the sin. Who could have told you the truth, and did you let them?", "'Can a man carry fire next to his chest?' Where are you playing with proximity and calling it control?"], "forge": "Name the specific first step on your path — the app, the hour, the room, the situation. Put one concrete barrier there this week and tell one man exactly what it is so he can check.", "formation": {"culture": "The culture has made sexual sin frictionless, private, and reframed as health. It's available in seconds, requires no relationship, leaves no obvious evidence, and any conviction about it is treated as repression or shame. The one thing never discussed is the arc — where the road actually goes.\n\nUnderneath is the oldest pattern in the book: something that looks good, promises life, and delivers isolation. Proverbs is unusually honest that the honey is real — it doesn't pretend the appeal is fake. What it insists on is the accounting. Fire against the chest burns regardless of intent, and the road has a destination whether or not a man is thinking about it while he walks. The father's warning is not that the son will be caught. It's that he'll arrive.", "inventory": {"lead": "What's the first step on your path — the one before the one you'd confess — and what have you told yourself about it?", "prompts": ["Where are you carrying fire against your chest and calling it self-control?", "Who actually knows the truth about this area? If no one, what is the secrecy protecting?"], "land": "How do you see this pull — frictionless, private, relabeled as health — shaping what you permit yourself?"}, "step": {"milestone": "Week 6 of 10 — Off the Path", "body": "The most confronting week in the book, and the one most likely to get vague answers. The mark of growth here is specific and verifiable: a man has named his actual first step and put a real barrier there with one other man knowing. A maturing man stops negotiating privately with something that has a known destination."}, "prayer": "Father, I've let something honey-sweet stay in my life without ever looking at where the road ends. Give me the honesty to name the first step, not just the act. Put men around me who will ask. Let me hate the path more than I love the taste, and give me mercy for how far I've already walked. Amen."}}, {"n": 7, "passage": "14:29; 15:18; 16:32; 19:11; 29:11", "title": "Slow to Anger", "theme": "Self-control, provocation, and the strength of restraint", "context": "Proverbs treats anger management not as temperament but as strength — and ranks it above military conquest. In an honor culture where a slight demanded response, that ranking was countercultural.", "text": "Whoever is slow to anger has great understanding, but he who has a hasty temper exalts folly. A hot-tempered man stirs up strife, but he who is slow to anger quiets contention. Whoever is slow to anger is better than the mighty, and he who rules his spirit than he who takes a city. Good sense makes one slow to anger, and it is his glory to overlook an offense. A fool gives full vent to his spirit, but a wise man quietly holds it back.", "words": [{"greek": "אֶרֶךְ אַפַּיִם", "translit": "erek appayim", "gloss": "slow to anger", "note": "Literally 'long of nostrils' — an idiom from the flaring of the nose in rage. A long fuse. The same phrase describes God's own character in Exodus 34."}, {"greek": "מָשַׁל", "translit": "mashal", "gloss": "to rule", "note": "To govern or have dominion — used of kings. Applied here to a man's own spirit, and rated above capturing a city. The hardest territory to govern is yourself."}, {"greek": "עָבַר", "translit": "avar", "gloss": "to pass over / overlook", "note": "To let something go by without responding. Proverbs calls this a man's glory — the deliberate choice not to collect on a slight."}], "thread": "'Slow to anger' is God's own self-description. A man who rules his spirit is imitating the character God announced about Himself — abounding in steadfast love, slow to anger.", "elder": "What's helped you actually govern your temper over the years? Something practical.", "first": "What provokes you fastest — being disrespected, being wrong, or being inconvenienced?", "questions": ["Proverbs rates ruling your spirit above taking a city. Why do you think it's harder?", "'It is his glory to overlook an offense.' What offense are you currently unwilling to let pass?", "The fool 'gives full vent.' Where has venting been called honesty in your life?"], "forge": "Identify your fastest trigger. This week, when it fires, delay your response by a full sixty seconds before speaking. Report what changed and what it cost.", "formation": {"culture": "The culture treats venting as health and restraint as repression. Let it out, don't bottle it up, express what you feel — and anyone asking you to govern yourself is asking you to be inauthentic. Meanwhile outrage is monetized, and a man is trained by every platform to respond fast and hot.\n\nUnderneath is an old confusion between having a feeling and being ruled by one. Cain's face fell and God warned him that sin was crouching at the door — the anger wasn't the sin, the surrender to it was. Proverbs doesn't say a man shouldn't feel anger; it says the fool gives it full vent while the wise man holds it back. And it ranks that restraint above conquest, which tells you how rare and how strong it actually is.", "inventory": {"lead": "What provokes you fastest — and who in your life absorbs the cost of it?", "prompts": ["When you 'just being honest,' how often is it actually venting? Ask someone who lives with you.", "What offense are you holding onto that Proverbs would call your glory to overlook?"], "land": "How do you see this pull — venting as health, restraint as repression — shaping how you handle provocation?"}, "step": {"milestone": "Week 7 of 10 — Ruling Your Own Spirit", "body": "Deep into the book, and the territory has moved inward. The mark of growth here is that a man knows his specific trigger and has actually delayed a reaction rather than resolved to be calmer. A maturing man understands that ruling his own spirit is harder and more valuable than any external conquest, and that the people closest to him feel the difference first."}, "prayer": "Father, I've called my venting honesty and made the people closest to me absorb it. You describe Yourself as slow to anger — make me like You in that. Give me a longer fuse and the strength to overlook what doesn't need collecting. Let me rule my own spirit before I try to rule anything else. Amen."}}, {"n": 8, "passage": "11:2; 16:18; 27:2; 3:5–7", "title": "Pride and the Fall", "theme": "Humility, self-assessment, and leaning on your own understanding", "context": "Proverbs treats pride as the master sin — the one that precedes destruction and shows up in a man's certainty about himself. Chapter 3's famous verses are usually quoted for guidance; their sharper edge is the warning about being wise in your own eyes.", "text": "When pride comes, then comes disgrace, but with the humble is wisdom. Pride goes before destruction, and a haughty spirit before a fall. Let another praise you, and not your own mouth; a stranger, and not your own lips. Trust in the LORD with all your heart, and do not lean on your own understanding. In all your ways acknowledge Him, and He will make straight your paths. Be not wise in your own eyes; fear the LORD, and turn away from evil.", "words": [{"greek": "זָדוֹן", "translit": "zadon", "gloss": "pride / presumption", "note": "Arrogant presumption — acting beyond your station without reference to God. Related to the verb for boiling over. It's pride that has become action, not merely attitude."}, {"greek": "שָׁעַן", "translit": "sha'an", "gloss": "to lean / rest weight on", "note": "To put your full weight on something for support. 'Do not lean on your own understanding' isn't a ban on thinking — it's a warning about which structure bears the load."}, {"greek": "יָשַׁר", "translit": "yashar", "gloss": "to make straight", "note": "To make a path level and passable. God straightening a path doesn't mean removing obstacles from a man's plan — it means the way itself becomes navigable."}], "thread": "Christ, being in the form of God, humbled Himself to the point of death — and God exalted Him. The pattern Proverbs describes finds its clearest expression at the cross: down, then up, and God does the lifting.", "elder": "Where has pride cost you something you can't get back? Tell these men plainly.", "first": "Where are you certain you're right in a way you haven't examined recently?", "questions": ["'Do not lean on your own understanding' — where are you putting full weight on your own read of a situation?", "'Let another praise you, not your own mouth.' Where do you promote yourself, even subtly?", "'Be not wise in your own eyes' is the sharper warning. What would it take for someone to change your mind about something important?"], "forge": "Ask your wife or closest friend: 'Where am I overconfident?' Don't defend. Write down what they say and bring it back to the group.", "formation": {"culture": "The culture requires self-promotion and calls it visibility. A man builds his brand, tells his own story, projects certainty — and doubt or deference is treated as weakness or poor positioning. Confidence is the product being sold, and being wise in your own eyes is essentially the job description.\n\nUnderneath is the first sin. The serpent's pitch was that a man could decide for himself what was good — self-sufficiency in the place of dependence. Every proud man since has been re-running it. What makes Proverbs' warning so pointed is that pride is invisible from inside; a man being wise in his own eyes never feels arrogant, he feels correct. Which is why the only reliable test is external, and why Proverbs says let someone else do the praising.", "inventory": {"lead": "Where are you wise in your own eyes — and who would tell you if you were wrong?", "prompts": ["What are you fully leaning on your own read about right now? Career, marriage, a decision, a person?", "When did someone last change your mind about something that mattered? If you can't remember, that's the answer."], "land": "How do you see this pull — self-promotion and projected certainty — keeping you from being corrected?"}, "step": {"milestone": "Week 8 of 10 — Not Wise in Your Own Eyes", "body": "This is the sin that undoes everything the book has built. The mark of growth here is that a man has actively invited a hard assessment and received it without argument. A maturing man understands that pride never feels like pride from the inside — it feels like being right — so he builds external checks rather than trusting his own read."}, "prayer": "Father, I'm rarely aware of my own pride because from inside it just feels like being right. Show me where I'm leaning entirely on my own understanding. Give me people who will tell me the truth and the humility to receive it. Let another do the praising, and let me trust You with the parts I can't see. Amen."}}, {"n": 9, "passage": "22:6; 13:24; 27:23–24; 31:8–9", "title": "The Long Arc of Responsibility", "theme": "Fathering, stewardship, and speaking for those who can't", "context": "Proverbs closes its instruction with the long view — what a man builds that outlasts him. Children, flocks, and the vulnerable. These are the responsibilities that don't pay off quickly and can't be outsourced.", "text": "Train up a child in the way he should go; even when he is old he will not depart from it. Whoever spares the rod hates his son, but he who loves him is diligent to discipline him. Know well the condition of your flocks, and give attention to your herds, for riches do not last forever; and does a crown endure to all generations? Open your mouth for the mute, for the rights of all who are destitute. Open your mouth, judge righteously, defend the rights of the poor and needy.", "words": [{"greek": "חָנַךְ", "translit": "chanak", "gloss": "train / dedicate", "note": "Used of dedicating a house or temple. Training a child is treated as consecration — setting him apart for a purpose, not merely managing his behavior."}, {"greek": "מוּסָר", "translit": "musar", "gloss": "discipline / instruction", "note": "The same word from chapter 5. Discipline here is corrective formation, and Proverbs frames withholding it as a failure of love rather than kindness."}, {"greek": "יָדַע", "translit": "yada", "gloss": "to know intimately", "note": "'Know well the condition of your flocks' uses the deep word for knowing — the same used for personal, relational knowledge. Stewardship requires attention, not just ownership."}], "thread": "'As a father shows compassion to his children, so the LORD shows compassion to those who fear Him.' Every faithful father is a dim picture of the Father, and every man's stewardship reflects the God who knows His sheep by name.", "elder": "What do you know now about raising children or carrying responsibility that you'd tell your younger self?", "first": "What has been entrusted to you that you haven't been paying attention to?", "questions": ["'Know well the condition of your flocks.' What's under your care that you've stopped actually inspecting?", "Proverbs says withholding discipline is a failure of love. Where are you avoiding a hard conversation because it's uncomfortable?", "'Open your mouth for the mute.' Who has no voice in your world, and what would speaking up cost you?"], "forge": "Pick one thing entrusted to you that you've neglected — a child, an employee, your health, your marriage. Do one concrete act of attention this week. Not a promise. An action.", "formation": {"culture": "The culture rewards what pays off fast and can be seen. Long, unglamorous stewardship — raising children, tending a marriage, quietly caring for something over decades — has no metrics and no audience. And responsibility itself is framed as a burden to minimize rather than a weight worth carrying.\n\nUnderneath is a preference for the immediate over the enduring. Esau traded a birthright for a bowl of soup because the soup was now. Men have always been willing to trade the long thing for the near thing. What Proverbs keeps insisting is that riches don't last and a crown doesn't endure — the only things that outlive a man are what he formed in other people. That work is slow, unrecognized, and almost never urgent, which is exactly why it gets deferred.", "inventory": {"lead": "What's been entrusted to you that you've stopped actually inspecting — and who is quietly paying for that?", "prompts": ["Name the hard conversation you've been avoiding with someone under your care. What's the real reason?", "Where have you traded a long, unglamorous responsibility for something that paid off faster?"], "land": "How do you see this pull — fast returns and visible wins — shaping what you neglect?"}, "step": {"milestone": "Week 9 of 10 — The Long View", "body": "Near the end, and the horizon lengthens. The mark of growth here is that a man has actually inspected something he'd stopped looking at and taken one act of attention. A maturing man measures his life by what outlasts him rather than by what pays this quarter, and he stops deferring the slow work that nobody applauds."}, "prayer": "Father, I've given my best attention to what pays off fast and neglected what actually lasts. Show me what You've entrusted to me that I've stopped inspecting. Give me courage for the hard conversation I'm avoiding and patience for work that won't be recognized. Let what I build outlive me. Amen."}}, {"n": 10, "passage": "4:18–27; 31:10–31", "title": "The Path of the Righteous", "theme": "Guarding the heart, finishing well, and the woman of valor", "context": "Chapter 4 is the father's summary charge — guard everything, because everything flows from the heart. And the book closes with the woman of Proverbs 31, who is best read not as a checklist for wives but as wisdom herself, embodied and at work.", "text": "The path of the righteous is like the light of dawn, which shines brighter and brighter until full day. The way of the wicked is like deep darkness; they do not know over what they stumble. Keep your heart with all vigilance, for from it flow the springs of life. Put away from you crooked speech, and put devious talk far from you. Let your eyes look directly forward. Ponder the path of your feet; then all your ways will be sure. An excellent wife who can find? She is far more precious than jewels. Charm is deceitful and beauty is vain, but a woman who fears the LORD is to be praised.", "words": [{"greek": "נָצַר", "translit": "natsar", "gloss": "to guard / keep watch", "note": "A military term for garrisoning a fortress. 'Keep your heart with all vigilance' is posting a watch — the heart is treated as the position that must not fall."}, {"greek": "חַיִל", "translit": "chayil", "gloss": "valor / strength", "note": "The word for an army's might or a warrior's valor. Proverbs 31 calls her an 'eshet chayil' — a woman of valor. It's military vocabulary, not domestic."}, {"greek": "אֹרַח", "translit": "orach", "gloss": "path / way", "note": "A well-worn track. The righteous path brightens gradually toward full day — Proverbs' picture of growth is incremental and directional, not sudden."}], "thread": "Christ is the light of the world, and the path that shines brighter until full day is the path of a man walking toward Him. The gradual brightening is sanctification — slow, real, and headed somewhere.", "elder": "Looking back, has the path gotten brighter? Tell these men honestly what the long arc has actually looked like.", "first": "What's the one thing in your heart right now that most needs a guard posted on it?", "questions": ["'Keep your heart with all vigilance, for from it flow the springs.' What's flowing out of you that tells you what's in there?", "The path brightens gradually. Where have you expected sudden change and gotten discouraged by slow growth?", "Proverbs 31 is wisdom embodied and at work. What would it look like for wisdom to be that visible in your daily life?"], "forge": "Name the one area of your heart that most needs a guard. Put one specific, concrete watch on it — and ask a man in this group to check on it in thirty days.", "formation": {"culture": "The culture manages the outside and leaves the inside alone. Optimize your appearance, your output, your presentation — and treat the heart as either irrelevant or as something that just is what it is. Where it does address the interior, the message is to follow it rather than guard it: your heart knows, trust what you feel.\n\nUnderneath is a very old inversion. Scripture says the heart is the wellspring and also that it's deceitful above all things — which means it must be guarded, not simply obeyed. Proverbs treats it as a fortress with a garrison posted, because everything downstream comes from it. A man who only manages the outside is defending the wrong wall. And the brightening path is a promise that the guarding actually works over time — slowly, which is the part men find hardest to accept.", "inventory": {"lead": "What's coming out of you that reveals what's actually in your heart — and where have you left it unguarded?", "prompts": ["Under pressure this month, what came out? Anger, withdrawal, appetite, deceit? That's the spring, not an accident.", "Where have you been following your heart when Proverbs says to guard it?"], "land": "How do you see this pull — manage the outside, trust the inside — leaving the real position undefended?"}, "step": {"milestone": "Week 10 of 10 — Brighter Until Full Day", "body": "You've reached the end. Look back at ten weeks — teachable, sharpened, diligent, honest about money, restrained in speech, off the path, ruling your spirit, humbled, stewarding the long things, and now guarding the heart everything flows from. The mark of a man finishing well here isn't that he's arrived — Proverbs never promises that. It's that the path is brightening, which means he's still walking and still being corrected. Post a guard on your heart, keep men close enough to tell you the truth, and keep walking. It gets brighter."}, "prayer": "Father, I've managed the outside and left my heart unguarded, and what comes out under pressure tells the truth about what's in there. Post a watch on it. Let what flows out of me be life instead of poison. Thank You that the path brightens gradually — keep me walking, keep me teachable, and keep me in the company of men who will tell me the truth. Amen."}}]}];

ming down from the Father of lights, with whom can be no variation, nor turning shadow.", 0], [1, 18, "Of his own will he gave birth to us by the word of truth, that we should be a kind of first fruits of his creatures.", 0]]}]}, {"sel": 0, "segs": [{"ref": "James 1:19–27", "v": [[1, 19, "So, then, my beloved brothers, let every man be swift to hear, slow to speak, and slow to anger;", 1], [1, 20, "for the anger of man doesn’t produce the righteousness of God.", 0], [1, 21, "Therefore, putting away all filthiness and overflowing of wickedness, receive with humility the implanted word, which is able to save your souls.", 0], [1, 22, "But be doers of the word, and not only hearers, deluding your own selves.", 0], [1, 23, "For if anyone is a hearer of the word and not a doer, he is like a man looking at his natural face in a mirror;", 0], [1, 24, "for he sees himself, and goes away, and immediately forgets what kind of man he was.", 0], [1, 25, "But he who looks into the perfect law of freedom and continues, not being a hearer who forgets, but a doer of the work, this man will be blessed in what he does.", 0], [1, 26, "If anyone among you thinks himself to be religious while he doesn’t bridle his tongue, but deceives his heart, this man’s religion is worthless.", 1], [1, 27, "Pure religion and undefiled before our God and Father is this: to visit the fatherless and widows in their affliction, and to keep oneself unstained by the world.", 0]]}]}, {"sel": 0, "segs": [{"ref": "James 2:1–13", "v": [[2, 1, "My brothers, don’t hold the faith of our Lord Jesus Christ of glory with partiality.", 1], [2, 2, "For if a man with a gold ring, in fine clothing, comes into your synagogue, and a poor man in filthy clothing also comes in,", 0], [2, 3, "and you pay special attention to him who wears the fine clothing and say, “Sit here in a good place;” and you tell the poor man, “Stand there,” or “Sit by my footstool”", 0], [2, 4, "haven’t you shown partiality among yourselves, and become judges with evil thoughts?", 0], [2, 5, "Listen, my beloved brothers. Didn’t God choose those who are poor in this world to be rich in faith, and heirs of the Kingdom which he promised to those who love him?", 0], [2, 6, "But you have dishonored the poor man. Don’t the rich oppress you, and personally drag you before the courts?", 0], [2, 7, "Don’t they blaspheme the honorable name by which you are called?", 0], [2, 8, "However, if you fulfill the royal law according to the Scripture, “You shall love your neighbor as yourself,” you do well.", 0], [2, 9, "But if you show partiality, you commit sin, being convicted by the law as transgressors.", 0], [2, 10, "For whoever keeps the whole law, and yet stumbles in one point, he has become guilty of all.", 0], [2, 11, "For he who said, “Do not commit adultery,” also said, “Do not commit murder.” Now if you do not commit adultery, but murder, you have become a transgressor of the law.", 0], [2, 12, "So speak and so do, as men who are to be judged by a law of freedom.", 0], [2, 13, "For judgment is without mercy to him who has shown no mercy. Mercy triumphs over judgment.", 0]]}]}, {"sel": 0, "segs": [{"ref": "James 2:14–26", "v": [[2, 14, "What good is it, my brothers, if a man says he has faith, but has no works? Can faith save him?", 1], [2, 15, "And if a brother or sister is naked and in lack of daily food,", 0], [2, 16, "and one of you tells them, “Go in peace. Be warmed and filled;” yet you didn’t give them the things the body needs, what good is it?", 0], [2, 17, "Even so faith, if it has no works, is dead in itself.", 0], [2, 18, "Yes, a man will say, “You have faith, and I have works.” Show me your faith without works, and I will show you my faith by my works.", 0], [2, 19, "You believe that God is one. You do well. The demons also believe, and shudder.", 1], [2, 20, "But do you want to know, vain man, that faith apart from works is dead?", 0], [2, 21, "Wasn’t Abraham our father justified by works, in that he offered up Isaac his son on the altar?", 0], [2, 22, "You see that faith worked with his works, and by works faith was perfected.", 0], [2, 23, "So the Scripture was fulfilled which says, “Abraham believed God, and it was accounted to him as righteousness,” and he was called the friend of God.", 0], [2, 24, "You see then that by works, a man is justified, and not only by faith.", 0], [2, 25, "In the same way, wasn’t Rahab the prostitute also justified by works, in that she received the messengers and sent them out another way?", 0], [2, 26, "For as the body apart from the spirit is dead, even so faith apart from works is dead.", 0]]}]}, {"sel": 0, "segs": [{"ref": "James 3:1–12", "v": [[3, 1, "Let not many of you be teachers, my brothers, knowing that we will receive heavier judgment.", 1], [3, 2, "For we all stumble in many things. Anyone who doesn’t stumble in word is a perfect person, able to bridle the whole body also.", 0], [3, 3, "Indeed, we put bits into the horses’ mouths so that they may obey us, and we guide their whole body.", 0], [3, 4, "Behold, the ships also, though they are so big and are driven by fierce winds, are yet guided by a very small rudder, wherever the pilot desires.", 0], [3, 5, "So the tongue is also a little member, and boasts great things. See how a small fire can spread to a large forest!", 0], [3, 6, "And the tongue is a fire. The world of iniquity among our members is the tongue, which defiles the whole body, and sets on fire the course of nature, and is set on fire by Gehenna.", 0], [3, 7, "For every kind of animal, bird, creeping thing, and sea creature, is tamed, and has been tamed by mankind;", 0], [3, 8, "but nobody can tame the tongue. It is a restless evil, full of deadly poison.", 0], [3, 9, "With it we bless our God and Father, and with it we curse men who are made in the image of God.", 0], [3, 10, "Out of the same mouth comes blessing and cursing. My brothers, these things ought not to be so.", 0], [3, 11, "Does a spring send out from the same opening fresh and bitter water?", 0], [3, 12, "Can a fig tree, my brothers, yield olives, or a vine figs? Thus no spring yields both salt water and fresh water.", 0]]}]}, {"sel": 0, "segs": [{"ref": "James 3:13–18", "v": [[3, 13, "Who is wise and understanding among you? Let him show by his good conduct that his deeds are done in gentleness of wisdom.", 1], [3, 14, "But if you have bitter jealousy and selfish ambition in your heart, don’t boast and don’t lie against the truth.", 0], [3, 15, "This wisdom is not that which comes down from above, but is earthly, sensual, and demonic.", 0], [3, 16, "For where jealousy and selfish ambition are, there is confusion and every evil deed.", 0], [3, 17, "But the wisdom that is from above is first pure, then peaceful, gentle, reasonable, full of mercy and good fruits, without partiality, and without hypocrisy.", 0], [3, 18, "Now the fruit of righteousness is sown in peace by those who make peace.", 0]]}]}, {"sel": 0, "segs": [{"ref": "James 4:1–12", "v": [[4, 1, "Where do wars and fightings among you come from? Don’t they come from your pleasures that war in your members?", 1], [4, 2, "You lust, and don’t have. You murder and covet, and can’t obtain. You fight and make war. You don’t have, because you don’t ask.", 0], [4, 3, "You ask, and don’t receive, because you ask with wrong motives, so that you may spend it on your pleasures.", 0], [4, 4, "You adulterers and adulteresses, don’t you know that friendship with the world is hostility toward God? Whoever therefore wants to be a friend of the world makes himself an enemy of God.", 0], [4, 5, "Or do you think that the Scripture says in vain, “The Spirit who lives in us yearns jealously”?", 0], [4, 6, "But he gives more grace. Therefore it says, “God resists the proud, but gives grace to the humble.”", 0], [4, 7, "Be subject therefore to God. Resist the devil, and he will flee from you.", 0], [4, 8, "Draw near to God, and he will draw near to you. Cleanse your hands, you sinners. Purify your hearts, you double-minded.", 0], [4, 9, "Lament, mourn, and weep. Let your laughter be turned to mourning, and your joy to gloom.", 0], [4, 10, "Humble yourselves in the sight of the Lord, and he will exalt you.", 0], [4, 11, "Don’t speak against one another, brothers. He who speaks against a brother and judges his brother, speaks against the law and judges the law. But if you judge the law, you are not a doer of the law, but a judge.", 1], [4, 12, "Only one is the lawgiver, who is able to save and to destroy. But who are you to judge another?", 0]]}]}, {"sel": 0, "segs": [{"ref": "James 4:13–5:6", "v": [[4, 13, "Come now, you who say, “Today or tomorrow let’s go into this city, and spend a year there, trade, and make a profit.”", 1], [4, 14, "Whereas you don’t know what your life will be like tomorrow. For what is your life? For you are a vapor that appears for a little time, and then vanishes away.", 0], [4, 15, "For you ought to say, “If the Lord wills, we will both live, and do this or that.”", 0], [4, 16, "But now you glory in your boasting. All such boasting is evil.", 0], [4, 17, "To him therefore who knows to do good, and doesn’t do it, to him it is sin.", 0], [5, 1, "Come now, you rich, weep and howl for your miseries that are coming on you.", 1], [5, 2, "Your riches are corrupted and your garments are moth-eaten.", 0], [5, 3, "Your gold and your silver are corroded, and their corrosion will be for a testimony against you and will eat your flesh like fire. You have laid up your treasure in the last days.", 0], [5, 4, "Behold, the wages of the laborers who mowed your fields, which you have kept back by fraud, cry out, and the cries of those who reaped have entered into the ears of the Lord of Armies.", 0], [5, 5, "You have lived in luxury on the earth, and taken your pleasure. You have nourished your hearts as in a day of slaughter.", 0], [5, 6, "You have condemned and you have murdered the righteous one. He doesn’t resist you.", 0]]}]}, {"sel": 0, "segs": [{"ref": "James 5:7–20", "v": [[5, 7, "Be patient therefore, brothers, until the coming of the Lord. Behold, the farmer waits for the precious fruit of the earth, being patient over it, until it receives the early and late rain.", 1], [5, 8, "You also be patient. Establish your hearts, for the coming of the Lord is at hand.", 0], [5, 9, "Don’t grumble, brothers, against one another, so that you won’t be judged. Behold, the judge stands at the door.", 1], [5, 10, "Take, brothers, for an example of suffering and of perseverance, the prophets who spoke in the name of the Lord.", 0], [5, 11, "Behold, we call them blessed who endured. You have heard of the perseverance of Job, and have seen the Lord in the outcome, and how the Lord is full of compassion and mercy.", 0], [5, 12, "But above all things, my brothers, don’t swear— not by heaven, or by the earth, or by any other oath; but let your “yes” be “yes”, and your “no”, “no”, so that you don’t fall into hypocrisy.", 1], [5, 13, "Is any among you suffering? Let him pray. Is any cheerful? Let him sing praises.", 1], [5, 14, "Is any among you sick? Let him call for the elders of the assembly, and let them pray over him, anointing him with oil in the name of the Lord,", 0], [5, 15, "and the prayer of faith will heal him who is sick, and the Lord will raise him up. If he has committed sins, he will be forgiven.", 0], [5, 16, "Confess your offenses to one another, and pray for one another, that you may be healed. The insistent prayer of a righteous person is powerfully effective.", 0], [5, 17, "Elijah was a man with a nature like ours, and he prayed earnestly that it might not rain, and it didn’t rain on the earth for three years and six months.", 0], [5, 18, "He prayed again, and the sky gave rain, and the earth produced its fruit.", 0], [5, 19, "Brothers, if any among you wanders from the truth and someone turns him back,", 1], [5, 20, "let him know that he who turns a sinner from the error of his way will save a soul from death and will cover a multitude of sins.", 0]]}]}], "nehemiah": [{"sel": 0, "segs": [{"ref": "Nehemiah 1:1–11", "v": [[1, 1, "The words of Nehemiah the son of Hacaliah. Now in the month Chislev, in the twentieth year, as I was in Susa the palace,", 1], [1, 2, "Hanani, one of my brothers, came, he and certain men out of Judah; and I asked them about the Jews who had escaped, who were left of the captivity, and concerning Jerusalem.", 0], [1, 3, "They said to me, “The remnant who are left of the captivity there in the province are in great affliction and reproach. The wall of Jerusalem is also broken down, and its gates are burned with fire.”", 0], [1, 4, "When I heard these words, I sat down and wept, and mourned several days; and I fasted and prayed before the God of heaven,", 1], [1, 5, "and said, “I beg you, Yahweh, the God of heaven, the great and awesome God, who keeps covenant and loving kindness with those who love him and keep his commandments:", 0], [1, 6, "Let your ear now be attentive, and your eyes open, that you may listen to the prayer of your servant, which I pray before you at this time, day and night, for the children of Israel your servants, while I confess the sins of the children of Israel, which we have sinned against you. Yes, I and my father’s house have sinned.", 0], [1, 7, "We have dealt very corruptly against you, and have not kept the commandments, nor the statutes, nor the ordinances, which you commanded your servant Moses.", 0], [1, 8, "“Remember, I beg you, the word that you commanded your servant Moses, saying, ‘If you trespass, I will scatter you among the peoples;", 1], [1, 9, "but if you return to me, and keep my commandments and do them, though your outcasts were in the uttermost part of the heavens, yet I will gather them from there, and will bring them to the place that I have chosen, to cause my name to dwell there.’", 0], [1, 10, "“Now these are your servants and your people, whom you have redeemed by your great power, and by your strong hand.", 1], [1, 11, "Lord, I beg you, let your ear be attentive now to the prayer of your servant, and to the prayer of your servants, who delight to fear your name; and please prosper your servant today, and grant him mercy in the sight of this man.” Now I was cup bearer to the king.", 0]]}]}, {"sel": 0, "segs": [{"ref": "Nehemiah 2:1–20", "v": [[2, 1, "In the month Nisan, in the twentieth year of Artaxerxes the king, when wine was before him, I picked up the wine, and gave it to the king. Now I had not been sad before in his presence.", 1], [2, 2, "The king said to me, “Why is your face sad, since you are not sick? This is nothing else but sorrow of heart.” Then I was very much afraid.", 0], [2, 3, "I said to the king, “Let the king live forever! Why shouldn’t my face be sad, when the city, the place of my fathers’ tombs, lies waste, and its gates have been consumed with fire?”", 0], [2, 4, "Then the king said to me, “What is your request?” So I prayed to the God of heaven.", 1], [2, 5, "I said to the king, “If it pleases the king, and if your servant has found favor in your sight, that you would send me to Judah, to the city of my fathers’ tombs, that I may build it.”", 0], [2, 6, "The king said to me (the queen was also sitting by him), “How long will your journey be? When will you return?” So it pleased the king to send me, and I set a time for him.", 1], [2, 7, "Moreover I said to the king, “If it pleases the king, let letters be given me to the governors beyond the River, that they may let me pass through until I come to Judah;", 0], [2, 8, "and a letter to Asaph the keeper of the king’s forest, that he may give me timber to make beams for the gates of the citadel by the temple, for the wall of the city, and for the house that I will occupy.” The king granted my requests, because of the good hand of my God on me.", 0], [2, 9, "Then I came to the governors beyond the River, and gave them the king’s letters. Now the k
